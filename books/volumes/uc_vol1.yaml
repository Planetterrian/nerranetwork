# Volume 1 of the Unintended Consequences anthology — the first fifty
# episodes, in broadcast order (~36k words, ~4h narrated; the split at 50
# leaves episodes 51-100 as an equal-length Volume 2 once the show gets
# there). Every field here is metadata only; the
# chapter text comes from the committed digest markdown at build time
# (scripts/build_book.py --volume uc_vol1).
#
# buy_links start empty: the operator fills each in as the store listing
# goes live (docs/books.md has the per-store checklist). The website's
# Books page renders only the links that exist.

volume_id: uc_vol1
show_slug: unintended_consequences
show_name: Unintended Consequences
volume_number: 1

title: "Unintended Consequences"
subtitle: "Fifty true stories of good intentions gone spectacularly wrong"
author: "Nerra Network"
language: en

description: >-
  Cobra bounties that bred more cobras. A nuclear phase-out that imported
  coal by wire. Prohibition's gift to organized crime. Twenty true,
  carefully reconstructed stories of policies, inventions, and plans that
  achieved the exact opposite of what their designers intended — each one
  traced from the good intention, through the mechanism that turned it
  inside out, to the lesson that travels. Fifty stories, compiled from
  the Unintended Consequences podcast.

