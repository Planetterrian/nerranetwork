# Series config for the First Principles Daily anthology — see the
# unintended_consequences series file for how inheritance works.

show_slug: first_principles
show_name: First Principles Daily
series_title: "First Principles"
subtitle_template: "{count_words} teardowns of what things really cost — and what they could"
author: "Patrick Novak"
language: en

# Chapters per planner-cut volume (the planner only cuts FULL volumes;
# a partial tail waits for the show to publish more episodes). This is
# a PRODUCT decision, set once here (WO-12, Sept 2026): the editorial
# review found 20-chapter volumes at $4.99 priced ~5x market rate per
# word, while Volume 1 at 73 chapters / $7.99 is healthy. Default when
# absent is 60 (engine.book_compiler.DEFAULT_VOLUME_CHAPTERS), never
# 20. Band 10-80.
volume_chapters: 60

price_usd: 4.99

description: >-
  What would this cost if physics were the only constraint? Each story
  applies the first-principles lens — the magic wand number and the
  Idiot Index — to one industry or one historical breakthrough, from
  freight rail to fertilizer, tracing the gap between what something
  costs and what the raw materials and energy say it should. Compiled
  from the First Principles Daily podcast.

cover_color: "#0F766E"
cover_accent: "#00D4FF"

image_model: "grok-imagine-image-quality"

cover_art_style: >-
  Bold technical-blueprint-meets-editorial illustration: a single
  iconic machine, structure, or industrial object rendered with
  precision, deep teal and off-white palette with copper highlights,
  clean geometry, quietly awe-inspiring, wide negative space in the
  upper third for a title. Absolutely no text, letters, numbers,
  typography, or watermarks anywhere in the image. Do not depict signs, signage, documents, scrolls, plaques, labels, placards, banners, engraved inscriptions, or any object whose surface carries writing.

chapter_art_style: >-
  Clean technical editorial illustration, teal and neutral palette
  with copper accents, one clear machine, material, or process as the
  subject, precise linework with soft shading, optimistic engineering
  tone. Absolutely no text, letters, numbers, typography, or
  watermarks anywhere in the image.

# WO-6: series-inherited About-the-Author page (authored prose,
# never generated).
author_bio_file: books/frontmatter/author_bio_patrick_novak.md

# Episodes editorially EXCLUDED from books (WO-12). The podcast episodes
# stay published; Volume 1 omitted them as true retellings and the
# planner must never sweep them into Volume 2:
#  21  Haber-Bosch — retells ep7's ammonia cost argument
#  25  Container ships — retells ep6's shipping-container story
excluded_episodes: [21, 25]
