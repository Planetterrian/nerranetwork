# Series config for the Unintended Consequences anthology. Every volume
# inherits everything here (books/volumes/<id>.yaml files stay thin —
# id, number, episode list, buy links). Changing a value here rebrands
# the WHOLE series on the next build; that consistency is the point:
# the covers share typography and palette so shelf-adjacent volumes
# read as siblings, while each volume gets fresh Grok-Imagine cover art.

show_slug: unintended_consequences
show_name: Unintended Consequences
series_title: "Unintended Consequences"
subtitle_template: "{count_words} true stories of good intentions gone spectacularly wrong"
author: "Patrick Novak"
language: en

# Stories per volume (the planner only cuts full volumes; a partial
# tail waits for the show to publish more episodes). Keep in 10-20.
volume_size: 20

price_usd: 4.99

description: >-
  True, carefully reconstructed stories of policies, inventions, and
  plans that achieved the exact opposite of what their designers
  intended — each one traced from the good intention, through the
  mechanism that turned it inside out, to the lesson that travels.
  Compiled from the Unintended Consequences podcast.

# Show branding (matches the show's site brand color; accent is the
# network cyan used across Nerra surfaces).
cover_color: "#B45309"
cover_accent: "#00D4FF"

# Latest pinned Grok Imagine tier (quality, released 2026-04; the
# floating -latest alias is deliberately avoided — published artifacts
# never ride floating model aliases in this repo).
image_model: "grok-imagine-image-quality"

# Style guides for the generated art. IMPORTANT: both insist on zero
# text in the image — AI-rendered lettering is the tell that cheapens
# a cover, and the typography layer is composited separately so the
# series branding stays identical across volumes.
cover_art_style: >-
  Dramatic editorial illustration in a vintage-poster style: a single
  strong metaphorical object or scene, warm amber and deep charcoal
  palette with high contrast lighting, textured grain, moody and
  intriguing, wide negative space in the upper third for a title.
  No people's faces in close-up. Absolutely no text, letters, numbers,
  typography, or watermarks anywhere in the image. Do not depict signs, signage, documents, scrolls, plaques, labels, placards, banners, engraved inscriptions, or any object whose surface carries writing.

chapter_art_style: >-
  Editorial magazine illustration, muted warm palette with amber
  accents, clean composition, one clear visual metaphor for the story,
  subtle paper texture, serious and curious in tone. Absolutely no
  text, letters, numbers, typography, or watermarks anywhere in the
  image.

# Episodes editorially EXCLUDED from books (WO-3, Aug 2026). The podcast
# episodes stay published; this is a book-inclusion decision. The planner
# skips these so they are never swept into a future volume.
#   1  Cobra Bounty — founding anecdote likely apocryphal, invented archival record
#  36  Sanitizer Paradox — load-bearing evidence fabricated (nonexistent study)
#  44  Congestion Charge — cited TfL monitoring contradicts thesis; fabricated quote
#  56  The Moderators — four sourcing failures incl. invented settlement
#  71  The Filter Tip — three unverifiable tobacco quotes + false FTC claim
#  74  Rent Control, Revisited — duplicate of ep25 with extra errors ("1947 law" never existed)
#  77  The Testing Factory — duplicate of ep26; ep26 renders the CEP survey more completely
excluded_episodes: [1, 36, 44, 56, 71, 74, 77]

# WO-6: series-inherited About-the-Author page (authored prose,
# never generated).
author_bio_file: books/frontmatter/author_bio_patrick_novak.md
