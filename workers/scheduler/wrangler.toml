# Exact-time show dispatcher (June 2026 punctuality pass).
#
# GitHub Actions delivers `schedule` events best-effort — observed 1-6 h
# late (Tesla's 11:00 UTC cron started at 13:54 on June 9 2026). Cloudflare
# Cron Triggers fire to the minute, so this Worker dispatches each show's
# run via the GitHub workflow_dispatch API at its intended time; the
# GitHub crons in run-show.yml remain as delayed fallbacks, and the
# gate's same-day duplicate guard prevents double-publishing.
#
# Deploy (one-time):
#   cd workers/scheduler
#   wrangler secret put GITHUB_DISPATCH_TOKEN   # fine-grained PAT, see README
#   wrangler deploy
name = "nerra-scheduler"
main = "src/index.ts"
compatibility_date = "2026-05-01"
# Serve the read-only status/health endpoints on the *.workers.dev URL so a
# deploy can be verified from a browser (GET /health — see README). The
# fetch handler exposes nothing secret and dispatches nothing.
workers_dev = true

[triggers]
# The first trigger covers every show slot (:01/:07/:16/:31/:37/:46 from
# 06:00-12:00 UTC); the Worker maps the firing time to the show, mirroring
# run-show.yml's CRON_MAP (drift guard: tests/test_scheduling_punctuality.py).
# The second fires Nerra Daily on Pacific wall time — 07:50 (release) and
# 09:01 (end of the straggler hold) are 14:50/16:01 UTC under PDT and
# 15:50/17:01 UTC under PST, so it covers both; the Worker converts the
# firing time to Pacific and no-ops on the minutes that are neither.
crons = ["1,7,16,31,37,46 6-12 * * *", "1,50 14-17 * * *"]
