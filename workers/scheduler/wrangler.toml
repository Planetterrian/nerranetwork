# Exact-time show dispatcher (June 2026 punctuality pass).
#
# GitHub Actions delivers `schedule` events best-effort — observed 1-6 h
# late (Tesla's 11:00 UTC cron started at 13:54 on June 9 2026). Cloudflare
# Cron Triggers fire to the minute, so this Worker dispatches each show's
# run via the GitHub workflow_dispatch API at its intended time; the
# GitHub crons in run-show.yml remain as delayed fallbacks, and the
# gate's same-day duplicate guard prevents double-publishing.
#
# Deploy (one-time):
#   cd workers/scheduler
#   wrangler secret put GITHUB_DISPATCH_TOKEN   # fine-grained PAT, see README
#   wrangler deploy
name = "nerra-scheduler"
main = "src/index.ts"
compatibility_date = "2026-05-01"
# Serve the read-only status/health endpoints on the *.workers.dev URL so a
# deploy can be verified from a browser (GET /health — see README). The
# fetch handler exposes nothing secret and dispatches nothing.
workers_dev = true

[triggers]
# ONE trigger, on purpose (Oct 9 2026): the account was then on the Workers
# Free plan, which allows five cron triggers in total, and the Voices Worker
# held three — a second trigger here was refused at deploy
# ("reached the Workers Free limit of 5 cron triggers", code 10072), so the
# edition dispatch never went live. The handler decides from the exact
# firing minute, so one broad expression covers every job.
#
# Oct 17 2026: every five minutes. The show slots, the Nerra Daily edition
# (06:35 / 06:50) and the @nerranetwork X queue (:05 / :35, 7:05 AM to
# 10:05 PM) are all on EASTERN wall time, and every one of them sits on a
# multiple of five minutes; Eastern is UTC-4 (EDT) or UTC-5 (EST), whole
# hours, so a minute that is a multiple of five in New York is one in UTC
# under both offsets. The handler converts each firing to Eastern time and
# matches SLOTS / EDITION_DISPATCH / X_QUEUE_DISPATCH; every other firing is
# a logged no-op (~250 a day, each a few milliseconds). Drift guard:
# tests/test_scheduling_punctuality.py and
# tests/test_seven_am_eastern_2026_10_17.py check the trigger fires at every
# slot in both offsets. The account is on Workers Paid now (Oct 23 2026), so
# a second trigger would deploy; none is needed while the handler reads the
# firing minute.
crons = ["*/5 * * * *"]
