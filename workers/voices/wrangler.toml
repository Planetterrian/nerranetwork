# Voices API Worker (The Age of AI + Nerra Voices) — webhook + tool-endpoint
# layer for the live-interview pipeline. Both Mira-hosted shows share this
# Worker; rows carry a `show` slug (see the SHOWS map in src/index.ts).
# See workers/voices/README.md and docs/age_of_ai_plan.md.
#
# NOTE (documented deviation from the pipeline spec §5.6): the spec sketched
# these handlers as Vercel/Next.js API routes beside Bill Saved. This repo's
# established API surface is Cloudflare Workers on api.nerranetwork.com
# (gallery worker precedent), so the handlers live here; the logic ports
# 1:1 to Next.js route files if the operator prefers Vercel later.

name = "nerra-voices-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
account_id = ""  # intentionally blank in-repo (gallery worker convention)

# The gallery worker holds api.nerranetwork.com as a custom domain; this
# worker claims only the /voices/* path via a zone route (more-specific
# routes take precedence over the custom-domain worker).
routes = [
  { pattern = "api.nerranetwork.com/voices/*", zone_name = "nerranetwork.com" },
]

# Daily cron: gate-2 housekeeping — day-4 guest reminder, day-7
# auto-approve (spec §7).
[triggers]
# */5: punctual fire-tick dispatch to the GitHub fire workflow (Aug 2026 —
# GitHub's own */5 cron arrives ~hourly under load; Cloudflare fires to
# the minute, same pattern as workers/scheduler for the shows).
# 17:00: gate-2 housekeeping (guest-review reminders / auto-approve).
crons = ["*/5 * * * *", "0 17 * * *"]

# Phase 2 co-host (Sept 2026): local browser recordings (guest + host
# MediaRecorder chunks and their manifest.json) are written straight to R2
# by /voices/upload-chunk and /voices/upload-done. Same bucket the Python
# pipeline uploads to (VOICES_R2_BUCKET env in GitHub Actions); the
# post-interview job reads <r2_prefix>/local/<run_id>/<role>/ from it.
[[r2_buckets]]
binding = "VOICES_R2"
bucket_name = "podcast-audio"

# Secrets (set once via `wrangler secret put <NAME>`):
#   SUPABASE_URL              Nerra Voices Supabase project URL
#   SUPABASE_SERVICE_KEY      service-role key (RLS bypass; Worker-only)
#   GITHUB_DISPATCH_TOKEN     fine-grained PAT, contents:write on
#                             Planetterrian/nerranetwork (repository_dispatch)
#   ADMIN_TOKEN               bearer token gating /voices/admin/*
#   RESEND_API_KEY            transactional email (booking link, approvals)
#   VOICES_FROM_EMAIL         e.g. mira@nerranetwork.com
#   CALCOM_BOOKING_URL        The Age of AI Cal.com event link (also the
#                             fallback for Nerra Voices)
#   SLACK_WEBHOOK             operator notifications (optional)
#   VOX_GUEST_USER / VOX_GUEST_PASSWORD
#                             Voximplant app user the guest studio logs in as
#                             (one-time-key handshake; user defaults to "guest")
#
# Phase 2 co-host (Sept 2026, docs/cohost_phase2_contract.md):
#   VOX_HOST_USER             Voximplant user the scenario dials for Patrick
#                             (default "host"; create it with
#                             voximplant_client.add_user())
#   VOX_HOST_PASSWORD         its password — /voices/studio-auth only issues
#                             host credentials to a caller holding ADMIN_TOKEN
#   OPERATOR_PHONE            optional E.164 number the fire step SMSes the
#                             host link to (OPERATOR_EMAIL gets it regardless)
#
# Optional, Nerra Voices (Sept 2026) — all fall back to the values above:
#   CALCOM_BOOKING_URL_NERRA_VOICES  second Cal.com event link for Nerra Voices
#   CALCOM_EVENT_SLUG_AGE_OF_AI      Cal.com event-type slug (or numeric id)
#                                    that routes /voices/cal-com-booked to age_of_ai
#   CALCOM_EVENT_SLUG_NERRA_VOICES   ditto for nerra_voices; when both are
#                                    unset an event slug containing "voices"
#                                    → nerra_voices, anything else → age_of_ai
