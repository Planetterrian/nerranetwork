# Cloudflare Worker that backs the Nerra Network image gallery's
# email-gated download flow. See workers/gallery/README.md for the
# deploy + secret bootstrap steps, and docs/gallery_storage.md for
# the architecture context.

name = "nerra-gallery-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
account_id = ""  # set via `wrangler whoami` or CI; intentionally
                 # blank in-repo so a developer fork doesn't bind
                 # to the production account by mistake.

# Custom Domain for the Worker.  A custom_domain routes the WHOLE
# hostname to the Worker (no path or wildcard allowed here — the
# Worker's own router in src/index.ts handles /api/* and 404s the
# rest).  `wrangler deploy` provisions the DNS record + cert for
# api.nerranetwork.com automatically; no manual CNAME needed.
routes = [
  { pattern = "api.nerranetwork.com", custom_domain = true },
]

# R2 binding for the gallery bucket.  The Worker uses
# env.GALLERY_BUCKET.get(key) on download; no separate access key is
# needed because the binding is scoped by Cloudflare to this Worker.
[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "nerra-gallery"

# KV namespace for rate limiting on subscribe/login, for the per-email
# revocation list, and (Aug 2026) for the Nerra Personal member records
# (`member:<email>`) and feed tokens (`feedtok:<token>`). Provisioned
# 2026-08-23 as `gallery_rate_limits`; the id below is that namespace.
#
# Both rate-limit consumers fail open when the binding is absent (see
# checkRateLimit / isEmailRevoked in src/handlers.ts), but the Personal
# endpoints do NOT — they answer 503 "not configured" without it.
#
# NEVER leave `id` blank here. Wrangler validates the whole config before
# running ANY command, so a blank id doesn't just fail `deploy` — it also
# blocks `wrangler kv namespace list`, which is how you'd look the id up.
# That loop cost the operator five failed deploys on 2026-07-30. To look
# up ids, run from a directory WITHOUT this wrangler.toml:
#     cd <repo root>
#     workers/gallery/node_modules/.bin/wrangler kv namespace list
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "6bef8549fdb541009f43ce92ee3fbdbd"

# Nerra Personal (Aug 2026): the private personalized-feed audio bucket,
# created 2026-08-23. Keys live under `personal/<token>/` and are served
# ONLY through the Worker's token-checked /api/feed endpoint — the bucket
# stays private, so cancelling a subscription revokes the feed at once.
[[r2_buckets]]
binding = "PERSONAL_BUCKET"
bucket_name = "nerra-personal"

# Secrets are set out-of-band via:
#   wrangler secret put JWT_SECRET
#   wrangler secret put BUTTONDOWN_API_KEY
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put RESEND_FROM_EMAIL
# Nerra Personal additionally needs:
#   wrangler secret put STRIPE_WEBHOOK_SECRET   # from the Stripe webhook endpoint
#   wrangler secret put PERSONAL_ADMIN_TOKEN    # any long random string; the
#                                               # batch builder presents it
#   wrangler secret put MEMBER_BOOK_CODE        # store discount code members see
# Do NOT commit them here.

[observability]
enabled = true

[placement]
mode = "smart"
