# Cloudflare Worker that backs the Nerra Network image gallery's
# email-gated download flow. See workers/gallery/README.md for the
# deploy + secret bootstrap steps, and docs/gallery_storage.md for
# the architecture context.

name = "nerra-gallery-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
account_id = ""  # set via `wrangler whoami` or CI; intentionally
                 # blank in-repo so a developer fork doesn't bind
                 # to the production account by mistake.

# Custom Domain for the Worker.  A custom_domain routes the WHOLE
# hostname to the Worker (no path or wildcard allowed here — the
# Worker's own router in src/index.ts handles /api/* and 404s the
# rest).  `wrangler deploy` provisions the DNS record + cert for
# api.nerranetwork.com automatically; no manual CNAME needed.
routes = [
  { pattern = "api.nerranetwork.com", custom_domain = true },
]

# R2 binding for the gallery bucket.  The Worker uses
# env.GALLERY_BUCKET.get(key) on download; no separate access key is
# needed because the binding is scoped by Cloudflare to this Worker.
[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "nerra-gallery"

# KV namespace for rate limiting on subscribe/login, and for the
# per-email revocation list. COMMENTED OUT because no namespace has ever
# been provisioned — so this is not a regression, it is the config
# finally matching production. Both consumers fail open when the binding
# is absent (see checkRateLimit / isEmailRevoked in src/handlers.ts), so
# the Worker runs correctly without it; it simply has no rate limiting.
#
# DO NOT uncomment these lines with a blank `id`. Wrangler validates the
# whole config before running ANY command, so a blank id doesn't just
# fail `deploy` — it also blocks `wrangler kv namespace list`, which is
# how you'd look the id up. That loop cost the operator five failed
# deploys on 2026-07-30.
#
# To enable rate limiting, from a directory WITHOUT this wrangler.toml
# (so the same validation doesn't block you):
#     cd <repo root>
#     workers/gallery/node_modules/.bin/wrangler kv namespace create gallery_rate_limits
# then paste the returned id below and uncomment all four lines.
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = ""
# preview_id = ""  # Optional preview namespace

# Secrets are set out-of-band via:
#   wrangler secret put JWT_SECRET
#   wrangler secret put BUTTONDOWN_API_KEY
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put RESEND_FROM_EMAIL
# Do NOT commit them here.

[observability]
enabled = true

[placement]
mode = "smart"
