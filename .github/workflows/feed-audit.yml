name: Feed Audit

on:
  schedule:
    - cron: '0 12 * * 0'  # Sunday 12:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'requirements.txt'
          extra-packages: "pyyaml requests feedparser"
          skip-checkout: 'true'

      - name: Run feed audit
        id: audit
        run: |
          set +e
          python scripts/audit_feeds.py 2>&1 | tee audit_output.txt
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: ./.github/actions/safe-commit-push
        with:
          add-paths: "data/feed_audit_*.json"
          commit-message: "Feed audit report $(date +%Y-%m-%d)"

      - name: Warn if unhealthy feeds
        if: steps.audit.outputs.exit_code == '1'
        run: echo "::warning::Feed audit found stale or dead feeds — check audit_output.txt"
