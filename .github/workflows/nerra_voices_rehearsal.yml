# Nerra Voices — rehearsal harness (Oct 21 2026, review §7.5).
#
# A change to Mira's room (prompt, end-of-turn silence, reasoning effort)
# is rehearsed against a FIXTURE GUEST — a second voice agent playing a
# past guest from their approved transcript — before any real guest hears
# it. Two arms, same fixture, same scheduled behaviours: `proposed` is the
# prompt compile_mira_prompt writes today on the fixture's real application;
# `current` is the prompt the last real interview actually ran on. Each room
# is transcribed per speaker and measured with audio_metrics; the report
# prints PASS only on the §7.5 rule (proposed beats current on overlap
# events, self-answered turns and guest words per answer, and does not lose
# on turn length). A PASS still needs one operator listen before a deploy.
#
# This workflow never deploys anything. It needs the fixture-guest scenario
# deployed once (Deploy Voximplant scenario) and the Worker to leave a
# session_kind=rehearsal run alone (no editorial passes, no emails).
name: Nerra Voices — rehearsal
on:
  workflow_dispatch:
    inputs:
      fixture:
        description: 'Fixture guest (pipelines/voices/fixtures/rehearsal_guests.yaml)'
        type: choice
        options: [roddy, vincent, adrian]
        default: roddy
      minutes:
        description: 'Minutes per room (15 is the shortest that reaches the closing round: under 15 the room plans a 45-minute interview)'
        type: number
        default: 15
      repeat:
        description: 'Rooms per arm (each room is two Voice Agent sessions)'
        type: number
        default: 1
      arms:
        description: 'Which arms to run (proposed alone is judged on the room checks; both = the two-arm comparison for a prompt or setting change)'
        type: choice
        options: [proposed, both, current]
        default: proposed
      turn_silence_ms:
        description: 'Proposed arm: end-of-turn silence override (blank = the fire step default)'
        type: string
        default: ''
      reasoning_effort:
        description: 'Proposed arm: interview_runs.reasoning_effort (blank = the room default)'
        type: string
        default: ''
      tools:
        description: 'Proposed arm: in-call tools'
        type: choice
        options: [default, none]
        default: default
      candidate_scenario:
        description: 'Proposed arm runs THIS ref''s interview scenario, uploaded beside the live one (the live scenario is not touched)'
        type: boolean
        default: false
      with_hold:
        description: 'The fixture steps away to take a call at minute four (both arms)'
        type: boolean
        default: false
      invite_email:
        description: 'Email this address a test room for a PERSON instead of running a fixture (the draft room when candidate_scenario is on). The job waits up to 90 min for them to join, then measures the room.'
        type: string
        default: ''
      remeasure:
        description: 'Measure rooms that already ran instead of running new ones: current:<run id>,proposed:<run id>'
        type: string
        default: ''
  # Nightly only when the operator turns it on: repo variable
  # VOICES_REHEARSAL_NIGHTLY=true. Each room costs a Voice Agent session on
  # both sides.
  schedule:
    - cron: '23 9 * * *'

permissions:
  contents: read

concurrency:
  group: nerra-voices-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    if: ${{ github.event_name != 'schedule' || vars.VOICES_REHEARSAL_NIGHTLY == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      FIXTURE: ${{ inputs.fixture || 'roddy' }}
      MINUTES: ${{ inputs.minutes || 15 }}
      REPEAT: ${{ inputs.repeat || 1 }}
      ARMS: ${{ inputs.arms || 'proposed' }}
      OUT_DIR: outputs/rehearsals/${{ github.run_id }}
      SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
      VOXIMPLANT_ACCOUNT_ID: ${{ secrets.VOXIMPLANT_ACCOUNT_ID }}
      VOXIMPLANT_API_KEY: ${{ secrets.VOXIMPLANT_API_KEY }}
      VOXIMPLANT_CALLER_ID: ${{ secrets.VOXIMPLANT_CALLER_ID }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      REHEARSAL_COUGH_CLIP: ${{ vars.REHEARSAL_COUGH_CLIP }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.14'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      # Oct 23 2026: one tiny text request before any room. Four rooms and two
      # probes were placed that morning on an account out of credit, and every
      # Voice Agent session was refused at start. A 401/403 (or a credit 429)
      # stops the run here; anything else goes ahead.
      - name: Check xAI accepts requests
        if: ${{ inputs.remeasure == '' }}
        run: python pipelines/voices/rehearsal.py preflight
      # Oct 22 2026: static ffmpeg, the way test.yml installs it. All three
      # rehearsals that day died at exit 124 in the apt install (the Azure
      # mirror served the ffmpeg debs at a few hundred KB/s) before any room
      # ran. Pinned dated BtbN tag, cached, checksum-verified.
      - name: Cache static ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-static
          key: ffmpeg-btbn-autobuild-2026-10-22-13-06-n8.1.3-23-g5c4f5744cd-linux64-gpl-8.1
      - name: Install static ffmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        timeout-minutes: 6
        env:
          BTBN_TAG: autobuild-2026-10-22-13-06
          BTBN_ASSET: ffmpeg-n8.1.3-23-g5c4f5744cd-linux64-gpl-8.1.tar.xz
        run: |
          set -euo pipefail
          dest="${{ runner.temp }}/ffmpeg-static"
          mkdir -p "$dest"
          base="https://github.com/BtbN/FFmpeg-Builds/releases/download/${BTBN_TAG}"
          cd /tmp
          curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            -o checksums.sha256 "${base}/checksums.sha256"
          curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            -o "${BTBN_ASSET}" "${base}/${BTBN_ASSET}"
          grep -F " ${BTBN_ASSET}" checksums.sha256 | sha256sum -c -
          tar -xJf "${BTBN_ASSET}" -C /tmp
          src="/tmp/${BTBN_ASSET%.tar.xz}"
          cp "$src/bin/ffmpeg" "$src/bin/ffprobe" "$dest/"
          chmod +x "$dest/ffmpeg" "$dest/ffprobe"
      - name: Add ffmpeg to PATH
        run: |
          echo "${{ runner.temp }}/ffmpeg-static" >> "$GITHUB_PATH"
          "${{ runner.temp }}/ffmpeg-static/ffmpeg" -version | head -1
      # Oct 22 2026: a change to the room's code is rehearsed before it is
      # deployed. This uploads the checked-out scenario as
      # age_of_ai_interview_candidate, reached only by "candroom-" calls,
      # which only the fixture guest makes; the live scenario and its rule are
      # never written here.
      - name: Upload this ref's interview scenario as the candidate
        if: ${{ inputs.candidate_scenario && env.ARMS != 'current' && inputs.remeasure == '' }}
        run: |
          python - <<'PY'
          from voximplant.api_clients.voximplant_client import (
              CANDIDATE_SCENARIO_NAME, ensure_candidate_room_rule, upload_candidate_scenario)
          print(f"uploaded {CANDIDATE_SCENARIO_NAME}: {upload_candidate_scenario()}")
          print("candidate room rule:", ensure_candidate_room_rule())
          PY
        env:
          GROK_VOICE_MODEL: ${{ vars.GROK_VOICE_MODEL }}
          GROK_SESSION_MAX_MIN: ${{ vars.GROK_SESSION_MAX_MIN }}
          VOICES_WEBHOOK_SECRET: ${{ secrets.VOICES_WEBHOOK_SECRET }}
      # The fixture guest is rehearsal-only. A candidate room is reached only
      # by a fixture that knows the "candroom-" prefix, and the hold beats are
      # fixture behaviour, so either input refreshes it from this ref (its
      # default prefix stays "room-").
      - name: Upload this ref's fixture guest
        if: ${{ (inputs.candidate_scenario || inputs.with_hold) && inputs.remeasure == '' && inputs.invite_email == '' }}
        run: |
          python - <<'PY'
          from voximplant.api_clients.voximplant_client import (
              FIXTURE_SCENARIO_NAME, ensure_fixture_rule, upload_fixture_scenario)
          print(f"uploaded {FIXTURE_SCENARIO_NAME}: {upload_fixture_scenario()}")
          print("fixture rule:", ensure_fixture_rule())
          PY
        env:
          GROK_VOICE_MODEL: ${{ vars.GROK_VOICE_MODEL }}
          GROK_SESSION_MAX_MIN: ${{ vars.GROK_SESSION_MAX_MIN }}
      - name: Rehearse the current configuration
        if: ${{ env.ARMS != 'proposed' && inputs.remeasure == '' && inputs.invite_email == '' }}
        run: |
          args=(--arm current --fixture "$FIXTURE" --minutes "$MINUTES" --repeat "$REPEAT" --out-dir "$OUT_DIR")
          [ "$WITH_HOLD" = "true" ] && args+=(--with-hold)
          python pipelines/voices/rehearsal.py run "${args[@]}"
        env:
          WITH_HOLD: ${{ inputs.with_hold }}
      - name: Rehearse the proposed configuration
        if: ${{ env.ARMS != 'current' && inputs.remeasure == '' && inputs.invite_email == '' }}
        run: |
          args=(--arm proposed --fixture "$FIXTURE" --minutes "$MINUTES" --repeat "$REPEAT" --out-dir "$OUT_DIR")
          [ -n "$TURN_SILENCE_MS" ] && args+=(--turn-silence-ms "$TURN_SILENCE_MS")
          [ -n "$REASONING_EFFORT" ] && args+=(--reasoning-effort "$REASONING_EFFORT")
          [ "$TOOLS" = "none" ] && args+=(--tools none)
          [ "$CANDIDATE" = "true" ] && args+=(--scenario candidate)
          [ "$WITH_HOLD" = "true" ] && args+=(--with-hold)
          python pipelines/voices/rehearsal.py run "${args[@]}"
        env:
          CANDIDATE: ${{ inputs.candidate_scenario }}
          WITH_HOLD: ${{ inputs.with_hold }}
          TURN_SILENCE_MS: ${{ inputs.turn_silence_ms }}
          REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          TOOLS: ${{ inputs.tools || 'default' }}
      # A measurement fix is checked on rooms that already ran: their
      # recordings stay on Voximplant, and a new room costs a Voice Agent
      # session on both sides.
      # Oct 23 2026: a person in the room instead of the fixture. The address
      # and the studio link stay out of the log (public repository): the
      # address reaches the script through the environment, the link only
      # through the email.
      - name: Invite a person to a test room
        if: ${{ inputs.invite_email != '' && inputs.remeasure == '' }}
        run: |
          scenario=deployed
          [ "$CANDIDATE" = "true" ] && scenario=candidate
          python pipelines/voices/rehearsal.py invite --email "$INVITE_EMAIL" \
            --minutes "$MINUTES" --scenario "$scenario" --out-dir "$OUT_DIR"
        env:
          INVITE_EMAIL: ${{ inputs.invite_email }}
          CANDIDATE: ${{ inputs.candidate_scenario }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          VOICES_FROM_EMAIL: ${{ secrets.VOICES_FROM_EMAIL }}
      - name: Re-measure rooms that already ran
        if: ${{ inputs.remeasure != '' }}
        run: python pipelines/voices/rehearsal.py remeasure --runs "$REMEASURE" --fixture "$FIXTURE" --out-dir "$OUT_DIR"
        env:
          REMEASURE: ${{ inputs.remeasure }}
      - name: Report
        if: ${{ always() }}
        run: |
          python pipelines/voices/rehearsal.py report "$OUT_DIR" \
            --summary-file "$OUT_DIR/report.md" --json-out "$OUT_DIR/report.json" || true
          cat "$OUT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no rooms measured" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the rooms and the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-${{ github.run_id }}
          path: outputs/rehearsals/
          retention-days: 14
          if-no-files-found: ignore
