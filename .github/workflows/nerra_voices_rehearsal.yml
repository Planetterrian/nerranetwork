# Nerra Voices — rehearsal harness (Oct 21 2026, review §7.5).
#
# A change to Mira's room (prompt, end-of-turn silence, reasoning effort)
# is rehearsed against a FIXTURE GUEST — a second voice agent playing a
# past guest from their approved transcript — before any real guest hears
# it. Two arms, same fixture, same scheduled behaviours: `proposed` is the
# prompt compile_mira_prompt writes today on the fixture's real application;
# `current` is the prompt the last real interview actually ran on. Each room
# is transcribed per speaker and measured with audio_metrics; the report
# prints PASS only on the §7.5 rule (proposed beats current on overlap
# events, self-answered turns and guest words per answer, and does not lose
# on turn length). A PASS still needs one operator listen before a deploy.
#
# This workflow never deploys anything. It needs the fixture-guest scenario
# deployed once (Deploy Voximplant scenario) and the Worker to leave a
# session_kind=rehearsal run alone (no editorial passes, no emails).
name: Nerra Voices — rehearsal
on:
  workflow_dispatch:
    inputs:
      fixture:
        description: 'Fixture guest (pipelines/voices/fixtures/rehearsal_guests.yaml)'
        type: choice
        options: [roddy, vincent, adrian]
        default: roddy
      minutes:
        description: 'Minutes per room'
        type: number
        default: 10
      repeat:
        description: 'Rooms per arm'
        type: number
        default: 3
      arms:
        description: 'Which arms to run'
        type: choice
        options: [both, proposed, current]
        default: both
      turn_silence_ms:
        description: 'Proposed arm: end-of-turn silence override (blank = the fire step default)'
        type: string
        default: ''
      reasoning_effort:
        description: 'Proposed arm: interview_runs.reasoning_effort (blank = the room default)'
        type: string
        default: ''
      tools:
        description: 'Proposed arm: in-call tools'
        type: choice
        options: [default, none]
        default: default
      candidate_scenario:
        description: 'Proposed arm runs THIS ref''s interview scenario, uploaded beside the live one (the live scenario is not touched)'
        type: boolean
        default: false
      with_hold:
        description: 'The fixture steps away to take a call at minute four (both arms)'
        type: boolean
        default: false
  # Nightly only when the operator turns it on: repo variable
  # VOICES_REHEARSAL_NIGHTLY=true. Each room costs a Voice Agent session on
  # both sides.
  schedule:
    - cron: '23 9 * * *'

permissions:
  contents: read

concurrency:
  group: nerra-voices-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    if: ${{ github.event_name != 'schedule' || vars.VOICES_REHEARSAL_NIGHTLY == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      FIXTURE: ${{ inputs.fixture || 'roddy' }}
      MINUTES: ${{ inputs.minutes || 10 }}
      REPEAT: ${{ inputs.repeat || 3 }}
      ARMS: ${{ inputs.arms || 'both' }}
      OUT_DIR: outputs/rehearsals/${{ github.run_id }}
      SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
      VOXIMPLANT_ACCOUNT_ID: ${{ secrets.VOXIMPLANT_ACCOUNT_ID }}
      VOXIMPLANT_API_KEY: ${{ secrets.VOXIMPLANT_API_KEY }}
      VOXIMPLANT_CALLER_ID: ${{ secrets.VOXIMPLANT_CALLER_ID }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      REHEARSAL_COUGH_CLIP: ${{ vars.REHEARSAL_COUGH_CLIP }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.14'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      - uses: ./.github/actions/setup-ffmpeg
      # Oct 22 2026: a change to the room's code is rehearsed before it is
      # deployed. This uploads the checked-out scenario as
      # age_of_ai_interview_candidate, reached only by "candroom-" calls,
      # which only the fixture guest makes; the live scenario and its rule are
      # never written here.
      - name: Upload this ref's interview scenario as the candidate
        if: ${{ inputs.candidate_scenario && env.ARMS != 'current' }}
        run: |
          python - <<'PY'
          from voximplant.api_clients.voximplant_client import (
              CANDIDATE_SCENARIO_NAME, ensure_candidate_room_rule, upload_candidate_scenario)
          print(f"uploaded {CANDIDATE_SCENARIO_NAME}: {upload_candidate_scenario()}")
          print("candidate room rule:", ensure_candidate_room_rule())
          PY
        env:
          GROK_VOICE_MODEL: ${{ vars.GROK_VOICE_MODEL }}
          GROK_SESSION_MAX_MIN: ${{ vars.GROK_SESSION_MAX_MIN }}
          VOICES_WEBHOOK_SECRET: ${{ secrets.VOICES_WEBHOOK_SECRET }}
      # The fixture guest is rehearsal-only. A candidate room is reached only
      # by a fixture that knows the "candroom-" prefix, and the hold beats are
      # fixture behaviour, so either input refreshes it from this ref (its
      # default prefix stays "room-").
      - name: Upload this ref's fixture guest
        if: ${{ inputs.candidate_scenario || inputs.with_hold }}
        run: |
          python - <<'PY'
          from voximplant.api_clients.voximplant_client import (
              FIXTURE_SCENARIO_NAME, ensure_fixture_rule, upload_fixture_scenario)
          print(f"uploaded {FIXTURE_SCENARIO_NAME}: {upload_fixture_scenario()}")
          print("fixture rule:", ensure_fixture_rule())
          PY
        env:
          GROK_VOICE_MODEL: ${{ vars.GROK_VOICE_MODEL }}
          GROK_SESSION_MAX_MIN: ${{ vars.GROK_SESSION_MAX_MIN }}
      - name: Rehearse the current configuration
        if: ${{ env.ARMS != 'proposed' }}
        run: |
          args=(--arm current --fixture "$FIXTURE" --minutes "$MINUTES" --repeat "$REPEAT" --out-dir "$OUT_DIR")
          [ "$WITH_HOLD" = "true" ] && args+=(--with-hold)
          python pipelines/voices/rehearsal.py run "${args[@]}"
        env:
          WITH_HOLD: ${{ inputs.with_hold }}
      - name: Rehearse the proposed configuration
        if: ${{ env.ARMS != 'current' }}
        run: |
          args=(--arm proposed --fixture "$FIXTURE" --minutes "$MINUTES" --repeat "$REPEAT" --out-dir "$OUT_DIR")
          [ -n "$TURN_SILENCE_MS" ] && args+=(--turn-silence-ms "$TURN_SILENCE_MS")
          [ -n "$REASONING_EFFORT" ] && args+=(--reasoning-effort "$REASONING_EFFORT")
          [ "$TOOLS" = "none" ] && args+=(--tools none)
          [ "$CANDIDATE" = "true" ] && args+=(--scenario candidate)
          [ "$WITH_HOLD" = "true" ] && args+=(--with-hold)
          python pipelines/voices/rehearsal.py run "${args[@]}"
        env:
          CANDIDATE: ${{ inputs.candidate_scenario }}
          WITH_HOLD: ${{ inputs.with_hold }}
          TURN_SILENCE_MS: ${{ inputs.turn_silence_ms }}
          REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          TOOLS: ${{ inputs.tools || 'default' }}
      - name: Report
        if: ${{ always() }}
        run: |
          python pipelines/voices/rehearsal.py report "$OUT_DIR" \
            --summary-file "$OUT_DIR/report.md" --json-out "$OUT_DIR/report.json" || true
          cat "$OUT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no rooms measured" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the rooms and the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-${{ github.run_id }}
          path: outputs/rehearsals/
          retention-days: 14
          if-no-files-found: ignore
