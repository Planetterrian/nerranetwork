name: Generate Multilingual Audio

# Decoupled multilingual (FR/RU/ES/ZH) audio generation (June 2026).
#
# This used to run INLINE inside run-show.yml after each episode published,
# but four sequential Grok-TTS renders (~16 min) pushed video-heavy shows
# (Tesla, SpaceX) past the 2400s episode-pipeline timeout — the SIGALRM fired
# mid-render, run_show exited non-zero, and the episode's commit step was
# skipped, leaving a partial publish (R2 + YouTube done, nothing committed).
#
# It now runs off the critical path here: a scheduled sweep (plus manual
# dispatch) that runs the idempotent driver scripts/generate_translations.py
# for each multilingual-enabled show. The driver skips (episode, language)
# pairs already present, so re-runs are cheap and it naturally backfills any
# tracks a prior run missed. The episode pipeline stays fast + durable.

on:
  # Fire right after an episode publishes so the latest episode is translated
  # within minutes (not hours). The episode pipeline ("Run Podcast Show") is a
  # separate workflow; its completion triggers a sweep here. The resolve job
  # narrows the matrix to the show the triggering run published (parsed from
  # its "Auto-generated: <show> <date>" head commit) — the old all-7-show
  # fan-out per episode run was ~35 mostly-no-op jobs/day. The scheduled
  # passes below stay full-fan-out catch-alls for anything this misses.
  workflow_run:
    workflows: ["Run Podcast Show"]
    types: [completed]
  schedule:
    # After the morning show window (shows finish ~12-13 UTC; GitHub cron is
    # often hours late, which is fine — the sweep is idempotent). Two passes
    # catch stragglers + late-arriving episodes.
    - cron: '7 14 * * *'
    - cron: '7 18 * * *'
  workflow_dispatch:
    inputs:
      show:
        description: 'Show slug to translate (or "all" for every enabled show)'
        required: true
        default: all
        type: string
      latest:
        description: 'How many recent episodes per show'
        required: false
        default: '3'
        type: string
      force:
        description: 'Re-translate even if a track already exists (passes --force). Use to refresh episodes after a prompt change.'
        required: false
        default: false
        type: boolean

# Serialize multilingual runs so two sweeps never fight over the same
# summaries files / git push.
concurrency:
  group: multilingual
  cancel-in-progress: false

permissions:
  contents: write
  # Needed so the push-failure recovery fallback can open a draft PR via the
  # gh CLI (scripts/create_recovery_pr.sh) — without it the RU-dub upload
  # records in a lost commit would be discarded and the next sweep would
  # re-upload duplicate public videos.
  pull-requests: write

jobs:
  # Decide which shows to translate, then fan out one job per show. Splitting
  # per-show (vs the old single sequential job that translated every show then
  # committed once at the end) (a) cuts wall-clock from ~3h to ~15min/show in
  # parallel and (b) removes the all-or-nothing timeout risk — each show
  # commits its own tracks independently, so a slow/failed show can't lose the
  # others' work.
  resolve:
    runs-on: ubuntu-latest
    # On the workflow_run trigger, only proceed if the episode pipeline that
    # triggered us actually succeeded — no point translating a failed/partial
    # publish. Schedule + manual dispatch always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      shows: ${{ steps.resolve.outputs.shows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'requirements.txt'
          skip-checkout: 'true'

      - name: Resolve shows to translate
        id: resolve
        shell: python3 {0}
        env:
          # Passed via env (not inline substitution) so a commit message can't
          # inject into the script. May be empty on non-workflow_run events.
          HEAD_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          import json, os, re, sys
          # `shell: python3 {0}` runs this from a temp file, so the repo root
          # isn't on sys.path — add the workspace (cwd) so `engine` imports.
          sys.path.insert(0, os.getcwd())
          from engine.config import discover_show_slugs, load_config

          def auto_enabled_shows():
              shows = []
              for slug in discover_show_slugs():
                  try:
                      cfg = load_config(f"shows/{slug}.yaml")
                  except Exception:
                      continue
                  ml = getattr(cfg, "multilingual", None)
                  if ml and ml.enabled and getattr(ml, "auto", False):
                      shows.append(slug)
              return shows

          dispatch = "${{ github.event.inputs.show }}".strip()
          event = "${{ github.event_name }}"
          if dispatch and dispatch not in ("", "all"):
              # Explicit single-show dispatch — honor it even if auto is off.
              shows = [dispatch]
          elif event == "workflow_run":
              # Triggered by one episode publish — sweep only the show it
              # published instead of fanning out all 7 matrix jobs. The
              # episode commit is "Auto-generated: <show> <YYYY-MM-DD>"
              # (run-show.yml); a show that isn't multilingual-enabled
              # resolves to []. When the head commit doesn't name a show
              # (e.g. the run started on an unrelated tip), fall back to the
              # full idempotent sweep — the cron passes remain the catch-all.
              head_msg = (os.environ.get("HEAD_COMMIT_MESSAGE") or "").strip()
              m = re.match(r"Auto-generated: (\S+) \d{4}-\d{2}-\d{2}",
                           head_msg.splitlines()[0] if head_msg else "")
              if m:
                  enabled = auto_enabled_shows()
                  shows = [m.group(1)] if m.group(1) in enabled else []
              else:
                  shows = auto_enabled_shows()
          else:
              # Scheduled / "all": every show that opts into auto multilingual.
              shows = auto_enabled_shows()
          print("Multilingual shows:", shows)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"shows={json.dumps(shows)}\n")

  translate:
    needs: resolve
    # Skip cleanly when no show qualifies (e.g. a no-op episode run).
    if: ${{ needs.resolve.outputs.shows != '' && needs.resolve.outputs.shows != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Cap parallelism: bounds Grok TTS concurrency (rate limits) and
      # push contention against main. The retry loop below absorbs the rest.
      max-parallel: 3
      matrix:
        show: ${{ fromJson(needs.resolve.outputs.shows) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # July 16 2026 — check out the LIVE main tip, not the pinned
          # trigger-time github.sha. The concurrency group serializes
          # multilingual runs, but a queued run's github.sha is frozen at
          # trigger time — observed 6 s stale on Jul 16 (run B triggered at
          # 11:42:16 on 384b0db4; run A's tesla push landed 11:42:22), so
          # the idempotent driver saw no tracks, re-translated Ep543, and
          # uploaded a DUPLICATE public RU Short to @NerraRU. The stale
          # checkout also made the commit step's rebase hit deterministic
          # add/add conflicts (recovery PRs #819/#820/#824/#825/#829/#830
          # were all duplicates of work already on main). `ref: main`
          # resolves at job start — after any sibling run has pushed.
          ref: main

      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'requirements.txt'
          system-packages: 'ffmpeg'
          skip-checkout: 'true'

      - name: Cache Whisper transcription model
        # The RU-dub step transcribes the Russian audio (faster-whisper
        # "base") for smart-start + Russian captions on the Shorts. Same
        # pinned model + cache key as run-show.yml so the ~150 MB HF
        # download is a one-time cost, not per-run.
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: whisper-faster-base-v1

      - name: Translate ${{ matrix.show }}
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_CLONED_VOICE_ID: ${{ secrets.GROK_CLONED_VOICE_ID }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          LATEST="${{ github.event.inputs.latest }}"
          [ -z "$LATEST" ] && LATEST=3
          # Operator-set --force re-translates episodes that already have tracks
          # (e.g. to refresh them after a translation-prompt change).
          FORCE=""
          [ "${{ github.event.inputs.force }}" = "true" ] && FORCE="--force"
          # --zh-approved is per-show now (multilingual.zh_approved in the show
          # YAML) — the old blanket flag defeated the listen-first ZH gate.
          ZH_FLAG=$(python -c "from engine.config import load_config; print('--zh-approved' if getattr(load_config('shows/${{ matrix.show }}.yaml').multilingual, 'zh_approved', False) else '')")
          # `</dev/null`: keep ffmpeg/ffprobe from consuming the step's stdin.
          python scripts/generate_translations.py "${{ matrix.show }}" --latest "$LATEST" ${ZH_FLAG:+"$ZH_FLAG"} ${FORCE:+"$FORCE"} </dev/null

      - name: Publish ${{ matrix.show }} Russian dubs to @NerraRU
        if: always()
        # Builds a Russian-dubbed video from the just-generated `ru` audio
        # track (reusing the episode's gallery scene images) and uploads to
        # the @NerraRU channel — only for shows with youtube.ru_dub_enabled.
        # Clean no-op for every other show and when YOUTUBE_REFRESH_TOKEN_RU
        # is unset. Off the episode critical path → no timeout risk.
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_RU: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RU }}
          # The RU title path translates the EN *optimized* YouTube title via
          # Grok (engine/ru_dub._translate_title_to_ru). Without the key every
          # dub silently falls back to the truncated hook title — observed on
          # all Jul 14-16 2026 @NerraRU uploads.
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.GROK_API_KEY }}
          # Gallery-scene downloads fall back to authenticated R2 when the
          # public CDN 403s CI egress (the Tesla Ep537 failure mode).
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          LATEST="${{ github.event.inputs.latest }}"
          [ -z "$LATEST" ] && LATEST=3
          python scripts/publish_ru_dubs.py "${{ matrix.show }}" --latest "$LATEST" </dev/null || \
            echo "::warning::RU dub publish failed for ${{ matrix.show }} (non-fatal)"

      - name: Build ${{ matrix.show }} language feeds
        if: always()
        env:
          # Translates + caches this show's channel title/description once
          # (digests/<slug>/channel_i18n.json); later rebuilds are credit-free.
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          python scripts/build_language_feeds.py "${{ matrix.show }}" || \
            echo "::warning::Language-feed build failed for ${{ matrix.show }}"

      - name: Regenerate ${{ matrix.show }} pages
        if: always()
        run: |
          # Regenerate just this show's pages so the per-episode language
          # switcher + per-language feed links render. Show-scoped, so parallel
          # jobs never touch the same files.
          python generate_html.py --show "${{ matrix.show }}" --blogs || \
            echo "::warning::HTML regen failed for ${{ matrix.show }} — next nightly regen will catch it"

      - name: Commit and push ${{ matrix.show }}
        if: always()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # Fresh checkout + show-scoped translate/feed/regen means the only
          # changes present belong to this show, so `git add -A` is safe and
          # parallel jobs stage disjoint files.
          git add -A
          if git diff --cached --quiet; then
            echo "No new translations to commit for ${{ matrix.show }}."
            exit 0
          fi
          git commit -m "Multilingual: ${{ matrix.show }} translation tracks $(date -u +%Y-%m-%d)"

          # More attempts than the single-job path: up to 3 shows push
          # concurrently, so ref-update collisions are expected and retried.
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin main && git push origin main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            [ $attempt -lt 8 ] && sleep $((attempt * 4))
          done

          # NOT safe to drop this commit: the RU-dub YouTube uploads already
          # happened and their only dedupe record (youtube_videos.ru.json) is
          # in it — discarding it makes the next sweep re-upload duplicate
          # public videos. Preserve the commit via a recovery branch + draft
          # PR, exactly like run-show.yml's commit step.
          echo "::warning::Could not push ${{ matrix.show }} translations after 8 attempts — preserving the commit (it may hold RU-dub upload records whose loss would cause duplicate uploads) via a recovery PR."
          GH_TOKEN="${{ github.token }}" \
          SHOW="multilingual-${{ matrix.show }}" \
          RUN_ID="${{ github.run_id }}" \
          REPO_URL="${{ github.server_url }}/${{ github.repository }}" \
          NOTIFICATION_WEBHOOK_URL="${{ secrets.NOTIFICATION_WEBHOOK_URL }}" \
          scripts/create_recovery_pr.sh
          exit $?
