# Nerra Voices — the weekly lesson pass (Oct 21 2026 review, §7.4).
# The grading pass after each interview PROPOSES standing instructions for
# Mira; this job decides once a week over all of the week's rooms with
# their audio measurements in front of it: at most six adopted, positive,
# with evidence; a lesson retired only when the metric that motivated it
# has been green for three rooms, never by age. Per-tape adoption (Sept 21)
# churned about a hundred lessons through the prompt while the grades did
# not move. pipelines/voices/adopt_lessons_weekly.py has the rules.
#
# Monday 14:51 UTC (before the week's first room, after the weekend's
# post-processing). Dispatch with dry_run to see the decision without it.
name: Weekly lesson pass
on:
  schedule:
    - cron: '51 14 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Decide nothing; print what the pass would do'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nerra-voices-weekly-lessons
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.14'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      - name: Adopt, merge, drop and retire
        run: >-
          python pipelines/voices/adopt_lessons_weekly.py
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
