name: TEMP word times for Blaine's ending
on:
  push:
    branches: [claude/project-thread-o1l615]
    paths: ['.github/workflows/zz_tmp_words.yml']
permissions:
  contents: read
jobs:
  words:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.14'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      - uses: ./.github/actions/setup-ffmpeg
      - name: Words
        run: |
          B=https://audio.nerranetwork.com/age_of_ai/raw/43ff31a6-e248-4352-8f47-6f5414ee0f49
          for r in guest mira; do
            curl -sSL -o $r.wav "${B}_${r}_rt20261104200204.wav"
            ffmpeg -nostdin -loglevel error -y -ss 2050 -t 140 -i $r.wav -ac 1 -ar 16000 w_$r.wav
            echo "== silences $r"; ffmpeg -nostdin -i w_$r.wav -af silencedetect=n=-40dB:d=0.4 -f null - 2>&1 | grep -o 'silence_[a-z]*: [0-9.]*' | awk '{printf "%s %.2f\n",$1,$2+2050}'
          done
          python - <<'P'
          from faster_whisper import WhisperModel
          m = WhisperModel("small", compute_type="int8")
          for r in ("guest", "mira"):
              segs, _ = m.transcribe(f"w_{r}.wav", word_timestamps=True, vad_filter=False)
              print("== words", r)
              for s in segs:
                  print(" ".join(f"{w.word.strip()}@{w.start+2050:.2f}-{w.end+2050:.2f}" for w in s.words))
          P
