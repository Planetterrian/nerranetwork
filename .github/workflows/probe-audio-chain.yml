# Read-only probe of the audio chain on fresh Grok audio (Oct 29 2026) — see
# scripts/probe_audio_chain.py. With no `script` input it synthesises one
# short passage on the show voice and on Mira (~900 characters), runs every
# stage old and new (Mira's piece, the voice chain, a story pause, the
# joins), prints clicks, pause floor and hiss per file, and attaches the
# audio so the operator can listen.
#
# Nov 3 2026 (listen before the slate): with `script` set to a committed
# digests/<dir>/<ep>_tts.txt it voices the first `seconds` of that REAL
# script on the show's voice (about 1,200 characters for 75 s, cents of
# TTS) and renders each named chain `variants` entry and the full mix
# through the real builders with the show's own theme — before/after MP3s
# plus loudness, clicks and hiss per file. A tts.dialogue_mode show (the DP
# Pod) renders at every DIALOGUE_SPEEDS automatically.
#
# Publishes nothing. Runs on a push that changes the probe (so a session
# branch can run it before merge) and on demand.
name: Probe audio chain

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'A committed TTS script, e.g. digests/tesla_shorts_time/<ep>_tts.txt (empty = the Oct 29 fixture passage)'
        required: false
        type: string
        default: ''
      seconds:
        description: 'How much of the script to voice (seconds)'
        required: false
        type: string
        default: '75'
      variants:
        description: 'Comma-separated chain variants (legacy, no_denoise, strong_declick, glue); a name the builders on this tree do not offer is reported and skipped'
        required: false
        type: string
        default: 'legacy'
      voice:
        description: 'Grok voice id (empty = the show''s tts.voice_id)'
        required: false
        type: string
        default: ''
  push:
    branches: ['claude/**']
    paths:
      - scripts/probe_audio_chain.py
      - .github/workflows/probe-audio-chain.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q -r requirements.txt
      - name: Probe the audio chain
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          PROBE_SCRIPT: ${{ github.event.inputs.script }}
          PROBE_SECONDS: ${{ github.event.inputs.seconds }}
          PROBE_VARIANTS: ${{ github.event.inputs.variants }}
          PROBE_VOICE: ${{ github.event.inputs.voice }}
        run: |
          ARGS=()
          if [ -n "$PROBE_SCRIPT" ]; then
            ARGS+=(--script "$PROBE_SCRIPT" --seconds "${PROBE_SECONDS:-75}" --variants "${PROBE_VARIANTS:-legacy}")
            [ -n "$PROBE_VOICE" ] && ARGS+=(--voice "$PROBE_VOICE")
          fi
          python3 scripts/probe_audio_chain.py "${ARGS[@]}"
      - name: Attach the audio
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audio-chain-probe
          path: probe_out/
          retention-days: 7
