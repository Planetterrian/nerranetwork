# Curriculum / queue-runway invariants — always run.
#
# test.yml skips on generated-only pushes to main (paths-ignore). Those
# pushes are exactly when a curriculum or topic-queue shortfall can land
# unnoticed: the daily pipeline drains subjects/topics and commits only
# digests/blog/html, so the full suite never sees the red check. This
# workflow has NO paths filter so a green main cannot hide a runway miss.
name: Curriculum invariants

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: curriculum-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  curriculum:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: ./.github/actions/setup-python
        timeout-minutes: 10
        with:
          python-version: '3.14'
          requirements-file: 'requirements.txt'
          skip-checkout: 'true'

      # ONE job owns every curriculum invariant. Serial, no -x: every
      # invariant reports in one run. Selectors verified via
      # --collect-only -q (46 node ids under these three targets).
      - name: Run curriculum invariants
        run: |
          python -m pytest \
            tests/test_launch_cohort_formats_2026_09_23.py::TestPredictionMarkets \
            tests/test_network_quality_pass.py::TestNarrativeQueueRunway \
            tests/test_queue_restock.py \
            -q --tb=short
