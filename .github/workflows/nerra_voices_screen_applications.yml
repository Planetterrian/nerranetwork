# Nerra Voices — screen pending guest applications for substance
# (Sept 18 2026). Every hour, each new application is read once against the
# open web and a verdict (strong / thin / unclear, with what was found and
# what was not) is written beside it on the triage page. Advice for the
# producer; nobody is declined by a machine.
name: Screen guest applications
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      application_id:
        description: 'guest_applications.id to (re)screen; blank = every unscreened pending application'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nerra-voices-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      - run: python pipelines/voices/screen_applications.py ${{ inputs.application_id }}
        env:
          SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
