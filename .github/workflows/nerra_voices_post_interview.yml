# Nerra Voices — post-interview processing (spec §5.3). Triggered by the
# api.nerranetwork.com/voices/interview-complete Worker (which receives the
# Voximplant hangup webhook) via repository_dispatch. Mixes audio, runs
# per-channel STT, the 8 editorial passes, and pings Patrick (gate 1).
name: Post-interview processing
on:
  repository_dispatch:
    types: [interview-complete]
  # Manual re-drive (Sept 14 2026). The hangup webhook fires once; when the
  # job fails for a reason that has nothing to do with the interview — that
  # day, a third-party ffmpeg action breaking — there was no way to run it
  # again without faking a webhook, and a finished interview sat unprocessed.
  workflow_dispatch:
    inputs:
      run_id:
        description: 'interview_runs.id to process'
        type: string
        required: true

permissions:
  contents: read

# Duplicate webhook deliveries for the same interview must not run the
# full mix + STT + editorial pipeline twice concurrently.
concurrency:
  group: nerra-voices-post-${{ github.event.client_payload.interview_id || inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # ffmpeg mix + per-channel Whisper STT + 8 editorial passes; cap well
    # below the 6h GitHub default so a hung API call can't strand it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          # No git history needed (landmine #1: full clone is ~2.5 GB).
          fetch-depth: 1
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      - uses: ./.github/actions/setup-ffmpeg
      - run: python pipelines/voices/post_interview.py
        env:
          INTERVIEW_RUN_ID: ${{ github.event.client_payload.run_id || inputs.run_id }}
          # ADMIN_TOKEN derives the per-package gate-1 review token that
          # goes in Patrick's email (must match the Worker's).
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          CALCOM_BOOKING_URL: ${{ secrets.CALCOM_BOOKING_URL }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}

      # Everything below used to be a person remembering to ask. The
      # interview ends; the episode should be waiting for Patrick, not
      # waiting for Patrick to request it. Each step is still separately
      # re-runnable by hand, and a failure here leaves the package and the
      # transcript intact — only the automatic cut is lost.
      - name: Cut the episode
        id: cut
        run: |
          python pipelines/voices/auto_edit.py "${{ github.event.client_payload.run_id || inputs.run_id }}" | tee /tmp/cut.json
          echo "slug=$(python -c 'import json,sys;print(json.load(open("/tmp/cut.json"))["slug"])')" >> "$GITHUB_OUTPUT"
        env:
          INTERVIEW_RUN_ID: ${{ github.event.client_payload.run_id || inputs.run_id }}
          # ADMIN_TOKEN derives the per-package gate-1 review token that
          # goes in Patrick's email (must match the Worker's).
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          CALCOM_BOOKING_URL: ${{ secrets.CALCOM_BOOKING_URL }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}

      - name: Mira reads the introduction and close
        run: python pipelines/voices/narrate.py "${{ steps.cut.outputs.slug }}"
        env:
          INTERVIEW_RUN_ID: ${{ github.event.client_payload.run_id || inputs.run_id }}
          # ADMIN_TOKEN derives the per-package gate-1 review token that
          # goes in Patrick's email (must match the Worker's).
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          CALCOM_BOOKING_URL: ${{ secrets.CALCOM_BOOKING_URL }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
          VOXIMPLANT_ACCOUNT_ID: ${{ secrets.VOXIMPLANT_ACCOUNT_ID }}
          VOXIMPLANT_API_KEY: ${{ secrets.VOXIMPLANT_API_KEY }}
          MIRA_VOICE_PRESET: ${{ vars.MIRA_VOICE_PRESET }}

      - name: Assemble and send it to Patrick
        run: python pipelines/voices/assemble_edit.py "${{ steps.cut.outputs.slug }}"
        env:
          INTERVIEW_RUN_ID: ${{ github.event.client_payload.run_id || inputs.run_id }}
          # ADMIN_TOKEN derives the per-package gate-1 review token that
          # goes in Patrick's email (must match the Worker's).
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          CALCOM_BOOKING_URL: ${{ secrets.CALCOM_BOOKING_URL }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
