name: Capture Site Screenshots

# Refreshes the committed screenshots of nerranetwork.com under
# assets/site_screens/ once a month and on demand (after a site redesign).
# Since Nov 3 2026 the outro card and the Shorts end card render from the
# show registry (engine/promo_card.py), not from these files: the only
# capture that ever ran was Aug 9 2026, and this workflow's Nov 1 run was
# green with every page failed and nothing committed, so every video showed
# the Aug 9 homepage (a retired no-advertising promise, a four-language
# list) for 86 days. The script now
# exits non-zero when it captures nothing, and the step below refuses a run
# that changed no file — a capture that silently keeps the old pictures is
# the defect, whichever showcase design the operator keeps.

on:
  workflow_dispatch:
  schedule:
    # 09:13 UTC on the 1st of each month — after the morning slate.
    - cron: "13 9 1 * *"

permissions:
  contents: write

concurrency:
  group: capture-site-screens
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.14'
          requirements-file: 'requirements.txt'
          skip-checkout: 'true'

      - name: Install Chromium for Playwright
        run: |
          set -euo pipefail
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture the pages
        run: python scripts/capture_site_screens.py

      - name: Refuse a run that changed nothing
        # The site's front page changes every day, so a capture that leaves
        # every committed PNG byte-identical did not capture (Nov 1 2026).
        run: |
          set -euo pipefail
          if git status --porcelain -- assets/site_screens | grep -q .; then
            echo "screenshots refreshed:"
            git status --porcelain -- assets/site_screens
          else
            echo "::error::capture_site_screens wrote nothing new — the committed screenshots are as old as before"
            exit 1
          fi

      - uses: ./.github/actions/safe-commit-push
        with:
          add-paths: "assets/site_screens/*.png"
          commit-message: "Site screenshots: refresh the outro and end-card captures"
