# TEMPORARY (Nov 27 2026): word-timed analysis for the Surendra Goel hand
# re-cut. Runs only on this branch; never merged.
name: tmp surendra analysis
on:
  push:
    branches: [claude/project-thread-tia1bx]
    paths: ['analysis/surendra/targets.json']
permissions:
  contents: write
jobs:
  track:
    strategy:
      matrix:
        name: [guest, mira, edit]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}
      - uses: ./.github/actions/setup-ffmpeg
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install faster-whisper numpy
      - name: analyse
        run: |
          URL=$(python -c "import json;print(json.load(open('analysis/surendra/targets.json'))['tracks'].get('${{ matrix.name }}',''))")
          RUN=$(python -c "import json;print(json.load(open('analysis/surendra/targets.json'))['run'])")
          if [ -z "$URL" ]; then echo skip; exit 0; fi
          python analysis/surendra/analyse.py ${{ matrix.name }} "$URL" out
          mkdir -p upl && cp out/*.json upl/ && echo "$RUN" > upl/run.txt
      - uses: actions/upload-artifact@v7
        with: {name: 'res-${{ matrix.name }}', path: upl/}
  commit:
    needs: track
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}
      - uses: actions/download-artifact@v5
        with: {path: dl}
      - run: |
          RUN=$(python3 -c "import json;print(json.load(open('analysis/surendra/targets.json'))['run'])")
          mkdir -p analysis/surendra/out/$RUN
          find dl -name '*.json' -exec cp {} analysis/surendra/out/$RUN/ \;
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/surendra/out
          git commit -m "tmp: Surendra analysis $RUN" && git push origin HEAD:claude/project-thread-tia1bx
