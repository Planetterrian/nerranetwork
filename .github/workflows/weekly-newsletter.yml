name: Weekly Newsletters

on:
  schedule:
    # Sunday at 2 PM UTC
    - cron: '0 14 * * 0'

  workflow_dispatch:
    inputs:
      show:
        description: 'Show to generate newsletter for (default: all)'
        required: false
        type: choice
        options:
          - all
          - tesla
          - omni_view
          - fascinating_frontiers
          - planetterrian
          - env_intel
          - models_agents
          - models_agents_beginners
          - finansy_prosto
          - modern_investing
          - privet_russian
      dry_run:
        description: 'Generate but do not send (default: false — will send!)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-newsletters
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'requirements.txt'

      - name: Backfill Content Lake from committed digests
        # NOTE: This pattern is duplicated in monthly-report.yml.
        # See scripts/backfill_content_lake.py for the implementation.
        # TODO(automation): Consider extracting to a composite action in the future.
        run: python scripts/backfill_content_lake.py

      - name: Run weekly newsletters
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.show }}" != "" ] && [ "${{ github.event.inputs.show }}" != "all" ]; then
            ARGS="--show ${{ github.event.inputs.show }}"
          fi
          # Scheduled runs (cron) actually send; manual dispatch respects the dry_run input.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled run — sending for real"
          elif [ "${{ github.event.inputs.dry_run }}" != "false" ]; then
            ARGS="$ARGS --dry-run"
            echo "Manual dispatch — dry run mode"
          fi
          python scripts/run_weekly_newsletters.py $ARGS

      - name: Generate cross-network intelligence briefing
        # Editorial synthesis across all 11 shows for the past 7 days.
        # Output: outputs/cross_network/cross_network_briefing_<YYYY-WW>.md.
        # The synthesizer skips when fewer than 10 episodes are in
        # window, so the script is no-op friendly.
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: python scripts/run_cross_network_briefing.py

      - uses: ./.github/actions/safe-commit-push
        with:
          add-paths: "outputs/newsletters/ outputs/cross_network/"
          commit-message: "Add weekly newsletters + cross-network briefing for $(date -I)"
