name: Weekly Newsletters

on:
  schedule:
    # Sunday at 2 PM UTC
    - cron: '0 14 * * 0'

  workflow_dispatch:
    inputs:
      show:
        description: 'Show to generate newsletter for (default: all)'
        required: false
        type: choice
        options:
          - all
          - tesla
          - omni_view
          - fascinating_frontiers
          - planetterrian
          - env_intel
          - models_agents
          - models_agents_beginners
          - finansy_prosto
          - modern_investing
          - privet_russian
      dry_run:
        description: 'Generate but do not send (default: false — will send!)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill Content Lake from committed digests
        # The Content Lake DB (data/content_lake.db) is in .gitignore,
        # so every fresh checkout starts with zero episodes — including
        # this scheduled runner. The daily run_show.py pipeline writes
        # to the DB but that copy is discarded when the runner shuts
        # down. Rebuilding from the committed digests/<slug>/*.md
        # files is fast (~5 s) and gives the synthesizer the past
        # week of episodes it needs. Without this step, every show
        # reported "Only 0 episodes for <show> week of …, skipping".
        run: python scripts/backfill_content_lake.py

      - name: Run weekly newsletters
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.show }}" != "" ] && [ "${{ github.event.inputs.show }}" != "all" ]; then
            ARGS="--show ${{ github.event.inputs.show }}"
          fi
          # Scheduled runs (cron) actually send; manual dispatch respects the dry_run input.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled run — sending for real"
          elif [ "${{ github.event.inputs.dry_run }}" != "false" ]; then
            ARGS="$ARGS --dry-run"
            echo "Manual dispatch — dry run mode"
          fi
          python scripts/run_weekly_newsletters.py $ARGS

      - name: Generate cross-network intelligence briefing
        # Editorial synthesis across all 11 shows for the past 7 days.
        # Output: outputs/cross_network/cross_network_briefing_<YYYY-WW>.md.
        # The synthesizer skips when fewer than 10 episodes are in
        # window, so the script is no-op friendly.
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: python scripts/run_cross_network_briefing.py

      - name: Commit newsletters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/newsletters/ outputs/cross_network/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Add weekly newsletters + cross-network briefing for $(date -I)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push failed (attempt $attempt), retrying in $((attempt * 2))s..."
            sleep $((attempt * 2))
          done
          echo "All push attempts failed"
          exit 1
