name: Build Gallery Manifest + Search Index

# Rebuilds site/data/gallery-manifest.json (R2 sidecars) and
# site/data/search-index.json (Content Lake FTS-powered episodes).
# See scripts/build_gallery_manifest.py and scripts/build_search_index.py.
#
# Search index (Item 2 of the May 2026 review) gives the global nav search
# full coverage of every episode via the lake without any runtime backend.
# Both builders are safe/no-op on missing data and avoid timestamp-only commits.
#
# Triggers:
#   * Nightly at 03:30 UTC (safety / full rebuild after everything settles).
#   * After every successful "Run Podcast Show" (via workflow_run) so new
#     episodes appear in the gallery + search within minutes.
#   * On push to main touching the builder scripts or templates.
#   * workflow_dispatch for manual runs.
#
# Note: nightly-maintenance.yml also runs the gallery + search builders as
# part of its artifact refresh (for immediate post-show consistency).

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Run Podcast Show"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/build_gallery_manifest.py'
      - 'scripts/build_search_index.py'
      - 'engine/gallery_uploader.py'
      - 'engine/content_lake.py'
      - 'templates/base.html.j2'
      - '.github/workflows/build-gallery-manifest.yml'

permissions:
  contents: write

concurrency:
  group: build-gallery-manifest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip workflow_run firings where the upstream Run Podcast Show failed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'requirements.txt'
          skip-checkout: 'true'

      - name: Build gallery manifest
        env:
          R2_GALLERY_BUCKET: ${{ secrets.R2_GALLERY_BUCKET }}
          R2_GALLERY_PUBLIC_BASE_URL: ${{ secrets.R2_GALLERY_PUBLIC_BASE_URL }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/build_gallery_manifest.py --out site/data/gallery-manifest.json

      - name: Build global search index (Content Lake FTS)
        # No secrets needed — purely local lake + metadata. Safe even if lake is empty.
        run: python scripts/build_search_index.py --out site/data/search-index.json

      - uses: ./.github/actions/safe-commit-push
        with:
          add-paths: "site/data/gallery-manifest.json site/data/search-index.json"
          commit-message: "Update gallery manifest + search index $(date -u +%Y-%m-%dT%H:%MZ)"
