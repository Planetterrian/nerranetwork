name: Run Tests

on:
  push:
    branches: [main]
    # Oct 19 2026: the pipeline pushes to main ~100 times a day (episode
    # commits, audio-first checkpoints, video, multilingual, finalize), and
    # each push ran the full suite — ~18 runs and ~150 runner-minutes a day
    # testing commits that change no code. A push that touches ONLY generated
    # output is skipped; pull requests always run (no paths filter there, so
    # a required check is never left pending).
    paths-ignore:
      - 'digests/**'
      - 'blog/**'
      - 'claims/**'
      - 'topics/**'
      - 'ru/**'
      - 'fr/**'
      - 'api/**'
      - 'site/data/**'
      - 'assets/share/**'
      - 'assets/site_screens/**'
      - 'specials/**'
      - 'books/catalog.json'
      - '*.rss'
      - '*.html'
      - 'sitemap.xml'
  pull_request:
    branches: [main]
  # Weekly full-suite backstop for the paths filter: generated-only pushes
  # skip this workflow, so a Monday cron still exercises the whole suite.
  schedule:
    - cron: '17 6 * * 1'

# Cancel superseded runs on the same PR; on main every push gets its own
# group (run_id) so nothing is cancelled there.
concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-26.04
    # Oct 22 2026: main run 39810036245 spent ~15 min in setup-python on a
    # trickle-slow apt ffmpeg mirror (3×300 s → exit 124). Keep a hard job
    # ceiling so a stalled setup cannot burn a full runner hour.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No git history needed (landmine #1: full clone is ~2.5 GB).
          fetch-depth: 1

      # cache-dependency-path pins the pip cache key to the requirements
      # files (not the runner image fingerprint alone). No apt ffmpeg here
      # — see Cached static ffmpeg below (main 39810036245 hung ~15 min on
      # a trickle mirror installing ffmpeg via apt).
      - name: Setup Python
        uses: ./.github/actions/setup-python
        timeout-minutes: 10
        with:
          python-version: '3.14'
          requirements-file: 'requirements.txt'
          cache-dependency-path: |
            requirements.txt
            requirements_fascinating_frontiers.txt
            requirements_planetterrian.txt
          # Oct 9 2026: pytest-xdist runs the suite across the runner's cores.
          extra-packages: "ruff pytest-xdist"
          skip-checkout: 'true'

      # Static ffmpeg via actions/cache (not apt, not FedericoCarboni —
      # the latter broke on Sep 14 2026 by scraping an upstream README;
      # see .github/actions/setup-ffmpeg). Pin a dated BtbN autobuild tag
      # (not ``latest``); cache key includes the tag; miss downloads the
      # exact asset and verifies sha256sum -c against that release's
      # checksums.sha256 under a 6-minute ceiling.
      - name: Cache static ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-static
          key: ffmpeg-btbn-autobuild-2026-10-22-13-06-n8.1.3-23-g5c4f5744cd-linux64-gpl-8.1

      - name: Install static ffmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        timeout-minutes: 6
        env:
          BTBN_TAG: autobuild-2026-10-22-13-06
          BTBN_ASSET: ffmpeg-n8.1.3-23-g5c4f5744cd-linux64-gpl-8.1.tar.xz
        run: |
          set -euo pipefail
          dest="${{ runner.temp }}/ffmpeg-static"
          mkdir -p "$dest"
          base="https://github.com/BtbN/FFmpeg-Builds/releases/download/${BTBN_TAG}"
          cd /tmp
          curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            -o checksums.sha256 "${base}/checksums.sha256"
          curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            -o "${BTBN_ASSET}" "${base}/${BTBN_ASSET}"
          grep -F " ${BTBN_ASSET}" checksums.sha256 | sha256sum -c -
          tar -xJf "${BTBN_ASSET}" -C /tmp
          src="/tmp/${BTBN_ASSET%.tar.xz}"
          cp "$src/bin/ffmpeg" "$src/bin/ffprobe" "$dest/"
          chmod +x "$dest/ffmpeg" "$dest/ffprobe"

      - name: Add ffmpeg to PATH
        run: |
          echo "${{ runner.temp }}/ffmpeg-static" >> "$GITHUB_PATH"
          "${{ runner.temp }}/ffmpeg-static/ffmpeg" -version | head -1

      - name: Lint with ruff (full)
        run: ruff check engine/ run_show.py scripts/ --fix --exit-non-zero-on-fix

      - name: Validate GitHub Actions workflows (actionlint)
        env:
          # The ONLY working place to suppress shellcheck codes for
          # actionlint — the `shellcheck:` block that used to sit in
          # .github/actionlint.yaml is not part of actionlint's config
          # schema and silently did nothing. These four are noisy-to-false
          # in the Actions environment (`${{ }}` expands before the shell
          # runs); fix the script rather than extend this list.
          SHELLCHECK_OPTS: "-e SC2086 -e SC2034 -e SC2044 -e SC2035"
        run: |
          # Install actionlint if not present
          curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest
          ./actionlint -color

      - name: Run tests
        if: github.event_name != 'schedule'
        # Oct 9 2026: in parallel across the runner's cores (operator-directed).
        # Serial, 11,700 tests took 12-20 minutes on the new image; the first
        # xdist trial locally ran 5,777 of them in six minutes on four
        # workers, and the clean full run passed. -x still stops the run on
        # the first failure.
        # Curriculum / queue-runway invariants live in curriculum.yml (always
        # runs, including on generated-only pushes). Deselect exact node ids
        # here so a curriculum break is red on the curriculum check, never
        # silently absent from this job. Never use -k for this — a green
        # check that means less than it looks like is the failure we are
        # fixing. Single-quote every --deselect value: parametrized node
        # ids carry [...] which the shell would otherwise treat as a glob.
        run: |
          python -m pytest tests/ -x -q --tb=short -n auto \
            --deselect='tests/test_launch_cohort_formats_2026_09_23.py::TestPredictionMarkets::test_board_week_parses_the_committed_ep1' \
            --deselect='tests/test_launch_cohort_formats_2026_09_23.py::TestPredictionMarkets::test_week_block_pairs_first_and_latest_readings' \
            --deselect='tests/test_launch_cohort_formats_2026_09_23.py::TestPredictionMarkets::test_hook_wires_the_friday_block' \
            --deselect='tests/test_launch_cohort_formats_2026_09_23.py::TestPredictionMarkets::test_prompts_carry_price_not_odds_week_board_and_critic' \
            --deselect='tests/test_launch_cohort_formats_2026_09_23.py::TestPredictionMarkets::test_validator_board_stops_at_week_board' \
            --deselect='tests/test_launch_cohort_formats_2026_09_23.py::TestPredictionMarkets::test_curriculum_restocked' \
            --deselect='tests/test_network_quality_pass.py::TestNarrativeQueueRunway::test_queue_has_runway[unintended_consequences-7-4.0]' \
            --deselect='tests/test_network_quality_pass.py::TestNarrativeQueueRunway::test_queue_has_runway[first_principles-7-3.0]' \
            --deselect='tests/test_network_quality_pass.py::TestNarrativeQueueRunway::test_queue_ids_unique' \
            --deselect='tests/test_network_quality_pass.py::TestNarrativeQueueRunway::test_first_principles_alternation_stocked' \
            --deselect='tests/test_network_quality_pass.py::TestNarrativeQueueRunway::test_first_principles_unproduced_alternates' \
            --deselect='tests/test_network_quality_pass.py::TestNarrativeQueueRunway::test_no_duplicate_topics_reintroduced' \
            --deselect='tests/test_network_quality_pass.py::TestNarrativeQueueRunway::test_uc_biofuels_category_accurate' \
            --deselect='tests/test_network_quality_pass.py::TestNarrativeQueueRunway::test_uc_unproduced_interleaved_not_clustered' \
            --deselect='tests/test_queue_restock.py::TestConfigRegistry::test_both_narrative_shows_registered' \
            --deselect='tests/test_queue_restock.py::TestConfigRegistry::test_age_of_ai_never_registered' \
            --deselect='tests/test_queue_restock.py::TestConfigRegistry::test_files_exist[first_principles]' \
            --deselect='tests/test_queue_restock.py::TestConfigRegistry::test_files_exist[unintended_consequences]' \
            --deselect='tests/test_queue_restock.py::TestConfigRegistry::test_trigger_sits_above_alarm_floor[first_principles]' \
            --deselect='tests/test_queue_restock.py::TestConfigRegistry::test_trigger_sits_above_alarm_floor[unintended_consequences]' \
            --deselect='tests/test_queue_restock.py::TestConfigRegistry::test_categories_match_live_queue[first_principles]' \
            --deselect='tests/test_queue_restock.py::TestConfigRegistry::test_categories_match_live_queue[unintended_consequences]' \
            --deselect='tests/test_queue_restock.py::TestConfigRegistry::test_prompt_placeholders[first_principles]' \
            --deselect='tests/test_queue_restock.py::TestConfigRegistry::test_prompt_placeholders[unintended_consequences]' \
            --deselect='tests/test_queue_restock.py::TestRunwayMath::test_no_restock_above_trigger' \
            --deselect='tests/test_queue_restock.py::TestRunwayMath::test_restock_fills_to_target' \
            --deselect='tests/test_queue_restock.py::TestRunwayMath::test_backstop_cap' \
            --deselect='tests/test_queue_restock.py::TestValidation::test_accepts_valid_novel_topic' \
            --deselect='tests/test_queue_restock.py::TestValidation::test_rejects_duplicate_and_near_duplicate' \
            --deselect='tests/test_queue_restock.py::TestValidation::test_rejects_bad_category_and_thin_brief' \
            --deselect='tests/test_queue_restock.py::TestValidation::test_caps_at_needed' \
            --deselect='tests/test_queue_restock.py::TestValidation::test_never_mutates_existing_queue' \
            --deselect='tests/test_queue_restock.py::TestValidation::test_parse_tolerates_fences_and_prose' \
            --deselect='tests/test_queue_restock.py::TestWorkflowWiring::test_workflow_exists_and_gated' \
            --deselect='tests/test_queue_restock.py::TestWorkflowWiring::test_runway_alarm_comment_updated' \
            --deselect='tests/test_queue_restock.py::TestResequenceUnproduced::test_fpd_shape_alternates_within_imbalance_bound' \
            --deselect='tests/test_queue_restock.py::TestResequenceUnproduced::test_uc_shape_no_adjacent_repeat_before_overflow' \
            --deselect='tests/test_queue_restock.py::TestResequenceUnproduced::test_produced_entries_and_positions_untouched' \
            --deselect='tests/test_queue_restock.py::TestResequenceUnproduced::test_restock_flow_calls_resequence' \
            --deselect='tests/test_queue_restock.py::TestModelFallback::test_primary_success_never_touches_the_fallback' \
            --deselect='tests/test_queue_restock.py::TestModelFallback::test_transport_failure_falls_back_once' \
            --deselect='tests/test_queue_restock.py::TestModelFallback::test_unparsable_output_falls_back_too' \
            --deselect='tests/test_queue_restock.py::TestModelFallback::test_both_failing_raises_the_last_error' \
            --deselect='tests/test_queue_restock.py::TestModelFallback::test_env_pin_on_the_fallback_model_calls_it_once' \
            --deselect='tests/test_queue_restock.py::TestResequenceSkipsDeferred::test_deferred_entries_stay_in_place' \
            --deselect='tests/test_queue_restock.py::TestResequenceSkipsDeferred::test_pickable_sequence_is_interleaved_around_a_parked_entry'

      # Weekly full-suite backstop: no paths filter applies to schedule, and
      # NO --deselect — the whole suite including curriculum invariants runs.
      - name: Run full suite (weekly backstop)
        if: github.event_name == 'schedule'
        run: python -m pytest tests/ -x -q --tb=short -n auto

