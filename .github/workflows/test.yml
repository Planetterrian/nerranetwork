name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'requirements.txt'
          extra-packages: "ruff"

      - name: Lint with ruff
        run: ruff check engine/ run_show.py --select=E9,F63,F7,F82 --no-fix

      - name: Run tests
        run: python -m pytest tests/ -x -q --tb=short
