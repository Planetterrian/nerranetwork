name: Run Tests

on:
  push:
    branches: [main]
    # Oct 19 2026: the pipeline pushes to main ~100 times a day (episode
    # commits, audio-first checkpoints, video, multilingual, finalize), and
    # each push ran the full suite — ~18 runs and ~150 runner-minutes a day
    # testing commits that change no code. A push that touches ONLY generated
    # output is skipped; pull requests always run (no paths filter there, so
    # a required check is never left pending).
    paths-ignore:
      - 'digests/**'
      - 'blog/**'
      - 'claims/**'
      - 'topics/**'
      - 'ru/**'
      - 'fr/**'
      - 'api/**'
      - 'site/data/**'
      - 'assets/share/**'
      - 'assets/site_screens/**'
      - 'specials/**'
      - 'books/catalog.json'
      - '*.rss'
      - '*.html'
      - 'sitemap.xml'
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR; on main every push gets its own
# group (run_id) so nothing is cancelled there.
concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-26.04
    # Oct 22 2026: main run 39810036245 spent ~15 min in setup-python on a
    # trickle-slow apt ffmpeg mirror (3×300 s → exit 124). Keep a hard job
    # ceiling so a stalled setup cannot burn a full runner hour.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No git history needed (landmine #1: full clone is ~2.5 GB).
          fetch-depth: 1

      # cache-dependency-path pins the pip cache key to the requirements
      # files (not the runner image fingerprint alone). No apt ffmpeg here
      # — see Cached static ffmpeg below (main 39810036245 hung ~15 min on
      # a trickle mirror installing ffmpeg via apt).
      - name: Setup Python
        uses: ./.github/actions/setup-python
        timeout-minutes: 10
        with:
          python-version: '3.14'
          requirements-file: 'requirements.txt'
          cache-dependency-path: |
            requirements.txt
            requirements_fascinating_frontiers.txt
            requirements_planetterrian.txt
          # Oct 9 2026: pytest-xdist runs the suite across the runner's cores.
          extra-packages: "ruff pytest-xdist"
          skip-checkout: 'true'

      # Static ffmpeg via actions/cache (not apt, not FedericoCarboni —
      # the latter broke on Sep 14 2026 by scraping an upstream README;
      # see .github/actions/setup-ffmpeg). Cache hit is seconds; miss
      # downloads a pinned BtbN linux64 gpl build under a 6-minute ceiling.
      - name: Cache static ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-static
          key: ffmpeg-n8.1-linux64-gpl-8.1

      - name: Install static ffmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          dest="${{ runner.temp }}/ffmpeg-static"
          mkdir -p "$dest"
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz"
          curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            -o /tmp/ffmpeg.tar.xz "$url"
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          src=$(echo /tmp/ffmpeg-n8.1-*-linux64-gpl-8.1)
          cp "$src/bin/ffmpeg" "$src/bin/ffprobe" "$dest/"
          chmod +x "$dest/ffmpeg" "$dest/ffprobe"

      - name: Add ffmpeg to PATH
        run: |
          echo "${{ runner.temp }}/ffmpeg-static" >> "$GITHUB_PATH"
          "${{ runner.temp }}/ffmpeg-static/ffmpeg" -version | head -1

      - name: Lint with ruff (full)
        run: ruff check engine/ run_show.py scripts/ --fix --exit-non-zero-on-fix

      - name: Validate GitHub Actions workflows (actionlint)
        env:
          # The ONLY working place to suppress shellcheck codes for
          # actionlint — the `shellcheck:` block that used to sit in
          # .github/actionlint.yaml is not part of actionlint's config
          # schema and silently did nothing. These four are noisy-to-false
          # in the Actions environment (`${{ }}` expands before the shell
          # runs); fix the script rather than extend this list.
          SHELLCHECK_OPTS: "-e SC2086 -e SC2034 -e SC2044 -e SC2035"
        run: |
          # Install actionlint if not present
          curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest
          ./actionlint -color

      - name: Run tests
        # Oct 9 2026: in parallel across the runner's cores (operator-directed).
        # Serial, 11,700 tests took 12-20 minutes on the new image; the first
        # xdist trial locally ran 5,777 of them in six minutes on four
        # workers, and the clean full run passed. -x still stops the run on
        # the first failure.
        run: python -m pytest tests/ -x -q --tb=short -n auto
