# Nerra Voices — xAI key preflight (Sept 10 2026). The Voximplant Grok
# connector answers a bad key with a bare "WebSocket.Close 1011 Internal
# server error"; this asks xAI directly what it thinks of the key the
# scenario is deployed with (GROK_API_KEY). Prints status only, never the key.
name: xAI key check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask xAI about the key
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          key = os.environ.get("GROK_API_KEY", "")
          print("key present:", bool(key), "| length:", len(key), "| starts with xai-:", key.startswith("xai-"),
                "| has whitespace:", key != key.strip())
          req = urllib.request.Request("https://api.x.ai/v1/api-key",
                                       headers={"Authorization": "Bearer " + key.strip()})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  info = json.loads(r.read().decode())
                  print("HTTP", r.status)
                  for k in ("name", "status", "acls", "api_key_blocked", "api_key_disabled", "team_blocked", "create_time"):
                      if k in info: print(f"  {k}: {info[k]}")
          except urllib.error.HTTPError as e:
              print("HTTP", e.code, e.read().decode()[:300])
          req = urllib.request.Request("https://api.x.ai/v1/models",
                                       headers={"Authorization": "Bearer " + key.strip()})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  models = [m.get("id") for m in json.loads(r.read().decode()).get("data", [])]
                  print("models visible:", len(models), "| voice models:", [m for m in models if "voice" in m])
          except urllib.error.HTTPError as e:
              print("models HTTP", e.code, e.read().decode()[:300])
          # Realtime voice models are NOT in /v1/models. Ask the realtime
          # endpoint directly whether the model the scenario deploys with is
          # served: a deprecated id is what killed every interview on
          # Sept 10 2026 (bare WebSocket close 1011).
          for model in [os.environ.get("GROK_VOICE_MODEL", "").strip() or "grok-voice-latest",
                        "grok-voice-fast-1.0", "grok-voice-think-fast-1.0", "grok-voice-think-fast-2.0"]:
              req = urllib.request.Request(
                  f"https://api.x.ai/v1/realtime?model={model}",
                  headers={"Authorization": "Bearer " + key.strip(),
                           "Connection": "Upgrade", "Upgrade": "websocket",
                           "Sec-WebSocket-Version": "13",
                           "Sec-WebSocket-Key": "dGhlIHNhbXBsZSBub25jZQ=="})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print(f"  realtime {model}: HTTP {r.status}")
              except urllib.error.HTTPError as e:
                  body = e.read().decode()[:200]
                  verdict = "SERVED (upgrade refused by urllib, model accepted)" if e.code in (101, 400, 426) and "model" not in body.lower() else body
                  print(f"  realtime {model}: HTTP {e.code} {verdict}")
              except Exception as e:
                  print(f"  realtime {model}: {type(e).__name__} {str(e)[:120]}")
          PY
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_VOICE_MODEL: ${{ vars.GROK_VOICE_MODEL }}
