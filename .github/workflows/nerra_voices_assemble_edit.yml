# Nerra Voices — assemble a finished episode from an edit decision list
# (Sept 12 2026). Both of the first two Age of AI episodes needed a real
# edit: a reconnect to bridge, an opening performed to an empty guest chair
# to remove, a host talking over the guest's closing answer to replace with
# the guest's own isolated track. Those edits used to live only in whoever
# made them. Now they live in pipelines/voices/edl/<slug>.json, and this
# rebuilds the episode from the sources, uploads it, and points the gate 1
# and gate 2 review pages at it.
name: Assemble edited episode
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'pipelines/voices/edl/<slug>.json'
        type: string
        required: true

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-ffmpeg
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.14'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      - run: python pipelines/voices/assemble_edit.py
        env:
          EDL_SLUG: ${{ inputs.slug }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL || 'patricknovak1@gmail.com' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

  # Oct 28 2026: the video version (the guest's camera beside Mira), cut
  # exactly as the audio was. Its own job, after the episode exists: it can
  # take most of an hour on a long interview, and it never holds up or fails
  # the audio, which is the product. No camera take = nothing to do.
  video:
    needs: assemble
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-ffmpeg
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.14'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      - name: Cut the video version
        run: python pipelines/voices/render_video.py --edl "$EDL_SLUG"
        env:
          EDL_SLUG: ${{ inputs.slug }}
          SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL || 'patricknovak1@gmail.com' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
