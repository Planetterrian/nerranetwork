# Nerra Voices — fire scheduled interviews (spec §5.2). Every 5 minutes:
# T-2h SMS reminders + fire any interview whose slot falls in the window
# (window computed in-script with drift grace; interview_runs uniqueness
# makes double ticks safe). GitHub cron is best-effort — the in-script
# window, not the cron, is the precision mechanism.
name: Fire scheduled interviews
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  # Punctuality (Aug 5 2026, landmine #24 shape): GitHub delivered this
  # */5 cron at ~2-hour intervals and a real guest sat in a locked studio.
  # The nerra-voices Cloudflare Worker now fires this event every 5
  # minutes ON TIME; the GitHub cron stays as fallback (double ticks are
  # safe — the in-script window + run-row idempotency dedupe them).
  repository_dispatch:
    types: [fire-tick]

permissions:
  contents: read

concurrency:
  group: nerra-voices-fire
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Shallow checkout + cached pip. This job runs ~288×/day on the */5
      # cron; the previous bare checkout full-cloned the repo (~2.5 GB of
      # MP3 history, landmine #1) and reinstalled pip deps from scratch
      # on every tick.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      - run: python pipelines/voices/fire_interviews.py
        env:
          SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
          VOXIMPLANT_ACCOUNT_ID: ${{ secrets.VOXIMPLANT_ACCOUNT_ID }}
          VOXIMPLANT_API_KEY: ${{ secrets.VOXIMPLANT_API_KEY }}
          VOXIMPLANT_CALLER_ID: ${{ secrets.VOXIMPLANT_CALLER_ID }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          # Phase 2 co-host: Patrick's host link carries the Worker's
          # ADMIN_TOKEN; OPERATOR_PHONE (E.164) gets the SMS copy;
          # VOX_HOST_USER is the Voximplant user the scenario dials.
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          OPERATOR_PHONE: ${{ secrets.OPERATOR_PHONE }}
          VOX_HOST_USER: ${{ vars.VOX_HOST_USER }}
          # Inline short-notice briefs email the guest from the fire step.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
