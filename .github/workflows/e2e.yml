name: E2E (Playwright)

on:
  push:
    branches: [main]
    # Oct 19 2026: the pipeline pushes to main ~100 times a day (episode
    # commits, audio-first checkpoints, video, multilingual, finalize), and
    # each push ran the full suite — ~18 runs and ~150 runner-minutes a day
    # testing commits that change no code. A push that touches ONLY generated
    # output is skipped; pull requests always run (no paths filter there, so
    # a required check is never left pending).
    paths-ignore:
      - 'digests/**'
      - 'blog/**'
      - 'claims/**'
      - 'topics/**'
      - 'ru/**'
      - 'fr/**'
      - 'api/**'
      - 'site/data/**'
      - 'assets/share/**'
      - 'assets/site_screens/**'
      - 'specials/**'
      - 'books/catalog.json'
      - '*.rss'
      - '*.html'
      - 'sitemap.xml'
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
