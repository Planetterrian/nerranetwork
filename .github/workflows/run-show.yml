name: Run Podcast Show

on:
  schedule:
    # Network ships ~10 episodes/day. All shows scheduled to finish before
    # 10:01 UTC. Pipeline takes up to 45 min, so triggers must be staggered
    # accordingly (15-minute intervals for 10 daily shows across 7:01-10:01 UTC).
    #
    # June 2026 punctuality pass: GitHub delivers `schedule` events
    # best-effort and 1-6 h late in practice (Tesla's 11:00 cron observed
    # starting 13:54). Three mitigations:
    #   1. Cron minutes shifted off the contended :00/:30 marks (:07/:37).
    #   2. An exact-time external dispatcher (workers/scheduler — Cloudflare
    #      Cron Triggers fire to the minute) calls workflow_dispatch per
    #      slot once the operator deploys it; these GitHub crons then act
    #      as the delayed fallback.
    #   3. The gate skips a scheduled run when today's episode already
    #      landed (see the duplicate guard below), so dispatcher + late
    #      fallback cron can never double-publish.
    #
    # May 2026 schedule overhaul: 7 shows went daily (OV, PT, FF, M&A, MAB,
    # MIT, TST) with Sunday's slot becoming a "weekly recap" episode that
    # synthesises the past 7 days from the content lake. MIT also runs
    # Saturday with a weekend-focus angle (international markets, crypto,
    # lessons learned). Cron times shifted +1h from the prior schedule.
    #
    # Привет, Русский!: Weekly on Monday at 6:07 UTC
    - cron: '7 6 * * 1'
    # Omni View: Daily at 7:01 UTC (Sunday = weekly recap)
    - cron: '1 7 * * *'
    # Planetterrian Daily: Daily at 7:16 UTC (Sunday = weekly recap)
    - cron: '16 7 * * *'
    # Fascinating Frontiers: Daily at 7:31 UTC (Sunday = weekly recap)
    - cron: '31 7 * * *'
    # Models & Agents: Daily at 7:46 UTC (Sunday = weekly recap)
    - cron: '46 7 * * *'
    # Environmental Intelligence: Weekly on Monday at 8:07 UTC
    - cron: '7 8 * * 1'
    # Models & Agents for Beginners: Daily at 8:01 UTC (Sunday = weekly recap)
    - cron: '1 8 * * *'
    # Modern Investing Techniques: Daily at 8:16 UTC.
    # Mon-Fri = US market preview; Sat = weekend angle (international
    # markets, crypto, lessons learned, what to prepare for, long-term
    # insights); Sun = weekly recap.
    - cron: '16 8 * * *'
    # First Principles Daily: Daily at 8:31 UTC. Narrative show —
    # topic-queue-driven, no daily news fetch. Alternates concrete
    # example / opportunity area per episode. Runs all 7 days.
    - cron: '31 8 * * *'
    # Tesla Shorts Time: Daily at 8:46 UTC (Sunday = weekly recap)
    - cron: '46 8 * * *'
    # Unintended Consequences: Daily at 9:01 UTC. Narrative show —
    # topic-queue-driven, no daily news fetch. Runs all 7 days.
    - cron: '1 9 * * *'
    # SpaceX Daily: Daily at 9:16 UTC (Sunday = weekly recap)
    - cron: '16 9 * * *'
    # Финансы Просто: Weekly on Monday at 9:37 UTC
    - cron: '37 9 * * 1'

  workflow_dispatch:
    inputs:
      show:
        description: 'Show to run'
        required: true
        type: choice
        options:
          - tesla
          - omni_view
          - fascinating_frontiers
          - planetterrian
          - env_intel
          - models_agents
          - models_agents_beginners
          - finansy_prosto
          - privet_russian
          - modern_investing
          - unintended_consequences
          - first_principles
          - spacex
          - all
      test_mode:
        description: 'Dry run: fetch + digest only (no TTS, no R2 upload, no RSS, no X, no commit)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------------
  # Gate job: determine which show(s) to run based on cron time or dispatch
  # -----------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    outputs:
      shows: ${{ steps.resolve.outputs.shows }}
      known_noop: ${{ steps.resolve.outputs.known_noop }}
    steps:
      - name: Determine shows to run
        id: resolve
        shell: python3 {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import json, os, datetime

          dispatch_show = "${{ github.event.inputs.show }}" or ""
          event_name = "${{ github.event_name }}"
          known_noop = False

          if event_name == "workflow_dispatch":
              if dispatch_show == "all":
                  shows = ["tesla", "omni_view", "fascinating_frontiers", "planetterrian", "env_intel", "models_agents", "models_agents_beginners", "finansy_prosto", "privet_russian", "modern_investing", "unintended_consequences", "first_principles", "spacex"]
              else:
                  shows = [dispatch_show]
          else:
              # Scheduled: use github.event.schedule to deterministically identify
              # which cron expression triggered this run.  This is immune to GitHub
              # Actions cron delays (which previously caused shows to miss their
              # wall-clock time window).
              event_schedule = "${{ github.event.schedule }}" or ""
              now_utc = datetime.datetime.now(datetime.timezone.utc)
              day = now_utc.day
              weekday = now_utc.weekday()  # 0=Mon .. 6=Sun
              is_odd_day = day % 2 == 1
              is_even_day = day % 2 == 0

              # Map each cron expression to (show_slug, day_filter).
              # day_filter: "even" = even days only, "odd" = odd days only,
              #             "odd_weekday" = odd days AND weekdays,
              #             "weekday" = weekdays only, None = always run.
              # GitHub Actions cron uses OR logic for day-of-month + day-of-week,
              # so some crons fire more often than intended.  The day_filter
              # applies the intended restriction.
              CRON_MAP = {
                  "7 6 * * 1":        ("privet_russian",          "monday"),
                  "1 7 * * *":        ("omni_view",                None),
                  "16 7 * * *":       ("planetterrian",            None),
                  "31 7 * * *":       ("fascinating_frontiers",    None),
                  "46 7 * * *":       ("models_agents",            None),
                  "7 8 * * 1":        ("env_intel",               "monday"),
                  "1 8 * * *":        ("models_agents_beginners",  None),
                  "16 8 * * *":       ("modern_investing",         None),
                  "31 8 * * *":       ("first_principles",         None),
                  "46 8 * * *":       ("tesla",                    None),
                  "1 9 * * *":        ("unintended_consequences", None),
                  "16 9 * * *":       ("spacex",                   None),
                  "37 9 * * 1":       ("finansy_prosto",          "monday"),
              }

              shows = []
              entry = CRON_MAP.get(event_schedule)

              if entry:
                  show_slug, day_filter = entry
                  run_today = True

                  if day_filter == "even" and not is_even_day:
                      run_today = False
                      known_noop = True
                      print(f"Even-day no-op: {show_slug} doesn't run on odd day {day}.")
                  elif day_filter == "odd" and not is_odd_day:
                      run_today = False
                      known_noop = True
                      print(f"Odd-day no-op: {show_slug} doesn't run on even day {day}.")
                  elif day_filter == "odd_weekday":
                      if not is_odd_day:
                          run_today = False
                          known_noop = True
                          print(f"Odd-day no-op: {show_slug} doesn't run on even day {day}.")
                      elif weekday >= 5:
                          run_today = False
                          known_noop = True
                          print(f"Weekend no-op: {show_slug} only runs on weekdays.")
                  elif day_filter == "weekday" and weekday >= 5:
                      run_today = False
                      known_noop = True
                      print(f"Weekend no-op: {show_slug} only runs on weekdays.")
                  elif day_filter == "monday" and weekday != 0:
                      # Weekly shows run only on Monday (weekday()==0). The cron
                      # already pins Monday; this guard also drops a GitHub cron
                      # that fires late on a different day.
                      run_today = False
                      known_noop = True
                      print(f"Weekly no-op: {show_slug} only runs on Mondays.")

                  if run_today:
                      shows.append(show_slug)
              else:
                  msg = f"WARNING: Unknown cron expression '{event_schedule}' — no show matched"
                  print(msg)
                  print(f"::warning::{msg}")

              # Same-day duplicate guard (June 2026): with the external
              # exact-time dispatcher (workers/scheduler) publishing on
              # time and GitHub's delayed cron arriving hours later, the
              # late cron must NOT produce a second episode. Each show
              # job commits "Auto-generated: <show> <YYYY-MM-DD>"; if
              # that commit already exists today, drop the show from
              # this scheduled run. Applies to `schedule` events only —
              # manual workflow_dispatch reruns stay possible.
              if shows:
                  import urllib.request
                  token = os.environ.get("GITHUB_TOKEN", "")
                  since = now_utc.strftime("%Y-%m-%dT00:00:00Z")
                  today_str = now_utc.strftime("%Y-%m-%d")
                  try:
                      req = urllib.request.Request(
                          f"https://api.github.com/repos/${{ github.repository }}/commits?since={since}&per_page=100",
                          headers={"Authorization": f"Bearer {token}",
                                   "Accept": "application/vnd.github+json"},
                      )
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          commits = json.load(resp)
                      messages = [c.get("commit", {}).get("message", "") for c in commits]
                      remaining = []
                      for slug in shows:
                          marker = f"Auto-generated: {slug} {today_str}"
                          if any(m.startswith(marker) for m in messages):
                              known_noop = True
                              print(f"Duplicate guard: {slug} already published today "
                                    f"(found '{marker}' commit) — skipping scheduled rerun.")
                          else:
                              remaining.append(slug)
                      shows = remaining
                  except Exception as exc:
                      # Guard is best-effort: on API failure, run the show
                      # (a duplicate is annoying; a missing episode is worse).
                      print(f"Duplicate guard check failed ({exc}) — proceeding without it.")

          matrix = json.dumps(shows)
          print(f"Shows to run: {matrix}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"shows={matrix}\n")
              f.write(f"known_noop={'true' if known_noop else 'false'}\n")

  # -----------------------------------------------------------------------
  # Alert if no shows were scheduled (catch misconfiguration / DST issues)
  # -----------------------------------------------------------------------
  alert-skip:
    needs: gate
    if: needs.gate.outputs.shows == '[]' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Alert on skipped schedule
        run: |
          if [ "${{ needs.gate.outputs.known_noop }}" = "true" ]; then
            echo "DST no-op: cron fired at a UTC hour that only applies during the other DST state."
            echo "The affected show will run at its alternate UTC trigger instead."
            echo "UTC time: $(date -u)"
            exit 0
          fi
          echo "::error::SCHEDULE SKIP: No shows were matched for this cron trigger."
          echo "This may indicate a cron misconfiguration or DST edge case."
          echo "UTC time: $(date -u)"
          echo "Shows output: ${{ needs.gate.outputs.shows }}"
          # Exit with failure to surface in workflow dashboard
          exit 1

  # -----------------------------------------------------------------------
  # Run show(s) in parallel via matrix
  # -----------------------------------------------------------------------
  run:
    needs: gate
    if: needs.gate.outputs.shows != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: show-${{ matrix.show }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        show: ${{ fromJson(needs.gate.outputs.shows) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Shallow clone (June 2026): nothing in the pipeline reads git
          # history, and the repo carries 2.2 GB of legacy MP3 history
          # (landmine #1) — a full clone cost minutes + GBs on every one
          # of the ~13 daily jobs. The push step's `git pull --rebase`
          # works fine from a depth-1 clone (it fetches what it needs).
          fetch-depth: 1

      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'requirements.txt'
          system-packages: 'ffmpeg'
          skip-checkout: 'true'

      - name: Cache Whisper transcription model
        # faster-whisper downloads ~150 MB from Hugging Face on every
        # episode (unauthenticated, rate-limited, occasionally flaky —
        # an HF hiccup degrades transcripts → captions → Shorts).
        # The model is pinned ("base"), so a static cache key is safe.
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: whisper-faster-base-v1

      - name: Install show-specific Python requirements
        run: |
          if [ "${{ matrix.show }}" = "fascinating_frontiers" ] && [ -f requirements_fascinating_frontiers.txt ]; then
            pip install -r requirements_fascinating_frontiers.txt
          fi
          if [ "${{ matrix.show }}" = "planetterrian" ] && [ -f requirements_planetterrian.txt ]; then
            pip install -r requirements_planetterrian.txt
          fi

      - name: Run smoke tests
        run: |
          python -m pytest tests/test_config.py tests/test_schedule.py \
            tests/test_tts_grok.py tests/test_tesla_hook.py tests/test_rss.py \
            tests/test_review_remediation.py tests/test_show_scaffold.py \
            tests/test_first_episode.py tests/test_generator.py \
            tests/test_show_memory.py tests/test_prompt_fidelity.py \
            tests/test_episode_validity.py tests/test_pipeline_safety.py \
            tests/test_phase2_growth.py tests/test_phase3_memory.py \
            tests/test_phase4_repositioning.py tests/test_social_distribution.py \
            tests/test_chapters.py tests/test_tesla_quality_pass.py \
            tests/test_four_show_quality_pass.py \
            tests/test_russian_shows_quality_pass.py \
            -q --tb=short

      - name: Validate config before run
        run: |
          python3 -c "
          from engine.config import load_config
          config = load_config('shows/${{ matrix.show }}.yaml')
          assert config.name, 'Show name is empty'
          assert config.llm.digest_prompt_file, 'Missing digest prompt file'
          assert config.llm.podcast_prompt_file, 'Missing podcast prompt file'
          from pathlib import Path
          assert Path(config.llm.digest_prompt_file).exists(), f'Digest prompt not found: {config.llm.digest_prompt_file}'
          assert Path(config.llm.podcast_prompt_file).exists(), f'Podcast prompt not found: {config.llm.podcast_prompt_file}'
          if config.llm.system_prompt_file:
              assert Path(config.llm.system_prompt_file).exists(), f'System prompt not found: {config.llm.system_prompt_file}'
          # Narrative-mode shows (e.g. unintended_consequences) are
          # topic-queue-driven — they intentionally ship with no RSS
          # sources. Validate the topic queue file instead.
          if getattr(config, 'narrative_mode', False):
              assert config.topic_queue_file, 'narrative_mode requires topic_queue_file'
              assert Path(config.topic_queue_file).exists(), f'Topic queue not found: {config.topic_queue_file}'
              print(f'Config validated: {config.name} (narrative mode, queue={config.topic_queue_file}, model={config.llm.model})')
          else:
              assert len(config.sources) > 0, 'No RSS sources configured'
              print(f'Config validated: {config.name} ({len(config.sources)} sources, model={config.llm.model})')
          "

      - name: Backfill Content Lake from committed digests
        # data/content_lake.db is in .gitignore, so each fresh checkout
        # has zero episodes. Without this step, the pipeline's
        # cross-episode deduplication queries see no historical
        # content and let through stories the network already
        # covered. Backfill is fast (~5 s for ~50 episodes) and
        # rebuilds from the committed digests/<slug>/*.md files.
        run: python scripts/backfill_content_lake.py

      - name: YouTube quota preflight
        # Landmine #20: enabling YouTube on a 3rd daily show tips the
        # @NerraNetwork channel past its 10k/day quota, after which uploads
        # fail silently. Non-strict here: emits a loud ::error:: annotation if
        # the enabled shows are projected over quota, but never blocks the
        # episode (exit 0). Run a guard job with --strict to hard-fail instead.
        run: python scripts/youtube_quota_preflight.py || true

      - name: Run show pipeline
        id: pipeline
        run: |
          set +e
          # Post-concurrency duplicate re-check (June 12 2026): the gate's
          # duplicate guard runs at QUEUE time — FF's hours-late fallback
          # cron passed it while a dispatched run was still mid-pipeline,
          # waited on the per-show concurrency lock, then shipped a second
          # episode 11 minutes after the first. This re-check runs AFTER
          # the lock + checkout, so it always sees the first run's commit.
          # Scheduled triggers only — manual dispatch reruns stay possible.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            OUTPUT_DIR="digests/${{ matrix.show }}"
            [ "${{ matrix.show }}" = "tesla" ] && OUTPUT_DIR="digests/tesla_shorts_time"
            git fetch origin main --depth=1 -q 2>/dev/null || true
            git checkout origin/main -- "$OUTPUT_DIR" 2>/dev/null || true
            TODAY=$(date -u +%Y%m%d)
            if find "$OUTPUT_DIR" -name "*_${TODAY}.md" -o -name "*${TODAY}*.md" 2>/dev/null | grep -q .; then
              echo "::notice::Duplicate re-check: ${{ matrix.show }} already published today — skipping scheduled rerun."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            EXTRA_FLAGS="--test"
            echo "::notice::test_mode=true — running with --test (fetch + digest only, no TTS/R2/RSS/X/commit)"
          fi
          python run_show.py ${{ matrix.show }} $EXTRA_FLAGS 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 2 ]; then
            echo "::warning::Show ${{ matrix.show }} skipped — insufficient articles for a quality episode"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $EXIT_CODE
        timeout-minutes: 45
        env:
          # June 2026: secrets are passed directly as env vars instead of
          # being written to a .env file via a heredoc + sed strip — same
          # effect (load_dotenv never overrides existing env), no secrets
          # on disk, no indentation-sensitive shell hack.
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # OPTIONAL override for multilingual audio: a different cloned Grok
          # voice for the translated tracks. Unset (the default) → the show's
          # existing tts.voice_id (kdif6sqjcyiq) is reused across all languages.
          GROK_CLONED_VOICE_ID: ${{ secrets.GROK_CLONED_VOICE_ID }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          PLANETTERRIAN_X_CONSUMER_KEY: ${{ secrets.PLANETTERRIAN_X_CONSUMER_KEY }}
          PLANETTERRIAN_X_CONSUMER_SECRET: ${{ secrets.PLANETTERRIAN_X_CONSUMER_SECRET }}
          PLANETTERRIAN_X_ACCESS_TOKEN: ${{ secrets.PLANETTERRIAN_X_ACCESS_TOKEN }}
          PLANETTERRIAN_X_ACCESS_TOKEN_SECRET: ${{ secrets.PLANETTERRIAN_X_ACCESS_TOKEN_SECRET }}
          PLANETTERRIAN_X_BEARER_TOKEN: ${{ secrets.PLANETTERRIAN_X_BEARER_TOKEN }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # YouTube OAuth — refresh tokens are minted once via
          # scripts/youtube_oauth_bootstrap.py, then stored as secrets.
          # Missing values cause the YouTube stage to skip cleanly.
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EN }}
          YOUTUBE_REFRESH_TOKEN_RU: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RU }}
          # Pexels: backs the long-form video slideshow (royalty-free
          # photos keyed off each show's keywords). Missing → falls back
          # to single-cover Ken Burns. Free tier covers our usage.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIPELINE_TIMEOUT_SECONDS: '2400'

      - name: Validate output
        if: steps.pipeline.outputs.skipped != 'true'
        run: |
          # shellcheck disable=SC2044
          SHOW="${{ matrix.show }}"
          echo "Validating output for $SHOW..."

          # Determine output directory
          OUTPUT_DIR="digests/${SHOW}"
          if [ "$SHOW" = "tesla" ]; then
            OUTPUT_DIR="digests/tesla_shorts_time"
          fi

          # Check that at least one .md digest file was created today
          TODAY=$(date +%Y%m%d)
          MD_COUNT=$(find "$OUTPUT_DIR" -name "*${TODAY}*.md" -type f 2>/dev/null | wc -l)
          if [ "$MD_COUNT" -eq 0 ]; then
            echo "WARNING: No digest markdown found for today in $OUTPUT_DIR"
          else
            echo "Found $MD_COUNT digest file(s) for today"
          fi

          # Check for MP3 output (skip for test-only runs)
          MP3_COUNT=$(find "$OUTPUT_DIR" -name "*${TODAY}*.mp3" -not -name "*_raw.mp3" -type f 2>/dev/null | wc -l)
          if [ "$MP3_COUNT" -eq 0 ]; then
            echo "WARNING: No final MP3 found for today in $OUTPUT_DIR"
          else
            # Validate MP3 is reasonable size (> 100KB = not empty/corrupt)
            # Use safe null-delimited loop to satisfy shellcheck SC2044.
            # shellcheck disable=SC2044
            find "$OUTPUT_DIR" -name "*${TODAY}*.mp3" -not -name "*_raw.mp3" -type f -print0 2>/dev/null | while IFS= read -r -d '' mp3; do
              SIZE=$(stat -c%s "$mp3" 2>/dev/null || echo 0)
              if [ "$SIZE" -lt 100000 ]; then
                echo "ERROR: MP3 $mp3 is suspiciously small (${SIZE} bytes)"
                exit 1
              fi
              echo "MP3 validated: $mp3 (${SIZE} bytes)"
            done
          fi

          # Check digest content for LLM refusal text and reasonable length
          python scripts/validate_digest_content.py "$OUTPUT_DIR" "$TODAY"
          # Validate RSS feed is well-formed XML (any .rss files modified by this run)
          # shellcheck disable=SC2044
          find . -maxdepth 1 -name "*.rss" -newer "$OUTPUT_DIR" -type f -print0 2>/dev/null | while IFS= read -r -d '' rss; do
            if [ -f "$rss" ]; then
              python scripts/validate_rss_feed.py "$rss" || exit 1
            fi
          done

          echo "Output validation passed"

      - name: Regenerate network RSS
        if: steps.pipeline.outputs.skipped != 'true'
        run: python generate_network_rss.py

      - name: Regenerate show HTML pages
        if: steps.pipeline.outputs.skipped != 'true'
        env:
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          GOOGLE_ADS_ID: ${{ secrets.GOOGLE_ADS_ID }}
          GOOGLE_ADS_SIGNUP_LABEL: ${{ secrets.GOOGLE_ADS_SIGNUP_LABEL }}
          PLAUSIBLE_DOMAIN: ${{ secrets.PLAUSIBLE_DOMAIN }}
        run: |
          # Regenerate show page (static episodes) + blog posts for this show
          python generate_html.py --show ${{ matrix.show }} --blogs

      - name: Commit and push output
        # Run on `always()` so a failure in a *peripheral* later step
        # (HTML regen, RSS regen, podcast-directory notify) doesn't
        # block the commit. The actual episode artifacts — digest .md,
        # transcripts, metrics — were produced by the pipeline step
        # and must reach git regardless. Operator caught (May 7 2026)
        # an entire day of episodes lost from the repo because
        # generate_html.py --blogs hit a UnicodeEncodeError on a lone
        # surrogate; GitHub Actions' implicit `success()` guard then
        # skipped this commit step, the runner shut down, and the
        # work was gone. Gate on `pipeline.outcome == 'success'` so
        # we only commit when the pipeline itself succeeded.
        #
        # Push reliability hardening (May 2026): GitHub occasionally returns
        # "fatal error in commit_refs" (server-side transient during ref update)
        # even after the pack is accepted, especially on larger text commits
        # (transcripts + metrics + chapters + blog HTML + digests ~8k+ insertions).
        # The 4-attempt rebase/merge loop below handles races from concurrent
        # matrix jobs. On final exhaustion we create a recovery/* branch + draft
        # PR so the generated artifacts are NEVER lost in the ephemeral runner.
        if: always() && steps.pipeline.outcome == 'success' && steps.pipeline.outputs.skipped != 'true'
        run: |
          # Use the standard GitHub Actions bot identity (consistent with
          # the safe-commit-push composite and other automation).
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all generated output
          git add -A digests/ || true
          git add '*.rss' || true
          git add '*.html' || true
          git add -A blog/ || true
          git add sitemap.xml || true
          # Tesla cached price for the public website widget. Written
          # by ``shows/hooks/tesla.py`` every Tesla run, consumed by
          # ``tesla.html`` JS so the stock pill doesn't depend on
          # Yahoo Finance CORS proxies.  Without committing this, the
          # file gets wiped on every fresh runner checkout and the
          # website shows "Market data unavailable" between runs
          # (operator caught this May 15 2026, TST Ep473).
          git add api/tsla.json || true
          # Tesla data dashboard (live TSLA market data + price history)
          # written by shows/hooks/tesla.py, consumed by tesla-dashboard.html.
          git add api/tesla_dashboard.json || true
          # SpaceX cached SPCX price — same contract as api/tsla.json
          # above. Written by ``shows/hooks/spacex.py`` every SpaceX run,
          # consumed by ``spacex.html`` JS so the SPCX pill has a
          # reliable same-origin source between runs.
          git add api/spcx.json || true
          # SpaceX launch-dashboard data (next/previous launch, cadence,
          # stats) for spacex-dashboard.html. Same reliability contract.
          git add api/spacex_launches.json || true
          # Growing SpaceX metrics time-series (monthly mass-to-orbit,
          # satellites, vehicle mix) — accumulates over time to power the
          # dashboard's long-run growth charts.
          git add site/data/spacex_metrics.json || true
          # Topic queues — narrative-mode shows mark topics as produced
          # after each successful run. Without committing this, every
          # narrative-show run re-picks the same first-unproduced topic
          # because the runner sees a stale queue on every fresh
          # checkout. (Bug caught May 2026 when UC Ep001 was about to
          # ship Cobra Effect twice.)
          git add -A shows/topic_queues/ || true
          # Deep-dive queues — same persistence requirement as topic_queues.
          # A deep-dive run marks its entry produced in shows/deep_dives/<show>.yaml;
          # without committing it the entry stays ``when: next`` and the deep dive
          # RE-FIRES on the next run (caught May 2026: SpaceX Ep059/Ep060 each
          # re-queued because this directory wasn't staged).
          git add -A shows/deep_dives/ || true

          # Exclude MP3 files (hosted on R2, not in git)
          git reset HEAD -- '*.mp3' 2>/dev/null || true

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-generated: ${{ matrix.show }} $(date +%Y-%m-%d)"

          # Push with retry (handles concurrent pushes from matrix jobs).
          # On persistent "fatal error in commit_refs" or other server transients
          # after the local commit succeeded, fall back to a recovery branch + PR
          # so the episode artifacts (transcripts, metrics, chapters, digests, blog)
          # are preserved instead of being discarded with the runner VM.
          PUSH_SUCCEEDED=false
          for attempt in 1 2 3 4; do
            # Try rebase first (cleanest history)
            if git pull --rebase origin main; then
              if git push origin main; then
                echo "Push succeeded on attempt $attempt (rebase)"
                PUSH_SUCCEEDED=true
                break
              fi
            else
              # Rebase failed (likely conflict) — abort and try merge
              git rebase --abort 2>/dev/null || true
              echo "Rebase failed on attempt $attempt, trying merge..."
              if git pull --no-rebase origin main -X theirs; then
                if git push origin main; then
                  echo "Push succeeded on attempt $attempt (merge)"
                  PUSH_SUCCEEDED=true
                  break
                fi
              else
                echo "Merge also failed on attempt $attempt"
              fi
            fi
            if [ $attempt -lt 4 ]; then
              echo "Push failed on attempt $attempt, retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            fi
          done

          if [ "$PUSH_SUCCEEDED" != "true" ]; then
            echo "All direct push attempts to main exhausted (likely GitHub 'fatal error in commit_refs' transient)."
            echo "Creating recovery branch + draft PR to preserve generated episode artifacts..."

            # Delegate to a dedicated script. This keeps the workflow YAML clean
            # (no nested heredocs that confuse the YAML parser) and makes the
            # recovery logic easy to test/enhance in isolation.
            SHOW="${{ matrix.show }}" \
            RUN_ID="${{ github.run_id }}" \
            REPO_URL="${{ github.server_url }}/${{ github.repository }}" \
            scripts/create_recovery_pr.sh
            # The script exits 0 on successful PR creation (data preserved),
            # or 1 only in the extremely rare case that even the recovery branch push failed.
            exit $?
          fi

      - name: Alert on failure
        if: failure()
        run: |
          echo "::error::PIPELINE FAILURE: ${{ matrix.show }} failed on $(date -u +%Y-%m-%d)"
          echo "Check the workflow logs for details."
          echo "Show: ${{ matrix.show }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify on failure (webhook)
        if: failure() && env.NOTIFICATION_WEBHOOK_URL != ''
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        run: |
          # Supports Slack, Discord, or any generic webhook that accepts JSON {"text": "..."}
          curl -s -X POST "$NOTIFICATION_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"❌ Pipeline FAILED: ${{ matrix.show }} on $(date -u +%Y-%m-%d)\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "Webhook notification failed (non-blocking)"

  # -----------------------------------------------------------------------
  # Finalize: regenerate shared pages after all show jobs have completed
  # -----------------------------------------------------------------------
  # Each show job commits its own blog posts, show page, and RSS.  But the
  # network homepage (index.html), network blog index (blog/index.html), and
  # sitemap.xml aggregate data from ALL shows.  Generating them inside each
  # matrix job causes a race condition: the last job to push overwrites the
  # others, losing their updates to the shared pages.
  #
  # This finalize job runs once after all matrix jobs are done.  It pulls
  # the latest main (with every show's committed data), regenerates the
  # shared pages with the complete dataset, and pushes a single commit.
  # -----------------------------------------------------------------------
  finalize:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    concurrency:
      group: finalize-shared-pages
      cancel-in-progress: false
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          # Shallow — finalize only regenerates pages from working-tree
          # state and pushes one commit.
          fetch-depth: 1

      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'requirements.txt'
          skip-checkout: 'true'

      - name: Pull latest changes from all show jobs
        run: git pull origin main

      - name: Regenerate shared pages
        env:
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          GOOGLE_ADS_ID: ${{ secrets.GOOGLE_ADS_ID }}
          GOOGLE_ADS_SIGNUP_LABEL: ${{ secrets.GOOGLE_ADS_SIGNUP_LABEL }}
          PLAUSIBLE_DOMAIN: ${{ secrets.PLAUSIBLE_DOMAIN }}
          # R2 read creds for the gallery-manifest rebuild (clean no-op
          # when unset — the builder writes an empty manifest).
          R2_GALLERY_BUCKET: ${{ secrets.R2_GALLERY_BUCKET }}
          R2_GALLERY_PUBLIC_BASE_URL: ${{ secrets.R2_GALLERY_PUBLIC_BASE_URL }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # Network homepage (latest episodes + blog posts from all shows)
          # Network-wide blog index (aggregates all shows' posts)
          # Sitemap with all pages
          python generate_html.py --network --blogs --sitemap
          python scripts/generate_api.py

          # Rebuild the global search index so new episodes are immediately searchable.
          # This (combined with the backfill in nightly) makes search reliable and up-to-date.
          python scripts/build_search_index.py --out site/data/search-index.json

          # Gallery manifest (June 2026): previously a standalone workflow
          # spun up a fresh runner after EVERY Run Podcast Show completion
          # (~13/day) just to run this one script. Building it here reuses
          # this runner; the nightly job remains the safety rebuild.
          python scripts/build_gallery_manifest.py --out site/data/gallery-manifest.json

      - name: Commit and push shared pages
        run: |
          # Standard bot identity for consistency with episode commits and composites.
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html || true
          git add blog/index.html || true
          git add sitemap.xml || true
          git add api/*.json || true
          git add blog*.rss || true
          git add site/data/search-index.json || true
          git add site/data/gallery-manifest.json || true

          if git diff --cached --quiet; then
            echo "Shared pages are already up to date."
            exit 0
          fi

          git commit -m "Update shared pages (network index, blog index, sitemap, search index) $(date +%Y-%m-%d)"

          # The regeneration above (generate_html.py --network --blogs) also
          # rewrites per-show pages — especially after a template change, where
          # every page changes — leaving them modified-but-unstaged. This step
          # deliberately commits only the CURATED shared pages above (committing
          # per-show pages here would rebase-conflict with each show's own job).
          # Those incidental unstaged changes must be discarded, or
          # `git pull --rebase` aborts with "cannot pull with rebase: you have
          # unstaged changes" and fails all 5 attempts (observed 2026-06-16).
          # The per-show pages are owned + committed by each show's own job
          # (generate_html.py --show <slug> --blogs), so discarding the redundant
          # regen here is safe.
          git checkout -- . 2>/dev/null || true

          # 5 attempts + slightly longer backoff for the shared-pages commit
          # (lower stakes than per-episode artifacts; pages are fully regenerable
          # from the per-show commits that already landed).
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt 5 ]; then
              echo "Push failed on attempt $attempt, retrying in $((attempt * 3))s..."
              sleep $((attempt * 3))
            fi
          done
          echo "All push attempts failed for shared pages"
          echo "::warning::Shared pages (index, blog index, sitemap) could not be pushed after 5 attempts. They will be regenerated on the next successful nightly or manual run."
          exit 1

      - name: Post daily health summary
        # Positive heartbeat: the pipeline already notifies on failure, but
        # nothing confirms a healthy day. This composes an all-clear / cost /
        # quota / RSS-freshness line from the freshly-regenerated dashboard.json
        # and posts it if NOTIFICATION_WEBHOOK_URL is set (clean no-op if not).
        # Runs even if the shared-pages push had trouble.
        if: always()
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        run: python scripts/post_run_summary.py || true
