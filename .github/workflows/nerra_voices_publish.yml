# OPERATOR RULE (Aug 10 2026): publishing is ALWAYS a deliberate human
# act — the operator hears the produced episode first (final-listen
# gate). The daily sweep the review agent added violated that rule and
# republished an already-published interview as a duplicate Ep2 from a
# stale artifact. Do NOT re-add schedule triggers here.
# Nerra Voices — publish an approved, produced episode (spec §5.5).
# Manual dispatch (operator picks the release moment), repository_dispatch
# from a scheduler, or the daily SWEEP. Updates RSS + summaries + site
# pages and commits, same publish surface as every other Nerra show.
#
# The sweep exists because this was dispatch-only, and the 2026-07-17
# interview sat unpublished for 13 days after clearing BOTH human gates
# while the 2026-07-20 one — recorded three days later — went out
# normally, purely because someone dispatched that one by hand. Gate 2
# auto-approves after 7 days, so an episode can reach `approved` with
# nobody watching. The sweep publishes only rows where both gates are
# already recorded as cleared, so it adds no authority the manual path
# did not have; it just removes the requirement that a human remember.
name: Publish Age of AI episode
on:
  workflow_dispatch:
    inputs:
      interview_id:
        description: 'Supabase interviews.id to publish (blank = sweep all eligible)'
        required: false
        type: string
  repository_dispatch:
    types: [interview-publish]

permissions:
  contents: write

concurrency:
  group: nerra-voices-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # ffmpeg + network calls; the 6h GitHub default is not a real guard.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Publish only reads working-tree files and pushes; no history
          # needed (landmine #1: full clones of this repo are ~2.5 GB).
          fetch-depth: 1
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: python pipelines/voices/publish_episode.py
        env:
          INTERVIEW_ID: ${{ github.event.inputs.interview_id || github.event.client_payload.interview_id }}
          SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
      # Aug 15 2026: replaced a naive 4-attempt push loop. By this point
      # the Supabase row already reads `published` and the audio is on R2,
      # so a lost push silently strands the RSS entry / digest / site
      # pages with no retry path (the sweep skips published rows). The
      # composite adds rebase-conflict cleanup between attempts and, on
      # exhaustion, opens a draft recovery PR instead of dropping the
      # episode.
      - name: Commit RSS + summaries + pages
        uses: ./.github/actions/safe-commit-push
        with:
          add-paths: |
            age_of_ai_podcast.rss
            digests/age_of_ai/
            age-of-ai.html
            age-of-ai-summaries.html
            blog/age_of_ai/
          commit-message: "Publish: Age of AI episode"
          recovery-on-failure: "true"
          recovery-show: "age_of_ai"
