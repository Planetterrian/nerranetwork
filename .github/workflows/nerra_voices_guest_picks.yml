# Guest picks and referrals (Oct 15 2026, Patrick). Daily: read the closing
# round of every newly published Age of AI and Nerra Voices interview (a
# book, the best advice, who inspires them, the show's own question, who
# Mira should interview next), invite the people guests recommended, ask the
# guest for an introduction when no public address can be found, and
# refresh guest-picks.html. pipelines/voices/referrals.py has the rules.
#
# 17:34 UTC is mid-morning Pacific, after the 17:00 gate-2 sweep. Invites go
# out from Mira, copying Patrick and Dan; PRODUCER_MODE=off stops all of it.
# Dispatch with dry_run first: nothing goes to a guest and Patrick gets the
# exact messages that would have gone.
name: Guest picks and referrals
on:
  schedule:
    - cron: '34 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only: send nothing to guests, email Patrick what would go out'
        type: boolean
        default: true
      limit:
        description: 'Most invitations in one run'
        type: string
        default: '6'

permissions:
  contents: write

concurrency:
  group: nerra-voices-guest-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-26.04
    # The first run reads every episode (about two minutes each with search).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.14'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      - name: Picks, referrals and invitations
        run: >-
          python pipelines/voices/referrals.py
          --limit "${{ github.event.inputs.limit || '6' }}"
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          VOICES_FROM_EMAIL: ${{ secrets.VOICES_FROM_EMAIL }}
          OPERATOR_EMAIL: patricknovak1@gmail.com
          OPERATOR_CC: patrick@planetterrian.com
          PRODUCER_MODE: ${{ vars.PRODUCER_MODE }}
          CALCOM_BOOKING_URL: ${{ secrets.CALCOM_BOOKING_URL }}
          CALCOM_BOOKING_URL_NERRA_VOICES: ${{ secrets.CALCOM_BOOKING_URL_NERRA_VOICES }}
      - name: Guest Picks page
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python generate_html.py --guest-picks
      # A preview changes nothing public: Patrick reads the picks in the
      # preview email first, and the first real run publishes them.
      - name: Commit the page and its data
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: ./.github/actions/safe-commit-push
        with:
          add-paths: |
            guest-picks.html
            site/data/guest_picks.json
          commit-message: "Guest picks: refresh page"
