name: Daily Audit & Automated Remediation

# Consolidated post-publish quality + health gate.
# Runs after the last show (~12:15 UTC safety net + on successful run-show completion).
#
# Responsibilities:
# - Episode quality review + AI scoring (hallucinations, repetition, short scripts)
# - Missed episode detection + automated recovery (retry dispatch for shows without skip markers)
# - RSS feed freshness / staleness health checks
# - Production of structured api/daily-review.json for operators and dashboards
# - Full episode quality review (including AI scoring for hallucinations, repetition, short scripts)
# - Detection of missed episodes (with skip marker awareness)
# - Automated recovery: dispatch retries for missed shows that lack skip markers
# - RSS feed freshness / staleness health checks (primary implementation)
# - Production of structured api/daily-review.json (and daily-audit summary) for dashboard + operators
#
# This workflow is the primary "did everything ship and was it any good?" gate.
# It is intentionally earlier and more actionable than heavy nightly maintenance.
#
# Past incidents incorporated for prevention/detection:
# - Missed episodes without markers (PT/UC May 29) → auto-retry dispatch + clear remediation JSON
# - Dangerously short / thin scripts (Env Intel 710 words) → strengthened in review + generation gates
# - LLM hallucinations & factual fabrications (Tesla Ep491) → pattern checks + AI review + JSON output
# - Repetition loops and garbles ("nay-toe", "nassa", repeated phrases) → dedicated check_hallucination_patterns
# - Workflow bloat → this + nightly-maintenance are now the two main post-pipeline workflows

on:
  schedule:
    # Missed-episode sweep + issue creation. Runs LATE enough that the day's
    # slate has actually finished. The scheduled crons end at 11:30 UTC, but
    # GitHub Actions routinely delivers scheduled events hours late (observed
    # 3-6h in May-Jun 2026), so shows can finish as late as ~16:00 UTC. The
    # old 12:15 slot ran *before* the tail and produced false "missed episode"
    # alarms + spurious auto-retries (e.g. 2026-06-02: audit at 12:15 flagged
    # MIT/Tesla/UC missed; they actually published at 14:21/14:59/15:51).
    # (Stale-comment fix June 2026: the per-episode workflow_run trigger was
    # removed earlier — this once-daily sweep reviews ALL of the day's
    # committed episodes. Tune later if GitHub delays worsen.)
    - cron: '15 16 * * *'

  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYYMMDD) for the audit (defaults to today)"
        required: false
        type: string
      show:
        description: "Limit audit to a single show slug (e.g. tesla, planetterrian)"
        required: false
        type: string
      create_issues:
        description: "Create GitHub issues for critical problems (default true)"
        required: false
        default: "true"
        type: string

# Runs ONCE per day (the 16:15 cron) + on manual dispatch. Previously it also
# triggered on every "Run Podcast Show" completion (workflow_run), so it ran
# ~10x/day; that per-episode trigger was removed — the once-daily sweep already
# reviews ALL of the day's committed episodes via discover_episodes().

permissions:
  # write: the persist step commits api/daily-review.json back to main via the
  # safe-commit-push composite (a bare read-token push never landed a single
  # daily-review.json commit — July 2026 reliability pass).
  contents: write
  issues: write
  # `gh workflow run` (missed-show auto-retry + the out-of-rotation Show
  # Review Agent dispatch on editorial criticals) requires actions: write.
  actions: write
  # The review dispatcher checks for in-flight agent/review-* PRs.
  pull-requests: read

concurrency:
  group: daily-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'requirements.txt'
          extra-packages: "openai python-dotenv"
          skip-checkout: 'true'

      - name: Run Episode Quality Review + Structured Output
        id: audit
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ inputs.date || '' }}
          INPUT_SHOW: ${{ inputs.show || '' }}
          INPUT_CREATE_ISSUES: ${{ inputs.create_issues || 'true' }}
        run: |
          ARGS=()
          if [ -n "$INPUT_DATE" ]; then ARGS+=(--date "$INPUT_DATE"); fi
          if [ -n "$INPUT_SHOW" ]; then ARGS+=(--show "$INPUT_SHOW"); fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$INPUT_CREATE_ISSUES" = "true" ]; then
            ARGS+=(--create-issues)
          fi

          set +e
          python review_episodes.py "${ARGS[@]}" 2>&1 | tee /tmp/audit_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          SUMMARY=$(tail -n 40 /tmp/audit_output.txt | head -c 4000)
          {
            echo "summary<<SUMMARY_EOF"
            echo "$SUMMARY"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

          # Exit 1 = OPERATIONAL problem only (a due episode is missing) — page.
          # Exit 2 = editorial-quality notes + warnings — recorded in the GitHub
          # issue + api/daily-review.json, but must NOT fail the run (otherwise
          # the audit pages daily for routine quality notes). Operator decision,
          # May 2026.
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "::error::Operational problem — a due episode is missing. See GitHub issue + api/daily-review.json"
            exit 1
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "::warning::Quality notes recorded (non-paging) — see GitHub issue + api/daily-review.json"
            exit 0
          fi

      - name: RSS Feed Freshness Health Check
        shell: python3 {0}
        run: |
          import os
          import sys
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          from datetime import datetime, timezone

          FEEDS = {
              "podcast.rss": ("Tesla Shorts Time", 48),
              "omni_view_podcast.rss": ("Omni View", 96),
              "fascinating_frontiers_podcast.rss": ("Fascinating Frontiers", 96),
              "planetterrian_podcast.rss": ("Planetterrian Daily", 96),
              # Monday-only since the Aug 2026 cadence alignment (CRON_MAP
              # "7 8 * * 1") — a full week between episodes, so the daily/
              # alt-cadence limits below would page every Saturday. 240h =
              # one missed Monday + slack, same band as Offshore North.
              "env_intel_podcast.rss": ("Environmental Intelligence", 240),
              "models_agents_podcast.rss": ("Models & Agents", 96),
              "models_agents_beginners_podcast.rss": ("Models & Agents for Beginners", 96),
              # Monday-only (CRON_MAP "37 9 * * 1" / "7 6 * * 1") — see
              # Environmental Intelligence note above.
              "finansy_prosto_podcast.rss": ("Finansy Prosto", 240),
              "privet_russian_podcast.rss": ("Privet Russian", 240),
              "modern_investing_podcast.rss": ("Modern Investing", 120),
              "unintended_consequences_podcast.rss": ("Unintended Consequences", 120),
              "first_principles_podcast.rss": ("First Principles Daily", 96),
              # July 2026: SpaceX + DP Pod were missing — stale feeds would
              # not page the daily audit (both are daily shows).
              "spacex_podcast.rss": ("SpaceX Daily", 96),
              "dp_pod_podcast.rss": ("The DP Pod", 96),
              # Monday-only — a full week between episodes, so the limit
              # matches the dashboard's Monday cadence band, not the daily 96.
              "offshore_north_podcast.rss": ("Offshore North", 240),
          }

          now = datetime.now(timezone.utc)
          stale = []
          for rss_file, (name, max_hours) in FEEDS.items():
              # A show registered before its first episode has no feed file
              # yet. That is pre-launch, not staleness — skipping keeps the
              # audit from paging the operator every day until Ep1 ships.
              if not os.path.exists(rss_file):
                  print(f"{name}: no feed yet (pre-launch) — skipped")
                  continue
              try:
                  tree = ET.parse(rss_file)
                  items = tree.getroot().findall(".//item")
                  if not items:
                      stale.append(f"{name}: no episodes")
                      continue
                  dates = []
                  for item in items:
                      pub = item.find("pubDate")
                      if pub is not None and pub.text:
                          try:
                              dates.append(parsedate_to_datetime(pub.text))
                          except Exception:
                              pass
                  if dates:
                      latest = max(dates)
                      age_h = (now - latest).total_seconds() / 3600
                      if age_h > max_hours:
                          stale.append(f"{name}: {age_h:.1f}h old (limit {max_hours}h)")
              except Exception as e:
                  stale.append(f"{name}: error {e}")

          if stale:
              # A feed not updating past its (cadence-aware) limit is an
              # OPERATIONAL problem — episodes aren't reaching subscribers — so
              # this fails the job and pages the operator, same tier as a missed
              # episode. (Editorial-quality notes do NOT fail the run; see the
              # review step above.) Thresholds already tolerate alt-cadence /
              # weekend gaps, so a trip here means multiple missed cycles.
              print("::error::STALE RSS FEEDS: " + "; ".join(stale))
              with open("has_stale_rss", "w") as f: f.write("\n".join(stale))
              sys.exit(1)
          else:
              print("RSS freshness: all feeds OK")

      - name: Automated Remediation (retry missed shows using daily-review.json)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The dispatcher alerts (instead of re-running) when a "missed" show
          # is actually stranded on a same-day recovery/* branch — a re-run
          # would duplicate the already-uploaded YouTube/R2 assets.
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        run: python scripts/dispatch_audit_retries.py

      - name: Dispatch out-of-rotation show review on editorial criticals
        # Event-driven complement to the scheduled Show Review Agent
        # rotation: a show that shipped an episode with editorial-CRITICAL
        # issues today gets reviewed now, not when the calendar comes
        # around. At most one dispatch per day; shows with an open
        # agent/review-* PR or a pushed agent/review-* branch are skipped.
        # See docs/REVIEW_AGENT.md.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/dispatch_quality_reviews.py

      # Always commit the structured audit JSON so dashboard / operators can
      # consume it. Uses the safe-commit-push composite (rebase + retry) — the
      # previous bare `git push origin main` from a job-start checkout was
      # always non-fast-forward on this push-busy repo and never landed.
      - name: Persist Audit Artifacts
        if: always()
        uses: ./.github/actions/safe-commit-push
        with:
          add-paths: |
            api/daily-review.json
          commit-message: "Daily audit artifacts"

      - name: Notify on operational problems
        if: always()
        env:
          DAILY_REVIEW_WEBHOOK_URL: ${{ secrets.DAILY_REVIEW_WEBHOOK_URL || '' }}
          EXIT_CODE: ${{ steps.audit.outputs.exit_code || '0' }}
          SUMMARY: ${{ steps.audit.outputs.summary || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Webhook notification ONLY on operational problems (exit 1 = a
          # missed episode). Editorial-quality notes (exit 2) are recorded in
          # the GitHub issue + JSON and must not ping — that daily noise is
          # exactly what the May 2026 operator change removed. (A stale RSS
          # feed fails its own step, which red-X's the run separately.)
          if [ -n "$DAILY_REVIEW_WEBHOOK_URL" ] && [ "$EXIT_CODE" = "1" ]; then
            curl -s -X POST "$DAILY_REVIEW_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"Nerra Daily Audit: a due episode is missing (operational) — $RUN_URL\"}" || true
          fi
