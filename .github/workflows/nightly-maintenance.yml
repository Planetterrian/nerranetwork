name: Nightly Maintenance

# Consolidated nightly maintenance orchestrator (the "heavy" post-publish job).
# Runs after the last show of the day (~12:45 UTC) and on successful run-show completions.
#
# Responsibilities:
#   - Full dashboard regeneration (api/dashboard.json)
#   - Gallery manifest + Search index rebuild
#   - Content lake backfill (for search)
#   - Regeneration of heavy transparency pages (MIT performance + TST narrative)
#   - Safe commit + push of all the above artifacts
#
# Clear ownership split:
# - Daily Audit (daily-audit.yml)     → Quality review, missed episode detection + auto-retry,
#                                         RSS freshness, early remediation.
# - Nightly Maintenance (this file)   → Heavier, idempotent artifact & index builds.
#
# This split keeps the daily gate fast and actionable while the nightly job owns
# the more expensive data processing.

on:
  schedule:
    # Runs ONCE per day, after the day's slate has finished. The crons end at
    # 11:30 UTC but GitHub delivers scheduled events 3-6h late (observed
    # May-Jun 2026), so shows finish as late as ~16:00. Run at 16:45 so the
    # regenerated dashboard / gallery / search index / narrative pages reflect
    # the whole day. Previously this also triggered on every "Run Podcast Show"
    # completion (workflow_run) — that ran it ~10x/day and churned the repo
    # with redundant maintenance commits; the per-show trigger was removed.
    # (Each show already refreshes the shared site pages in its own finalize
    # step, so intraday freshness is unaffected.)
    - cron: '45 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write  # recovery PR escape hatch on push exhaustion

concurrency:
  group: nightly-maintenance
  cancel-in-progress: false

jobs:
  generate-artifacts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Shallow clone — nothing here reads git history, and the repo
          # carries 2.2 GB of legacy MP3 history (landmine #1).
          fetch-depth: 1

      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'requirements.txt'
          skip-checkout: 'true'

      - name: Fetch audience stats (OP3 + Buttondown + GA4 + Spotify + Apple)
        # Clean no-ops when the secrets are unset. Must run BEFORE the
        # dashboard build so the Audience section can consume the JSONs.
        # GA4 uses the official Data API (service-account key secret).
        # Spotify still uses a community cookie connector, and those
        # cookies expire — the fetch then logs a re-auth hint and keeps
        # the previous JSON (stale data, never a red nightly).
        #
        # Apple now has TWO sources, deliberately:
        #   * fetch_apple_reporter.py — Apple's OFFICIAL Reporter
        #     endpoint, authenticated with a 180-day access token. This
        #     is the one to trust. It accumulates its own history in
        #     api/apple_reporter_daily.json because Apple serves nothing
        #     from before the reporting vendor was provisioned, so a
        #     missed day is gone for good.
        #   * fetch_apple_stats.py — the older cookie scrape, kept as a
        #     fallback while the Reporter history is still short. Its
        #     cookies expire in about a day.
        # Both are clean no-ops when their secrets are unset.
        env:
          OP3_API_TOKEN: ${{ secrets.OP3_API_TOKEN }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          SPOTIFY_SP_DC: ${{ secrets.SPOTIFY_SP_DC }}
          SPOTIFY_SP_KEY: ${{ secrets.SPOTIFY_SP_KEY }}
          APPLE_MYACINFO: ${{ secrets.APPLE_MYACINFO }}
          APPLE_ITCTX: ${{ secrets.APPLE_ITCTX }}
          APPLE_REPORTER_TOKEN: ${{ secrets.APPLE_REPORTER_TOKEN }}
          APPLE_REPORTER_VENDOR: ${{ secrets.APPLE_REPORTER_VENDOR }}
          APPLE_REPORTER_ACCOUNT: ${{ secrets.APPLE_REPORTER_ACCOUNT }}
        run: |
          python scripts/fetch_op3_stats.py --out api/op3_stats.json --popular-out site/data/popular_episodes.json
          python scripts/fetch_buttondown_stats.py --out api/buttondown_stats.json
          python scripts/fetch_ga4_stats.py --out api/ga4_stats.json
          python scripts/fetch_spotify_stats.py --out api/spotify_stats.json
          python scripts/fetch_apple_reporter.py
          python scripts/fetch_apple_stats.py --out api/apple_stats.json

      - name: Refresh show performance trackers from OP3 data
        # Closes the memory systems' performance-feedback loop (June
        # 2026 reviews): derives strong_topics_last_30d from the
        # most-downloaded episodes so the prompts' performance-signals
        # blocks run on real audience data. Covers Tesla + all
        # show_memory shows (M&A, FF, Planetterrian). Clean no-op when
        # api/op3_stats.json is missing or has no entry for a show.
        run: python scripts/update_performance_trackers.py

      - name: Fetch YouTube analytics + refresh title performance hints
        # Recursive YouTube-feedback loop: reads per-video retention back
        # from the Analytics API into api/youtube_stats.json, then distils
        # per-show 'what's working' title hints into
        # digests/<slug>/youtube_performance.json (title-only, no audio →
        # outside landmine #17). Clean no-op until the stored token is
        # re-authorised with yt-analytics.readonly AND data accrues
        # (docs/youtube_feedback_loop.md).
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EN }}
          YOUTUBE_REFRESH_TOKEN_RU: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RU }}
        run: |
          python scripts/fetch_youtube_analytics.py --out api/youtube_stats.json --days 90 || true
          python scripts/update_youtube_performance.py || true

      - name: Update adaptive YouTube publishing policy
        # Velocity-gated per-channel publish tiers (long-form on/off +
        # Shorts count) in api/youtube_policy.json, consumed by run_show +
        # the RU-dub sweep via engine.youtube_policy. Reads the committed
        # api/youtube_stats.json + the previous policy (hysteresis) — no
        # secrets needed. Never edits show YAMLs; opt out per show via
        # youtube.adaptive_publishing: false. Best-effort, non-fatal.
        run: python scripts/update_youtube_policy.py || echo "::warning::YouTube policy update failed (non-fatal)"

      - name: Refresh SpaceX launch dashboard data
        # Next/previous launch, 12-month cadence, and stats for
        # spacex-dashboard.html (The Space Devs Launch Library 2). Keeps
        # last-good cache on failure; refreshes even on days SpaceX's own
        # run is skipped.
        run: python scripts/fetch_spacex_launches.py --out api/spacex_launches.json || true

      - name: Refresh Tesla dashboard data
        # Live TSLA market data + 1y price history for tesla-dashboard.html
        # (Yahoo Finance). Keeps last-good cache on failure.
        run: python scripts/fetch_tesla_dashboard.py --out api/tesla_dashboard.json || true

      - name: Backfill Content Lake (before dashboard + search index)
        # The content lake DB is gitignored. July 24 2026 lake review: this
        # step used to run AFTER the dashboard build, so api/dashboard.json
        # reported "lake: 0 episodes" every single night (the mission-control
        # card showed a permanent false "lake empty" warning). Backfill
        # first; the dashboard and search index both read the populated lake.
        run: python scripts/backfill_content_lake.py

      - name: Generate Management Dashboard
        run: python scripts/generate_dashboard.py --out api/dashboard.json

      - name: Daily Show Health Check (Grok Tier 1)
        # Pattern-based surface checks (chapters, phonetic garbles, word count).
        # Outputs api/daily-show-health.json. Escalations (score >0.6) post to
        # NOTIFICATION_WEBHOOK_URL for manual Claude deep-review. Non-fatal.
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        run: python scripts/grok_show_check.py --out api/daily-show-health.json || echo "::warning::Show health check failed (non-fatal)"

      - name: Build Gallery Manifest + Search Index
        env:
          R2_GALLERY_BUCKET: ${{ secrets.R2_GALLERY_BUCKET }}
          R2_GALLERY_PUBLIC_BASE_URL: ${{ secrets.R2_GALLERY_PUBLIC_BASE_URL }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python scripts/build_gallery_manifest.py --out site/data/gallery-manifest.json
          python scripts/build_search_index.py --out site/data/search-index.json

      - name: Join gallery images with YouTube retention
        # Imagery data flywheel: joins the fresh gallery manifest with the
        # per-video retention fetched above (api/youtube_stats.json) into
        # api/gallery_retention.json — which imagery styles keep viewers
        # watching. Clean no-op (empty JSON) until analytics data accrues.
        run: python scripts/build_gallery_retention.py --out api/gallery_retention.json || echo "::warning::Gallery retention join failed (non-fatal)"

      - name: Generate MIT Performance Page + Tesla Narrative Page + Main Site
        # Ensures dedicated transparency pages (MIT performance + TST narrative tracker)
        # and other pages that depend on fresh data stay up to date.
        # Marketing env vars must be present on EVERY html-regen step —
        # otherwise a nightly rebuild strips analytics tags from pages the
        # daily run-show regen (which passes them) had added.
        env:
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          GOOGLE_ADS_ID: ${{ secrets.GOOGLE_ADS_ID }}
          GOOGLE_ADS_SIGNUP_LABEL: ${{ secrets.GOOGLE_ADS_SIGNUP_LABEL }}
          PLAUSIBLE_DOMAIN: ${{ secrets.PLAUSIBLE_DOMAIN }}
        run: |
          python generate_html.py --show modern_investing
          python generate_html.py --show tesla
          # Homepage rebuild picks up the fresh popular-episodes rail +
          # newsletter subscriber social proof from the audience-stats step.
          # --network also regenerates spacex-dashboard.html (data-light).
          python generate_html.py --network
          # Player + How to Listen are NOT covered by --network; without
          # these, new shows (DP Pod, Age of AI, …) stay invisible on the
          # two primary discovery pages until someone runs --all.
          python generate_html.py --player
          python generate_html.py --how-to-listen
          # Start Here / FAQ / About are cheap static pages that drift when
          # shows launch — regenerate so onboarding stays current.
          python generate_html.py --start-here --faq --about
          # Optionally regenerate full site if needed:
          # python generate_html.py --all

      - name: Rebuild per-language podcast RSS feeds (safety net)
        # The multilingual workflow rebuilds + commits these after each
        # translation sweep; this nightly pass is a regenerable safety net
        # (deterministic from summaries → usually a no-op diff). The key
        # populates digests/<slug>/channel_i18n.json if a show is missing it.
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: python scripts/build_language_feeds.py --all || echo "::warning::Language-feed rebuild failed (non-fatal)"

      - name: Rebuild video-podcast feeds
        # run_show rebuilds a show's <show>_podcast.video.rss inline right
        # after it publishes; this nightly pass repairs a feed whose inline
        # build was skipped (e.g. the episode run timed out after the R2
        # upload landed). Deterministic from summaries → usually a no-op.
        run: python scripts/build_video_feeds.py --all || echo "::warning::Video-feed rebuild failed (non-fatal)"

      # NOTE on the committed-paths list below: `*.video.rss` is NOT
      # redundant with `*_podcast.*.rss`. Tesla's audio feed is the ROOT
      # podcast.rss, so its video feed is podcast.video.rss, which the
      # *_podcast.*.rss glob does not match (youtube_channel_history
      # landmine: a whitelist gap silently drops a generated file for days
      # before anyone notices). Do not put comments INSIDE the block scalar
      # below — it is fed to `git add --pathspec-from-file`, which has no
      # comment syntax.
      - uses: ./.github/actions/safe-commit-push
        with:
          add-paths: |
            *_podcast.*.rss
            *.video.rss
            digests/**/video_assets.json
            digests/**/channel_i18n.json
            api/dashboard.json
            api/daily-show-health.json
            api/youtube_stats.json
            api/youtube_channel_history.json
            api/youtube_policy.json
            api/gallery_retention.json
            digests/**/youtube_performance.json
            api/op3_stats.json
            api/op3_history.json
            api/buttondown_stats.json
            api/ga4_stats.json
            api/spotify_stats.json
            api/apple_stats.json
            api/apple_reporter.json
            api/apple_reporter_daily.json
            digests/tesla_shorts_time/tesla_performance_tracker.json
            digests/models_agents/models_agents_performance_tracker.json
            digests/fascinating_frontiers/fascinating_frontiers_performance_tracker.json
            digests/planetterrian/planetterrian_performance_tracker.json
            digests/spacex/spacex_performance_tracker.json
            api/spacex_launches.json
            api/tesla_dashboard.json
            site/data/spacex_metrics.json
            site/data/popular_episodes.json
            site/data/gallery-manifest.json
            site/data/search-index.json
            index.html
            player.html
            how-to-listen.html
            start-here.html
            faq.html
            about.html
            data.html
            modern-investing-performance.html
            modern-investing.html
            tesla-narrative.html
            tesla.html
            tesla-dashboard.html
            spacex-dashboard.html
          commit-message: "Nightly maintenance: update dashboards + gallery + search index + MIT + Tesla/SpaceX data pages"
          recovery-on-failure: "true"
          recovery-show: "nightly"

      - name: Notify on failure (webhook)
        if: failure() && env.NOTIFICATION_WEBHOOK_URL != ''
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$NOTIFICATION_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"⚠️ Nightly Maintenance job had issues on $(date -u +%Y-%m-%d). Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "Webhook notification failed (non-blocking)"
