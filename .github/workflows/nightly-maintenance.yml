name: Nightly Maintenance

# Consolidated nightly maintenance orchestrator.
# Runs after the last show of the day (~12:30 UTC) and triggers:
#   - Health check (RSS freshness)
#   - Dashboard refresh
#   - Gallery manifest + Search index
#   - Feed audit (light)
#
# This reduces the number of independent scheduled workflows and gives
# us a single place to reason about "end-of-day" automation.

on:
  schedule:
    # ~30-45 min after the last show (Unintended Consequences at 11:30 UTC)
    - cron: '45 12 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Run Podcast Show"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: nightly-maintenance
  cancel-in-progress: false

jobs:
  generate-artifacts:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'requirements.txt'
          skip-checkout: 'true'

      - name: Generate Management Dashboard
        run: python scripts/generate_dashboard.py --out api/dashboard.json

      - name: Build Gallery Manifest + Search Index
        env:
          R2_GALLERY_BUCKET: ${{ secrets.R2_GALLERY_BUCKET }}
          R2_GALLERY_PUBLIC_BASE_URL: ${{ secrets.R2_GALLERY_PUBLIC_BASE_URL }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python scripts/build_gallery_manifest.py --out site/data/gallery-manifest.json
          python scripts/build_search_index.py --out site/data/search-index.json

      - uses: ./.github/actions/safe-commit-push
        with:
          add-paths: |
            api/dashboard.json
            site/data/gallery-manifest.json
            site/data/search-index.json
          commit-message: "Nightly maintenance: update dashboard + gallery + search index"

      - name: Notify on failure (webhook)
        if: failure() && env.NOTIFICATION_WEBHOOK_URL != ''
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$NOTIFICATION_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"⚠️ Nightly Maintenance job had issues on $(date -u +%Y-%m-%d). Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "Webhook notification failed (non-blocking)"
