name: Nightly Maintenance

# Consolidated nightly maintenance orchestrator (the "heavy" post-publish job).
# Runs after the last show of the day (~12:45 UTC) and on successful run-show completions.
#
# Responsibilities:
#   - Full dashboard regeneration (api/dashboard.json)
#   - Gallery manifest + Search index rebuild
#   - Content lake backfill (for search)
#   - Regeneration of heavy transparency pages (MIT performance + TST narrative)
#   - Safe commit + push of all the above artifacts
#
# Clear ownership split:
# - Daily Audit (daily-audit.yml)     → Quality review, missed episode detection + auto-retry,
#                                         RSS freshness, early remediation.
# - Nightly Maintenance (this file)   → Heavier, idempotent artifact & index builds.
#
# This split keeps the daily gate fast and actionable while the nightly job owns
# the more expensive data processing.

on:
  schedule:
    # Runs ONCE per day, after the day's slate has finished. The crons end at
    # 11:30 UTC but GitHub delivers scheduled events 3-6h late (observed
    # May-Jun 2026), so shows finish as late as ~16:00. Run at 16:45 so the
    # regenerated dashboard / gallery / search index / narrative pages reflect
    # the whole day. Previously this also triggered on every "Run Podcast Show"
    # completion (workflow_run) — that ran it ~10x/day and churned the repo
    # with redundant maintenance commits; the per-show trigger was removed.
    # (Each show already refreshes the shared site pages in its own finalize
    # step, so intraday freshness is unaffected.)
    - cron: '45 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-maintenance
  cancel-in-progress: false

jobs:
  generate-artifacts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'requirements.txt'
          skip-checkout: 'true'

      - name: Generate Management Dashboard
        run: python scripts/generate_dashboard.py --out api/dashboard.json

      - name: Backfill Content Lake (required for search index)
        # The content lake DB is gitignored. Nightly needs it populated from
        # committed digests so build_search_index.py can produce a real index.
        # Without this, search returns 0 results (the bug the user reported).
        run: python scripts/backfill_content_lake.py

      - name: Build Gallery Manifest + Search Index
        env:
          R2_GALLERY_BUCKET: ${{ secrets.R2_GALLERY_BUCKET }}
          R2_GALLERY_PUBLIC_BASE_URL: ${{ secrets.R2_GALLERY_PUBLIC_BASE_URL }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python scripts/build_gallery_manifest.py --out site/data/gallery-manifest.json
          python scripts/build_search_index.py --out site/data/search-index.json

      - name: Generate MIT Performance Page + Tesla Narrative Page + Main Site
        # Ensures dedicated transparency pages (MIT performance + TST narrative tracker)
        # and other pages that depend on fresh data stay up to date.
        run: |
          python generate_html.py --show modern_investing
          python generate_html.py --show tesla
          # Optionally regenerate full site if needed:
          # python generate_html.py --all

      - uses: ./.github/actions/safe-commit-push
        with:
          add-paths: |
            api/dashboard.json
            site/data/gallery-manifest.json
            site/data/search-index.json
            modern-investing-performance.html
            modern-investing.html
            tesla-narrative.html
            tesla.html
          commit-message: "Nightly maintenance: update dashboard + gallery + search index + MIT + Tesla narrative pages"

      - name: Notify on failure (webhook)
        if: failure() && env.NOTIFICATION_WEBHOOK_URL != ''
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$NOTIFICATION_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"⚠️ Nightly Maintenance job had issues on $(date -u +%Y-%m-%d). Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "Webhook notification failed (non-blocking)"
