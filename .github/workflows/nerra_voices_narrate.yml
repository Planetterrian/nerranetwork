# Nerra Voices — Mira reads a hand-written pickup (Sept 11 2026).
# An episode sometimes needs words a person wrote: a proper guest
# introduction, a closing summary replacing a fumbled goodbye. Mira reads
# them HERSELF, through the same Speech-to-Speech agent that hosts the
# interview, one Voximplant session per paragraph — text-to-speech is a
# different engine and a listener hears two different hosts. Commit the text
# to pipelines/voices/narration/<slug>.json, run this, and the MP3s appear in
# R2 with their URLs in the log.
name: Voice a narration pickup
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'pipelines/voices/narration/<slug>.json'
        type: string
        required: true
      engine:
        description: 'agent = Mira reads it herself (matches the show); tts = fallback only'
        type: choice
        options: [agent, tts]
        default: agent

permissions:
  contents: read

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Grok TTS chunks long text and stitches the pieces with ffmpeg, which
      # is not on the runner by default (Sept 11 2026, first narrate run).
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      - run: python pipelines/voices/narrate.py
        env:
          NARRATION_SLUG: ${{ inputs.slug }}
          NARRATION_ENGINE: ${{ inputs.engine }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
          VOXIMPLANT_ACCOUNT_ID: ${{ secrets.VOXIMPLANT_ACCOUNT_ID }}
          VOXIMPLANT_API_KEY: ${{ secrets.VOXIMPLANT_API_KEY }}
          MIRA_VOICE_PRESET: ${{ vars.MIRA_VOICE_PRESET }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
