# Nerra Voices — voice a hand-written narration pickup (Sept 11 2026).
# The normal path writes and voices narration inside produce_episode. This
# is for the times an episode needs words a person wrote: a proper guest
# introduction, a closing summary replacing a fumbled goodbye. Commit the
# text to pipelines/voices/narration/<slug>.json, run this, and the MP3s
# appear in R2 with their URLs in the log.
name: Voice a narration pickup
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'pipelines/voices/narration/<slug>.json'
        type: string
        required: true

permissions:
  contents: read

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Grok TTS chunks long text and stitches the pieces with ffmpeg, which
      # is not on the runner by default (Sept 11 2026, first narrate run).
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      - run: python pipelines/voices/narrate.py
        env:
          NARRATION_SLUG: ${{ inputs.slug }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          MIRA_VOICE_PRESET: ${{ vars.MIRA_VOICE_PRESET }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
