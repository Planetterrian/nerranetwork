name: TEMP retrack Blaine Mathieu
on:
  push:
    branches: [claude/project-thread-o1l615]
    paths: ['.github/workflows/zz_tmp_diag_room_clock.yml']
permissions:
  contents: read
jobs:
  retrack:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      RUN_ID: '43ff31a6-e248-4352-8f47-6f5414ee0f49'
      MODE: 'apply'
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
      CALCOM_BOOKING_URL: ${{ secrets.CALCOM_BOOKING_URL }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
      VOXIMPLANT_ACCOUNT_ID: ${{ secrets.VOXIMPLANT_ACCOUNT_ID }}
      VOXIMPLANT_API_KEY: ${{ secrets.VOXIMPLANT_API_KEY }}
      MIRA_VOICE_PRESET: ${{ vars.MIRA_VOICE_PRESET }}
      INTERVIEW_RUN_ID: '43ff31a6-e248-4352-8f47-6f5414ee0f49'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.14'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      - uses: ./.github/actions/setup-ffmpeg
      - name: Rebuild the tracks
        run: python pipelines/voices/retrack_run.py "$RUN_ID" $([ "$MODE" = apply ] && echo --apply)
      - name: Cut the episode
        id: cut
        env:
          AUTO_EDIT_RESULT: /tmp/cut.json
        run: |
          python pipelines/voices/auto_edit.py "$RUN_ID"
          echo "slug=$(python -c 'import json;print(json.load(open("/tmp/cut.json"))["slug"])')" >> "$GITHUB_OUTPUT"
      - name: Mira reads the introduction and close
        run: python pipelines/voices/narrate.py "${{ steps.cut.outputs.slug }}"
      - name: Assemble and send it to Patrick
        run: python pipelines/voices/assemble_edit.py "${{ steps.cut.outputs.slug }}"
