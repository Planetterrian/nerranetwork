name: TEMP retrack Blaine Mathieu
on:
  push:
    branches: [claude/project-thread-o1l615]
    paths: ['.github/workflows/zz_tmp_diag_room_clock.yml']
permissions:
  contents: read
jobs:
  retrack:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      RUN_ID: '43ff31a6-e248-4352-8f47-6f5414ee0f49'
      MODE: 'dry'
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.14'
          requirements-file: 'pipelines/requirements.txt'
          skip-checkout: 'true'
      - uses: ./.github/actions/setup-ffmpeg
      - name: Rebuild the tracks
        run: python pipelines/voices/retrack_run.py "$RUN_ID" $([ "$MODE" = apply ] && echo --apply)
