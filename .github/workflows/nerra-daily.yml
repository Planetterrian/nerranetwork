name: Nerra Daily Edition

# Assembles the network's combined daily edition (Nerra Daily): splices
# the day's already-published English episode MP3s (pulled back from R2)
# into one ~2 h episode with Mira's host links between segments, and
# publishes it as a virtual show (RSS + summaries + chapters + blog +
# pages). No show content is regenerated — the cost per episode is one
# small Grok call + a few thousand TTS characters + one R2 upload.
#
# Release (Oct 17 2026, operator-directed; was 8:00 AM Pacific from Oct 8):
# the edition is out by 7:00 AM Eastern (4:00 AM Pacific) with every edition
# show of the morning in it. The ready gate in scripts/build_daily_edition.py
# (engine/daily_edition.py ready_decision) waits until 06:35 Eastern whatever
# has landed — a build takes 6-7 minutes — then builds once every expected
# show has published or skipped. A show still missing is held for until
# 06:50 Eastern, and past that the gate builds with whatever exists (a run
# that failed outright leaves no marker to wait on). The gate reads Eastern
# wall time, so the release does not move on the daylight-saving changes.
# Vancouver Daily News keeps its local Pacific slot and is not in the edition.
#
# Triggers: the Cloudflare Worker (workers/scheduler EDITION_DISPATCH)
# dispatches this workflow at 06:35 and 06:50 Eastern to the minute; a show
# run that lands after 06:35 dispatches it itself (below); the scheduled
# crons are late GitHub fallbacks that cover both UTC offsets. Re-runs are
# free: the committed summaries entry for the edition date is the
# idempotency key.
#
# Oct 19 2026: no workflow_run trigger any more. It woke this gate after
# EVERY Run Podcast Show run (~44 a day, each paying checkout + Python to
# read "holding for the release"). The scheduler Worker dispatches the gate
# at the release and at the end of the hold (EDITION_DISPATCH), and a show
# run that lands AFTER the release — a straggler inside the hold, a re-run
# after a failed morning — dispatches it itself
# (scripts/followup_dispatch.py nerra-daily, run-show.yml's last step, on
# success, failure or skip). The crons below are the GitHub fallbacks.
on:
  schedule:
    # Fallbacks for the Worker's Eastern-clock dispatches (GitHub cron is
    # UTC, cannot follow daylight saving and is often hours late — the gate
    # decides). 10:40 / 10:55 UTC are 06:40 / 06:55 EDT, inside the release
    # window and just past the hold, so a summer day still builds by about
    # 7:05 ET if the Worker is down; 11:40 / 11:55 UTC are the same Eastern
    # times under EST. A sweep that lands before the release is a quiet wait.
    - cron: '40 10 * * *'
    - cron: '55 10 * * *'
    - cron: '40 11 * * *'
    - cron: '55 11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Edition date YYYY-MM-DD (default: today UTC)'
        required: false
        default: ''
        type: string
      force:
        description: 'Build now with whatever segments exist (skip the ready gate)'
        required: false
        default: false
        type: boolean

# One edition build at a time — two sweeps must never race the same feed
# file / git push.
concurrency:
  group: nerra-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    # Every wake-up (Worker dispatch, a show run's dispatch, a fallback
    # cron) is handled the same way: the ready gate reads what is committed
    # (published episodes, skip markers) and decides. Oct 18 2026: every
    # show from 09:16 UTC failed its smoke step and no trigger woke the
    # gate — which is why a FAILED show run dispatches it too (run-show.yml).
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # ALWAYS the current tip of main, never the event's pinned SHA:
          # a dispatch event resolves GITHUB_SHA at dispatch time, so a
          # run queued behind an in-flight build would otherwise start from
          # a tree WITHOUT the edition commit, see the date as unpublished,
          # and rebuild it — overwriting the live R2 object under the
          # enclosure URL the first build already published.
          ref: main
          fetch-depth: 1

      # Cheap pre-setup gate: ~10 of the day's ~13 triggers fire after the
      # edition has already published, and each was paying ~90 s of pip
      # install just to learn that. Runner-native python3 reads the
      # committed summaries (the idempotency key) with zero dependencies;
      # a force dispatch always proceeds.
      - name: Fast gate — already published today?
        id: fastgate
        env:
          EDITION_DATE: ${{ github.event.inputs.date }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime, json, os
          date = (os.environ.get("EDITION_DATE") or "").strip() or \
              datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          done = False
          try:
              with open("digests/nerra_daily/summaries_nerra_daily.json") as fh:
                  data = json.load(fh)
              done = any(e.get("date") == date for e in data.get("summaries", [])
                         if isinstance(e, dict))
          except Exception:
              pass
          print(f"published={'true' if done else 'false'}")
          EOF

      - uses: ./.github/actions/setup-python
        if: steps.fastgate.outputs.published != 'true' || github.event.inputs.force == 'true'
        timeout-minutes: 45
        with:
          python-version: '3.14'
          requirements-file: 'requirements.txt'
          system-packages: 'ffmpeg'
          skip-checkout: 'true'

      - name: Build and publish the edition
        if: steps.fastgate.outputs.published != 'true' || github.event.inputs.force == 'true'
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          EDITION_DATE: ${{ github.event.inputs.date }}
          EDITION_FORCE: ${{ github.event.inputs.force }}
          # Oct 9 2026: the edition posts to X from the network account
          # (engine.x_post). Unset secrets are a logged skip, recorded in
          # the edition metrics as x_post_skipped: no_credentials.
          NERRANETWORK_X_CONSUMER_KEY: ${{ secrets.NERRANETWORK_X_CONSUMER_KEY }}
          NERRANETWORK_X_CONSUMER_SECRET: ${{ secrets.NERRANETWORK_X_CONSUMER_SECRET }}
          NERRANETWORK_X_ACCESS_TOKEN: ${{ secrets.NERRANETWORK_X_ACCESS_TOKEN }}
          NERRANETWORK_X_ACCESS_TOKEN_SECRET: ${{ secrets.NERRANETWORK_X_ACCESS_TOKEN_SECRET }}
          # Oct 17 2026: the edition queues its X post into the reserved
          # 7:00 ET slot (engine/x_queue.py; the cover waits on the audio R2
          # bucket, R2_* above). Same secrets as run-show.yml and x-queue.yml;
          # unset = the edition posts directly, as before.
          X_QUEUE_SUPABASE_URL: ${{ secrets.VOICES_SUPABASE_URL }}
          X_QUEUE_SUPABASE_KEY: ${{ secrets.VOICES_SUPABASE_SERVICE_KEY }}
        run: |
          ARGS="--edition en --when-ready"
          if [ -n "$EDITION_DATE" ]; then ARGS="$ARGS --date $EDITION_DATE"; fi
          if [ "$EDITION_FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/build_daily_edition.py $ARGS
          echo "EDITION_DAY=${EDITION_DATE:-$(date -u +%F)}" >> "$GITHUB_ENV"

      # Oct 18 2026: the homepage is the network's news front page and the
      # day's edition is on it (the "Today" band). Re-render it the moment the
      # edition publishes instead of waiting for the next show's finalize run.
      # --homepage writes index.html ONLY: --network would also rewrite
      # claims.html, the dashboards and the member pages, which this
      # workflow does not own or commit. A failure here never costs the
      # edition commit below.
      - name: Refresh the homepage
        if: steps.fastgate.outputs.published != 'true' || github.event.inputs.force == 'true'
        env:
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          GSC_VERIFICATION: ${{ secrets.GSC_VERIFICATION }}
          GOOGLE_ADS_ID: ${{ secrets.GOOGLE_ADS_ID }}
          GOOGLE_ADS_SIGNUP_LABEL: ${{ secrets.GOOGLE_ADS_SIGNUP_LABEL }}
          PLAUSIBLE_DOMAIN: ${{ secrets.PLAUSIBLE_DOMAIN }}
          STRIPE_LINK_PERSONAL: ${{ vars.STRIPE_LINK_PERSONAL || 'https://buy.stripe.com/8x26oI4Ho7Lc6Qa1VB0Ba00' }}
          STRIPE_TRIAL_DAYS: ${{ vars.STRIPE_TRIAL_DAYS || '7' }}
          EDITION_DATE: ${{ env.EDITION_DAY }}
        run: |
          # Only when THIS run published the edition (a --when-ready run that
          # exited early must not commit a homepage whose only change is its
          # "Updated" stamp).
          if python3 - <<'EOF'
          import datetime, json, os, sys
          date = (os.environ.get("EDITION_DATE") or "").strip() or \
              datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          try:
              with open("digests/nerra_daily/summaries_nerra_daily.json") as fh:
                  data = json.load(fh)
          except Exception:
              sys.exit(1)
          sys.exit(0 if any(isinstance(e, dict) and e.get("date") == date
                            for e in data.get("summaries", [])) else 1)
          EOF
          then
            python generate_html.py --homepage || echo "::warning::homepage refresh failed; the next finalize run rebuilds it"
          else
            echo "Edition not published by this run; homepage left as is."
          fi

      - name: Commit edition artifacts
        if: steps.fastgate.outputs.published != 'true' || github.event.inputs.force == 'true'
        uses: ./.github/actions/safe-commit-push
        with:
          add-paths: |
            digests/nerra_daily
            nerra_daily_podcast.rss
            blog/nerra_daily
            nerra-daily.html
            nerra-daily-summaries.html
            index.html
          commit-message: "Nerra Daily edition ${{ env.EDITION_DAY }}"

      # --- Nerra Personal follows the edition (Sep 14 2026) ---------------
      # The per-subscriber build lives in the PRIVATE nerra-personal-batch
      # repo and used to rely on its own 12:30 UTC GitHub cron, which GitHub
      # delivered 4-5 h late every day (Sep 7-14: 16:30-18:09 UTC) — so a
      # subscriber's Monday edition appeared at lunchtime. This chains it
      # to the moment the edition actually publishes instead. Same
      # runner-native check as the fast gate, read AFTER the build: the
      # edition counts as published-by-this-run only when the fast gate
      # said "not yet" and the summaries now carry the date. A --when-ready
      # run that exited without building must NOT wake the personal build,
      # because that build splices whatever segments exist today and then
      # locks the date (episodes.json), and Nerra Daily would be missing.
      - name: Did this run publish the edition?
        id: postgate
        if: steps.fastgate.outputs.published != 'true' || github.event.inputs.force == 'true'
        env:
          EDITION_DATE: ${{ env.EDITION_DAY }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os
          date = (os.environ.get("EDITION_DATE") or "").strip() or \
              datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          done = False
          try:
              with open("digests/nerra_daily/summaries_nerra_daily.json") as fh:
                  data = json.load(fh)
              done = any(e.get("date") == date for e in data.get("summaries", [])
                         if isinstance(e, dict))
          except Exception:
              pass
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"published={'true' if done else 'false'}\n")
              out.write(f"date={date}\n")
          print(f"edition {date}: {'published by this run' if done else 'not published'}")
          EOF

      - name: Wake the Nerra Personal build
        # Fires nerra-personal-batch's workflow_dispatch with today's date.
        # Needs PERSONAL_BATCH_DISPATCH_TOKEN: a fine-grained PAT scoped to
        # Planetterrian/nerra-personal-batch with Actions: Read and write
        # (GITHUB_TOKEN cannot reach another repo). Soft no-op without it —
        # the batch repo's own off-peak sweep crons remain the fallback, so
        # a missing token means "late", never "never". The personal builder
        # skips subscribers already built for the date, so a sweep that
        # follows this dispatch is harmless.
        if: steps.postgate.outputs.published == 'true'
        env:
          PERSONAL_BATCH_DISPATCH_TOKEN: ${{ secrets.PERSONAL_BATCH_DISPATCH_TOKEN }}
          EDITION_DATE: ${{ steps.postgate.outputs.date }}
        run: |
          if [ -z "$PERSONAL_BATCH_DISPATCH_TOKEN" ]; then
            echo "::warning::PERSONAL_BATCH_DISPATCH_TOKEN not set — Nerra Personal waits for its fallback cron (hours late). See docs/nerra_personal.md."
            exit 0
          fi
          status=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $PERSONAL_BATCH_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Planetterrian/nerra-personal-batch/actions/workflows/personal-feeds.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"date\":\"$EDITION_DATE\"}}")
          if [ "$status" = "204" ]; then
            echo "Nerra Personal build dispatched for $EDITION_DATE"
          else
            echo "::warning::Nerra Personal dispatch failed ($status): $(head -c 300 /tmp/dispatch.out). Fallback cron will build it later."
          fi
