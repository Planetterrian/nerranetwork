name: Monthly Source Discovery

on:
  schedule:
    # 15th of each month at 2 PM UTC
    - cron: '0 14 15 * *'

  workflow_dispatch:
    inputs:
      show:
        description: 'Show to discover for (default: all)'
        required: false
        type: choice
        options:
          - all
          - tesla
          - omni_view
          - fascinating_frontiers
          - planetterrian
          - env_intel
          - models_agents
          - models_agents_beginners
          - finansy_prosto
          - privet_russian
      min_score:
        description: 'Minimum quality score (default: 70)'
        required: false
        type: string
        default: '70'
      auto_apply:
        description: 'Auto-add approved sources to configs'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-source-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.12'
          requirements-file: 'requirements.txt'
          extra-packages: "pyyaml requests feedparser"
          skip-checkout: 'true'

      - name: Audit existing sources
        run: python check_sources.py --check-blocked

      - name: Discover new sources
        env:
          INPUT_SHOW: ${{ github.event.inputs.show || '' }}
          INPUT_MIN_SCORE: ${{ github.event.inputs.min_score || '' }}
          INPUT_AUTO_APPLY: ${{ github.event.inputs.auto_apply || '' }}
        run: |
          ARGS="--report"
          if [ "$INPUT_SHOW" != "" ] && [ "$INPUT_SHOW" != "all" ]; then
            ARGS="$ARGS $INPUT_SHOW"
          fi
          if [ "$INPUT_MIN_SCORE" != "" ]; then
            ARGS="$ARGS --min-score $INPUT_MIN_SCORE"
          fi
          if [ "$INPUT_AUTO_APPLY" = "true" ]; then
            ARGS="$ARGS --apply"
          fi
          python discover_sources.py "$ARGS"

      - uses: ./.github/actions/safe-commit-push
        with:
          add-paths: "reports/source_discovery_*.md"
          commit-message: "Monthly source discovery report $(date +%Y-%m)"

      - name: Create PR if sources were auto-applied
        if: ${{ github.event.inputs.auto_apply == 'true' }}
        run: |
          git add shows/*.yaml
          if ! git diff --cached --quiet; then
            BRANCH="source-discovery/$(date +%Y-%m)"
            git checkout -b "$BRANCH"
            git commit -m "Add discovered high-quality RSS sources $(date +%Y-%m)"
            git push -u origin "$BRANCH"
            gh pr create \
              --title "Monthly Source Discovery: $(date +%B %Y)" \
              --body "$(cat <<'EOF'
          ## Monthly Source Discovery

          Automated discovery found new high-quality RSS sources for the network.
          Each source has been audited for:
          - Reachability and response time
          - Content freshness (articles within 7 days)
          - Volume (articles per week)
          - Content quality (title/description richness)
          - Blocked source list compliance

          All sources score grade B (70+) or higher.

          See the discovery report in `reports/` for full details.
          EOF
          )" \
              --base main
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
