name: "Safe Commit & Push"
description: |
  Reusable composite for safely committing and pushing changes with retry logic + optional PR creation.
  Used across many Nerra Network workflows.

  Supports both direct pushes to main and creating branches + PRs.

inputs:
  add-paths:
    description: |
      Paths to git add. Supports both space-separated and multi-line YAML block scalars
      (the recommended form for readability in workflows). Example:
        add-paths: |
          api/dashboard.json
          site/data/gallery-manifest.json
    required: true
  commit-message:
    description: "Commit message"
    required: true
  create-branch:
    description: "If true, create a new branch instead of pushing directly to main (for PR-creating jobs)"
    required: false
    default: "false"
  branch-name:
    description: "Branch name to create when create-branch is true"
    required: false
    default: ""
  pull-request:
    description: "When create-branch is true, also open a PR"
    required: false
    default: "false"
  pr-title:
    description: "Title for the PR (only used if pull-request=true)"
    required: false
    default: ""
  pr-body:
    description: "Body for the PR (only used if pull-request=true)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Configure git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull latest (best effort)
      shell: bash
      run: |
        git pull --rebase --autostash origin main || true

    - name: Add files
      shell: bash
      run: |
        # Safely handle multi-line add-paths (the documented usage pattern).
        # Writing to a temp file + --pathspec-from-file prevents shell
        # word-splitting and stops paths from being misinterpreted as
        # executable commands (the cause of "Permission denied" on .json files).
        cat > /tmp/paths-to-add.txt << 'EOL'
        ${{ inputs.add-paths }}
        EOL

        # Drop blank lines and add the rest
        grep -v '^[[:space:]]*$' /tmp/paths-to-add.txt > /tmp/paths-clean.txt || true
        if [ -s /tmp/paths-clean.txt ]; then
          git add --pathspec-from-file=/tmp/paths-clean.txt || true
        fi

    - name: Check for changes
      id: check
      shell: bash
      run: |
        if git diff --cached --quiet; then
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          echo "No changes to commit"
        else
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit
      if: steps.check.outputs.has_changes == 'true'
      shell: bash
      run: |
        # Use a temp file for the commit message to safely support
        # multi-line messages and special characters.
        printf '%s\n' "${{ inputs.commit-message }}" > /tmp/commit-msg.txt
        git commit -F /tmp/commit-msg.txt

    - name: Push to main (with retry)
      if: steps.check.outputs.has_changes == 'true' && inputs.create-branch != 'true'
      shell: bash
      run: |
        for attempt in 1 2 3 4 5; do
          if git push origin main; then
            echo "Push succeeded on attempt $attempt"
            exit 0
          fi
          echo "Push failed (attempt $attempt), rebasing and retrying in $((attempt * 2))s..."
          git pull --rebase --autostash origin main || true
          sleep $((attempt * 2))
        done
        echo "All push attempts failed"
        exit 1

    - name: Create branch + push (for PR workflows)
      if: steps.check.outputs.has_changes == 'true' && inputs.create-branch == 'true'
      shell: bash
      run: |
        if [ -n "${{ inputs.branch-name }}" ]; then
          BRANCH="${{ inputs.branch-name }}"
        else
          BRANCH="automation/update-$(date +%Y%m%d-%H%M%S)"
        fi
        git checkout -b "$BRANCH"
        git push -u origin "$BRANCH"

    - name: Open Pull Request
      if: steps.check.outputs.has_changes == 'true' && inputs.create-branch == 'true' && inputs.pull-request == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Write title and body to files to handle newlines and special characters safely
        printf '%s\n' "${{ inputs.pr-title }}" > /tmp/pr-title.txt
        printf '%s\n' "${{ inputs.pr-body }}"  > /tmp/pr-body.txt

        HEAD_REF="${{ inputs.branch-name || 'automation/update-*' }}"

        gh pr create \
          --title "$(cat /tmp/pr-title.txt)" \
          --body  "$(cat /tmp/pr-body.txt)" \
          --base main \
          --head "$HEAD_REF" || true
