name: "Setup Python + Pip"
description: |
  Reusable composite for Nerra Network workflows.
  Handles checkout (optional), Python setup, pip caching, system packages, and requirements installation.

  Usage example:
    - uses: ./.github/actions/setup-python
      with:
        system-packages: 'ffmpeg'
        extra-packages: 'ruff'

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.14"
  requirements-file:
    description: "Path to requirements file"
    required: false
    default: "requirements.txt"
  fetch-depth:
    description: "fetch-depth for checkout (0 = full history, needed for most commit jobs)"
    required: false
    default: "0"
  extra-packages:
    description: "Space-separated extra pip packages to install (e.g. 'ruff openai')"
    required: false
    default: ""
  skip-checkout:
    description: "Set to 'true' if checkout was already performed in the calling workflow"
    required: false
    default: "false"
  cache:
    description: "Enable pip caching (true/false)"
    required: false
    default: "true"
  cache-dependency-path:
    description: >
      Glob(s) hashed into the pip cache key (setup-python cache-dependency-path).
      Pin this in the calling workflow so the key stays stable across OS image
      churn; default is requirements.txt.
    required: false
    default: "requirements.txt"
  system-packages:
    description: "Space-separated apt packages to install (e.g. 'ffmpeg')"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout
      if: ${{ inputs.skip-checkout != 'true' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache == 'true' && 'pip' || '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    # Oct 23 2026: six of the morning's show runs (Planetterrian, FF, Omni
    # View, Top World, Africa & Middle East, plus one on Oct 22) lost the
    # whole episode here: the Ubuntu mirror served nothing for fifteen
    # minutes and four bounded attempts all ran out. Retrying a mirror
    # cannot fix a mirror, so the network is now the last resort: the .debs
    # one run downloads are cached per runner IMAGE and every later run on
    # that image installs them from the cache with no network at all; if a
    # run must download and apt still cannot finish, ffmpeg comes from the
    # pinned, checksum-verified static build the test suite already runs on
    # (test.yml's BTBN tag — tests/test_slate_2026_10_23.py keeps the two
    # equal) instead of failing the episode.
    - name: System package cache key
      id: apt-key
      if: inputs.system-packages != ''
      shell: bash
      run: |
        pkgs="$(echo "${{ inputs.system-packages }}" | tr -s ' ' '-')"
        echo "key=apt-debs-v1-${ImageOS:-unknown}-${ImageVersion:-unknown}-${pkgs}" >> "$GITHUB_OUTPUT"
        echo "dir=${RUNNER_TEMP}/apt-debs" >> "$GITHUB_OUTPUT"

    - name: Restore cached system packages
      id: apt-cache
      if: inputs.system-packages != ''
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.apt-key.outputs.dir }}
        key: ${{ steps.apt-key.outputs.key }}

    - name: Install system dependencies
      id: apt-install
      if: inputs.system-packages != ''
      shell: bash
      env:
        APT_DEBS: ${{ steps.apt-key.outputs.dir }}
        CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        BTBN_TAG: autobuild-2026-10-22-13-06
        BTBN_ASSET: ffmpeg-n8.1.3-23-g5c4f5744cd-linux64-gpl-8.1.tar.xz
      run: |
        _t0=$(date +%s)
        mkdir -p "$APT_DEBS/partial"
        chmod 777 "$APT_DEBS" "$APT_DEBS/partial"
        if [ "$CACHE_HIT" = "true" ] && ls "$APT_DEBS"/*.deb >/dev/null 2>&1; then
          # Same image, same packages: install the cached files, no mirror.
          # Oct 28 2026: dpkg, never `apt-get install --no-download`. apt
          # resolves the request against the image's own (stale) package
          # lists, which name older versions than the cached files, so it
          # asked for archives it did not have and fell back to the mirror on
          # all 50 cache hits of Oct 27. dpkg installs exactly the cached set.
          if sudo timeout 240 dpkg --force-confold -i "$APT_DEBS"/*.deb >/dev/null; then
            echo "apt install from the image cache took $(( $(date +%s) - _t0 )) s"
            echo "source=cache" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::the cached system packages did not install; falling back to the mirror"
        fi
        # apt update is best-effort: third-party mirrors on the runner
        # image (e.g. dl.google.com chrome-stable) intermittently serve
        # Hash Sum mismatches and exit 100, which killed an entire
        # episode run (FF, June 11 2026) even though our packages come
        # from the Ubuntu archives and install fine from cached indexes.
        #
        # Aug 28 2026: each command also gets a HARD TIMEOUT. The retry
        # only helps when apt FAILS — on outage day a stalled mirror made
        # `apt-get update` HANG for ~44 minutes with no output until the
        # job-level 45-minute hang guard killed the whole run (spacex run
        # 33151417188). With per-command timeouts a stalled mirror costs
        # ~6 minutes total and the run proceeds from cached indexes; the
        # 45-minute step guard stays as the outer backstop.
        #
        # Oct 8 2026: `apt-get install` stalled past 300 s twice. apt's own
        # per-connection timeout is 120 s and it does not retry a stalled
        # fetch, so APT_OPTS abandons a silent connection after 30 s and
        # retries the fetch.
        #
        # Oct 9 2026: `-qq` hid apt's "Waiting for cache lock" for a whole
        # 606 s stall. Wait for apt-daily / unattended-upgrades before the
        # first apt call, bound the lock wait, and log at `-q`.
        sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
        for unit in apt-daily.service apt-daily-upgrade.service unattended-upgrades.service; do
          if systemctl is-active --quiet "$unit" 2>/dev/null; then
            echo "waiting for $unit to finish before apt"
            sudo timeout 120 systemctl stop "$unit" 2>/dev/null || true
          fi
        done
        # Dir::Cache::Archives keeps every downloaded .deb where the cache
        # save step below finds it.
        APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=4 -o DPkg::Lock::Timeout=60 -o Dir::Cache::Archives=$APT_DEBS/"
        sudo timeout 120 apt-get $APT_OPTS update -q || sudo timeout 120 apt-get $APT_OPTS update -q || \
          echo "::warning::apt-get update failed or timed out twice — installing from cached indexes"
        # Oct 22 2026: a mirror can TRICKLE rather than stall, so no timeout
        # above fires. A killed install keeps every .deb it finished, so each
        # attempt resumes where the last stopped, while the step is under
        # ten minutes.
        _ok=0
        for _attempt in 1 2 3 4; do
          # -f: a cache install that stopped half-way leaves dpkg with unmet
          # dependencies, which apt refuses to work around without it.
          if sudo timeout 300 apt-get $APT_OPTS install -y -q -f ${{ inputs.system-packages }}; then
            _ok=1; break
          fi
          echo "::warning::apt-get install attempt $_attempt did not finish ($(( $(date +%s) - _t0 )) s so far); downloaded packages are kept"
          [ $(( $(date +%s) - _t0 )) -lt 600 ] || break
        done
        if [ "$_ok" = 1 ]; then
          sudo chmod -R a+r "$APT_DEBS"
          echo "apt install took $(( $(date +%s) - _t0 )) s"
          # Nothing downloaded (already on the image) leaves nothing to cache.
          if ls "$APT_DEBS"/*.deb >/dev/null 2>&1; then
            echo "source=mirror" >> "$GITHUB_OUTPUT"
          else
            echo "source=image" >> "$GITHUB_OUTPUT"
          fi
          exit 0
        fi
        if [ "${{ inputs.system-packages }}" != "ffmpeg" ]; then
          echo "::error::apt-get install did not finish"; exit 124
        fi
        echo "::warning::apt could not install ffmpeg from the mirror; this run uses the pinned static ffmpeg 8.1.3 (the build the test suite runs on)"
        dest="${RUNNER_TEMP}/ffmpeg-static"
        mkdir -p "$dest"
        base="https://github.com/BtbN/FFmpeg-Builds/releases/download/${BTBN_TAG}"
        cd "${RUNNER_TEMP}"
        timeout 300 curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 240 \
          -o checksums.sha256 "${base}/checksums.sha256" && \
        timeout 300 curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 240 \
          -o "${BTBN_ASSET}" "${base}/${BTBN_ASSET}" && \
        grep -F " ${BTBN_ASSET}" checksums.sha256 | sha256sum -c - || {
          echo "::error::apt-get install did not finish and the static ffmpeg download failed"; exit 124; }
        tar -xJf "${BTBN_ASSET}"
        cp "${BTBN_ASSET%.tar.xz}/bin/ffmpeg" "${BTBN_ASSET%.tar.xz}/bin/ffprobe" "$dest/"
        chmod +x "$dest/ffmpeg" "$dest/ffprobe"
        echo "$dest" >> "$GITHUB_PATH"
        "$dest/ffmpeg" -version | head -1
        echo "source=static" >> "$GITHUB_OUTPUT"

    - name: Save system packages for this image
      if: inputs.system-packages != '' && steps.apt-cache.outputs.cache-hit != 'true' && steps.apt-install.outputs.source == 'mirror'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.apt-key.outputs.dir }}
        key: ${{ steps.apt-key.outputs.key }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f "${{ inputs.requirements-file }}" ]; then
          pip install -r "${{ inputs.requirements-file }}"
        fi
        if [ -n "${{ inputs.extra-packages }}" ]; then
          pip install ${{ inputs.extra-packages }}
        fi
