name: "Setup Python + Pip"
description: |
  Reusable composite for Nerra Network workflows.
  Handles checkout (optional), Python setup, pip caching, system packages, and requirements installation.

  Usage example:
    - uses: ./.github/actions/setup-python
      with:
        system-packages: 'ffmpeg'
        extra-packages: 'ruff'

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.12"
  requirements-file:
    description: "Path to requirements file"
    required: false
    default: "requirements.txt"
  fetch-depth:
    description: "fetch-depth for checkout (0 = full history, needed for most commit jobs)"
    required: false
    default: "0"
  extra-packages:
    description: "Space-separated extra pip packages to install (e.g. 'ruff openai')"
    required: false
    default: ""
  skip-checkout:
    description: "Set to 'true' if checkout was already performed in the calling workflow"
    required: false
    default: "false"
  cache:
    description: "Enable pip caching (true/false)"
    required: false
    default: "true"
  system-packages:
    description: "Space-separated apt packages to install (e.g. 'ffmpeg')"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout
      if: ${{ inputs.skip-checkout != 'true' }}
      uses: actions/checkout@v5
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache == 'true' && 'pip' || '' }}

    - name: Install system dependencies
      if: inputs.system-packages != ''
      shell: bash
      run: |
        # apt update is best-effort: third-party mirrors on the runner
        # image (e.g. dl.google.com chrome-stable) intermittently serve
        # Hash Sum mismatches and exit 100, which killed an entire
        # episode run (FF, June 11 2026) even though our packages come
        # from the Ubuntu archives and install fine from cached indexes.
        #
        # Aug 28 2026: each command also gets a HARD TIMEOUT. The retry
        # only helps when apt FAILS — on outage day a stalled mirror made
        # `apt-get update` HANG for ~44 minutes with no output until the
        # job-level 45-minute hang guard killed the whole run (spacex run
        # 33151417188: apt woke up at 08:11:13, finished installing at
        # 08:11:19, and the guard fired at 08:11:20). With per-command
        # timeouts a stalled mirror costs ~6 minutes total and the run
        # proceeds from cached indexes; the 45-minute step guard stays as
        # the outer backstop.
        sudo timeout 120 apt-get update -qq || sudo timeout 120 apt-get update -qq ||           echo "::warning::apt-get update failed or timed out twice — installing from cached indexes"
        sudo timeout 300 apt-get install -y -qq ${{ inputs.system-packages }} ||           sudo timeout 300 apt-get install -y -qq ${{ inputs.system-packages }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f "${{ inputs.requirements-file }}" ]; then
          pip install -r "${{ inputs.requirements-file }}"
        fi
        if [ -n "${{ inputs.extra-packages }}" ]; then
          pip install ${{ inputs.extra-packages }}
        fi
