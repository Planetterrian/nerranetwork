name: "Setup Python + Pip"
description: |
  Reusable composite for Nerra Network workflows.
  Handles checkout (optional), Python setup, pip caching, system packages, and requirements installation.

  Usage example:
    - uses: ./.github/actions/setup-python
      with:
        system-packages: 'ffmpeg'
        extra-packages: 'ruff'

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.14"
  requirements-file:
    description: "Path to requirements file"
    required: false
    default: "requirements.txt"
  fetch-depth:
    description: "fetch-depth for checkout (0 = full history, needed for most commit jobs)"
    required: false
    default: "0"
  extra-packages:
    description: "Space-separated extra pip packages to install (e.g. 'ruff openai')"
    required: false
    default: ""
  skip-checkout:
    description: "Set to 'true' if checkout was already performed in the calling workflow"
    required: false
    default: "false"
  cache:
    description: "Enable pip caching (true/false)"
    required: false
    default: "true"
  system-packages:
    description: "Space-separated apt packages to install (e.g. 'ffmpeg')"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout
      if: ${{ inputs.skip-checkout != 'true' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache == 'true' && 'pip' || '' }}

    - name: Install system dependencies
      if: inputs.system-packages != ''
      shell: bash
      run: |
        # apt update is best-effort: third-party mirrors on the runner
        # image (e.g. dl.google.com chrome-stable) intermittently serve
        # Hash Sum mismatches and exit 100, which killed an entire
        # episode run (FF, June 11 2026) even though our packages come
        # from the Ubuntu archives and install fine from cached indexes.
        #
        # Aug 28 2026: each command also gets a HARD TIMEOUT. The retry
        # only helps when apt FAILS — on outage day a stalled mirror made
        # `apt-get update` HANG for ~44 minutes with no output until the
        # job-level 45-minute hang guard killed the whole run (spacex run
        # 33151417188: apt woke up at 08:11:13, finished installing at
        # 08:11:19, and the guard fired at 08:11:20). With per-command
        # timeouts a stalled mirror costs ~6 minutes total and the run
        # proceeds from cached indexes; the 45-minute step guard stays as
        # the outer backstop.
        #
        # Oct 8 2026: five runs (four multilingual, one Nerra Daily) died
        # here with exit 124 — `apt-get install` stalled past 300 s twice.
        # apt's own per-connection timeout is 120 s and it does not retry a
        # stalled fetch, so one hung mirror connection used the whole
        # budget. APT_OPTS abandons a silent connection after 30 s and
        # retries the fetch, which is what turns a stall into a delay.
        #
        # Oct 9 2026, afternoon: two more exit-124s on the new ubuntu-26.04
        # image (main's test job and a North America rerun, both at
        # 15:07 UTC) — and the log said NOTHING for the whole 606 s,
        # because `-qq` hides apt's "Waiting for cache lock" and its
        # per-file fetch lines. The 30 s Acquire timeout cannot shorten a
        # wait on the dpkg lock (apt-daily / unattended-upgrades hold it
        # at image boot), so: wait for those units to finish before the
        # first apt call, give the lock wait its own bound, and log at
        # `-q` so the next stall names itself.
        sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
        for unit in apt-daily.service apt-daily-upgrade.service unattended-upgrades.service; do
          if systemctl is-active --quiet "$unit" 2>/dev/null; then
            echo "waiting for $unit to finish before apt"
            sudo timeout 120 systemctl stop "$unit" 2>/dev/null || true
          fi
        done
        APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=4 -o DPkg::Lock::Timeout=60"
        _t0=$(date +%s)
        sudo timeout 120 apt-get $APT_OPTS update -q || sudo timeout 120 apt-get $APT_OPTS update -q ||           echo "::warning::apt-get update failed or timed out twice — installing from cached indexes"
        sudo timeout 300 apt-get $APT_OPTS install -y -q ${{ inputs.system-packages }} ||           sudo timeout 300 apt-get $APT_OPTS install -y -q ${{ inputs.system-packages }}
        echo "apt install took $(( $(date +%s) - _t0 )) s"

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f "${{ inputs.requirements-file }}" ]; then
          pip install -r "${{ inputs.requirements-file }}"
        fi
        if [ -n "${{ inputs.extra-packages }}" ]; then
          pip install ${{ inputs.extra-packages }}
        fi
