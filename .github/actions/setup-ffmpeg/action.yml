name: 'Set up ffmpeg'
description: >
  Put ffmpeg and ffprobe on the runner. Ours, not a third party's: on
  Sept 14 2026 FedericoCarboni/setup-ffmpeg@v3 started failing with
  "Failed to read version from readme" — it scrapes an upstream page that
  changed — and took out post-interview processing for a live interview,
  plus narrate, assemble, produce and publish. An apt install is slower by
  about fifteen seconds and cannot be broken by someone else's README.

runs:
  using: composite
  steps:
    - name: ffmpeg
      shell: bash
      run: |
        set -euo pipefail
        if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
          echo "ffmpeg already present: $(ffmpeg -version | head -1)"
          exit 0
        fi
        # Oct 9 2026: the same bounds the setup-python composite carries
        # (an apt stall here is a hung job, not a slow one — exit 124s on
        # Oct 8 and 9 came from the unbounded form of these two lines).
        APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=4 -o DPkg::Lock::Timeout=60"
        sudo timeout 120 apt-get $APT_OPTS update -q || sudo timeout 120 apt-get $APT_OPTS update -q || echo "::warning::apt-get update failed or timed out twice — installing from cached indexes"
        sudo timeout 300 apt-get $APT_OPTS install -y -q ffmpeg || sudo timeout 300 apt-get $APT_OPTS install -y -q ffmpeg
        ffmpeg -version | head -1
        ffprobe -version | head -1
