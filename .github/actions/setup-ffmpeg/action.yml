name: 'Set up ffmpeg'
description: >
  Put ffmpeg and ffprobe on the runner. Ours, not a third party's: on
  Sept 14 2026 FedericoCarboni/setup-ffmpeg@v3 started failing with
  "Failed to read version from readme" — it scrapes an upstream page that
  changed — and took out post-interview processing for a live interview,
  plus narrate, assemble, produce and publish. An apt install is slower by
  about fifteen seconds and cannot be broken by someone else's README.

runs:
  using: composite
  steps:
    - name: ffmpeg
      shell: bash
      run: |
        set -euo pipefail
        if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
          echo "ffmpeg already present: $(ffmpeg -version | head -1)"
          exit 0
        fi
        # Oct 9 2026: the same bounds the setup-python composite carries
        # (an apt stall here is a hung job, not a slow one — exit 124s on
        # Oct 8 and 9 came from the unbounded form of these two lines).
        APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=4 -o DPkg::Lock::Timeout=60"
        sudo timeout 120 apt-get $APT_OPTS update -q || sudo timeout 120 apt-get $APT_OPTS update -q || echo "::warning::apt-get update failed or timed out twice — installing from cached indexes"
        if ! { sudo timeout 300 apt-get $APT_OPTS install -y -q ffmpeg || sudo timeout 300 apt-get $APT_OPTS install -y -q ffmpeg; }; then
          # Oct 23 2026: a stalled Ubuntu mirror cost six show runs their
          # episodes. Same fallback as the setup-python composite: the
          # pinned, checksum-verified static build test.yml runs on.
          echo "::warning::apt could not install ffmpeg; using the pinned static ffmpeg 8.1.3"
          BTBN_TAG=autobuild-2026-10-22-13-06
          BTBN_ASSET=ffmpeg-n8.1.3-23-g5c4f5744cd-linux64-gpl-8.1.tar.xz
          base="https://github.com/BtbN/FFmpeg-Builds/releases/download/${BTBN_TAG}"
          dest="${RUNNER_TEMP}/ffmpeg-static"
          mkdir -p "$dest"
          cd "${RUNNER_TEMP}"
          curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 240 -o checksums.sha256 "${base}/checksums.sha256"
          curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 240 -o "${BTBN_ASSET}" "${base}/${BTBN_ASSET}"
          grep -F " ${BTBN_ASSET}" checksums.sha256 | sha256sum -c -
          tar -xJf "${BTBN_ASSET}"
          cp "${BTBN_ASSET%.tar.xz}/bin/ffmpeg" "${BTBN_ASSET%.tar.xz}/bin/ffprobe" "$dest/"
          chmod +x "$dest/ffmpeg" "$dest/ffprobe"
          echo "$dest" >> "$GITHUB_PATH"
          export PATH="$dest:$PATH"
        fi
        ffmpeg -version | head -1
        ffprobe -version | head -1
