name: "Backfill Content Lake"
description: |
  Rebuilds the local content_lake.db from committed markdown files in digests/.
  Needed because the SQLite DB is gitignored, so fresh runners start empty.
  Used by weekly and monthly synthesis/reporting jobs.

inputs:
  script-path:
    description: "Path to the backfill script"
    required: false
    default: "scripts/backfill_content_lake.py"

runs:
  using: "composite"
  steps:
    - name: Backfill Content Lake from committed digests
      shell: bash
      run: python ${{ inputs.script-path }}
