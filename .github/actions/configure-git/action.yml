name: "Configure Git for GitHub Actions"
description: |
  Standard way to configure git user for bot commits in Nerra Network workflows.
  Reduces duplication of the same 4 lines everywhere.

runs:
  using: "composite"
  steps:
    - name: Configure git user
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
