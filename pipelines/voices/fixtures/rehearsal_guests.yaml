# Fixture guests for the Age of AI rehearsal harness (Oct 21 2026).
#
# Each fixture is a PAST guest, played by a second voice agent from their
# published episode's digest (the approved transcript and the About section
# are the persona's material). Three registers on purpose: a warm
# storyteller who gives long answers, a terse guest who answers in a
# sentence and waits, and an analytical guest who thinks aloud in long
# arcs with pauses inside them. A change to Mira's room must hold up on all
# three before it reaches a real guest (docs/age_of_ai_rehearsal.md).
#
# `digest` is relative to the repo root. `voice` is the fixture agent's
# voice id (never Mira's "ara"). `speaks_first` reproduces a guest who says
# hello before the opening.
fixtures:
  roddy:
    name: Roddy de la Garza
    digest: digests/age_of_ai/Age_of_AI_Ep010_20260930.md
    register: warm storyteller; long answers with a specific detail; grateful; follows a tangent happily
    voice: sal
    speaks_first: false
  vincent:
    name: Vincent Rylan
    digest: digests/age_of_ai/Age_of_AI_Ep007_20260922.md
    register: terse; answers in one or two sentences and waits; dry; football and Detroit
    voice: rex
    speaks_first: true
  adrian:
    name: Adrian Wolfberg
    digest: digests/age_of_ai/Age_of_AI_Ep003_20260917.md
    register: analytical scholar; builds an argument over a long arc with pauses inside it; precise about terms
    voice: leo
    speaks_first: false
