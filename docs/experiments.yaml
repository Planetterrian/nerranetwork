    # factual flags cross-show; its service reliability on long
    # digest-shaped calls remains the blocker. Successor:
    # grok-46-wave2-scripts (script-stage only, the shape that survived).
    status: done
    interim: >
      2026-08-27 (operator-directed): the first_principles and
      unintended_consequences WHOLE-SHOW arms are withdrawn — on the
      GitHub-cron outage day, FPD's grok-4.6 digest calls stalled ~260s
