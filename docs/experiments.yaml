  - id: long-open-cliff
    title: "Long-form open cliff — hold at the 5% mark"
    area: retention
    shipped: 2026-08-17
    readout: 2026-09-07
    status: reading
    metric: long_open_hold_5pct_en
    baseline: 0.51
    target: >
      Mean EN audienceWatchRatio at 5% elapsed above 0.55. The curves
