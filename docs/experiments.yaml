      Gallery was reduced, not removed: still 2:1 over every peer and still
      never on consecutive days. The pool length had to stay coprime with the
      per-show offset stride of 3 or the shows re-collapse into a few phase
      classes; that invariant is pinned rather than commented. offshore_north
      still speaks no surface (COMPACT_PROMO_SHOWS) and the Russian shows are
      excluded structurally. Revert is deleting two dict entries and restoring
      one string. Guards: tests/test_rotation_pass_2026_09_21.py.

