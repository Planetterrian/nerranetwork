    area: reach
    shipped: 2026-08-07
    readout: 2026-08-21
    status: done
    criteria: >
      RESOLVED 2026-08-15 — NEGATIVE, ended 6 days early per the experiment's own exit rule: ru_long_vpd 1.52 vs the 2.0 floor, 52 forced RU/FR longs earned 461 total views (~9/video) and a net -2 subscribers — the July demotion numbers repeated almost exactly. dub_force_long_channels removed from tesla/spacex/FF; the adaptive policy's shorts-only tier decides again. Do not re-probe without a materially different format (e.g. native-RU presentation rather than a dubbed EN render).
    metric: ru_long_vpd_max
    baseline: 2.0
    target: >
      RU/FR long_vpd clearing the RU floor (2.0) with retention above the
      ~9% the July demotion measured; watch fr_long_vpd_max too.
    notes: >
      Operator-directed: dub_force_long_channels pins long-form ON for
      the big three on both dub channels regardless of tier; the Shorts
      supply ladder is untouched. Overrides the July RU long demotion
      (~9% retention, ~11 views/video) to give dubbed long-form a
      second, deliberate read. If the readout repeats the July numbers,
      remove the YAML flags and let the policy decide again.

  - id: shorts-progress-bar
    title: "Shorts progress bar (all channels)"
    area: retention
    shipped: 2026-08-07
    readout: 2026-08-21
    status: reading
    target: >
      Short median AVP up vs the ~44% pre-bar level (compare EN+RU short
      retention before/after 08-07 in youtube_stats).
    notes: >
