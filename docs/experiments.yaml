      are dropped rather than sprayed across the channel. Metadata-only.

  - id: long-open-cliff
    title: "Long-form open cliff — hold at the 5% mark"
    area: retention
    shipped: 2026-08-17
    readout: 2026-09-07
    status: reading
    metric: long_open_hold_5pct_en
    baseline: 0.51
    target: >
      Mean EN audienceWatchRatio at 5% elapsed above 0.55. The curves
      show ~half the audience gone inside the first 30-45 s while decay
      flattens after 25% — the open is the dominant remaining retention
      lever. This entry TRACKS the instrument (new dashboard card +
      metric); the accelerating open, chapters, and the motion batch are
      the levers currently in flight against it. Content-side changes
      to the spoken open are audio (landmine #17) and stay operator-gated.
    notes: >
      Curves accrue nightly for each channel's top 5 recent longs.
      Outliers worth studying: tesla-RU ep554 held 72% at 5%,
      spacex ep65 68% — both had thumbnail/title promises the opening
      delivered immediately.

  - id: mit-rules-based-era
    title: "Modern Investing restarts its track record on published rules"
    area: quality
    shipped: 2026-08-18
    readout: 2026-09-15
    status: reading
    baseline: "holds ran 0-6 sessions (median 3) against a five-day thesis; alpha conflated pick quality with pick weekday"
    target: >
      Every weekly hold spans exactly 5 sessions unless stopped out, so
      per-trade alpha is attributable to the pick. The on-air record is
      the era only, with its trade count in every sentence, and a listener
      can reproduce any reported number from the pick date, the symbol and
      public price data.
    criteria: >
      At readout, score: zero holds off the horizon; zero pre-era figures
      spoken; confidence ratings actually varying; every pick carrying an
      invalidation. If holds are still drifting, the exit rule is not
      being enforced somewhere and that is a bug, not a tuning question.
    notes: >
      The headline alpha goes to zero for about a week and then to a
      sample too small to claim an edge — that is the intended cost of a
      reproducible record, and the prompts require the show to say so.
      Prompt + audio change — landmine #17 A/B.
