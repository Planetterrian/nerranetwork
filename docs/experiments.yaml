  - id: dp-pod-lever-shape-v2
    title: "DP Pod Lever — real-world actions, not screen lookups"
    area: quality
    shipped: 2026-09-04
    readout: 2026-09-18
    status: done
    outcome: >
      PARTIAL with a REGRESSION, scored 2026-09-21. On the levers that
      shipped, all three targets are met: of the ten most recent levers
      (Ep061-074) 4/10 are screen lookups against a 21/26 baseline and a
      <=5/10 target; the most-repeated opening verb appears twice (Contact,
      Open and Buy at 2 each) against 13/26 opening "Open" and a <=3/10
      target; and 10/10 survive the fuzzy collapse in _recent_levers()
      against 3 near-duplicate groups at baseline. The mechanism is live
      rather than merely instructed — the rotation block currently computes
      "BANNED OPENING VERBS today: Contact" from the record itself — and
      levers now run to physical actions (plant three native shrubs, call a
      regional office, join a restoration workday) where the renewed-episode
      run was overwhelmingly "open a website and look something up".
      THE REGRESSION: The Lever SEGMENT is now missing outright from some
      episodes. It appears in 37 of 37 digests before this pass and 14 of
      18 after it — Ep066, Ep068, Ep072 and Ep073 carry no "### The Lever"
      heading at all, and all four are inside the last two weeks. Ep068
      also dropped Think Positive. The Lever is a named segment of this
      show's spine, so an episode without one is not a cleaner episode, it
      is a shorter one; and it means part of the screen-lookup improvement
      above is levers not being WRITTEN rather than being written better.
      Most likely cause is constraint load: banned verbs plus a real-world
      action due plus fuzzy-distinctness is a harder brief than the model
      always satisfies, and dropping the segment satisfies it vacuously.
      PROPOSED, NOT APPLIED (landmine #17 — prompt change, operator A/B):
      make the segment mandatory in the digest spec and let the rotation
      constraints degrade instead of the segment. A read-only detector for
      a missing required segment would catch the whole class without
      touching audio.
      AND THE AUDIENCE DID NOT MOVE. api/audience_headline.json has dp_pod
      at 60 downloads/30d, 3 in the last COMPLETE week against 10 the week
      before, and a first-week median of 0 across its four most recent
      episodes. YouTube: 375 views over 16 videos, 31.3% Shorts retention,
      the lowest of any show still uploading. So the next DP Pod decision
      is a distribution or cadence question, NOT a fourth prompt pass on
      The Lever — fix the missing segment, then leave the copy alone.
    baseline: "21/26 renewed-episode levers were screen lookups; 13/26 opened with 'Open'; 3 near-duplicate groups"
    target: >
      <=5/10 screen-lookup levers, <=3/10 opening with the same verb,
      >=9/10 fuzzy-distinct — scored by the 2026-09-04 ledger predictions.
    notes: >
      Successor tic of the Aug-10 rotation memory: exact repeats stopped
      and the model converged on a shape instead. Fix is data-side (fuzzy
      dedup, banned-verb and real-world-due lines computed from the last
      six levers) plus a shape-only de-seed of the digest Lever spec.
      Prompt change — landmine #17 A/B.

