      Ran 3 days as a script-stage-only A/B before the network upgrade
      landed. The MIT rule carries forward unchanged: any invented
      number/ticker/price reaching a script is an immediate revert.

  - id: network-grok-46-upgrade
    title: "Network-wide grok-4.6 — all LLM stages off 4.3 (operator-directed)"
    area: quality
    shipped: 2026-08-18
    readout: 2026-09-01
    status: reading
    baseline: >
      grok-4.3 on digest/fetch/scripts/synth/titles/reviewer; 30d LLM
      token spend ~$25 (would be ~$47 at 4.6 rates on the same tokens);
      script under-floor share 81% network-wide (MIT 9/10 under 1800w);
      episode-reviewer FACTUAL_ERRORS flags at the pre-upgrade rate
      (establish from review_report history at readout).
    target: >
      Script length off the 4.3 plateau (MIT median clears 1700w+; the
      chronically-short shows' under-floor share drops), reviewer
      FACTUAL_ERRORS flag rate NOT above the pre-upgrade baseline, and
      refusal-fallback fires stay rare. LLM cost line lands ~$45-50/30d.
    criteria: >
      OPERATOR OVERRIDE of the July-31 digests-stay-on-4.3 decision
      (explicitly directed 2026-08-18, risks acknowledged: 4.6's
      confident-hallucination profile is unmeasured for this network).
      REVERT TRIGGERS, checked daily via the audit, decided at readout:
      (1) any invented number/ticker/price in an MIT script — immediate
      one-line revert (model: grok-4.3 in _defaults.yaml); (2) reviewer
      FACTUAL_ERRORS rate clearly above baseline across shows; (3) fetch
      tool-calls (x_search/web_search) failing on 4.6. Also A/B-listen
      the first post-merge episode on 2-3 shows per landmine #17 — every
      script's prose changes with this merge.
    notes: >
      Everything moved together: digest/fetch, scripts (dp_pod's 4.5 and
      MIT's 4.6 pins removed — superseded/absorbed), synth, titles,
      reviewer, review agent, restock; refusal fallback repointed
      grok-4.20-reasoning -> grok-4.3 (different snapshot than the new
      primary, retires the aging 4.20 dependency). Translation was
      already pinned 4.6 same-day. ~+$22-25/mo at current volume.
    title: "Modern Investing states verified-window alpha only"
    area: quality
    shipped: 2026-08-15
    readout: 2026-08-29
    status: decide
    baseline: "+9.28% across 45 trades spoken on air; the 10 honestly-measured trades were at -1.95%"
    target: >
      Every alpha figure spoken on air comes from the 10 (and growing)
      trades with pick-date-aligned benchmark windows, with the trade
      count in the same sentence. No blended lifetime alpha reaches air.
    criteria: >
      OPERATOR DECISION at readout: run
      `scripts/recompute_mit_benchmarks.py --apply` (needs market-data
      access) to rebuild the 35 legacy windows. That collapses the split
      — every trade gains entry_bar_date and the verified figure simply
      becomes the whole record. Until it runs, the show's headline is
      honest but built on n=10.
    notes: >
      The recompute has been an open operator item in the MIT ledger
      since 2026-07-03. This change stops the unrun backfill from
      silently flattering the on-air number in the meantime.

