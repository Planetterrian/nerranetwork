      day's slate now speaks 12 distinct surfaces instead of 4.
    notes: >
      AUDIO-AFFECTING — the first episodes after merge are the A/B-listen set
      (landmine #17), and the thing to listen for is whether the model KEPT the
      new sentence: `spoken` is prompt text rendered into {closing_block} under
      "do not rewrite it", not deterministic insertion, and the model has
      dropped part of a promo frame before (MIT Ep171). The Mira line carries
