# Growth levers in flight — the dashboard's experiments registry.
#
# Every change that was shipped TO MOVE A NUMBER gets an entry here the
# day it ships, with the date the result becomes readable and (where the
# generator supports it) a named live metric so the dashboard can show
# the current value against the baseline. This makes "what are we testing
# and when do we decide" a rendered surface instead of tribal knowledge —
# the same discipline as the review ledgers, applied to growth work.
#
# Consumed by scripts/generate_dashboard.py::build_experiments_section.
# Schema per entry:
#   id:        unique slug
#   title:     short human name
#   area:      retention | reach | subscribers | funnel | quality
#   shipped:   YYYY-MM-DD the change reached production
#   readout:   YYYY-MM-DD the earliest honest read (or decision date)
#   status:    reading   — accruing data, do not stack another change on
#                          the same metric until readout
#              decide    — readout date is a DECISION with criteria below
#              done      — resolved; keep for the record, dashboard greys it
#   metric:    (optional) live-metric key the generator computes:
#                long_form_median_avp_en_14d   — EN long-form median
#                                                averageViewPercentage, 14d
#                fr_short_vpd_max              — best FR short_vpd (policy)
#                ru_short_vpd_max              — best RU short_vpd (policy)
#                channel_views_wow_ru          — RU channel views, last 7d
#                                                vs prior 7d (%)
#                channel_views_wow_en          — same for EN
#                dub_fragment_title_share_14d  — share of RU/FR window-
#                                                Short titles starting
#                                                mid-sentence, 14d
#              Unknown/absent metric renders as null — never 0.
#   baseline:  (optional) the number when the change shipped
#   target:    (optional) what success looks like
#   criteria:  (optional, decide entries) the decision rule
#   notes:     (optional) one line of context
#
# Prune done entries older than ~a quarter.

experiments:
  - id: cold-open-retention
    title: "Cold open — hook is the first thing spoken"
    area: retention
    shipped: 2026-07-30
    readout: 2026-08-15
    status: reading
    metric: long_form_median_avp_en_14d
    baseline: 11.3
    target: "long-form median AVP off the ~11% floor"
    notes: >
      Ten seconds of theme + a 35-word greeting used to push the first
      fact to ~second 28; Shorts (which skip the intro) hold ~42% on the
      same audio. Audio change — was A/B-listened per landmine #17.

  - id: staggered-shorts
    title: "Staggered Shorts — #1 at publish, rest at channel prime time"
    area: reach
    shipped: 2026-08-06
    readout: 2026-08-13
    status: reading
    metric: channel_views_wow_ru
    target: "RU/EN Short views up WoW with unchanged supply"
    notes: >
      publishAt scheduling; EN 17/21/23 UTC, RU 15/18/20, FR 17/19/21.
      First full day 2026-08-07. Confounder note: reads channel views,
      so a big news day can mask it — check views-per-video too.

  - id: ru-3-short-band
    title: "RU 3-Short band on spacex + FF"
    area: reach
    shipped: 2026-07-30
    readout: 2026-08-13
    status: reading
    metric: ru_short_vpd_max
    baseline: 60.9
    target: "short_vpd holds or grows with 50% more supply"
    notes: >
      The supply ladder's 20-vpd band. If vpd holds while supply grew,
      the audience wasn't saturated; if it drops proportionally, it was.

  - id: dub-window-headlines
    title: "Complete headlines for RU/FR window-Shorts"
    area: quality
    shipped: 2026-08-07
    readout: 2026-08-14
    status: reading
    metric: dub_fragment_title_share_14d
    baseline: 0.66
    target: "fragment share of window-Short titles near zero"
    notes: >
      Was ~2/3 of @NerraRU Short titles once the 3-Short band shipped
      (mid-sentence transcript slices). Grok headline w/ clause-trim
      fallback; title-only metadata.

  - id: fr-channel-decision
    title: "@NerraFR — keep or pause the dub channel"
    area: reach
    shipped: 2026-07-21
    readout: 2026-08-25
    status: decide
    metric: fr_short_vpd_max
    baseline: 0.26
    criteria: >
      Keep if any FR show reaches short_vpd >= 1.0 or organic subscriber
      traction appears by 2026-08-25; else pause FR dubs
      (youtube.dub_languages: [] on the four shows — one line,
      reversible). FR PODCAST tracks are decided separately via the
      per-language OP3 instrument.
    notes: >
      53 of 72 launch-window uploads had zero recorded views. Clean
      analytics only since 2026-07-29 (the glob fix), hence the late
      decision date rather than a same-day verdict.

  - id: dub-long-form-probe
    title: "RU+FR long-form dubs on tesla / spacex / FF (operator override)"
    area: reach
    shipped: 2026-08-07
    readout: 2026-08-21
    status: reading
    metric: ru_long_vpd_max
    baseline: 2.0
    target: >
      RU/FR long_vpd clearing the RU floor (2.0) with retention above the
      ~9% the July demotion measured; watch fr_long_vpd_max too.
    notes: >
      Operator-directed: dub_force_long_channels pins long-form ON for
      the big three on both dub channels regardless of tier; the Shorts
      supply ladder is untouched. Overrides the July RU long demotion
      (~9% retention, ~11 views/video) to give dubbed long-form a
      second, deliberate read. If the readout repeats the July numbers,
      remove the YAML flags and let the policy decide again.

  - id: shorts-progress-bar
    title: "Shorts progress bar (all channels)"
    area: retention
    shipped: 2026-08-07
    readout: 2026-08-21
    status: reading
    target: >
      Short median AVP up vs the ~44% pre-bar level (compare EN+RU short
      retention before/after 08-07 in youtube_stats).
    notes: >
      Thin animated cyan bar at the top of every Short — visible time
      remaining, the standard short-video retention device. Render-only;
      per-show opt-out youtube.shorts_progress_bar: false. NOTE: overlaps
      the staggered-shorts readout window — judge by retention (AVP),
      which stagger does not touch, not by views.

  - id: earnings-special-format
    title: "Event specials — earnings/flight reaction episodes"
    area: reach
    shipped: 2026-08-05
    readout: 2026-08-12
    status: reading
    target: "special out-performs the daily episodes around it"
    notes: >
      Ep059 (Q2 earnings) is the pilot: compare its 7d views/downloads
      against Ep057/058/060. flight-14-catch-reaction and
      q3-2026-earnings are pre-staged in the spacex deep-dive queue.

  - id: site-outro-cards
    title: "Site-showcase endings — outro card + Shorts site strip"
    area: funnel
    shipped: 2026-08-09
    readout: 2026-08-23
    status: reading
    target: >
      utm_content=outro sessions appearing in api/funnel.json (QR scans)
      and click-through from video surfaces up vs the pre-08-09 level;
      newsletter captures from src-youtube-* tags are the end goal.
    notes: >
      Long-form videos end on a card built from real nerranetwork.com
      screenshots (show page + network home) with a QR to the
      funnel-tagged show page; Shorts end cards gain the home page's
      show-grid strip. Render-only (outside landmine #17); per-show
      opt-outs youtube.outro_card_enabled /
      youtube.shorts_end_card_site_panel. Screenshots are committed
      (assets/site_screens) and refreshed by
      scripts/capture_site_screens.py.

  - id: dp-pod-script-model-45
    title: "DP Pod script stage on grok-4.5 (podcast_model A/B)"
    area: quality
    shipped: 2026-08-10
    readout: 2026-08-24
    status: reading
    baseline: "27/30 episodes with zero exclamation points; ~30% median digest-to-script 10-word shingle overlap (Ep22 65%)"
    target: >
      Scripts stop reading the brief verbatim (<=15% median shingle
      overlap) and the delivery spec finally lands (>=2 exclamation
      points in most episodes, voice tags actually used) with NO new
      facts beyond the digest.
    criteria: >
      Operator A/B-listens the first post-merge episodes; keep grok-4.5
      only if the energy is real and factuality holds — revert is
      deleting the one podcast_model line in shows/dp_pod.yaml.
    notes: >
      First (only) show on the July-31 script-stage model knob. The
      digest/fetch stage stays on grok-4.3 by design — facts are locked
      before the script model runs. Audio change — landmine #17 A/B.
      Scored against the 2026-08-10 dp_pod review ledger predictions.

  - id: youtube-chapters-live
    title: "Seek-bar chapters ship in every long-form description"
    area: reach
    shipped: 2026-08-12
    readout: 2026-08-26
    status: reading
    metric: long_form_median_avp_en_14d
    baseline: 13.4
    target: >
      Long-form median AVP up vs the 13.4% (14d) baseline, and
      chapter-driven "Key moments" appearing in search — chapters had
      NEVER shipped (0 of 1,333 committed chapter files started at
      0:00, so the formatter discarded every block).
    notes: >
      Synthetic localized "0:00 Intro" line prepended when chapter 1
      starts after the music intro (clamped when it starts <10s).
      Metadata-only — outside landmine #17. Confounded with the
      caption-hold + end-card caption fixes shipping the same day;
      read AVP as the joint effect of the retention batch.

  - id: shorts-caption-continuity
    title: "Shorts captions hold through pauses + stay visible over the end card"
    area: retention
    shipped: 2026-08-12
    readout: 2026-08-26
    status: reading
    target: >
      Shorts median averageViewPercentage up vs the 50.8% EN / 43.6% RU
      (14d) baselines; specifically less drop-off in the final 3 s
      (end-card window) once retention curves are fetched.
    notes: >
      Per-word ASS cues extend to the next word's start (card no longer
      flickers off 10-20x per Short at breaths) and the subtitles stage
      runs after the end-card overlay (last ~3 s of speech kept its
      text hidden under the opaque CTA card). Render-only — outside
      landmine #17.

  - id: shorts-motion-ab-stalled
    title: "Shorts motion A/B — ENDED (operator, 2026-08-14): unreadable"
    area: retention
    shipped: 2026-07-30
    readout: 2026-08-14
    status: done
    criteria: >
      RESOLVED 2026-08-14 — operator chose (b): formally ended as
      unreadable. The treatment arm froze at n=4 when
      shorts_ab_enabled: false landed via the merged spacex review PR
      #973; final data (4 vs 12) is not significant and stills remain
      the network default (no Grok Video spend on Shorts). The four
      render items the verdict was holding are now shipped on their own
      merits: progress bar (A3, shipped earlier), Shorts transition
      split (A2), punch-in easing (E1), long-form closing beat (D2) —
      all in the scene-cadence-36-slots reading window.
    notes: >
      The A/B machinery (engine/shorts_ab.py, the nightly report) stays
      dormant and re-usable; kb_extended=False keeps reproducing the
      legacy control render if a future experiment wants it.

  - id: scene-cadence-36-slots
    title: "Long-form scene cadence — input dedup + 36-slot cap + adaptive Ken Burns"
    area: retention
    shipped: 2026-08-14
    readout: 2026-08-28
    status: reading
    metric: long_form_median_avp_en_14d
    target: >
      Long-form median AVP up vs the 13.4%/11.4% (14d) recent band. A
      17-min episode now changes scene every ~29 s instead of holding
      85+ s, the accelerating open survives, and Ken Burns speed no
      longer collapses on long holds (0.006/s adaptive amplitude).
      Reads jointly with youtube-chapters-live (both target the same
      metric; this is the render half).
    notes: >
      Enabled by ffmpeg input dedup (one -i per unique image + split),
      which removed the per-slot demuxer cost behind the old 24-slot
      cap. Render-only — outside landmine #17.
