      levers now run to physical actions (plant three native shrubs, call a
      regional office, join a restoration workday) where the renewed-episode
      run was overwhelmingly "open a website and look something up".
      THE REGRESSION: The Lever SEGMENT is now missing outright from some
      episodes. It appears in 37 of 37 digests before this pass and 14 of
      18 after it — Ep066, Ep068, Ep072 and Ep073 carry no "### The Lever"
      heading at all, and all four are inside the last two weeks. Ep068
      also dropped Think Positive. The Lever is a named segment of this
      show's spine, so an episode without one is not a cleaner episode, it
      is a shorter one; and it means part of the screen-lookup improvement
      above is levers not being WRITTEN rather than being written better.
      Most likely cause is constraint load: banned verbs plus a real-world
      action due plus fuzzy-distinctness is a harder brief than the model
      always satisfies, and dropping the segment satisfies it vacuously.
      PROPOSED, NOT APPLIED (landmine #17 — prompt change, operator A/B):
      make the segment mandatory in the digest spec and let the rotation
      constraints degrade instead of the segment. A read-only detector for
      a missing required segment would catch the whole class without
