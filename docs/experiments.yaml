      modern_investing) requests exceeded the 300s client timeout or were
      server-disconnected. Nested SDK+tenacity retries amplified each
      stall into a 41-45 min burn; 7 of 12 shows failed on day one
      (2026-08-18 07:37-10:33 UTC). Rolled back to grok-4.3 everywhere
      except the translation pin (already 4.6 via the alias freeze, small
      chunks, no timeouts observed). The hallucination-profile question
      is UNANSWERED — the experiment never reached an editorial readout.
      Any retry follows docs/model_upgrade_playbook.md: one show first,
      digest-latency gate before network-wide.
  - id: staged-grok-46-trial
    title: "grok-4.6 staged trial — dp_pod script, synth, reviewer (FPD+UC arms withdrawn 2026-08-27)"
    area: quality
    shipped: 2026-08-18
    readout: 2026-09-01
    # Closed at readout (2026-09-01). OUTCOME: PARTIAL ADOPTION.
    # Adopted for good: dp_pod script-stage (14/14 days incl. the 08-27
    # bad-service day, LV 7.2-8.3, 2 factual flags in 10 reviewer-days —
