      the lowest of any show still uploading. So the next DP Pod decision
      is a distribution or cadence question, NOT a fourth prompt pass on
      The Lever — fix the missing segment, then leave the copy alone.
    baseline: "21/26 renewed-episode levers were screen lookups; 13/26 opened with 'Open'; 3 near-duplicate groups"
