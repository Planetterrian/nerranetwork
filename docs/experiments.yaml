    area: reach
    shipped: 2026-08-05
    readout: 2026-08-12
    status: done
    criteria: >
      RESOLVED 2026-08-15 — NEGATIVE. The Q2 special (spacex Ep59) was the WORST RU performer in its neighbourhood by three orders of magnitude (3 RU views vs 2,469 for Ep60) and second-lowest EN long AVP (12.0%), partly because it landed on a 9-upload day (3/day norm). Verdict: specials do not outperform dailies as published; keep them rare, give each its OWN publish day, and enforce the deep-dive brief floor (Ep59 shipped 1775w vs its 2400 floor). Applies to the queued flight-14-catch-reaction special.
    target: "special out-performs the daily episodes around it"
    notes: >
      Ep059 (Q2 earnings) is the pilot: compare its 7d views/downloads
      against Ep057/058/060. flight-14-catch-reaction and
      q3-2026-earnings are pre-staged in the spacex deep-dive queue.

