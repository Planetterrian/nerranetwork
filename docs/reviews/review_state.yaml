# Review-agent rotation state.
#
# Maps each review target to the date it was last reviewed. The scheduled
# Show Review Agent (.github/workflows/show-review.yml) picks the
# least-recently-reviewed target via scripts/pick_review_target.py, and the
# agent's review PR updates the entry to the review date — so the rotation
# only advances when the operator merges the PR.
#
# `network` is the cross-cutting whole-network review (workflows, funnels,
# costs, landmines) in the style of docs/network_review_2026_06.md.
#
# Seed dates reflect the June 2026 manual passes (PRs #573-585: per-show
# quality passes June 9-10 plus the website / prompt-voice / workflow
# network-scope passes on June 10).
targets:
  tesla: 2026-06-10
  # Prompt + Grok API/Voice infra review July 9 2026 (cache routing, TTS speed).
  # Goals & differentiation audit + meta-review July 18 2026.
  network: 2026-07-18
  modern_investing: 2026-07-18
  fascinating_frontiers: 2026-07-21
  models_agents: 2026-07-19
  models_agents_beginners: 2026-06-25
  planetterrian: 2026-07-20
  finansy_prosto: 2026-06-16
  privet_russian: 2026-06-10
  env_intel: 2026-07-13
  spacex: 2026-07-17
  first_principles: 2026-07-16
  omni_view: 2026-07-11
  unintended_consequences: 2026-06-12
  # First dedicated review July 9 2026 (market fit + Ep1–4).
  dp_pod: 2026-07-09
  age_of_ai: 2026-07-04
  # Launch registration, not a review — Nerra Voices (Age of AI's sister
  # interview show) had no episodes on this date. Dated to launch day so it
  # enters the rotation at the back like offshore_north did.
  nerra_voices: 2026-09-05
  # Launch registration, not a review — Offshore North had no episodes on
  # this date. Dated to launch day so it enters the rotation at the back
  # and comes up once there are real episodes to review.
  offshore_north: 2026-08-04
