    reviewer: claude-code (Ep2 job-log read, same day, second entry)
    summary: >-
      Ep2's fallback anatomy from the job log: the grok-4.7 digest call sat the full 600 s request timeout (11:11:30 -> 11:21:30) with no bytes, then grok-4.3 wrote the episode. A streamed call would have shown silence at 180 s and the same-model retry would have had 4.7 answer in its usual 200-390 s. The dose_terms blocking lint (PR F) stands; this entry records the timing only.
    shipped:
      - llm.stream: true; one budget-gated same-model retry before any switch
    predictions:
