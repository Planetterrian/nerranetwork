do_not_retry:
- Adding a prohibition to Mira's live prompt for a fault the room can enforce (one question per turn, no second sign-off, no re-asking); the three such lessons carry relapse counts of 2, 4 and 3 and the fault persists (Oct 21 2026 review).
- Retiring a verbal tic by listing its instances in the prompt; seventy "That's a ..." lines were listed and the shape moved to a one-word echo opener on every turn (Jon Cheney, Oct 19 2026).
- Quoting a bad line or a guest's complaint verbatim in the prompt as a teaching example; the network-wide de-seed-by-shape rule applies to Mira exactly as it did to Tesla and DP Pod.
- Raising the end-of-turn silence timer as the fix for interruptions; 1,100 -> 1,300 -> 1,800 ms and the Oct 20 room still logged 14.
