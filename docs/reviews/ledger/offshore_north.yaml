      - prompts: last-known position + date, never "unconfirmed"; content not timestamps; no standings; Canadian Boat first and longest; incidents not leaderboards; no scaffolding words on air; pedigree rationed; evergreen Plain Sailing; exactly one Dan reference + "Dan's lens" line; finish outranks a re-surfaced start
