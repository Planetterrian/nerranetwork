      Scott's Notes feed, the position/content/standings/lead-with-Canada/
      incidents/evergreen/Dan rules, the race-state rule, refreshed
      standing facts (Route du Rhum entry confirmed, 118 skippers, TORA
      result), a cadence-aware blog footer, and the public campaign
      dashboard.
