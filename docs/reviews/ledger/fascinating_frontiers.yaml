do_not_retry:
  - idea: Phonetic respellings or programmatic speech-tag injection.
    evidence: >-
      Landmine #17 — 100% regression rate on the custom voice kdif6sqjcyiq.
      NOTE: this pass's garble repair is the OPPOSITE (it removes a phonetic
      respelling the model emitted, restoring the standard spelling TTS handles)
      and is allowed.
  - idea: >-
      Push FF podcast length above the digest ceiling via harder prompt
      pressure (demanding more words/sentences from a snippet-bound digest).
    evidence: >-
      June 12 2026 review verified the ceiling is the digest (RSS snippets,
      ~1,300-1,600w), not the target. Ep099 script (1664w) already exceeded its
      digest (1572w). More prompt pressure produces padding (Ep099: 6 headline
      restatements), not facts. The only legitimate lever is digest-side depth
      (Cosmic Deep Dive own-knowledge), not podcast-side word demands.
