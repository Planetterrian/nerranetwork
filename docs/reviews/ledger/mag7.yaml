    summary: >-
      Episode 1 generated and passed every gate but never reached main: the hook's quote cache was api/mag7.json, the same path as the per-show public API file generate_html writes; finalize committed that file while the cache sat untracked on the show runner, and all four rebase attempts aborted ('untracked working tree file would be overwritten'). The run exited green through the recovery-PR escape hatch (#1270). Content: the Thread re-read four tape prices, the Counterpoint was a technical-analysis 'fails at resistance' article, the Company Desk spent two items on Gemini settings changes, and the script carried 9 absence sentences.
    shipped:
      - chapters cover the opening when no start marker matches (engine/chapters.py)
      - absence-sentence filter on digest and script (engine/absence_sentences.py, opt-in)
      - targeted X accounts as a content source (x_fetch_enabled; x_lookback_hours on weeklies)
      - full article text for the top 12 articles (fetch_full_text)
      - quote cache renamed api/mag7_quotes.json, whitelisted in the commit step; guard that no hook writes api/<slug>.json
      - Thread never repeats a tape number; Counterpoint must be an argument; TA titles excluded; minor UI rollouts rejected
      - tape percentages drop a trailing .0
    deferred:
