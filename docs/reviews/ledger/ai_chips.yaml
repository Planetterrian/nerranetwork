      CORRECTION to the entry above: dc_items_unlabelled did not catch the model omitting build states. It required a state word AND a MW figure of EVERY item in Data Centres & Power, while the prompt exempts non-site items from the state word and forbids estimating a capacity the source did not give; Ep3's three items (an 800 VDC whitepaper, Huawei's UnifiedBus, Nvidia on wasted power) are not sites, so the finding could never clear and the retry was spent for nothing. The lint now judges SITE items only (a capacity figure or a build cue such as ground-breaking, construction, energisation, land area, a substation; "campus" alone is not a cue - Ep3 said "not a named campus") and needs two site items before it fires. Replay: Ep1 0 of 2 sites unlabelled (pass), Ep2 one site item (OpenAI/Anthropic seek 20-30 MW, no state - under the two-site floor), Ep3 no site items. The real Ep3 question is selection - the section carried no build at all - which the prompt's item-mix rule owns, not this lint. Ep2's own fallback (a dropped 4.7 connection at ~260 s) is covered by the resilience pass.
    shipped:
