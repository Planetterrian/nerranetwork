do_not_retry:
  - idea: >-
      Push the podcast length target above ~1500 words via prompt escalation
      (e.g. demanding 1800-2400 spoken words harder).
    evidence: >-
      shows/first_principles.yaml records the operator already regenerated 3x
      (8 -> 10.6 -> 10.1 min) and found grok-4.3 plateaus at ~1200-1500 words
      network-wide and "resists prompt escalation past that ceiling." The
      floor (1500) is intentionally a thin-pass trigger, not a real target.
      Do not re-litigate the length ceiling; only rescue genuinely-thin passes.
  - idea: Phonetic respellings or programmatic speech-tag injection.
    evidence: >-
      Landmine #17 — 100% regression rate on the custom voice kdif6sqjcyiq
      across every prior attempt (Planetterrian, tissue, neurodegenerative,
      <fast>/<build-intensity> wraps). FP inherits the blessed TTS chain
      verbatim and must keep it.
  - idea: Enable FP distribution (newsletter / X / YouTube) now.
    evidence: >-
      Operator decision (CLAUDE.md): distribution OFF at launch; the network
      review recommends waiting to ~Ep15 after queue/length settle. We are at
      Ep5. Premature.
