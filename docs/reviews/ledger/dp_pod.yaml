  - date: 2026-09-04
    pr: null
    doc: docs/reviews/dp_pod_review_2026_09_04.md
    reviewer: claude-code (operator-directed performance / mission / naturalness / experience pass)
    summary: >-
      Scored the Aug-10 renewal on 26 shipped episodes: verbatim paste
      collapsed (~30% -> ~3% median), digest length hit the floor, the
      grok-4.6 script stage was adopted (Sep 1) and the dialogue reads
      like two friends. Three successor problems: (1) the Lever converged
      on a new SHAPE — "Open your <website> today..." opened 13/26 and 21/26
      levers were screen lookups on a show that signs off "do something
      about it"; (2) the prompt's own comedy examples calcified into
      catchphrases (checklist 23/26, steel-man 23/26, I'll concede 17/26);
      (3) episodes overshoot the ten-minute promise (11-14 min on 4.6).
      Also: two closings double-asked for dispatches and one claimed "we
      read every dispatch" with zero ever received; the founders' notes
      went almost unused (Yukon 0/26); review_snapshot crashed on any show
      without exclude_title_patterns. All fixes data-side rotation memory
      or de-seed by shape. YouTube Shorts-only enabled (operator-directed
      reach; the A/B condition set on Aug 10 is met).
    shipped:
      - _recent_levers fuzzy near-dup collapse + BANNED OPENING VERBS + REAL-WORLD ACTION DUE (data-side)
      - _recent_banter_phrases retired-bits rotation memory (mined from the last 6 scripts, furniture-excluded)
      - _founders_detail_nudge (fires only when no real host material aired in 5 episodes)
      - digest Lever spec de-seeded v2 (physical-world action; screen step must END in a thing done) — A/B
      - podcast prompt comedy/dynamic examples removed (de-seed by shape), RETIRED BITS obedience, HARD CEILING 1,750 words — A/B
      - intros.py closings: dispatch double-ask + "we read every dispatch" claim replaced with the every-little-bit mission line — A/B
      - youtube.enabled true, publish_long_form false, smart Shorts 3.5 (reach)
      - scripts/review_snapshot.py digest_files hoisted (crash fix for shows without exclude patterns)
      - scripts/generate_api.py dp_pod duration ~12 min (was defaulting to ~15 against a ten-minute promise)
      - founders notes: five concrete prompts for Dan (comment block, never reaches the prompt)
      - tests/test_dp_pod_show.py::TestSep4NaturalnessPass (9 guards)
    deferred:
