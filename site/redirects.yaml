# Paths that are measured as 404s and should STAY 404s. Listed so the audit
# reports only genuinely new holes, and so the reasoning is not re-litigated.
accepted_404:
  # A feed URL that never existed must not answer with HTML: GitHub Pages
  # serves ``.rss`` as application/rss+xml, so a redirect stub there would
  # hand a feed reader a document it cannot parse — worse than a clean 404.
  # These came from the same mis-resolved crawl as the pages above, one
  # session each.
  - path: blog/dp_pod/age_of_ai_podcast.rss
    reason: feed path that never existed — a 404 is the correct answer
  - path: blog/dp_pod/blog.rss
    reason: feed path that never existed — a 404 is the correct answer
  - path: blog/dp_pod/dp_pod_podcast.rss
    reason: feed path that never existed — a 404 is the correct answer
  - path: blog/dp_pod/env_intel_podcast.rss
    reason: feed path that never existed — a 404 is the correct answer
  - path: blog/dp_pod/fascinating_frontiers_podcast.rss
    reason: feed path that never existed — a 404 is the correct answer
  - path: blog/dp_pod/finansy_prosto_podcast.rss
    reason: feed path that never existed — a 404 is the correct answer
