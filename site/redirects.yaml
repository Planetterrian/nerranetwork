# Redirect stubs for URLs that used to work, or that people keep asking for.
#
# GitHub Pages cannot issue a 301, so a URL that has moved is answered with a
# tiny generated page: meta refresh + canonical + a visible link
# (``templates/redirect_stub.html.j2``, written by
# ``generate_redirect_stubs()`` in ``generate_html.py``). The pattern is the
# one the hand-written ``finansy-prosto.html`` has used since the RU pages
# moved under ``ru/``; this file makes it a generated, tested surface instead
# of a one-off.
#
# Why this exists: on 2026-09-18, 49 of 188 measured landing sessions — 26% —
# arrived at a path with no file, every one bouncing at 100%
# (``api/ga4_stats.json``). Nothing noticed, because every check the site had
# asked whether the pages it GENERATES are sound, never whether the pages
# people ASK for exist. ``scripts/audit_dead_urls.py`` is the instrument;
# this file is the answer.
#
# Rules:
#   * ``to`` must exist in the repo, and ``from`` must NOT — a stub may never
#     shadow a real page (guarded in tests).
#   * Stubs are ``noindex`` and are excluded from ``sitemap.xml``, including
#     from its ``blog/<show>/ep*.html`` glob.
#   * Send people somewhere that answers the question they arrived with: a
#     deleted episode goes to its show's archive, not to the homepage.

redirects:
  # --- The DP Pod catalogue prune (2026-08-10, operator-directed) ---------
  # Thirteen episodes were removed from RSS/summaries/blog/site for repeated
  # levers or high verbatim paste. Their URLs stayed indexed and still take
  # ~28 landing sessions a month, all bouncing. The show's blog archive is
  # the honest destination: the episode is gone, the show is not.
  - from: blog/dp_pod/ep004.html
    to: blog/dp_pod/index.html
    reason: purged 2026-08-10 (DP Pod catalogue prune)
  - from: blog/dp_pod/ep005.html
    to: blog/dp_pod/index.html
    reason: purged 2026-08-10 (DP Pod catalogue prune)
