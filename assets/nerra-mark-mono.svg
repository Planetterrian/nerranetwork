<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Nerra Network mark (monochrome)">
  <!-- Single-color mark. Set color via CSS `color:` or replace currentColor.
       Use on solid brand or neutral backgrounds where the gradient can't reproduce. -->
  <g fill="currentColor" stroke="currentColor">
    <g stroke-width="2.4" stroke-linecap="round" opacity="0.55">
      <line x1="50" y1="50" x2="50" y2="26"/><line x1="50" y1="50" x2="70.8" y2="38"/>
      <line x1="50" y1="50" x2="70.8" y2="62"/><line x1="50" y1="50" x2="50" y2="74"/>
      <line x1="50" y1="50" x2="29.2" y2="62"/><line x1="50" y1="50" x2="29.2" y2="38"/>
    </g>
    <circle cx="50" cy="26" r="5.2"/><circle cx="70.8" cy="38" r="5.2"/>
    <circle cx="70.8" cy="62" r="5.2"/><circle cx="50" cy="74" r="5.2"/>
    <circle cx="29.2" cy="62" r="5.2"/><circle cx="29.2" cy="38" r="5.2"/>
    <circle cx="50" cy="50" r="10"/>
  </g>
</svg>
