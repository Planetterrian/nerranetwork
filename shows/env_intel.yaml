  rss_title: "Environmental Intelligence"
  # June 2026: say the real cadence (odd weekdays, not daily) and lead
  # with the scannable Compliance Brief — the B2B differentiator.
  rss_description: "The environmental compliance briefing for Canadian practitioners, published every other weekday. Each episode opens with a scannable Compliance Brief you can forward to your team, then regulatory updates across provincial and federal jurisdictions, contaminated sites and remediation news, and a practitioner field lesson with the most common mistake and its fix."
  rss_link: https://nerranetwork.com/env-intel.html
  rss_author: Environmental Intelligence
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/environmental-intelligence.jpg
  rss_category: Science
  rss_subcategory: Earth Sciences
  rss_keywords: "environment, canada environment, regulation, sustainability, climate, compliance"
  guid_prefix: env-intel
  base_url: https://nerranetwork.com
