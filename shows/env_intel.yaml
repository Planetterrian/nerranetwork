min_articles: 5
min_articles_skip: 2

# Per-show translation set (June 2026 "Spanish dropped network-wide" decision).
# Env Intel is a lighter daily show like Models & Agents / First Principles —
# French only, NOT the inherited _defaults [fr, ru, es, zh]. Without this
# override it silently inherited the stale default (incl. the dropped Spanish).
multilingual:
  enabled: true
  auto: true
  languages:
  - fr

llm:
  provider: xai
  system_prompt_file: shows/prompts/env_intel_system.txt
  digest_prompt_file: shows/prompts/env_intel_digest.txt
  podcast_prompt_file: shows/prompts/env_intel_podcast.txt
  digest_temperature: 0.5
  podcast_temperature: 0.7
  max_tokens: 3500
  podcast_max_tokens: 8000
  # env_intel is structurally a shorter, specialist show: alt-cadence
  # (odd weekdays), narrow content surface (BC environmental policy +
  # federal regulatory tracking), small daily news pool. The last five
  # shipped episodes ran 693, 730, 820, 838 and 928 words — the network
  # default ``min_podcast_words: 1500`` was never close. Pin the target
  # to reality so the "below target" warning isn't permanent noise; pair
  # it with an explicit ``min_podcast_word_floor: 450`` so a narrow-news
  # day (Ep036, 2026-05-21 came in at 539 words and was incorrectly
  # treated as "clearly broken") ships as a short-but-legitimate
  # episode instead of aborting. The podcast prompt already tells the
  # LLM "if the briefing is genuinely thin, let the episode be shorter
  # rather than fill space with editorial padding"; this aligns the
  # pipeline gate with that instruction.
  min_podcast_words: 900
  # June 2026 network quality pass: chronic below-target episodes —
  # the expand-retry now fires on ANY below-target script.
  podcast_expand_below_target: true
  min_podcast_word_floor: 450

tts:
  # Inherits provider=grok, voice_id=sal, language_code=en, max_chars=10000
  # from shows/_defaults.yaml (network default since May 2026 — Grok TTS
  # at $4.20/M chars vs ElevenLabs Flash $150/M).
  {}

audio:
  music_file: assets/music/EnvIntel.mp3
  transition_sting: assets/music/transition_sting.mp3
  # May 12 2026 retune (see shows/_defaults.yaml).
  voice_intro_delay: 10.0
  intro_duration: 10.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.4
  overlap_volume: 0.3
  fade_volume: 0.25
  outro_volume: 0.4

