# Peptides Weekly — launched Sep 2026 (Phase 1 of docs/new_shows_plan_2026_09_22.md
# §4.3). Weekly (Thursday), Planetterrian-structured: the week's news plus one
# curriculum spotlight (shows/curricula/peptides.yaml, picked by the hook).
# Health posture (plan §4.3): education and awareness, never dosing,
# sourcing or protocols. The posture is in the identity line and the
# closing (engine/intros.py — supplied verbatim, so the model cannot drop
# it), the newsletter health callout, and every prompt. The claims gate is
# the network default enforce + STRIP: a sentence it cannot trace to a
# source does not ship. Spotlight evidence arrives as real Europe PMC
# abstracts (engine/europe_pmc.py via the hook), so it can be cited.
# YouTube stays OFF until a policy review — platform medical-content rules
# are a channel-level risk, not a per-video one.
#
# Distribution OFF at launch; no cron until Episode 1 has been heard.
name: Peptides Weekly
slug: peptides
weekly_summary_segment: false   # a weekly show IS the week in review
memory_enabled: true
story_recurrence: true
description: Education and awareness about peptides — the approved drugs, the research compounds and the grey market — with the evidence read carefully every week. Never dosing advice.

# Weekly show: every feed reads a week and a day (window_hours: 192), and
# nothing older than nine days by its page or feed date reaches the prompt
# (stale_article_days). Opt-in by name in the Offshore North guards.
stale_article_days: 9
# check_feeds.py 2026-09-22 (this session's egress, pipeline user agent):
# Endpoints News 403s the fetcher's user agent; Fierce Biotech's pubDate is
# not a parseable date; ScienceDaily Hormones and Cell Metabolism were stale
# (monthly issue feeds). Wiley journal feeds 403 GitHub runners (Peptides
# dry run, 2026-09-22). Dropped. Re-grade from a runner before Episode 1.
sources:
- url: https://www.statnews.com/feed/
  label: STAT News
  window_hours: 192
- url: https://www.biopharmadive.com/feeds/news/
  label: BioPharma Dive
  window_hours: 192
- url: https://rss.sciencedirect.com/publication/science/01969781
  label: Peptides (journal)
  window_hours: 192
- url: https://www.sciencedaily.com/rss/health_medicine.xml
  label: ScienceDaily Health
  window_hours: 192
- url: https://news.google.com/rss/search?q=peptide+drug+OR+peptide+therapy+when:7d&hl=en-US&gl=US&ceid=US:en
  label: Google News peptide drugs
  window_hours: 192
- url: https://news.google.com/rss/search?q=GLP-1+OR+semaglutide+OR+tirzepatide+when:7d&hl=en-US&gl=US&ceid=US:en
  label: Google News GLP-1
  window_hours: 192
- url: https://news.google.com/rss/search?q=compounded+peptides+OR+%22research+use+only%22+peptides+when:7d&hl=en-US&gl=US&ceid=US:en
  label: Google News compounding & grey market
  window_hours: 192
- url: https://news.google.com/rss/search?q=FDA+peptide+OR+%22Health+Canada%22+peptide+when:7d&hl=en-US&gl=US&ceid=US:en
  label: Google News peptide regulation
  window_hours: 192

web_search_queries:
- peptide drug news this week
- GLP-1 semaglutide tirzepatide news this week
- FDA compounded peptides news

exclude_title_patterns:
# Commerce and dosing content only. Never bare "order" (an FDA or
# executive order is news) or "protocol" (a trial protocol is news).
- '\b(buy now|shop now|coupon|promo code|discount code|for sale)\b'
- '\b(peptide stack|dosing guide|how much to take|cycle guide)\b'

keywords:
- peptide
- peptides
- glp-1
- semaglutide
- tirzepatide
- retatrutide
- insulin
- oxytocin
- teriparatide
- bpc-157
- thymosin
- ghk
- sermorelin
- tesamorelin
- bremelanotide
- melanotan
- compounding
- compounded
- research use only
- fda
- health canada
- amino acid

min_articles: 5
min_articles_skip: 3

max_weekly_cost_usd: 4.0

multilingual:
  enabled: false

llm:
  provider: xai
  system_prompt_file: shows/prompts/peptides_system.txt
  digest_prompt_file: shows/prompts/peptides_digest.txt
  podcast_prompt_file: shows/prompts/peptides_podcast.txt
  digest_temperature: 0.4
  podcast_temperature: 0.6
  max_tokens: 6000
  podcast_max_tokens: 9000
  min_podcast_words: 1400
  podcast_expand_below_target: false
  min_digest_words: 1200
  digest_expand_below_target: true

tts: {}

audio:
  # Reuses Planetterrian's theme (the health strand) until a dedicated
  # track is commissioned (plan §5c).
  music_file: assets/music/oilers-pride.mp3
  transition_sting: assets/music/transition_sting.mp3
  voice_intro_delay: 0.0
  intro_duration: 3.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.6
  overlap_volume: 0.5
  fade_volume: 0.4
  outro_volume: 0.6

publishing:
  rss_file: peptides_podcast.rss
  rss_title: Peptides Weekly
  rss_description: 'What peptides are, what the evidence actually shows, and what is approved, investigational or unregulated. Every Thursday: the week in peptide science and regulation, and one peptide explained properly — mechanism, studies, status, risks. Education only; never dosing, sourcing or protocols, and never medical advice.'
  rss_link: https://nerranetwork.com/peptides.html
  rss_author: Patrick
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/peptides.jpg
  rss_category: Health & Fitness
  rss_subcategory: Medicine
  rss_category2: "Science"
  rss_subcategory2: "Life Sciences"
  rss_keywords: peptide, peptides, glp-1, semaglutide, tirzepatide, retatrutide, insulin, oxytocin, teriparatide, bpc-157
  guid_prefix: peptides
  base_url: https://nerranetwork.com
  audio_subdir: digests/peptides
  summaries_json: digests/peptides/summaries_peptides.json
  summaries_podcast_name: peptides
  player_html: peptides.html
  summaries_html: peptides-summaries.html
  x_enabled: false
  x_env_prefix: X_
  host_name: Patrick
  host_kind: human

episode:
  prefix: Peptides_Weekly
  filename_pattern: '{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3'
  output_dir: digests/peptides
  mp3_glob: Peptides_Weekly_Ep*.mp3

chapters:
  enabled: true
  section_markers:
  - pattern: This is Peptides Weekly|Peptides Weekly, episode
    title: Introduction
    where: start
  - pattern: this week'?s (spotlight|mechanism)|let'?s look (closely|properly) at
    title: Peptide Spotlight
  - pattern: That's Peptides Weekly|see you next week
    title: Closing
    where: end

slow_news:
  enabled: false

newsletter:
  enabled: false
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: Peptides Weekly
  short_label: Peptides
  emoji: 🧪
  newsletter_start_date: '2026-10-01'
  requires_financial_disclaimer: false
  requires_health_disclaimer: true
  length_target_words: 1300

content_tracking:
  section_patterns: {}

source_integrity:
  enabled: true
  enforce: true
  on_failure: strip

youtube:
  enabled: false                # OFF until a medical-content policy review
  channel: en
  category_id: 27
  shorts_start_mode: smart
  shorts_min_score_threshold: 3.5
  default_language: en
  privacy_status: public
  image_provider: grok
  grok_image_model: grok-imagine-image
  grok_image_descriptor: "cinematic laboratory science photo, soft lighting, ultra-detailed"
  image_queries:
  - research laboratory bench with pipettes
  - microscope in a clinical lab
  - scientist reviewing data on a screen
  - molecular model on a desk
  - hospital research corridor
  - library of scientific journals
  image_query_prefix: ''
  tags:
  - peptides
  - health science
  - medical research
