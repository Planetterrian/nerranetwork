- id: hfc-refrigerants-kigali
  title: 'Saving the Ozone, Warming the Planet: The HFC Swap'
  brief: The Montreal Protocol's replacement refrigerants — hydrofluorocarbons — did exactly what they promised, sparing the ozone layer from the CFCs they replaced. The unintended consequence took two decades to size up — many HFCs turned out to be greenhouse gases hundreds to thousands of times more potent than carbon dioxide, and the booming air-conditioning world was now built on them. Cover the good-faith chemistry choice made with the knowledge of the time, the slow recognition of the warming problem, and the Kigali Amendment that began the second swap — a rare case where the fix for one atmospheric crisis quietly fed another, and where the institutions noticed and corrected. Distinct from the show's CFC episode — this is the sequel about the cure. Treat all warming-potential figures as approximate.
  category: classic
  produced: true
