- id: shares-instead-of-land-how
  title: 'Shares Instead of Land: How Philippine Estates Escaped Reform'
  brief: 'The Comprehensive Agrarian Reform Law of June 1988 was meant to break up the Philippines'' large estates and put farmland in the hands of the people who worked it. It also carried a stock distribution option that let a corporate landowner give farmworkers shares instead of land, and the Cojuangco family''s Hacienda Luisita in Tarlac, roughly 4,900 hectares, used it after 1989 farmworker referendums, so workers held a minority of the stock while the family kept control; parts of the estate were later reclassified and converted to industrial and commercial use, and land taken for the Subic-Clark-Tarlac Expressway. A Philippine Institute for Development Studies review of Marife Ballesteros''s work lists the wider evasion toolkit: excess holdings registered to relatives or dummies, mortgaging land to defer coverage, conversion to non-agricultural use, and shares in place of land. The Presidential Agrarian Reform Council revoked Luisita''s stock option in 2005, the Supreme Court upheld that in 2011 and 2012, and the last land certificates were awarded in 2018. Cover the reform''s real achievement (the government reports most covered land was distributed) beside its own conclusion that it failed to break up large estates, and the 2004 Luisita strike as context without retrying it.'
