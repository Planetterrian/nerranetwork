- id: red-light-cameras-and-the
  title: Red-Light Cameras and the Rear-End Crash
  brief: Red-light cameras were installed to stop drivers running signals and causing the side-impact, right-angle crashes that kill and maim at intersections, and they largely did that. A 2005 Federal Highway Administration evaluation of 132 camera intersections in seven U.S. jurisdictions found right-angle crashes fell 24.6 percent, but rear-end crashes rose 14.9 percent as drivers braked hard to avoid a ticket and the car behind did not. The FHWA still found a modest net economic benefit; a 2007 Virginia Transportation Research Council study of six Northern Virginia jurisdictions found rear-end crashes up 27 or 42 percent depending on the method and, in aggregate, a net increase in crash costs, and recommended deciding intersection by intersection. Cover how a safety tool trades one crash type for another, why the answer depends on the intersection, and the statistical traps (regression to the mean) that inflated early claims.
