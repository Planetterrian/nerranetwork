  brief: 'In 1883 Hawaii imported small Indian mongooses to plantations to prey on rats damaging sugarcane. The largely diurnal mongooses rarely overlapped with nocturnal rats yet readily consumed native ground-nesting birds and eggs. Within decades several endemic species were driven extinct or to remnant populations on mongoose-free islands, illustrating how a single-purpose predator introduction can reorder an island food web when temporal and dietary mismatches are ignored.


