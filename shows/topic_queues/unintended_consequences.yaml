- id: fosta-and-the-market-that
  title: FOSTA and the Market That Moved Offshore
  brief: In March 2018 Congress passed the Fight Online Sex Trafficking Act (FOSTA), 388 to 25 in the House and 97 to 2 in the Senate, to make websites liable when their users advertise sex trafficking. Craigslist shut its U.S. personals section within days, and in April 2018 federal authorities also seized Backpage.com. A 2021 Government Accountability Office report found that many platform operators had moved overseas and the market had fragmented, which made it harder for investigators to gather tips and evidence; by then prosecutors had brought one case under the law's new aggravated-offence provision and sought no criminal restitution. Sex workers warned the law would push them back onto the street, and a peer-reviewed study had earlier found that Craigslist's erotic-services listings reduced female homicide by 12 to 18 percent by moving transactions indoors. Present the safety claims as contested evidence, not settled fact, and separate the law's effects from Backpage's seizure in the same month.
