- id: airbags-front-seat-children
  title: 'The Airbag That Was Tuned for an Adult'
  brief: 'Airbags were mandated to save lives in crashes, and for adults they did. The unintended consequence emerged from a design assumption — early bags deployed with force calibrated to an unbelted adult male, and for small children and short adults in the front seat that deployment itself became lethal, killing dozens of children in low-speed crashes that were otherwise survivable. Cover the engineering intent, the tragic pattern regulators pieced together in the 1990s, and the corrections — rear-seat guidance for kids, depowered and then smart staged airbags — told with empathy for engineers who saved thousands while a design constant harmed the smallest passengers. Distinct from the seatbelt risk-compensation episode: this is not behavior adapting to safety, it is a safety device meeting a body it was never tuned for. Treat casualty figures as approximate.'
