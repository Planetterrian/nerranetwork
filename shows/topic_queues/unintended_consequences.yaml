- id: the-canadian-residential-school-nutrition
  title: The Canadian Residential School Nutrition Experiments
  brief: 'Mid-twentieth-century federal researchers deliberately withheld vitamins and minerals from children in several residential schools to establish minimum requirements. The controlled malnutrition produced measurable growth stunting and higher tuberculosis rates that persisted after the studies ended. Records released decades later documented the ethical breach and long-term health effects on survivors. The episode underscores how research protocols conducted without consent can embed harm inside ostensibly scientific objectives.


    SOURCE AUDIT (2026-10-11) — where this differs from the brief above, this is right, and any figure not confirmed here is unsourced and must not be used: The experiments are real, documented by Ian Mosby (2013, *Histoire sociale*): 1942–1952, six residential schools (including Alberni, Kenora, Shubenacadie and Lethbridge) and northern Manitoba reserves, about 1,000–1,300 children. Researchers held milk at 8 oz/day instead of the recommended 24, gave supplements to some children and not others, and withheld dental care to observe effects. No source found for the brief''s claims of "measurable growth stunting and higher tuberculosis rates that persisted". Also, this was deliberate harm, not an unintended consequence, so the episode needs an honest framing (e.g. what the studies'' science failed to deliver and what the archives'' release set off).'
