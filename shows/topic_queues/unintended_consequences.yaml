- id: bicycle-helmet-laws-participation
  title: Helmet Laws and the Cyclists Who Stayed Home
  brief: 'Mandatory bicycle-helmet laws were passed to prevent head injuries, and helmets genuinely protect the head that crashes. The unintended consequence showed up in the counting — in jurisdictions like 1990s Australia, cycling participation dropped sharply after mandates, and fewer riders can mean losing the safety-in-numbers effect and the large health benefits of everyday cycling, leaving the population-level ledger genuinely disputed. Cover the honest physics of a helmet, the participation data, the safety-in-numbers evidence, and why bike-friendly countries with the safest cycling often have the fewest helmets — infrastructure, not headgear, dominates. Present the debate fairly: this is a case where an individually sensible precaution and a population-level policy can point in different directions. Treat participation figures as approximate.'
  category: policy
