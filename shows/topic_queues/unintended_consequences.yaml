- id: the-u-s-lead-free
  title: The U.S. Lead-Free Solder Mandate and Tin Whiskers
  brief: 'The 2006 Restriction of Hazardous Substances directive eliminated lead in electronics solder to reduce e-waste toxicity. Tin-based substitutes grew microscopic whiskers that bridged circuits, causing intermittent failures in servers, satellites, and medical devices. Manufacturers added conformal coatings and nickel barriers, raising costs and introducing new failure modes. The substitution showed how removing one material hazard can create reliability problems when the replacement''s physics are incompletely characterized.


    SOURCE AUDIT (2026-10-11) — where this differs from the brief above, this is right, and any figure not confirmed here is unsourced and must not be used: RoHS is an EU directive (in force July 2006), not a US mandate. The US had no federal lead-free solder mandate, though US makers converted because components went lead-free and some US exemptions applied (military, aerospace, medical). Tin whiskers and satellite failures are real (e.g. Galaxy IV, 1998, plus NASA''s failure database). However, those failures largely PREDATE RoHS and involve pure-tin plating, so they cannot illustrate RoHS consequences. Corrected fact: EU RoHS (2006), and post-RoHS whisker risk and mitigation costs (nickel underplate, conformal coat), with the pre-2006 satellite cases explicitly labelled as earlier pure-tin failures.'
