- id: britain-s-1902-importation-of
  title: Britain's 1902 Importation of the Large Copper Butterfly and the Fenland Drain
  brief: 'To restore a butterfly extinct in England, collectors released Dutch Large Coppers into preserved fen habitat. Drainage works intended to improve agriculture lowered water tables and eliminated the host plant, reed sweet-grass, faster than the butterflies could spread. The reintroduction failed within a generation, showing that habitat engineering without concurrent hydrological protection can nullify species-recovery efforts.


