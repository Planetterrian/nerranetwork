- id: seatbelts-peltzman-effect
  title: Safer Cars, Bolder Drivers
  brief: Mandatory seatbelts and airbags cut deaths per crash dramatically — one of public health's genuine wins. Economist Sam Peltzman then noticed something odd in the data - some of the safety gain seemed to be offset by drivers taking more risk once they felt protected, a pattern later seen with anti-lock brakes tested on Munich taxi drivers who braked later and followed closer. Present the evidence carefully - the offsetting effect is real but partial, and belts still save tens of thousands of lives a year. The lesson is risk compensation, not that safety rules fail; engineers now design assuming behavior will adapt.
  category: policy
