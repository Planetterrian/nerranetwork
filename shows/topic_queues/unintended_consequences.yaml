  brief: When the patent on the painkiller diclofenac lapsed in the early 1990s, cheap Indian generics made it affordable for treating cattle, and survey evidence puts the first widespread veterinary use in 1994. Carcasses of treated animals carried residues lethal to Gyps vultures, a link established by Lindsay Oaks and colleagues in Nature in 2004; by 2007 India's oriental white-backed vulture population was estimated at one-thousandth of its early-1990s level. India moved to end veterinary diclofenac in 2006 and strengthened the ban in 2008, but diversion of human doses kept the drug in use. Without vultures, carcasses rotted at dumps, feral dogs multiplied and water was contaminated; Eyal Frank and Anant Sudarshan (American Economic Review, 2024) estimate human death rates rose by more than 4 percent in districts that had been good vulture habitat, about 100,000 extra deaths a year from 2000 to 2005. Treat the mortality figure as one study's estimate from a natural experiment, and cover the rabies pathway, the stubborn illicit trade and what a scavenger is worth.
