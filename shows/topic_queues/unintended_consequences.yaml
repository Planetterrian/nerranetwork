  brief: 'A series of dams on the Euphrates and Tigris intended to generate hydropower and expand irrigation reduced seasonal floods that had sustained Mesopotamian marshes. The marshes shrank by more than 90 percent between the 1970s and 2000s, eliminating fisheries and increasing dust storms in southern Iraq. Downstream communities bore concentrated ecological losses while upstream benefits accrued to different populations. The cascade demonstrates how upstream storage decisions can sever the flood-pulse ecology that downstream wetlands require.


