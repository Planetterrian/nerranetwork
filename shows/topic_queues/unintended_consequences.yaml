- id: india-s-demonetisation-and-the
  title: India's Demonetisation and the Cash That Came Back
  brief: 'On 8 November 2016 Prime Minister Narendra Modi announced that 500- and 1,000-rupee notes, about 86 percent of the currency in circulation by value, would stop being legal tender at midnight, to strike at black money, counterfeits and terror financing. The expectation was that hoarded illicit cash would never be deposited, but the Reserve Bank of India reported in August 2018 that 99.3 percent of the cancelled notes had come back. Most undeclared wealth was never kept as cash, a doubt recorded in the minutes of the RBI''s own board. What did happen was a cash crunch: Gabriel Chodorow-Reich, Gita Gopinath, Prachi Mishra and Abhinav Narayanan estimate employment and night-light output fell about 2 percentage points in late 2016 relative to their expected paths, effects that faded within a few months. Present the government''s case for the gains it claims (digital payments, a wider tax base) beside the evidence, and keep death counts from the queues out of the episode unless an official figure is quoted with its source.'
