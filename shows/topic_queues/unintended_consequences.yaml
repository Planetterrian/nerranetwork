- id: plastic-recycling-myth
  title: The Recycling Symbol That Was Mostly Hope
  brief: The chasing-arrows symbol and municipal recycling programs were meant to close the loop on plastic waste and reassure consumers that packaging had a second life. In practice, most plastic types were never economically recyclable at scale; contamination, oil-price swings, and export of waste to countries that could not process it turned "recyclable" into a marketing claim more than a material cycle. Cover the well-intentioned design, the economics that broke it, the litter and ocean consequences, and the lesson that a comforting label can delay harder choices about reduction and redesign. Treat recycling-rate figures as approximate and contested.
