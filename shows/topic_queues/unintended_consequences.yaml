- id: containerization-port-cities
  title: 'The Shipping Container: Ports That Lost Their Waterfront'
  brief: 'Malcom McLean''s shipping container slashed the cost of moving goods and remade global trade — one of the great logistics breakthroughs of the 20th century. The unintended consequence for port cities was the death of the old waterfront: break-bulk jobs vanished, piers emptied, and the dense dockside neighborhoods that depended on them hollowed out even as national wealth rose. Cover the efficiency miracle, the labor and urban dislocation, the rise of inland megaports, and the lesson that a productivity leap can strand the places and people built around the old method. Treat employment and cost figures as approximate.'
