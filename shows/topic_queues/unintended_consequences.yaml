- id: road-salt-and-the-freshwater
  title: Road Salt and the Freshwater It Salts
  brief: Spreading salt on winter roads began in New Hampshire in the late 1930s and grew with paved surfaces and with drivers' expectation of bare pavement, because it saves lives on icy roads. The chloride does not break down. A 2017 PNAS study by Dugan and colleagues analysed 371 North American lakes and found about 44 percent of those sampled in the Midwest and Northeast were salinising over the long term, with lakes that have even modest pavement near their shores most at risk; roughly 23 million metric tons of sodium-chloride deicer go on North American roads each year. A 2018 PNAS study led by Sujay Kaushal of 232 U.S. Geological Survey river sites found salinisation across about 37 percent of the contiguous U.S. drainage area, with road salt the primary source in the Mid-Atlantic and New England and fertiliser in the Midwest. Cover the effects on aquatic life, lake mixing and corroding pipes, the decades it takes salt to flush out, and the smarter-salting practices that keep roads safe with less.
