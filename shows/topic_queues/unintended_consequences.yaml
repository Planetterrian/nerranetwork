- id: india-s-free-gas-connections-and
  title: India's Free Gas Connections and the Firewood That Stayed
  brief: In May 2016 India launched the Pradhan Mantri Ujjwala Yojana to give poor households, registered in women's names, a free LPG connection so that families would stop cooking over smoky wood and dung fires; the scheme passed 80 million connections in 2019. A connection is not a cooking habit. India's Comptroller and Auditor General found that beneficiaries who had held a connection for a year averaged 3.66 cylinder refills a year as of March 2018, falling to 3.21 by December 2018, and called sustained use a major challenge. In a 2018 survey of almost 5,000 forest-fringe households in central India, 90 percent of LPG-using households still burned firewood as well, a pattern researchers call fuel stacking, driven by refill costs, uneven incomes and fuel that can be gathered for free. Cover the real gains in access, why the refill rather than the connection decides the health outcome, and the audit's separate finding of refills diverted to commercial use.
