- id: the-eastland-lifeboats-that-capsized
  title: 'The Eastland: Lifeboats That Capsized a Ship'
  brief: After the Titanic sank in 1912 with too few lifeboats, the campaign for lifeboats for all produced the La Follette Seamen's Act, signed in March 1915. On 24 July 1915 the Great Lakes steamer Eastland, chartered for a Western Electric company picnic, rolled over at her dock in the Chicago River and 844 people died, more passengers than the Titanic lost. The ship was already top-heavy, with no keel and badly designed ballast tanks, but lifeboats and rafts for the new rules had been added to her upper decks without a stability test, and a shipping executive had warned during the debate that shallow Great Lakes ships could capsize under the extra weight. The historian George Hilton argues the added safety equipment was the final straw, while the grand jury cited overloading, ballast handling and faulty construction. Cover how a rule written for an ocean liner was applied to a lake steamer, the disputed blame, and why the disaster is so little remembered.
