- id: the-energiewende-paradox-more-renewables
  title: 'The Energiewende Paradox: More Renewables, More Lignite'
  brief: 'Germany''s guaranteed feed-in tariffs were meant to decarbonise its power supply, and renewable output did reach record levels. Yet German carbon emissions rose in 2012 and 2013, and lignite generation in 2013 reached its highest level since 1990. The think tank Agora Energiewende named it the Energiewende paradox: cheap renewable power pushed down wholesale prices and squeezed the plants with the highest running costs, which were gas plants, not coal, while falling coal prices and an EU carbon price of around seven euros a tonne left lignite and hard coal the cheapest fossil fuels to burn. Economists disagree on how much the nuclear phase-out added; Agora called it a fuel switch from gas to coal, and the economist Claudia Kemfert called the missing carbon price the core problem. The episode should explain the merit order in plain language and end on 2014, when emissions fell and renewables became the largest source in the power mix for the first time.'
