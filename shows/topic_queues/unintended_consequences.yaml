- id: tall-smokestacks-and-the-acid
  title: Tall Smokestacks and the Acid Rain They Exported
  brief: 'In the early 1970s the fix for choking local air was height. Inco''s Superstack at its Sudbury, Ontario nickel smelter, 381 metres tall and in full operation in 1972, carried sulphur dioxide high enough for the prevailing winds to take it past the city, and in the United States power plants built tall stacks to cut ground-level concentrations and meet the new national air standards; the GAO counts only two U.S. stacks over 500 feet in 1970 and more than 180 by 1985. Ground-level pollution near the sources fell, but the emissions did not go away: they travelled to other provinces and states, and as acid rain strained relations between Canada and the United States, American officials cited Inco as North America''s largest sulphur dioxide emitter. Congress barred stack height above good engineering practice from counting toward emission limits in 1977, and Ontario''s Countdown Acid Rain programme in 1985 ordered Inco and other major emitters to cut emissions by more than 60 percent. Cover the slogan of the era, dilution is the solution to pollution, Sudbury''s own regreening, and the GAO''s caution that stack height is only one factor in how far pollution travels.'
