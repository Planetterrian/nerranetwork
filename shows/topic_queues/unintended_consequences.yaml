- id: student-loans-tuition-inflation
  title: Easy Loans, Expensive Degrees
  brief: 'Subsidized student loans were built to open college to everyone regardless of family wealth — and enrollment did surge. The unintended consequence, argued over as the Bennett hypothesis, is that guaranteed credit may have helped tuition itself inflate: when every student can borrow more, institutions face little pressure to hold prices, and research finds a meaningful share of expanded loan limits passing through to higher sticker prices. Cover the access victory honestly, the evidence for and against pass-through (this one is genuinely contested — present both sides), the debt overhang a generation carries, and the lesson that subsidizing demand for something supply-constrained can feed the price you were trying to make affordable. Treat pass-through estimates as approximate and contested.'
  category: economics
  produced: true
  episode_number: 88
  produced_date: '2026-08-13'
- id: esa-shoot-shovel-shutup
  title: Shoot, Shovel, and Shut Up
  brief: The Endangered Species Act made it costly to have a listed species on your land - development limits, logging restrictions, federal oversight. Some landowners responded by quietly destroying habitat BEFORE a species could be found, or preemptively clearing timber near red-cockaded woodpecker colonies, a pattern economists documented in North Carolina pine forests. The act still has real recoveries to its name (bald eagle, gray whale). Cover both, plus the fix that grew from the lesson - safe-harbor agreements that reward rather than punish landowners who host rare species, turning the incentive right-side up.
  category: policy
  produced: true
  episode_number: 89
