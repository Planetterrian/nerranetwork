- id: biometric-surveillance-mission-creep
  title: 'Face Recognition: From Airports to Everywhere'
  brief: 'Biometric ID systems were sold first as convenience and security at borders and phones — unlock faster, catch the right person. Once the infrastructure existed, mission creep followed: stadiums, schools, retail, protest monitoring, and databases that outlast the original use case. Cover the genuine security wins, the false-match and bias failures, the difficulty of consent when the camera is ambient, and the lesson that a capability built for a narrow high-stakes context rarely stays there. Treat accuracy claims as contested and figures approximate.'
