- id: mtbe-oxygenate-groundwater
  title: 'Cleaner Air, Poisoned Wells: The MTBE Story'
  brief: 'To cut smog, US clean-air rules pushed refiners toward oxygenated gasoline, and MTBE became the additive of choice — cheap, effective at reducing tailpipe emissions, blended into a third of the nation''s fuel. The unintended consequence traveled underground: MTBE is highly water-soluble and resists breaking down, so every leaking storage tank became a plume, and a turpentine taste made water undrinkable at tiny concentrations. Cover the air-quality win, the groundwater contamination that closed wells across California and beyond, the state bans and the billion-dollar cleanups, and the lesson that a substance can be evaluated for the medium it is meant to fix while its failure mode lives in another one entirely. Treat contamination and cost figures as approximate.'
  category: policy
