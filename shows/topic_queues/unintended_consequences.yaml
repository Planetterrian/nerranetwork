- id: the-polio-vaccine-switch-and
  title: The Polio Vaccine Switch and the Type 2 Outbreaks
  brief: 'The oral polio vaccine contains a weakened live virus; it has helped cut wild polio cases by more than 99 percent since 1988, but where too few children are immunised the excreted vaccine virus can keep circulating, mutate and regain the ability to paralyse. Wild type 2 poliovirus was certified eradicated in 2015, and most vaccine-derived outbreaks were type 2, so in April 2016 every country using the oral vaccine switched at once to a version without the type 2 strain. The CDC''s surveillance reports show what followed: children born after the switch had no type 2 immunity, outbreak responses with a monovalent type 2 vaccine sometimes seeded new emergences, and reported vaccine-derived outbreaks rose from nine in January 2017 to June 2018 to 29 in January 2018 to June 2019, 86 percent of them type 2. A genetically stabilised vaccine, novel OPV2, was developed in response. The episode must be clear that vaccine-derived polio arises only in under-immunised communities and that the remedy is more vaccination, not less.'
