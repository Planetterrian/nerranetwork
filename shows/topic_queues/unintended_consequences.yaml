- id: fire-suppression-megafires
  title: 'Putting Out Every Fire: How Suppression Built Megafires'
  brief: 'For most of the 20th century, US forest policy treated every wildfire as an enemy to extinguish by 10 a.m. the next day — a heroic, intuitive goal that saved timber and towns in the short run. The unintended consequence was a century of fuel buildup: dense understory, closed canopies, and forests that now burn hotter and farther when they finally ignite. Cover the Smokey Bear era, Indigenous burning practices that were suppressed along with the fires, the modern prescribed-burn and managed-fire turn, and the lesson that removing a natural disturbance regime can make the next disturbance catastrophic. Treat acreage and cost figures as approximate.'
