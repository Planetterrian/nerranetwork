- id: the-nile-perch-in-lake
  title: The Nile Perch in Lake Victoria
  brief: Ugandan and Kenyan fisheries authorities stocked Lake Victoria with Nile perch in the 1950s to create an export fishery. The large predator rapidly eliminated dozens of native cichlid species that had maintained the lake's water clarity through algae grazing. The resulting algal blooms and oxygen crashes turned large parts of the lake into seasonal dead zones, while the new fishery concentrated benefits among a few large boat owners.
