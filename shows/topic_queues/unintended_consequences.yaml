  brief: 'Cockpit automation made flying dramatically safer — autopilots and flight envelopes canceled whole categories of human error. The unintended consequence was quieter: with the machine flying nearly every hour, some manual skills and mental models atrophied, and when the automation handed a confused airplane back to its crew — as in the Air France 447 stall — pilots could be startled into errors the automation was built to prevent. Cover the enormous net safety win first and honestly, then the "children of the magenta line" problem, the industry''s response of upset-recovery training and deliberate hand-flying, and the lesson that automating a task changes the human who supervises it. Distinct from the GPS navigation episode: same species of skill fade, but here the stakes and the institutional correction are aviation-grade. Treat accident details as documented findings, not blame.'
