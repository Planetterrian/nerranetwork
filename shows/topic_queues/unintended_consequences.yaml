- id: invasive-lionfish-aquarium
  title: 'Lionfish: The Aquarium Escape That Ate the Reef'
  brief: Beautiful, venomous Indo-Pacific lionfish became popular aquarium pets, and by the 1980s some had entered Atlantic and Caribbean waters — likely released by owners or escaped during storms. With no natural predators in the new range and a voracious appetite, they spread explosively, devastating native reef-fish populations across the southeastern US, Gulf, and Caribbean. Cover how a harmless-seeming pet trade seeded an ecological invasion, the failure of the new ecosystem to recognize the predator, the creative human responses (lionfish derbies, restaurant demand), and the lesson that a self-reproducing organism released into a naive ecosystem is nearly impossible to recall. Treat figures as approximate.
  category: classic
