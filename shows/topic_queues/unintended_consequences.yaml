- id: vaping-gateway-or-harm-reduction
  title: 'Vaping: Harm Reduction That Recruited a Generation'
  brief: 'E-cigarettes were promoted as a less-harmful alternative for adult smokers — a harm-reduction tool with real potential to cut combustible-tobacco deaths. The unintended consequence was a youth vaping wave: flavored products, social media marketing, and nicotine delivery systems that hooked people who never would have smoked. Cover the adult-smoker evidence, the youth epidemic and regulatory scramble, the contested "gateway" debate, and the lesson that a product optimized for one population can be catastrophically attractive to another. Treat prevalence and relative-risk figures as approximate and contested.'
