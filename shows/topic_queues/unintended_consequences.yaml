- id: fire-suppression-megafires
  title: 'Putting Out Every Fire: How Suppression Built Megafires'
  brief: 'For most of the 20th century, US forest policy treated every wildfire as an enemy to extinguish by 10 a.m. the next day — a heroic, intuitive goal that saved timber and towns in the short run. The unintended consequence was a century of fuel buildup: dense understory, closed canopies, and forests that now burn hotter and farther when they finally ignite. Cover the Smokey Bear era, Indigenous burning practices that were suppressed along with the fires, the modern prescribed-burn and managed-fire turn, and the lesson that removing a natural disturbance regime can make the next disturbance catastrophic. Treat acreage and cost figures as approximate.'
  category: classic
  produced: true
  episode_number: 84
  produced_date: '2026-08-09'
- id: plastic-recycling-myth
  title: The Recycling Symbol That Was Mostly Hope
  brief: The chasing-arrows symbol and municipal recycling programs were meant to close the loop on plastic waste and reassure consumers that packaging had a second life. In practice, most plastic types were never economically recyclable at scale; contamination, oil-price swings, and export of waste to countries that could not process it turned "recyclable" into a marketing claim more than a material cycle. Cover the well-intentioned design, the economics that broke it, the litter and ocean consequences, and the lesson that a comforting label can delay harder choices about reduction and redesign. Treat recycling-rate figures as approximate and contested.
  category: economics
