- id: no-child-left-behind-teaching-to-test
  title: 'No Child Left Behind: When the Scoreboard Ate the Curriculum'
  brief: 'The 2001 No Child Left Behind Act aimed to close achievement gaps by measuring every school and holding them accountable — a civil-rights-framed push for transparency. The unintended consequence was teaching to the test: narrowed curricula, time stolen from science and arts, gaming of subgroups, and in extreme cases cheating scandals. Cover the equity goal, the measurement design, the behavioral response of schools under high stakes, and the lesson that what you measure intensely becomes what the system produces — sometimes at the expense of what you actually valued. Treat NAEP and proficiency figures as approximate.'
