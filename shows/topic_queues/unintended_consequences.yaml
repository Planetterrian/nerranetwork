- id: ban-the-box-and-the
  title: Ban the Box and the Applicants Who Paid for It
  brief: 'Ban-the-box laws, adopted by many U.S. cities and states, stop employers asking about criminal records on the initial job application, so that people with convictions can get as far as an interview. In a field experiment published in the Quarterly Journal of Economics in 2018, Amanda Agan and Sonja Starr sent about 15,000 fictitious applications in New Jersey and New York City before and after the laws took effect: records were a large barrier, but at employers that removed the question, the callback gap between otherwise identical white and Black applicants grew from about 7 percent to 43 percent. The economists Doleac and Hansen, using Current Population Survey data, found the policies lowered employment among young Black men without college degrees. Both papers read it as statistical discrimination: with the record hidden, some employers guessed from race. Starr herself says this is not necessarily an indictment of the policy, so the episode should present the evidence, the debate and the alternatives the researchers suggest rather than a verdict.'
