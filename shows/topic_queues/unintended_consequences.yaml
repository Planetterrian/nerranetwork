  brief: 'Wolves returned to south-central Sweden after a 1990s protection regime. Moose densities fell in wolf territories, cutting moose-vehicle collisions by roughly 20 percent on treated roads. The reduction occurred without changes in traffic volume or fencing, showing how apex-predator recovery can produce measurable road-safety co-benefits.


