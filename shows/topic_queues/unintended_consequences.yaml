- id: microcredit-overindebtedness
  title: 'Microcredit: When Small Loans Grew Heavy'
  brief: 'Microcredit — tiny loans to poor entrepreneurs, popularized by Muhammad Yunus and Grameen Bank — won a Nobel Peace Prize and was hailed as a market-based cure for poverty. The unintended consequences emerged as the model scaled and commercialized: in places like Andhra Pradesh, aggressive lending and collection led to over-indebtedness and a wave of borrower distress, while rigorous studies found the poverty-reduction effects were more modest than the early hype promised. Cover the genuine promise and the real successes, the shift from nonprofit to profit-seeking lenders, the debt crises, the sobering randomized evaluations, and the lesson that a tool that helps at small scale can harm when scaled and re-incentivized. Treat findings as contested and figures approximate.'
