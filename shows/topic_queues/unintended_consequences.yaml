- id: rent-control-housing-supply
  title: 'Rent Control: The Ceiling That Raised the Floor'
  brief: 'Rent control was designed to protect tenants from sudden rent spikes and displacement — a clear equity goal that still polls well. Economists across the spectrum have documented the second-order effects: landlords convert units, stop maintaining them, or exit the rental market; new construction slows in controlled jurisdictions; and the beneficiaries are often long-tenure tenants rather than the poorest newcomers. Cover the original injustice of rent shocks, the specific designs (NYC, San Francisco, Stockholm), the contested evidence on who gains and who loses, and the lesson that capping a price without expanding supply reallocates scarcity rather than curing it. Treat findings as contested and figures approximate.'
