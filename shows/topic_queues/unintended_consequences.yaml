- id: hospital-readmission-penalties
  title: 'The Readmission Penalty: Managing the Metric'
  brief: 'Medicare began penalizing hospitals whose patients bounced back within thirty days — a well-intended push to reward care that actually sticks. The unintended consequences lived in the measurement: some hospitals held returning patients under observation status so the visit never counted as a readmission, and researchers still debate whether heart-failure mortality ticked up as the incentive discouraged some readmissions that patients needed. Cover the genuine problem of revolving-door care, the gaming of the boundary, the contested mortality studies (present the dispute honestly), and the lesson that when a measure becomes a target, the first thing optimized is the measure — with empathy for clinicians navigating both the metric and the patient. Treat effect sizes as approximate and contested.'
