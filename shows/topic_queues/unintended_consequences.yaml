- id: the-british-window-tax-and
  title: The British Window Tax and Indoor Air Quality
  brief: Parliament taxed houses by the number of windows to approximate wealth without counting rooms. Owners responded by bricking up openings or designing new homes with fewer windows to stay under thresholds. The resulting darker, less ventilated dwellings increased damp and respiratory illness among residents who could least afford the tax.
