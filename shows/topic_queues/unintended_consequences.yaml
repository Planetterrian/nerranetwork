- id: jones-act-shipping
  title: The Jones Act's Empty Harbors
  brief: The 1920 Jones Act required goods shipped between US ports to travel on American-built, American-crewed ships, meant to guarantee a strong merchant marine for wartime. A century later the protected fleet has shrunk to a few dozen aging vessels, domestic sea shipping is so expensive that cargo moves by truck instead, and Puerto Rico and Hawaii pay measurably more for basics. Cover the national-security intent honestly, the fleet the law was meant to protect withering under protection, and the lesson that shielding an industry from all competition can hollow out the very capability you wanted to preserve.
  category: economics
  produced: true
  episode_number: 90
  produced_date: '2026-08-15'
- id: france-s-35-hour-work
  title: France's 35-Hour Work Week and the Overtime Shift
  brief: In 2000 France capped the statutory work week at 35 hours to spread employment. Firms responded by reclassifying hours, expanding overtime exemptions, and hiring temporary contract workers. Total hours worked per employee remained largely unchanged while wage inequality between permanent and contingent staff widened. The episode illustrates how rigid hour caps are arbitraged through contract redesign.
  category: policy
  produced: true
  episode_number: 91
  produced_date: '2026-08-16'
- id: sugar-quotas-hfcs
  title: The Sugar Wall and the Corn Syrup Flood
  brief: US sugar tariffs and import quotas, built to protect domestic cane and beet growers, held American sugar prices at roughly double the world price for decades. Food manufacturers responded by switching to a cheaper sweetener the quotas didn't cover - high-fructose corn syrup, made abundant by corn subsidies pushing from the other side. By the 1980s HFCS had displaced sugar in most American soft drinks while candy factories moved abroad to buy world-price sugar. Cover the two policies pushing in opposite directions, and the lesson that protecting one ingredient can redesign an entire food supply around its substitute.
  category: economics
  produced: true
  episode_number: 92
  produced_date: '2026-08-17'
- id: switzerland-s-nuclear-phase-out
  title: Switzerland's Nuclear Phase-Out and the Coal Rebound
  brief: After the 2017 referendum to retire nuclear plants, Switzerland increased electricity imports from German coal-fired generation. Grid operators documented a measurable rise in carbon intensity during winter peaks. The phase-out timeline had not included firm low-carbon replacement capacity. The episode demonstrates how firm decarbonization targets can be met on paper while shifting emissions across borders.
  category: policy
  produced: true
  episode_number: 93
  produced_date: '2026-08-18'
- id: furniture-flame-retardants
  title: The Couch That Was Supposed to Stop Burning
  brief: 'California''s 1975 furniture flammability standard pushed manufacturers to soak foam in chemical flame retardants, and because no one makes a couch for one state, it quietly set the standard for a continent. The unintended consequence unfolded over decades: the chemicals migrated out of the foam into household dust and bloodstreams — showing up in children and wildlife — while fire-safety testing later suggested the retardants added little real-world protection against furniture fires, and firefighters faced more toxic smoke. Cover the earnest fire-safety intent, the chemistry that would not stay put, the 2013 rewrite that allowed retardant-free compliance, and the lesson that a standard written for one hazard can create a slower, quieter one — with empathy for regulators acting on the fire deaths in front of them. Treat exposure figures as approximate.'
  category: classic
  produced: true
  episode_number: 94
  produced_date: '2026-08-19'
- id: the-japanese-whaling-moratorium-and
  title: The Japanese Whaling Moratorium and the Minke Harvest Spike
  brief: After the 1986 IWC commercial moratorium, Japan shifted its Antarctic quota to "scientific" permits targeting minke whales previously spared by size limits. Annual minke takes rose from near zero to several hundred, documented in IWC catch reports. The policy change redirected rather than reduced total cetacean removals. It shows how species-specific protections can intensify pressure on substitute populations.
  category: policy
  produced: true
  episode_number: 95
  produced_date: '2026-08-20'
- id: deposit-insurance-moral-hazard
  title: The Safety Net That Fed the Fire
  brief: Federal deposit insurance, born in 1933, ended the bank runs that had destroyed thousands of banks - depositors no longer needed to stampede at the first rumor. But insured depositors also stopped caring how risky their bank was, and in the 1980s savings-and-loan crisis, thrifts gambled on junk bonds and speculative real estate with government-guaranteed money while depositors chased the highest rate, no questions asked. The cleanup cost taxpayers over a hundred billion dollars. Cover the genuine stability win, the moral hazard that grew inside it, and the countermeasures - risk-based premiums and prompt corrective action - that try to price the gamble back in.
  category: economics
  produced: true
  episode_number: 96
  produced_date: '2026-08-21'
- id: norway-s-electric-vehicle-incentives
  title: Norway's Electric-Vehicle Incentives and the Used-Gasoline Export
  brief: Generous Norwegian EV purchase subsidies accelerated fleet turnover; older gasoline cars were exported in rising volumes to Eastern Europe. Fleet data showed that the exported vehicles had higher average emissions than the Norwegian fleet average before the policy. The net European emissions reduction was smaller than domestic figures suggested. The mechanism was accelerated vintage transfer across regulatory borders.
  category: policy
  produced: true
  episode_number: 97
  produced_date: '2026-08-22'
- id: hfc-replacement-super-greenhouse
  title: The Ozone Fix With a Thermostat Problem
  brief: When the Montreal Protocol phased out CFCs to heal the ozone layer - environmental policy's biggest win - industry replaced them with hydrofluorocarbons. HFCs are harmless to ozone, which was the goal, but they turned out to be greenhouse gases hundreds to thousands of times more potent than CO2, and air conditioning was booming worldwide. The world had traded an ozone crisis for a climate accelerant. Cover the genuinely successful original fix, the blind spot in evaluating replacements on only one axis, and the 2016 Kigali Amendment that now phases down the replacement itself - a rare case of a treaty debugging its own unintended consequence.
  category: classic
  produced: true
  episode_number: 98
  produced_date: '2026-08-23'
- id: brazil-s-ethanol-mandate-and
  title: Brazil's Ethanol Mandate and the Soybean Frontier
  brief: In the 1970s Brazil subsidized sugarcane ethanol to reduce oil imports and support domestic agriculture. Rising ethanol demand pushed sugarcane into prime pasture, displacing cattle ranchers northward into the Amazon where they cleared forest for new grazing. Deforestation rates accelerated in the 2000s even as ethanol production met its energy goals. The mechanism was an indirect land-use cascade rather than direct feedstock expansion.
  category: economics
  produced: true
  episode_number: 99
  produced_date: '2026-08-27'
- id: the-dutch-bicycle-subsidies-and
  title: The Dutch Bicycle Subsidies and the Helmet Gap
  brief: Generous Dutch commuter subsidies increased bicycle commuting kilometers by more than 40 percent between 1990 and 2010. Because helmet use remained low under the prevailing safety culture, absolute numbers of head-injury hospitalizations rose even as injury rates per kilometer fell. Planners had optimized for modal shift without adjusting protective norms. The outcome reveals that infrastructure incentives can change exposure volume faster than safety equipment adoption.
