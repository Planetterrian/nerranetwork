- id: transistor-integrated-circuit
  title: 'The Integrated Circuit: A Billion Switches for the Price of Sand'
  brief: 'Concrete example (historical/modern). Early computing was built from discrete components wired by hand, so the cost and reliability of a machine were dominated by the number of connections a human had to make. Reasoning from the real constraint, engineers put many transistors on a single sliver of silicon — the integrated circuit — so that adding complexity became a printing problem, not an assembly problem. Trace how that reframing launched the decades-long cost collapse later summarized as Moore''s law: cost per transistor falling by a staggering factor as the same photolithographic process printed ever more devices per wafer. The material is refined sand; the Idiot Index lived in interconnection and precision. Use it to teach that when a cost is dominated by per-unit hand labor, finding a way to PRINT the units instead resets everything. Hedge the figures.'
