  title: 'Canning: Buying Time Against Spoilage'
  brief: 'Concrete example (historical). Before reliable food preservation, feeding an army or a city out of season was ruinously expensive because most food rotted — the binding constraint was time, not the food itself, which was cheap in harvest season. Reasoning that spoilage was caused by something that heat could destroy, Nicolas Appert won a French prize for sealing cooked food in glass and heating it, decades before Pasteur explained why microbes were the culprit. Trace how canning (and the tin can that followed) collapsed the effective cost of out-of-season and long-distance food by attacking the spoilage term, reshaping military logistics, cities, and trade. The food barely changed; conquering time was the leap — and, honestly, they got the mechanism right by trial and error before the science existed. Lesson: you can attack the true constraint before you fully understand it, but knowing WHY makes the fix robust. Hedge the figures.'
