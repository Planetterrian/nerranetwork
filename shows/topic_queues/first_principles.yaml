- id: debut-raptor-and-opportunity
  title: 'The Magic Wand Number: Raptor, and the Industry That Forgot It'
  brief: 'Series premiere. Introduce the show and its two tools — the "magic wand number" (what a thing would cost if you only paid for its raw materials) and the "Idiot Index" (how many times more the finished part costs than the materials inside it), using the well-known story of a rocket part that cost far more than the metal in it. Worked example one (concrete): the development path of SpaceX''s Raptor engine — the full-flow staged-combustion cycle burning methane and liquid oxygen, and the drive across versions to slash part count, mass, and cost per engine by reasoning from physics rather than copying legacy engine designs. Worked example two (opportunity): housing and construction, a high-Idiot-Index industry where the finished cost of a home vastly exceeds the raw materials, held up by fragmented trades, on-site hand assembly, permitting, and land — and where a from-scratch, factory-built approach could compress cost toward the material floor.'
  category: debut
  produced: true
  episode_number: 1
  produced_date: '2026-06-07'
- id: tesla-gigacasting
  title: 'Tesla Gigacasting: Replacing Dozens of Parts With One'
  brief: 'Concrete example. Conventional car bodies are assembled from dozens or hundreds of stamped and welded steel parts, each needing tooling, fixtures, robots, and labor. Tesla asked what physics actually required and moved to "gigacasting" — casting large sections of the underbody as single aluminum pieces on enormous high-pressure die-casting machines. Trace the first-principles reasoning: the old approach''s Idiot Index was driven by assembly complexity, not material; collapsing many parts into one cuts tooling, robots, floor space, and weld points. Cover the trade-offs honestly — repairability, alloy development, and casting-machine scale.'
  category: concrete_example
  produced: false
  episode_number: null
  produced_date: null
- id: water-desalination
  title: 'Desalination: Why Fresh Water Costs More Than Physics Demands'
  brief: Opportunity area. There is a hard thermodynamic floor to the energy needed to separate salt from seawater (the minimum energy of separation), and modern reverse-osmosis plants already operate within a few times of it — but the delivered cost of desalinated water is still dominated by capital cost, energy, pre-treatment, and brine disposal rather than the membranes themselves. Reason about the magic-wand floor (the theoretical minimum energy) versus the finished cost, locate where the Idiot Index actually lives, and lay out where a from-scratch redesign — energy recovery, modular plants, cheaper clean power, brine handling — could push cost toward the floor. Flag every figure as approximate.
  category: opportunity_area
  produced: false
  episode_number: null
  produced_date: null
- id: starlink-user-terminal
  title: 'The Starlink Dish: Phased Arrays at Consumer Prices'
  brief: Concrete example. Military-grade phased-array antennas historically cost a fortune, which "by analogy" should have made a home satellite-internet dish wildly expensive. Starlink instead targeted a mass-manufacturable flat user terminal. Trace the first-principles push to drive the terminal's cost down through integration and volume manufacturing — reportedly subsidized early on, with cost falling over successive hardware revisions. Use it to show how a high starting Idiot Index in a low-volume specialty product collapses when you redesign for mass production. Keep cost figures clearly approximate.
  category: concrete_example
  produced: false
  episode_number: null
  produced_date: null
- id: advanced-nuclear-smr
  title: 'Nuclear Power: A High Idiot Index Hiding in Plain Sight'
  brief: 'Opportunity area. The raw materials in a nuclear plant — steel, concrete, fuel — are a small fraction of the finished cost; the price is dominated by bespoke on-site construction, first-of-a-kind engineering, financing, and regulatory overhead. Reason about the magic-wand floor versus delivered cost, and why the Idiot Index is so high. Examine the first-principles case for small modular reactors and factory-built, repeatable designs — learning-curve effects, standardization, and series production — alongside the honest hard parts: regulation, public trust, and supply chains. Hedge all numbers.'
  category: opportunity_area
  produced: false
  episode_number: null
  produced_date: null
- id: tesla-4680-dry-electrode
  title: The 4680 Cell and the Dry Electrode Bet
  brief: 'Concrete example. Conventional battery-electrode manufacturing coats slurry onto foil and then bakes off the solvent in long, energy-hungry drying ovens — a step that adds enormous capital cost and factory footprint. The dry-electrode approach (from Tesla''s Maxwell acquisition) asks whether the solvent and the ovens are even necessary. Trace the first-principles reasoning behind the larger 4680 cell format and dry coating: fewer process steps, less factory, lower cost per kilowatt-hour — and be candid about how hard the manufacturing ramp has been. Keep figures approximate.'
  category: concrete_example
  produced: false
  episode_number: null
  produced_date: null
- id: green-ammonia-fertilizer
  title: 'Fertilizer From Air: The Haber-Bosch Idiot Index'
  brief: 'Opportunity area. Synthetic ammonia for fertilizer is made by the century-old Haber-Bosch process, whose inputs are essentially nitrogen from the air and hydrogen — today mostly from natural gas, which is why cost and carbon track fossil prices. Reason about the magic-wand floor (the chemistry''s minimum energy) versus delivered cost, and where the gap lives: high-temperature, high-pressure centralized plants and fossil hydrogen. Examine the first-principles opportunity of cheap clean hydrogen and smaller, distributed synthesis, with honest treatment of the energy and catalysis challenges. Hedge every estimate.'
  category: opportunity_area
  produced: false
  episode_number: null
  produced_date: null
- id: falcon9-reusability
  title: 'Reusing the Rocket: Cost Per Kilogram From First Principles'
  brief: 'Concrete example. For decades launch providers threw the rocket away every flight, treating expendability as a given — so cost per kilogram to orbit barely moved. SpaceX asked what physics actually required and pursued booster reuse: landing and reflying the first stage. Trace the first-principles reasoning that reuse, not bigger subsidies, was the lever to drive cost per kilogram down, and how refurbishment cost is the real variable. Use it to contrast reasoning from physics versus reasoning by analogy. Keep all cost-per-kilogram figures clearly approximate.'
  category: concrete_example
  produced: false
  episode_number: null
  produced_date: null
- id: healthcare-diagnostics
  title: 'Blood Tests: When the Reagents Cost Pennies'
  brief: Opportunity area. Many common lab diagnostics use tiny quantities of inexpensive reagents, yet the billed price can be enormous — a textbook high Idiot Index, where the cost lives in instruments, labor, billing, intermediaries, and regulation rather than materials. Reason carefully about the magic-wand floor (reagent and sample cost) versus delivered price, and where the gap actually sits. Examine the first-principles opportunity of automation, point-of-care devices, and transparent pricing — while being honest about why healthcare cost is uniquely sticky (safety, liability, reimbursement). Hedge all numbers and avoid singling out any company.
  category: opportunity_area
  produced: false
  episode_number: null
  produced_date: null
- id: tesla-fsd-vision-only
  title: 'Removing the Sensors: Tesla''s Vision-Only Bet'
  brief: 'Concrete example. The autonomy industry assumed, by analogy, that self-driving needed expensive lidar plus radar plus cameras. Tesla made the contested first-principles argument that the roads are designed for human eyes, so a vision-and-compute system should be sufficient — and removed radar and ultrasonic sensors from its cars. Trace the reasoning (cost, supply-chain simplicity, and the bet that neural networks can extract depth from images) and treat the controversy honestly: many experts disagree, and the safety case is still being argued. This is a clean example of questioning a requirement before optimizing a part.'
  category: concrete_example
  produced: false
  episode_number: null
  produced_date: null
- id: grid-transmission
  title: 'Power Lines: The Cheap Metal and the Expensive Permit'
  brief: 'Opportunity area. The raw materials of a transmission line — aluminum conductor, steel towers — are a modest fraction of a project''s cost; the price and the decade-long timelines are dominated by permitting, right-of-way, interconnection queues, and bespoke engineering. Reason about the magic-wand floor versus delivered cost and where the Idiot Index really lives (process, not metal). Examine the first-principles opportunity: standardized designs, advanced conductors, grid-enhancing technologies, and permitting reform — with honest treatment of why these are political as much as technical. Hedge all figures.'
  category: opportunity_area
  produced: false
  episode_number: null
  produced_date: null
- id: optimus-actuators
  title: 'Optimus: Designing the Robot Joint From Scratch'
  brief: Concrete example. Off-the-shelf industrial robot actuators are precision, low-volume, and expensive — so building a humanoid robot "by analogy" from existing parts would be cost-prohibitive at scale. Tesla's approach with Optimus was to design custom actuators and integrate motors, gearing, sensors, and control as a high-volume automotive-style part. Trace the first-principles reasoning that designing for mass manufacturing, rather than buying specialty components, is what could move a humanoid robot from a lab curiosity toward an affordable product. Be candid that this is early and unproven, and keep figures approximate.
  category: concrete_example
  produced: false
  episode_number: null
  produced_date: null
- id: carbon-capture
  title: 'Pulling Carbon From Air: A Thermodynamic Floor and a Long Way to Go'
  brief: Opportunity area. Direct air capture has a real thermodynamic minimum energy to separate dilute carbon dioxide from the atmosphere, but today's delivered cost per ton sits far above any material floor, dominated by energy, sorbents, and capital. Reason about the magic-wand floor (minimum separation energy) versus current cost, and where the enormous Idiot Index lives. Examine the first-principles opportunity — cheaper clean energy, better sorbents, scale and learning curves — while being rigorously honest that the gap is large and the physics is genuinely hard. Hedge every estimate and avoid hype.
  category: opportunity_area
  produced: false
  episode_number: null
  produced_date: null
