- id: watchmaking-quartz-crisis
  title: 'The Quartz Crisis: When a Chip Beat the Craft'
  brief: 'Concrete example (historical/modern). For centuries a precise watch was a triumph of mechanical craft — hundreds of hand-finished parts, and the price tracked the labor-hours of skilled watchmakers, not the brass and steel inside. Then engineers reasoned from the real job (count time accurately) to a different mechanism entirely: a quartz crystal vibrating at a fixed frequency, driven by a cheap integrated circuit. The magic-wand floor of "knowing the time" collapsed toward pennies of electronics, and through the 1970s the price of an accurate watch fell by orders of magnitude while accuracy improved. Trace how attacking the FUNCTION rather than optimizing the old mechanism gutted the Swiss industry (and how it later survived by selling craft as luxury, not timekeeping). Lesson: when the Idiot Index lives in labor-hours, a mechanism that needs no craft resets the whole floor. Hedge the figures.'
