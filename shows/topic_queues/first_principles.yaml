- id: cotton-gin-textiles
  title: 'The Cotton Gin: One Machine, One Bottleneck'
  brief: 'Concrete example (historical). Raw cotton was cheap to grow but nearly worthless at scale because separating the sticky seeds from the fiber was punishing hand labor — the binding constraint was one slow step, not the plant. Eli Whitney''s gin mechanized exactly that step, and the throughput of cleaned cotton jumped by a large multiple almost overnight, collapsing the cost of the raw material for the mills. Trace the first-principles move of attacking the single dominant labor term, how it rippled downstream into cheap cloth, and — honestly — the dark unintended consequence that cheap-to-process cotton entrenched slavery rather than easing it. Lesson: find the one step that dominates the cost and mechanize THAT; also, a cost breakthrough is morally neutral and its second-order effects can be catastrophic. Hedge the figures.'
