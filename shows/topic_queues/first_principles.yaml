- id: catalytic-converter-materials
  title: 'The Catalytic Converter: Pennies of Metal, Priced by Scarcity'
  brief: 'Concrete example (modern). A catalytic converter cleans exhaust using a whisper-thin coating of platinum, palladium, and rhodium on a ceramic honeycomb — grams of metal, yet those grams can dominate the part''s cost because the metals themselves are genuinely scarce and volatile in price. Unlike most episodes, the magic-wand floor here is set partly by real material scarcity, not just process: reason carefully about that distinction and where engineering still moved the needle (thrifting the loadings down over decades, better washcoats, higher surface area so less metal does the same work). Cover the honest twist that scarcity created a theft economy for converters. Lesson: when the Idiot Index is genuinely materials-bound, the first-principles lever is using LESS of the scarce thing per unit of function, not pretending the floor is zero. Hedge the figures.'
