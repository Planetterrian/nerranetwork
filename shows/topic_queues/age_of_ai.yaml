# The Age of AI — production queue of COMPILED interview packets.
#
# Do not hand-author entries here: `scripts/age_of_ai_guests.py compile <id>`
# builds each packet from a consented, answered guest record in
# shows/guest_queues/age_of_ai.yaml (the consent gate lives in
# engine/interview.py, not in prompts). Standard narrative-queue schema
# (id / title / brief / produced / episode_number / produced_date) plus
# interview extras (guest_id / voice_mode / guest_voice_id).
#
# An empty queue is the normal resting state: the show cleanly skips
# (`narrative_queue_empty`) until the next interview is ready.

queue: []
