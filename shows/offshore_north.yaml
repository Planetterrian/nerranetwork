  summaries_html: offshore-north-summaries.html
  # RSS + site page only at launch (operator decision).
  x_enabled: false
  x_env_prefix: ""
  host_name: Dan

episode:
  prefix: Offshore_North
  filename_pattern: "{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3"
  output_dir: digests/offshore_north
  mp3_glob: "Offshore_North_Ep*.mp3"

chapters:
  enabled: true
  # Network chapter lessons baked in at launch:
  #  - positional `where` anchors on Introduction and Sign-Off (the
  #    Tesla/EI/PT orphan-chapter class);
  #  - Sign-Off listed BEFORE the body markers (EI June-11 ordering rule);
  #  - every announce-anchored marker uses the exact phrasings the podcast
  #    prompt REQUIRES the host to speak, so a passing mention earlier in
  #    the episode cannot steal the marker (dp_pod Ep001 "The Lever" bug).
  section_markers:
    # The Introduction pattern must cover EVERY greeting variant in
    # engine/intros.py::_SHOW_PERSONALITIES['offshore_north']['greetings'].
    # Caught at install: "Thanks for tuning in to" was missing, which would
    # have shipped ~1 episode in 5 with no Introduction chapter (the EI
    # June-17 orphan-chapter class). Add here whenever a greeting is added.
    # Ep001 (2026-08-05) shipped with NO Introduction chapter. The supplied
    # intro line is "This is Offshore North, episode 1." and this pattern
    # matched it exactly — but the LLM ignored the copy-verbatim rule and
    # wrote "Welcome to the very first episode of Offshore North! Today is
    # August fifth, twenty twenty-six." The greeting and the show name were
    # both present; the five words wedged between them broke the match.
    # The gap tolerance below absorbs that class of rewrite. It stays
    # bounded (no ".*") so a late brand mention still cannot claim the
    # marker, and `where: start` keeps it in the opening window.
    - pattern: "(?:[Ww]elcome (?:back )?to|[Tt]his is|[Gg]lad you.?re here on|[Gg]ood to have you aboard|[Tt]hanks for tuning in to)(?:\\s+\\S+){0,6}?\\s+Offshore North"
      title: "Introduction"
      where: start
    - pattern: "[Ff]air winds"
      title: "Sign-Off"
      where: end
    - pattern: "on the Canadian boat|over to the Canadian boat|to the Canadian boat"
      title: "The Canadian Boat"
    - pattern: "out in the fleet|now,? the fleet|rest of the fleet this week"
      title: "The Fleet"
    - pattern: "time for Plain Sailing|brings us to Plain Sailing|now for Plain Sailing"
      title: "Plain Sailing"
    - pattern: "and the countdown|before we go,? the countdown|the countdown stands"
      title: "The Countdown"

slow_news:
  # Offshore racing has genuine dead weeks. On a thin week the show expands
  # Plain Sailing from this library instead of padding the news — see the
  # explainer bank in the show bible.
  enabled: true
  library_file: shows/segments/offshore_north.json
  max_segments: 1
  cooldown_days: 120

newsletter:
  enabled: false
  tag: "Offshore North"
  short_label: "Offshore North"
  emoji: "⛵"

content_tracking:
  section_patterns: {}

youtube:
  # Off at launch (RSS + site page only). image_provider is pre-set to grok
  # so a future one-line enable doesn't trip the drift guard
  # (tests/test_config.py::test_youtube_enabled_shows_use_grok_image_provider).
  enabled: false
  channel: en
  category_id: 17               # Sports
  image_provider: grok
  # Required >=3 even while YouTube is disabled
  # (tests/test_visual_assets.py::test_every_show_yaml_has_image_queries).
  image_queries:
    - foiling ocean racing yacht at speed in heavy seas
    - solo sailor at the helm of a racing yacht at dawn
    - racing yacht bow wave and spray in the southern ocean
    - carbon fibre racing yacht in a boatyard refit shed
    - nautical chart with dividers and a weather routing plot

