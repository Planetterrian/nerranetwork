multilingual:
  enabled: false
  auto: false
  languages: []

llm:
  provider: xai
  system_prompt_file: shows/prompts/offshore_north_system.txt
  digest_prompt_file: shows/prompts/offshore_north_digest.txt
  podcast_prompt_file: shows/prompts/offshore_north_podcast.txt
  # Low temperature on the digest: this show's single unforgivable error is
  # a confidently-stated wrong fact about a boat, a skipper, or a date.
  digest_temperature: 0.4
  podcast_temperature: 0.7
  max_tokens: 4500
  podcast_max_tokens: 8000
  # ONE length target: 10-15 minutes ≈ 1,500-2,200 words at ~150 wpm.
  # 1,600 sits inside that band so the expand-retry fires on genuinely
  # short episodes, not on every good 1,550-word one.
  min_podcast_words: 1600
  # Lowered 1150 -> 950 on 2026-08-04. Ep001 generated a 1124-word script
  # and was skipped for being 26 words under its own floor, which was set
  # nearly 2x the network default of 600. 950 still sits just under the
  # 960 soft floor (60% of target), so a genuinely rushed episode is
  # still refused — but a real racing week no longer loses the episode to
  # a rounding error. The length fix is the wider fetch window below;
  # this is only the safety net under it.
  min_podcast_word_floor: 950
  # Network-wide July 2026 policy: length is attacked on the DIGEST side
  # only — the script can never say more than the brief gives it, and
  # podcast-side expansion pads by paraphrase-duplication. A weekly show
  # over seven days of news needs a fat brief.
  digest_expand_below_target: true
  min_digest_words: 1300
  podcast_expand_below_target: false

tts:
  # Dan's custom Grok voice — the same voice_id used for the DAN turns in
  # dp_pod's dialogue mode. Single-narrator here, so NO dialogue_mode.
  voice_id: 0vscf8u8yrxc
  language_code: en
  # Subtle energy lift, matched to dp_pod's tuned value. A/B-listen before
  # keeping (landmine #17) — drop to 1.0 if it introduces artifacts on
  # French proper nouns, which this show is full of.
  speed: 1.02

audio:
  # No dedicated theme at launch — ships as a clean voice-only briefing.
  # When a track exists, point this at assets/music/offshore_north.mp3 and
  # the network's standard mix parameters apply from _defaults.yaml.
  music_file: null

