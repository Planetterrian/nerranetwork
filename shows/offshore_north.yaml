multilingual:
  enabled: false
  auto: false
  languages: []

llm:
  provider: xai
  system_prompt_file: shows/prompts/offshore_north_system.txt
  digest_prompt_file: shows/prompts/offshore_north_digest.txt
  podcast_prompt_file: shows/prompts/offshore_north_podcast.txt
  # Low temperature on the digest: this show's single unforgivable error is
  # a confidently-stated wrong fact about a boat, a skipper, or a date.
  digest_temperature: 0.4
  podcast_temperature: 0.7
  max_tokens: 4500
  podcast_max_tokens: 8000
  # ONE length target: ~12 minutes = 1,400-1,800 words (August 2026
  # editorial review — was 1,500-2,200). 1,500 sits inside the band so the
  # digest-side expand-retry fires on genuinely short episodes, not on
  # every good 1,450-word one.
  min_podcast_words: 1500
  # Lowered 1150 -> 950 on 2026-08-04. Ep001 generated a 1124-word script
  # and was skipped for being 26 words under its own floor, which was set
  # nearly 2x the network default of 600. 950 still sits just under the
  # 960 soft floor (60% of target), so a genuinely rushed episode is
  # still refused — but a real racing week no longer loses the episode to
  # a rounding error. The length fix is the wider fetch window below;
  # this is only the safety net under it.
  min_podcast_word_floor: 950
  # Network-wide July 2026 policy: length is attacked on the DIGEST side
  # only — the script can never say more than the brief gives it, and
  # podcast-side expansion pads by paraphrase-duplication. A weekly show
  # over seven days of news needs a fat brief.
  digest_expand_below_target: true
  min_digest_words: 1300
  podcast_expand_below_target: false

tts:
  # Dan's custom Grok voice — the same voice_id used for the DAN turns in
  # dp_pod's dialogue mode. Single-narrator here, so NO dialogue_mode.
  voice_id: 0vscf8u8yrxc
  language_code: en
  # Subtle energy lift, matched to dp_pod's tuned value. A/B-listen before
  # keeping (landmine #17) — drop to 1.0 if it introduces artifacts on
  # French proper nouns, which this show is full of.
  speed: 1.02

audio:
  # "Eyes on the Horizon" — the show's own anthem (operator-produced in
  # Suno from the brief + lyrics in assets/music/offshore_north_theme.md,
  # Aug 2026). Used as the intro/outro bed on every episode via the
  # standard network mix; timing/volume params inherit _defaults.yaml
  # (3 s music alone under the cold open, then sidechain-ducked under
  # voice, 30 s outro). VERIFIED on install: 3:03, 48 kHz stereo,
  # ~191 kbps, integrated loudness -13.7 LUFS — dead centre of the
  # network library (-12.9 to -14.7 LUFS), so no level correction was
  # needed and the shared volume params apply as designed. The track
  # starts at full weight rather than fading in; the mixer's 50 ms
  # click-guard fade (engine/audio.py) handles that, and the result is
  # an immediate hit of theme before Dan's first line.
  music_file: assets/music/offshore_north.mp3
  # Episode 1 only: after the closing sign-off ("Fair winds — and eyes on
  # the horizon"), the FULL anthem plays the debut out — the script
  # introduces it on air and run_show appends the audio AFTER chapter
  # timestamps are computed. No-op for every other episode. Same pattern
  # as The DP Pod's Episode 1.
  debut_song_file: assets/music/offshore_north.mp3
  debut_song_episode: 1

# Narrative memory (Aug 2026 field review): the show's spine IS a
# two-year longitudinal story — the campaign's road to 12 Nov 2028 —
# which is exactly what the show_memory engine chronicles. Registered in
# engine/show_memory.py SHOW_MEMORY_CONFIGS + shows/hooks/offshore_north.py;
# gives the narrative tracker, the public Story Tracker page, and
# continuity injection into both prompts. Prompt-context change →
# A/B-listen per landmine #17 (operator-directed).
memory_enabled: true

publishing:
  rss_file: offshore_north_podcast.rss
  rss_title: "Offshore North"
  # Positioning rewritten Aug 2026 (audience-breadth review): lead with the
  # universal quest, promise no-knowledge-required, keep the depth pledge.
  rss_description: "No Canadian has ever finished the Vendée Globe — solo, non-stop, around the world, the Everest of the seas. Offshore North follows the campaign trying to change that, and the extraordinary sport around it: carbon boats that fly at highway speed, skippers who sleep in 20-minute fragments, races decided by seconds after weeks alone at sea. Every Monday: the Canadian campaign's week, the stories moving the wider fleet, and one thing explained properly — for lifelong sailors and for people who've never touched a rope. Sources in every episode. No hype, no jargon walls, no play-by-play."
  rss_link: https://nerranetwork.com/offshore-north.html
  rss_author: "Nerra Network"
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/offshore-north.jpg
  rss_category: Sports
  rss_subcategory: "Wilderness"
  # Apple allows a primary + secondary category; the second gets its own
  # category page. Sports is the home category; Places & Travel widens
  # reach to the adventure/expedition audience.
  rss_category2: "Society & Culture"
  rss_subcategory2: "Places & Travel"
  rss_keywords: "offshore sailing, ocean racing, IMOCA, Vendee Globe, Canada Ocean Racing, Scott Shawyer, The Ocean Race, Route du Rhum, solo sailing, foiling, yacht racing, Canadian sailing"
  guid_prefix: offshorenorth
  base_url: https://nerranetwork.com
  audio_subdir: digests/offshore_north
  summaries_json: digests/offshore_north/summaries_offshore_north.json
  summaries_podcast_name: offshore_north
  player_html: offshore-north.html
  summaries_html: offshore-north-summaries.html
  # RSS + site page only at launch (operator decision).
  x_enabled: false
  x_env_prefix: ""
  host_name: Dan

episode:
  prefix: Offshore_North
  filename_pattern: "{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3"
  output_dir: digests/offshore_north
  mp3_glob: "Offshore_North_Ep*.mp3"

chapters:
  enabled: true
  # Network chapter lessons baked in at launch:
  #  - positional `where` anchors on Introduction and Sign-Off (the
  #    Tesla/EI/PT orphan-chapter class);
  #  - Sign-Off listed BEFORE the body markers (EI June-11 ordering rule);
  #  - every announce-anchored marker uses the exact phrasings the podcast
  #    prompt REQUIRES the host to speak, so a passing mention earlier in
  #    the episode cannot steal the marker (dp_pod Ep001 "The Lever" bug).
  section_markers:
    # The Introduction pattern must cover EVERY greeting variant in
    # engine/intros.py::_SHOW_PERSONALITIES['offshore_north']['greetings'].
    # Caught at install: "Thanks for tuning in to" was missing, which would
    # have shipped ~1 episode in 5 with no Introduction chapter (the EI
    # June-17 orphan-chapter class). Add here whenever a greeting is added.
    # Ep001 (2026-08-05) shipped with NO Introduction chapter. The supplied
    # intro line is "This is Offshore North, episode 1." and this pattern
    # matched it exactly — but the LLM ignored the copy-verbatim rule and
    # wrote "Welcome to the very first episode of Offshore North! Today is
    # August fifth, twenty twenty-six." The greeting and the show name were
    # both present; the five words wedged between them broke the match.
    # The gap tolerance below absorbs that class of rewrite. It stays
    # bounded (no ".*") so a late brand mention still cannot claim the
    # marker, and `where: start` keeps it in the opening window.
    - pattern: "(?:[Ww]elcome (?:back )?to|[Tt]his is|[Gg]lad you.?re here on|[Gg]ood to have you aboard|[Tt]hanks for tuning in to)(?:\\s+\\S+){0,6}?\\s+Offshore North"
      title: "Introduction"
      where: start
    - pattern: "[Ff]air winds"
      title: "Sign-Off"
      where: end
    - pattern: "on the Canadian boat|over to the Canadian boat|to the Canadian boat"
      title: "The Canadian Boat"
    - pattern: "out in the fleet|now,? the fleet|rest of the fleet this week"
      title: "The Fleet"
    - pattern: "time for Plain Sailing|brings us to Plain Sailing|now for Plain Sailing"
      title: "Plain Sailing"
    # Anchored (Aug 2026): the announcement is its own short line, so the
    # pattern requires the line to START with it. The old unanchored
    # "and the countdown" matched mid-sentence in the debut's segment tour
    # ("...and the countdown with the days left"), stealing the marker to
    # 79 s inside the introduction and leaving the real segment unmarked.
    - pattern: "^\\s*(?:And |Before we go,? )?[Tt]he countdown\\b"
      title: "The Countdown"

slow_news:
  # Offshore racing has genuine dead weeks. On a thin week the show expands
  # Plain Sailing from this library instead of padding the news — see the
  # explainer bank in the show bible.
  enabled: true
  library_file: shows/segments/offshore_north.json
  max_segments: 1
  cooldown_days: 120

newsletter:
  enabled: false
  tag: "Offshore North"
  short_label: "Offshore North"
  emoji: "⛵"

content_tracking:
  section_patterns: {}

youtube:
  # Off at launch (RSS + site page only). image_provider is pre-set to grok
  # so a future one-line enable doesn't trip the drift guard
  # (tests/test_config.py::test_youtube_enabled_shows_use_grok_image_provider).
  enabled: false
  channel: en
  category_id: 17               # Sports
  image_provider: grok
  # Required >=3 even while YouTube is disabled
  # (tests/test_visual_assets.py::test_every_show_yaml_has_image_queries).
  image_queries:
    - foiling ocean racing yacht at speed in heavy seas
    - solo sailor at the helm of a racing yacht at dawn
    - racing yacht bow wave and spray in the southern ocean
    - carbon fibre racing yacht in a boatyard refit shed
    - nautical chart with dividers and a weather routing plot

# Spotify / Apple catalog IDs — fill in after the show is submitted and
# accepted. Leaving them unset simply disables that show's analytics pull.
# spotify_show_id:
# apple_show_id:
