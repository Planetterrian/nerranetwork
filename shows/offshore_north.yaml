# Offshore North — the Nerra Network's weekly offshore ocean racing show.
#
# Weekly, Mondays 06:00 Pacific. Single host: Dan, on his
# custom Grok voice (the same voice used for the DAN turns on dp_pod).
# ~12 minutes. The show follows Canada Ocean Racing's campaign toward the
# Vendée Globe 2028 as a spine story and explains the wider IMOCA world
# around it for a keen-but-not-expert English-speaking audience.
#
# Design notes live in docs/offshore_north_show_bible.md.
name: Offshore North
slug: offshore_north
description: "The quest to become the first Canadian to sail alone, non-stop, around the world — and the wild sport it happens in. Weekly, no sailing knowledge required: the campaign, the fleet, and one thing explained properly."

# Already a weekly show, so no Sunday week-in-review branch. Do NOT add
# this slug to DAILY_SHOWS in tests/test_schedule.py.
weekly_summary_segment: false

# The beat is genuinely sparse — offshore racing has real dead weeks (the
# whole of August 2026 sits between the Vendée Arctique and The Ocean Race
# Atlantic). A weekly cadence over seven days of news usually clears this
# comfortably; the floor is deliberately low so a quiet week ships with an
# expanded Plain Sailing segment rather than skipping.
# Raised 4 -> 6 on 2026-08-05, with the Ep001 review. This is both the
# expansion trigger AND (since the same review) the web-search relevance
# threshold: web search fires when fewer than this many ON-TOPIC articles
# survive. At 4, one decent RSS day silences the show's eight
# web_search_queries; a weekly episode covering seven days needs more
# than four beats to fill The Fleet properly.
min_articles: 6
min_articles_skip: 2

# Weekly show — the network default ladder (24 -> 48 -> 72h) is tuned for
# DAILY shows and tops out three days short of this show's own period, so
# four of the seven days it exists to cover were invisible. The 2026-08-04
# run starved to 6 on-topic articles from 2 of 17 feeds and only reached 46
# by dropping keyword filtering, i.e. by going off-topic; the digest came
# out at 596 words against a 1300 target and the episode was skipped.
# 168h = the seven days a Monday episode actually reports on.
fetch_expansion_hours: [48, 96, 168]

sources:
  # ---- Tier 1: the campaign itself (primary, low volume, highest value) ----
  # freshness_report: the fetch stage reports each flagged feed's newest
  # entry (date + title) into the digest's {campaign_freshness} block,
  # WINDOW-INDEPENDENT — so the show can say "the team's site was last
  # updated on [date], with [subject]" instead of the banned "no news
  # this week" (Aug 2026 editorial review: Ep2 claimed an absence while
  # the boat had already departed Collingwood).
  - url: "https://www.canadaoceanracing.com/feed/"
    label: Canada Ocean Racing
    freshness_report: true
  - url: "https://www.canadaoceanracing.com/category/news/feed/"
    label: Canada Ocean Racing — News
    freshness_report: true
  # Official YouTube channel feed (Atom; feedparser handles it like RSS).
  # Channel ID resolved from youtube.com/@CanadaOceanRacing page source and
  # the feed VERIFIED serving 15 entries on 2026-08-14. The channel posts
  # roughly every two weeks, so most weeks it contributes nothing — the
  # digest prompt treats a new video as bonus tier-1 material, never as an
  # expected weekly input. (Facebook/Instagram deliberately NOT wired:
  # no native RSS, third-party bridges are brittle, and their posts mirror
  # the site + YouTube. Parked until the automated sources prove to miss
  # something — August 2026 editorial review.)
  - url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCbyLJ8WsopLJ0fLjkCAVQjg"
    label: Canada Ocean Racing — YouTube
    freshness_report: true

  # ---- Tier 2: class + organizers ----
  # NOTE: imoca.org and theoceanrace.com publish NO RSS feed (verified
  # August 2026 — custom JS front-ends, no autodiscovery, /feed 404s).
  # They are covered by the Google News queries below and by
  # web_search_queries, which is the only route to them. Do not "fix"
  # their absence by inventing a feed URL.
  - url: "https://www.vendeeglobe.org/en/wall/rss.xml"
    label: Vendée Globe (official)
  # Vendée Globe French root feed as a fallback — the /en/ locale variant
  # above is Drupal-generated and its language has not been confirmed.
  # Drop one of the two after the first week of real fetches.
  - url: "https://www.vendeeglobe.org/wall/rss.xml"
    label: Vendée Globe (root feed)

  # ---- Tier 3: trade + insider ----
  # Tip & Shaft now publishes as Sailorz ("Sailorz by Tip & Shaft").
  # The site root is French; /en/ is the English edition.
  - url: "https://sailorz.com/en/feed/"
    label: "Sailorz (Tip & Shaft, English)"

  # ---- Tier 3b: FRENCH PRIMARY PRESS (Aug 2026 field review) ----
  # The sport is reported in French; three weekly skips traced to an
  # English-only feed list starving the digest. The show's premise IS
  # contextual translation — these are the sources it exists to translate.
  # French-language items flow through the normal keyword filter (the
  # sport's proper nouns are identical in French) and the digest's
  # translated-French VERIFY rule applies to claims sourced only here.
  # Both feeds VERIFIED serving valid RSS on 2026-08-17.
  - url: "https://www.courseaularge.com/feed"
    label: "Course au Large (FR)"
  - url: "https://sailorz.com/feed/"
    label: "Sailorz (Tip & Shaft, French)"
  # Voiles et Voiliers (Ouest-France) publishes no direct RSS — reach it
  # via a Google News site query (VERIFIED serving items 2026-08-17).
  # url_utils resolves GN redirects to the publisher at fetch time.
  - url: "https://news.google.com/rss/search?q=site:voilesetvoiliers.ouest-france.fr&hl=fr&gl=FR&ceid=FR:fr"
    label: "Voiles et Voiliers (via GN)"

  # ---- Tier 4: daily aggregation ----
  - url: "https://www.sailingscuttlebutt.com/feed/"
    label: Scuttlebutt Sailing News
  - url: "https://www.sail-world.com/rss/"
    label: "Sail-World (worldwide racing)"
  - url: "https://www.sail-world.com/Europe/rss/"
    label: "Sail-World Europe (racing)"

  # ---- Tier 5: magazines / technical depth ----
  # REMOVED 2026-08-04: Seahorse Magazine
  # (https://www.seahorsemagazine.com/?format=feed&type=rss) returned
  # "Feed yielded 0 entries (likely blocked/empty/stale URL)" on all four
  # fetch passes of the first live run — it is the only one of the 17
  # feeds that is actually broken rather than merely filtered out. No
  # replacement URL is guessed here; re-add only a URL confirmed to serve
  # recent English items.
  - url: "https://www.yachtingworld.com/news/feed"
    label: Yachting World — News

  # ---- Tier 6: Canadian angle ----
  # Canadian Yachting was renamed Canadian Boating; canadianyachting.ca
  # 302-redirects here. VERIFIED August 2026: the site-wide /feed/ returns
  # valid RSS ("Canadian Boating"). The category feeds
  # (/category/racing/feed/, /category/sailing-news/feed/) did NOT — they
  # served HTML on the same check, so they are deliberately not used here.
  # The keyword filter does the narrowing instead.
  - url: "https://canadianboating.ca/feed/"
    label: Canadian Boating

  # ---- Tier 7: Google News backfill (the only route to IMOCA + The Ocean
  # Race, which have no feeds of their own). Quote multi-word entities or
  # the results are noise.
  - url: "https://news.google.com/rss/search?q=%22Canada+Ocean+Racing%22+OR+%22Scott+Shawyer%22&hl=en-US&gl=US&ceid=US:en"
    label: "Google News — Canada Ocean Racing"
  - url: "https://news.google.com/rss/search?q=%22IMOCA%22+%28offshore+OR+%22Vend%C3%A9e%22+OR+foiling%29&hl=en-US&gl=US&ceid=US:en"
    label: "Google News — IMOCA class"
  - url: "https://news.google.com/rss/search?q=%22Vend%C3%A9e+Globe%22&hl=en-US&gl=US&ceid=US:en"
    label: "Google News — Vendée Globe"
  - url: "https://news.google.com/rss/search?q=%22The+Ocean+Race%22&hl=en-US&gl=US&ceid=US:en"
    label: "Google News — The Ocean Race"
  - url: "https://news.google.com/rss/search?q=%22Route+du+Rhum%22+OR+%22D%C3%A9fi+Azimut%22&hl=en-US&gl=US&ceid=US:en"
    label: "Google News — Route du Rhum / Défi Azimut"
  - url: "https://news.google.com/rss/search?q=%22offshore+racing%22+sailing+skipper+OR+transatlantic&hl=en-US&gl=US&ceid=US:en"
    label: "Google News — offshore racing"

# Web search is load-bearing on this show, not a supplement: the two most
# important non-campaign sources (imoca.org, theoceanrace.com) are only
# reachable this way — so it runs on EVERY episode, not only when the
# article count is low. Added 2026-08-14 after the Ep2 redo starved: 16
# on-topic articles (mostly Google News Vendée aggregation) kept the
# count gate shut, the load-bearing queries never ran, and the digest
# came out at 493 words -> 904-word script -> skip. Count was never the
# right proxy for material quality on a weekly show. Cost: 8 queries/wk.
web_search_always: true
# ---- X / Twitter as a CONTENT source (not posting) ----
# Offshore racing breaks on X and Instagram before it reaches any RSS feed:
# campaigns post launches, damage and routing calls in real time, and the
# French-language press picks them up days later. This is the third content
# lever after the keyword fix and web search.
#
# DORMANT BY DESIGN: `x_fetch_enabled` stays false until the operator has
# VERIFIED each handle below. These were written from the show bible's
# source list, NOT confirmed against live X — an unverified handle fetches
# nothing (it fails safe, it does not fabricate), but a wrong one is a
# silent hole in coverage. Check each, correct it, then flip the flag.
# Cost: X API calls per episode; weekly cadence keeps that small.
x_fetch_enabled: false
x_accounts:
- handle: imoca_class
  label: IMOCA Class (VERIFY handle)
  max_posts: 4
- handle: TheOceanRace
  label: The Ocean Race (VERIFY handle)
  max_posts: 3
- handle: VendeeGlobe
  label: Vendee Globe (VERIFY handle)
  max_posts: 3
- handle: tipandshaft
  label: Tip & Shaft (VERIFY handle)
  max_posts: 3
- handle: TeamMalizia
  label: Team Malizia (VERIFY handle)
  max_posts: 2

web_search_queries:
  - "Canada Ocean Racing Scott Shawyer this week"
  - "IMOCA class news this week"
  - "The Ocean Race Atlantic news"
  - "Vendée Globe 2028 qualification news"
  - "Route du Rhum IMOCA news"
  - "IMOCA new boat launch foils"
  - "offshore racing sponsorship budget IMOCA campaign"
  - "Tip and Shaft IMOCA English"

