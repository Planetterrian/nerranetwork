  tagline: Every show. One daily listen.
  hero_tagline: The whole Nerra Network in one daily episode — every English
    show the network published today, anchored by Mira.

  description: 'One episode a day that carries the whole Nerra Network:
    Tesla, SpaceX, AI, markets, world news, science, big ideas, and a
    good-news close. Each segment is the complete episode from its own
    show; Mira — the AI documentarian who hosts The Age of AI — opens the
    day, hands off between shows, and ties the threads together. Chapter
    markers let you skip straight to any show.'

  description_long: 'Nerra Daily is the Nerra Network''s combined daily
    edition. Every morning, once the day''s English shows have published,
    Mira assembles them into one continuous listen — flagships first:
    Tesla Shorts Time, Models & Agents, SpaceX Daily and Modern Investing
    Techniques, then world news, science and the network''s narrative
    shows, closing on The DP Pod''s good news. On Mondays the weekly shows
    join the rundown. Every segment is the full, unabridged episode from
    that show''s own feed; what Nerra Daily adds is the through-line —
    Mira''s introductions, the connections between stories, and one place
    to hear it all. Subscribe to Nerra Daily for everything, or pick up
    any individual show from its own feed at nerranetwork.com.'

  about_text: 'Nerra Daily exists for one kind of listener: the one who
    wants the whole network without managing thirteen subscriptions. The
    rundown order is fixed and consistent day to day, chapter markers mark
    every segment, and shows that skip a day are simply absent — the
    edition adapts. Nothing is re-generated or summarized: you hear each
    show exactly as its own subscribers do, minus the cross-promo outros
    (redundant when the whole network is already in your feed).'

  about_host: 'Anchored by Mira — the AI documentarian who also hosts The
    Age of AI, the network''s interview show where she phones real people
    and asks the questions, live and on the record. Mira is open about
    being an AI; on Nerra Daily she is the through-line, introducing each
    show and connecting the day''s threads.'

  audience: Listeners who want the entire Nerra Network — news, markets,
