spacex:
  about_host: Hosted by Patrick in Vancouver.
  about_text: 'The daily companion for following SpaceX as a public company (Nasdaq:
    SPCX). Launched the day of the largest IPO in history, the show covers the whole
    business — Starship development, Raptor and launch infrastructure, Falcon
    cadence, Starlink and Dragon — plus the fast-growing AI and compute thread
    where SpaceX meets the rest of the Musk stack: orbital data centers and AI
    satellites, Starlink as the backhaul, and the xAI / Grok / X ecosystem the IPO''s
    AI-infrastructure spend ties into. Every day: the developments with sources,
    what the spaceflight community is buzzing about, one honest counterpoint, a
    dedicated AI & Compute segment, a first-principles engineering deep dive, and the
    SPCX market picture. Not financial advice.'
