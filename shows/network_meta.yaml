  tagline: One man. One boat. Around the world, alone.
  hero_tagline: The quest to become the first Canadian to sail alone, non-stop,
    around the world — and the wild sport it happens in.

  description: 'The Vendée Globe is the Everest of the seas — solo, non-stop,
    around the world — and no Canadian has ever finished it. Offshore North
    follows the campaign trying to change that, and the extraordinary sport
    around it: flying boats, 20-minute sleep, photo finishes after 23 days at
    sea. No sailing knowledge required. One thing explained properly every
    week.'

  description_long: 'Offshore North is the Nerra Network''s weekly guide to
    offshore ocean racing. One of the great endurance sports on earth is
    reported almost entirely in French, which leaves English-speaking fans
    with the results but not the meaning. Every Monday, Dan closes that
    gap: what Canada Ocean Racing did on the road to the Vendée Globe and
    what it actually changes, the week in the wider IMOCA fleet — races,
    new boats, rule changes, and the money behind all of it — and Plain
    Sailing, one concept explained properly for people who love this sport
    without living inside it. Sources named in every episode and linked in
    the notes. No hype, no play-by-play, and nothing stated that the
    sources do not support.'

  about_text: 'Every four years, around thirty people sail alone, without
    stopping and without assistance, all the way around the world. No
    Canadian has ever finished. Scott Shawyer and Canada Ocean Racing are
    trying to change that at the Vendée Globe starting 12 November 2028,
    aboard a boat that has already won The Ocean Race and finished third in
    the Vendée Globe under two previous names. Offshore North follows that
    attempt week by week — and uses it as a door into the whole sport. Each
    episode: The Canadian Boat (what the campaign did, and what it changes),
    The Fleet (the week in offshore racing, with the why-it-matters layer),
    Plain Sailing (one concept explained for the keen non-expert), and The
    Countdown (days to the start, and where qualification actually stands).
    Made for people who are enthusiastic, not expert — and never treated as
    though those are the same thing.'

  about_host: 'Hosted by Dan — Nerra Network co-founder and commercial
    airline pilot. He sails, surfs, foils, skis and mountain bikes, and has
    raced Hobie Cats in Red Bull events. He is not an offshore racing expert
    and says so plainly, but he brings two things almost no English-language
    sailing commentator has together: a pilot spends his working life reading
    weather, trading a shorter track against a faster one, and making
    irreversible calls on incomplete information at three in the morning —
    which is very close to the job a solo skipper actually does — and he has
    felt, at a much smaller scale, what it is like when a hull comes unstuck
    and starts to fly.'

  audience: English-speaking offshore racing fans, Canadian sailors and club
    racers, and anyone who watched a Vendée Globe documentary and wanted to
    keep following the sport afterward

  meta_description: 'Offshore North — the weekly English-language offshore
    ocean racing podcast. Canada Ocean Racing''s road to the Vendée Globe
    2028, the IMOCA fleet, and one concept explained properly every week.'
