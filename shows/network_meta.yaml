dp_pod:
  about_host: Hosted by Dan Perra and Patrick Novak — the co-founders of the Nerra
    Network (Novak + Perra = Nerra). Patrick is a Vancouver-based entrepreneur,
    published science fiction novelist, and physical chemist by training. Dan is
    a commercial airline pilot and longtime technology enthusiast.
  about_text: 'Most media tells you what''s going wrong and who''s to blame. The
    Do Positive Podcast starts from a different conviction: individuals are not
    powerless. Every day, Dan and Patrick dig into genuinely good news in science,
    technology, and everyday life — and then get practical about it, connecting
    each story to a real action a regular person can take. Not performative
    gestures. Not guilt. Concrete choices, backed by honest numbers, that add up.
    Each episode: The Positive Papers (two or three real developments that are
    legitimately good news), The Lever (one individual action with honest numbers
    on its impact), and the Do Positive Dispatch (what listeners actually did).
    The name is a wink. The mission is sincere — and every episode closes with
    the same challenge: do something about it.'
  apple_podcasts_url: null
  audience: Curious, action-oriented listeners tired of feeling helpless — early
    adopters, science enthusiasts, EV owners, parents thinking about the future,
    professionals who want their choices to count
  brand_color: '#0B7A45'
  brand_color_dark: '#0B7A45'
  description: 'Daily good news with Dan and Patrick: real progress in science
    and tech, healthy disagreement about what it means, and one concrete action
    with honest numbers — The Lever. Do something about it.'
  description_long: 'The Do Positive Podcast is the Nerra Network''s two-host
    conversation show: Dan Perra and Patrick Novak on the day''s genuinely good
    news in science and technology, why it matters, and the one action a regular
    person can take about it — with honest numbers on cost, payback, and impact.
    Optimistic media that pairs good news with individual agency: the antidote
    to doomscrolling that actually asks something of you.'
