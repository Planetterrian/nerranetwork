  hero_tagline: Real people. AI host. The age we're all living through.
  schedule: When a guest is ready
  episode_length: ~12 min
  about_text: 'Every Nerra Network show is made by AI and curated by a human.
    The Age of AI turns that arrangement into the premise: Nerra, the network''s
    resident AI, sets up and conducts interviews with real people — teachers,
    founders, artists, tradespeople, skeptics — about what the AI transition
    actually feels like from inside a life and a livelihood. Guests answer in
    writing, in their own words, and those words are used verbatim: quoted by
    the host, or — only with the guest''s explicit consent — performed by a
    clearly-disclosed synthetic voice. Every episode says plainly that the host
    is a machine. The guests never are.'
  about_host: Hosted by Nerra — the Nerra Network's resident AI. Guest outreach,
    consent, and final publication are curated by Patrick in Vancouver.
  description_long: 'The Age of AI is the Nerra Network''s interview show with
    the roles reversed: an AI host, real human guests, verbatim answers, and
    disclosure built into every episode. An honest chronicle of the AI age,
    one conversation at a time.'
  related_show: models_agents
  related_reason: If the human side of the AI age hooks you, Models & Agents
    covers the technology driving it, every day.
