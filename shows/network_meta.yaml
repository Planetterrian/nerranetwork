  description_long: 'AI Chips & Data Centres Daily covers the physical layer of artificial
    intelligence. Every day: the accelerators and systems that shipped, with their specifications;
    the data centres that were announced, broke ground or switched on, with megawatts and
    locations; the grid, generation and cooling constraints that decide where compute can
    go; the memory, packaging and foundry capacity underneath it; and the export rules around
    it. One engineering teardown a day explains a mechanism properly. Numbers first, sources
    named, never hype.'
  about_text: 'Every conversation about AI eventually runs into something physical: a chip
    that is sold out, a packaging line that sets the pace, a substation that is years away,
    a cooling system that decides how dense a rack can be. AI Chips & Data Centres Daily follows
    that physical layer every day — the silicon, the systems, the sites and the power — and
    says plainly what shipped, what was only announced, and what it costs.'
