spacex:
  about_host: Hosted by Patrick in Vancouver.
  about_text: 'The daily companion for following SpaceX as a public company (Nasdaq:
    SPCX). Launched the day of the largest IPO in history, the show covers Starship
    development, Falcon launch cadence, Starlink, Dragon missions, the SPCX market
    picture, and the engineering and economics behind the push to make life
    multiplanetary. Every day: the developments with sources, what the spaceflight
    community is buzzing about, one honest counterpoint, and an engineering deep
    dive. Not financial advice.'
