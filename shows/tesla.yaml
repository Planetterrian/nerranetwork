name: Tesla Shorts Time
slug: tesla
weekly_recap_on_sunday: true   # May 2026: daily cadence; Sunday slot recaps the past 7 days from the content lake.
description: Daily Tesla news digest and podcast covering the latest developments, stock updates, and market analysis.

sources:
  - url: https://www.teslarati.com/feed/
    label: Teslarati
  - url: https://www.theverge.com/rss/tesla/index.xml
    label: The Verge
  - url: https://cleantechnica.com/tag/tesla/feed/
    label: CleanTechnica
  - url: https://whatsuptesla.com/feed
    label: WhatsUpTesla
  # driveteslacanada.ca returns persistent HTTP 403 (anti-bot block)
  # on the GitHub Actions runner — removed May 6 2026 after every
  # TST run logged the same warning. Re-add if/when their CDN
  # whitelists CI ranges or we move to a residential-proxy fetch.
  - url: https://carbuzz.com/feed
    label: CarBuzz
  - url: https://insideevs.com/rss/articles/all/
    label: InsideEVs
  # electrek.co removed — listed in _blocked_sources.yaml
  - url: https://www.cnbc.com/id/10001147/device/rss/rss.html
    label: CNBC
  # Google News — supplementary broad coverage
  - url: "https://news.google.com/rss/search?q=tesla+electric+vehicle&hl=en-US&gl=US&ceid=US:en"
    label: Google News Tesla
  - url: "https://news.google.com/rss/search?q=TSLA+stock+OR+tesla+earnings&hl=en-US&gl=US&ceid=US:en"
    label: Google News TSLA
  - url: "https://news.google.com/rss/search?q=tesla+full+self+driving+OR+tesla+robotaxi&hl=en-US&gl=US&ceid=US:en"
    label: Google News Tesla FSD
  - url: "https://news.google.com/rss/search?q=electric+vehicle+industry+news&hl=en-US&gl=US&ceid=US:en"
    label: Google News EV Industry
  # Reddit — community-sourced breaking stories
  - url: "https://www.reddit.com/r/teslamotors/.rss"
    label: r/teslamotors
  - url: "https://www.reddit.com/r/electricvehicles/.rss"
    label: r/electricvehicles
  - url: "https://www.reddit.com/r/teslainvestorsclub/.rss"
    label: r/teslainvestorsclub
  # --- Round 4 additions (April 2026) ---
  - url: https://www.notateslaapp.com/rss
    label: Not A Tesla App
  - url: https://evannex.com/blogs/news.atom
    label: Evannex

x_accounts:
  - handle: Tesla
    label: Tesla Official
    max_posts: 5
  - handle: sawyermerrit
    label: Sawyer Merritt
    max_posts: 5
  - handle: RobMaurer
    label: Rob Maurer (Tesla Daily)
    max_posts: 5
  - handle: wholemarsblog
    label: Whole Mars Blog
    max_posts: 3
  - handle: tslaming
    label: TSLAming
    max_posts: 3
  # TeslaAIBot removed June 2026 — its fetched posts were emoji spam and
  # slur-bearing one-liners ("Laughing Emojis", "NY is full of liberal
  # retards") that polluted the digest prompt and the content tracker
  # (see Ep505 run log + the content-tracker junk filter in #576).
  - handle: Teslarati
    label: Teslarati
    max_posts: 3

min_articles: 10
min_articles_skip: 6
min_audio_duration: 300

web_search_queries:
  - "Tesla news today"
  - "TSLA stock market news"
  - "Tesla FSD update"
  - "electric vehicle industry news today"

keywords:
  - tesla
  - tsla
  - model 3
  - model y
  - model s
  - model x
  - cybertruck
  - roadster
  - semi
  - robotaxi
  - optimus
  - fsd
  - full self-driving
  - autopilot
  - supercharger
  - giga
  - gigafactory
  - gigatexas
  - gigaberlin
  - gigashanghai
  - "4680"
  - lfp
  - hw4
  - hw5
  - ai5
  - tesla energy
  - powerwall
  - megapack
  - solar roof
  - tesla charging

multilingual:
  enabled: true
  auto: true
  languages: [fr, ru, zh]

llm:
  provider: xai
  # Inherits grok-4.3 from _defaults.yaml. Tesla previously pinned
  # grok-4.20-reasoning for step-by-step grounding on live market data
  # and FSD claims; grok-4.3 has always-on reasoning at lower cost so
  # we no longer need the per-show override.
  # Refusal fallback points at a different family so the chain actually
  # switches models on a refusal (default would equal `model`).
  fallback_model: grok-4.20-non-reasoning
  system_prompt_file: shows/prompts/tesla_system.txt
  digest_prompt_file: shows/prompts/tesla_digest.txt
  podcast_prompt_file: shows/prompts/tesla_podcast.txt
  digest_temperature: 0.5
  podcast_temperature: 0.7
  max_tokens: 5500
  podcast_max_tokens: 10000
  # May 2026 substance-boost: target bumped 1200 → 1600 to match the
  # new "ALL 12 Top + 3-4 X Takeover × 5-7 sentences" podcast
  # structure (was "all 12 + 2-3 × 4-6"). Tesla digest also has the
  # First Principles + Counterpoint blocks layered on top.
  # June 10 2026 review: 1600 → 2000. The prompt previously demanded
  # four contradictory lengths at once (12–15 min, 13–17 min, ≥2800
  # words, "under 950 unacceptable") while this field enforced 1600 —
  # conflicting anchors let the model satisfy the smallest. The prompt
  # now states ONE target (2,200–2,400 words ≈ 14–16 min); this floor
  # sits just under it so the expand-retry fires on anything short of
  # a real full-length episode.
  min_podcast_words: 2000
  # June 2026 quality pass: 9 of 10 recent episodes shipped 15-35%
  # under target (avg 1238 words; listener_value pinned at 3.2-3.9 vs
  # 4.5 on the one on-target episode). Expand-retry now fires on ANY
  # below-target script, not just near the skip floor. ~$0.03/day.
  podcast_expand_below_target: true
  podcast_chain: true

tts:
  # Inherits provider=grok, voice_id=kdif6sqjcyiq, language_code=en,
  # max_chars=10000 from shows/_defaults.yaml. Tesla Shorts Time was
  # the last ElevenLabs holdout; flipped to the operator's custom Grok
  # voice in the May 2026 full-network migration so every English show
  # speaks with a single consistent host identity. See landmine #17.
  {}

audio:
  music_file: assets/music/tesla_shorts_time.mp3
  transition_sting: assets/music/transition_sting.mp3
  # May 12 2026 retune (see shows/_defaults.yaml). Voice enters at 10 s,
  # music continues 45 s under voice with a 30 s log-fade, post-voice
  # outro is 20 s with a slow 15 s fade-out.
  voice_intro_delay: 10.0
  intro_duration: 10.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.6
  overlap_volume: 0.5
  fade_volume: 0.4
  outro_volume: 0.6

publishing:
  rss_file: podcast.rss
  # rss_title aligned to "Tesla Shorts Time" (May 2026 audit) so it
  # matches the Apple Podcasts listing + the website + every other
  # surface. The mismatched ``Daily`` suffix risked Apple's duplicate-
  # feed detector marking the show as a re-upload.
  rss_title: Tesla Shorts Time
  # June 2026: value-prop description for Apple/Spotify listing pages —
  # the previous generic one-liner ("covering the latest Tesla news")
  # sold nothing. This is what a prospective subscriber reads before
  # their first play.
  # June 10 2026: "in 10 minutes" → "in 15 focused minutes" to match the
  # unified 2,200–2,400-word (~14–16 min) episode target. A listing that
  # promises 10 and delivers 15 invites churny first plays.
  rss_description: >-
    Every Tesla story that matters, every single day — in 15 focused
    minutes. The day's top developments with sources, the real-time TSLA
    picture, what the Tesla community is buzzing about on X, one honest
    bearish counterpoint, and a daily first-principles analysis that
    follows the long arcs: Optimus, Cybercab and robotaxi, FSD, next-gen
    vehicles, and 4680 cells. Seven days a week, with a Sunday recap
    that ties the week's threads together.
  rss_summary: >-
    Every Tesla story that matters, every day, in 15 focused minutes —
    news with sources, the TSLA picture, community buzz, one honest
    counterpoint, and first-principles analysis tracking Optimus,
    Cybercab, FSD and more. Daily, plus a Sunday weekly recap.
  rss_link: https://nerranetwork.com/tesla.html
  rss_author: Patrick
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/tesla-shorts-time.jpg
  rss_category: Technology
  rss_keywords: "tesla, ev, electric vehicle, tsla, elon musk, robotaxi, fsd, cybertruck, model y"
  guid_prefix: tesla-shorts-time
  base_url: https://nerranetwork.com
  audio_subdir: digests/tesla_shorts_time
  summaries_json: digests/tesla_shorts_time/summaries_tesla.json
  summaries_podcast_name: tesla
  x_enabled: true
  x_env_prefix: "X_"
  x_handle: "@teslashortstime"

episode:
  prefix: Tesla_Shorts_Time_Pod
  filename_pattern: "{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3"
  output_dir: digests/tesla_shorts_time
  mp3_glob: "Tesla_Shorts_Time_Pod_Ep*.mp3"

chapters:
  enabled: true
  section_markers:
    # Made more flexible after vibrancy / natural-flow prompt changes (May 2026)
    # started producing less rigid opening lines (e.g. "Pulling up to another day...")
    # June 2026 chapter fix: positional `where` constraints + tightened
    # patterns. The closing's "find us on X at tesla shorts time" used to
    # re-match the Introduction marker (markers are tried in order, first
    # match wins per line), titling the closing "Introduction" on every
    # episode; bare "tomorrow" spawned mid-episode Tomorrow Teaser
    # chapters from any story sentence mentioning tomorrow; "the kicker"
    # matched the smart-Shorts hook phrasing inside stories.
    - pattern: "Tesla Shorts Time|coming to you from Vancouver|Pulling up to another day"
      title: "Introduction"
      where: start
    - pattern: "Top \\d+|biggest.*stories|let.?s.*get into|here's what happened"
      title: "Top Stories"
    - pattern: "X Takeover|takeover"
      title: "Tesla X Takeover"
    - pattern: "one thing worth watching|challenge worth discussing|Short Spot|short.?seller"
      title: "The Counterpoint"
    - pattern: "First Principles"
      title: "First Principles"
    - pattern: "Before we go|before we wrap|before I go|keep an eye on|we.?ll be watching"
      title: "Tomorrow Teaser"
      where: end
    - pattern: "That's Tesla Shorts Time|that.?s.*for today|that.?s a wrap|that covers it|everything worth knowing|until next time|have a great"
      title: "Closing"
      where: end

slow_news:
  enabled: true
  library_file: shows/segments/tesla.json
  max_segments: 2
  cooldown_days: 30
  repeat_trigger_threshold: 5

content_freshness:
  lookback_days: 2
  similarity_threshold: 0.72

content_tracking:
  quote_author_cooldown_days: 7

newsletter:
  enabled: true
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: "Tesla Shorts Time"
  short_label: "Tesla Shorts"
  emoji: "🚀"
  newsletter_start_date: "2026-04-30"
  requires_financial_disclaimer: false
  length_target_words: 1300

youtube:
  podcast_playlist_id: PLRHMnzNNXPYCRrcYpPwAzjaRXqzKRUl23
  enabled: true                 # Phase-1 rollout show
  channel: en
  category_id: 28               # Science & Tech (algorithm performs better than 2/Autos here)
  default_language: en
  privacy_status: public        # Phase-1 validated; uploads are public
  # Auto-pick the Shorts start at the most engaging beat (numeric
  # reveal, "the kicker is…" framing, surprise hook) instead of the
  # legacy voice-intro start. Falls back to voice mode when the
  # heuristic can't find a clear winner. See engine.shorts_selector.
  shorts_start_mode: smart
  # 1 Short per episode (June 2026 four-show expansion). Was 2 during
  # the May 2026 retune; dropped back to 1 to free quota for the
  # Fascinating Frontiers + Modern Investing Shorts-only launch while
  # the quota-increase request is pending. Restore to 2 only after the
  # increase lands AND FF/MIT long-form is re-evaluated (see CLAUDE.md
  # landmine #20 quota math).
  shorts_per_episode: 1
  # Shorter clips perform better on the Shorts surface — 40 s lands
  # in the 30-45 s "high completion rate" sweet spot vs the previous
  # 55 s near-max. Same generation cost, better algorithmic signal.
  short_duration_seconds: 40
  # TST content is often more measured/narrative than punchy. The
  # default 5.0 threshold in the smart selector frequently falls back
  # to the legacy voice start. Lowering to 3.5 gives the heuristic a
  # better chance on good-but-not-perfect Tesla stories while still
  # avoiding boilerplate openers. See engine/shorts_selector.py.
  shorts_min_score_threshold: 3.5
  # Curated Pexels search phrases. Direct keywords like "model 3" / "model y"
  # were returning fashion photography models — confirmed root cause for
  # the Ep456 manifest containing topless / portrait images. Each phrase
  # below is disambiguated so Pexels returns vehicles / charging / factory
  # imagery only.
  image_queries:
    - tesla car
    - tesla supercharger
    - electric vehicle charging
    - cybertruck
    - tesla factory
    - tesla model y
    - ev road trip
  image_query_prefix: "tesla "
  # May 2026 rollout — Tesla is the larger of the two YouTube-enabled
  # shows (Tesla + MAB only, per landmine #20 quota cap). Operator
  # opted in to Grok Imagine for differentiated long-form / Shorts
  # imagery tied to each day's hook. ~$0.32/episode at the standard
  # ``grok-imagine-image`` rate (8 imgs × 2 formats × $0.02). Flip
  # back to ``pexels`` if engagement metrics don't justify the spend.
  image_provider: grok
  grok_image_model: grok-imagine-image
  grok_image_descriptor: "high-energy Tesla news photo"
  tags:
    - tesla
    - tsla
    - electric vehicle
    - ev news
    - fsd
    - tesla podcast
