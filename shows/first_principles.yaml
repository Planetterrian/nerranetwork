name: First Principles Daily
slug: first_principles
description: 'A daily narrative podcast that reasons from first principles — the ''magic
  wand number'' (what something would cost if you only paid for raw materials) and
  the ''Idiot Index'' (how many times more a finished part costs than its materials).
  Episodes alternate: one day a concrete example of first-principles thinking in action
  — from history (Ford, Bessemer, the shipping container) and modern industry (solar,
  batteries, mRNA), and yes sometimes one of Musk''s teams — the next a deep exposé
  on an industry ripe for the same treatment. Musk popularized the language; the method
  is much older and bigger than any one person. Produced by the Nerra Network in Vancouver.'
narrative_mode: true
topic_queue_file: shows/topic_queues/first_principles.yaml
weekly_recap_on_sunday: false
min_articles_skip: 0
multilingual:
  enabled: true
  auto: true
  languages:
  - fr
llm:
  provider: xai
  system_prompt_file: shows/prompts/first_principles_system.txt
  digest_prompt_file: shows/prompts/first_principles_episode.txt
  podcast_prompt_file: shows/prompts/first_principles_podcast.txt
  digest_temperature: 0.55
  podcast_temperature: 0.7
  max_tokens: 4800
  podcast_max_tokens: 9000
  min_podcast_words: 1500
  podcast_expand_below_target: true
  # Digest-stage expansion retry (June 2026 FP pass). Briefs shipped
  # 848-1116w vs the prompt's 1600 floor, capping the podcast even after
  # the podcast-stage retry. 1400 is the retry TRIGGER, set below the
  # observed grok-4.3 ~1200-1500w plateau so it rescues genuinely-thin
  # briefs (~900w) without fighting the ceiling.
  min_digest_words: 1400
  digest_expand_below_target: true
  podcast_chain: true
tts: {}
audio:
  music_file: assets/music/first_principles.mp3
  transition_sting: assets/music/transition_sting.mp3
  voice_intro_delay: 10.0
  intro_duration: 10.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.5
  overlap_volume: 0.4
  fade_volume: 0.3
  outro_volume: 0.5
publishing:
  rss_file: first_principles_podcast.rss
  rss_title: First Principles Daily
  rss_description: A daily narrative podcast that reasons about the world from first
    principles — the 'magic wand number' and the 'Idiot Index'. Episodes alternate
    between a concrete example of first-principles thinking in action (historical
    and modern — Ford, Bessemer, the shipping container, solar, batteries, and sometimes
    Musk's teams) and a deep exposé on an industry ripe for the same treatment.
  rss_summary: Reason from raw materials, not analogy. One example or one opportunity,
    every day.
  rss_link: https://nerranetwork.com/first-principles.html
  rss_author: Patrick
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/first-principles-daily.jpg
  rss_category: Technology
  rss_keywords: first principles, Elon Musk, SpaceX, Tesla, engineering, cost, manufacturing,
    innovation, idiot index
  guid_prefix: first-principles
  base_url: https://nerranetwork.com
  audio_subdir: digests/first_principles
  summaries_json: digests/first_principles/summaries_first_principles.json
  summaries_podcast_name: first_principles
  x_enabled: false
episode:
  prefix: First_Principles
  filename_pattern: '{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3'
  output_dir: digests/first_principles
  mp3_glob: First_Principles_Ep*.mp3
chapters:
  enabled: true
  section_markers:
  - pattern: Welcome.*First Principles|First Principles Daily|first episode
    title: Introduction
    where: start
  # Closing is listed BEFORE the body markers (EI June-11 / SpaceX June-18
  # ordering rule). The sign-off tagline "one example or one opportunity,
  # every day" contains "opportunity", and the brand "First Principles Daily"
  # contains "first principle" — so the body markers "The Opportunity" /
  # "The First Principle" steal the sign-off line whenever they have not
  # already matched in the body, dropping the Closing chapter. 7 of the
  # first 18 episodes (Ep001/004/007/009/011/015/017) shipped with NO Closing
  # for this reason. `where: end` keeps Closing out of the body, so listing
  # it first only changes which marker wins the final sign-off line.
  - pattern: that.?s.*for today|until next time|see you tomorrow|one example or one
      opportunity
    title: Closing
    where: end
  - pattern: first principle|magic wand|raw material|atoms
    title: The First Principle
  - pattern: idiot index|finished part|cost of the materials|times more
    title: The Idiot Index
  - pattern: what they did|how they|the breakthrough|the redesign|the engineering
    title: The Breakdown
  - pattern: opportunity|what if|imagine if|ripe for|the potential|could be
    title: The Opportunity
  - pattern: lesson|takeaway|principle to remember|what this teaches|the bigger idea
    title: The Lesson
newsletter:
  enabled: true
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: First Principles Daily
  short_label: First Principles
  emoji: 💡
  newsletter_start_date: '2026-06-15'
  requires_financial_disclaimer: false
  length_target_words: 1200
