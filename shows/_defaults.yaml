# Network-wide defaults for all Nerra Network shows.
#
# Per-show YAML configs inherit these values. Any key set in a show's
# own YAML file overrides the default. Nested keys are merged one level
# deep (e.g. a show can override just `tts.stability` without losing
# the other tts defaults).
#
# Usage: engine/config.py load_config() loads this file first, then
# deep-merges the show-specific YAML on top.

llm:
  provider: xai
  # Grok 4.3 (released 2026-04-30) — always-on reasoning, $1.25/$2.50 per
  # 1M tokens (vs grok-4.20 at $2/$6). ~55% cheaper per episode at higher
  # intelligence tier; supersedes the previous grok-4.20-non-reasoning
  # default and the grok-4.20-reasoning override on Tesla / Modern
  # Investing (reasoning is no longer a separate variant).
  model: grok-4.3
  digest_temperature: 0.5
  podcast_temperature: 0.7
  max_tokens: 3500
  podcast_max_tokens: 8000
  min_podcast_words: 1500
  podcast_chain: false
  # Refusal fallback — keep on the older 4.20-reasoning variant so a
  # refusal genuinely switches model family/training-snapshot rather than
  # retrying the same model. Still cheaper than the historical grok-4
  # fallback ($3/$15) we replaced in April 2026.
  fallback_model: grok-4.20-reasoning
  # Synthesizer (weekly newsletter, monthly report, cross-show briefing).
  # Inherits the cheaper, smarter primary by default.
  synth_model: grok-4.3
  synth_max_tokens: 8000
  synth_temperature: 0.4
  # Episode quality reviewer — fast/cheap variant, headroom for critique.
  reviewer_model: grok-4-1-fast-non-reasoning
  reviewer_max_tokens: 1500
  reviewer_temperature: 0.3

tts:
  # Network default since May 2026: xAI Grok TTS at $4.20/M chars
  # (~36× cheaper than ElevenLabs Flash). Voice `kdif6sqjcyiq` is the
  # operator's current English voice — every English show on the
  # network shares it for a single consistent "host" identity.
  # Russian shows (FP/PR) override voice_id to their custom "Olya"
  # (`0b875ae2`) and language_code to `ru`. No show is on ElevenLabs
  # in production any more; the legacy block below is retained only
  # for emergency rollback.
  provider: grok
  voice_id: kdif6sqjcyiq
  language_code: en
  max_chars: 10000
  # No chunk-wrap. Earlier defaults wrapped every chunk in
  # ``<fast>...</fast>``; May 2026 audit caught Grok voicing the
  # opening tag aloud as "Fast." at section-TTS boundaries (M&A
  # Ep045, May 11). ``<fast>`` is also NOT on Grok's documented
  # tag list (only ``[breath]``, ``[pause]``, ``[long-pause]``,
  # ``<emphasis>``, ``<whisper>``, ``<slow>``, ``<soft>`` are).
  # News-anchor emphasis is now injected at script-save time by
  # ``engine.prosody.inject_prosody_tags`` using ``<emphasis>``.
  speech_wrap_open: ""
  speech_wrap_close: ""
  # ---- Legacy ElevenLabs baseline ----
  # No show currently overrides `provider: elevenlabs`. Kept here so
  # an emergency rollback (e.g. Grok TTS outage) is a one-line YAML
  # flip rather than a re-tune. Harmless when `provider=grok` (Grok
  # path silently ignores these fields).
  model: eleven_flash_v2_5
  stability: 0.5
  similarity_boost: 0.75
  style: 0.0
  use_speaker_boost: true
  apply_text_normalization: "on"

audio:
  min_audio_duration: 180
  transition_sting: assets/music/transition_sting.mp3
  # Music timing — bumped *again* in May 2026 after the operator
  # reported that the intro and outro still cut off too quickly on
  # TST and MAB. Total intro music presence is now 55s
  # (25 alone + 10 overlap + 20 fade-tail) and the outro runs 60s
  # after voice ends with a 6s graceful close. ``voice_intro_delay``
  # MUST stay >= ``intro_duration`` so the voice doesn't enter while
  # the music intro is still in its alone-period.
  voice_intro_delay: 25.0
  intro_duration: 25.0
  overlap_duration: 10.0
  fade_duration: 20.0
  outro_duration: 60.0
  outro_crossfade: 20.0
  outro_fade_out_duration: 6.0
  intro_volume: 0.5
  overlap_volume: 0.4
  fade_volume: 0.3
  outro_volume: 0.3

storage:
  provider: r2
  bucket: podcast-audio
  endpoint_env: R2_ENDPOINT_URL
  access_key_env: R2_ACCESS_KEY_ID
  secret_key_env: R2_SECRET_ACCESS_KEY
  public_base_url: "https://audio.nerranetwork.com"

publishing:
  rss_author: Nerra Network
  rss_email: patrick@planetterrian.com
  base_url: https://nerranetwork.com
  host_name: Patrick

analytics:
  # OP3 (https://op3.dev) is a free, open podcast analytics service.
  # Wrapping enclosure URLs proxies downloads through OP3 so we get
  # listener stats from podcast apps (Apple, Spotify, Pocket Casts, etc.)
  # that don't expose this data otherwise. Existing episode URLs in
  # RSS feeds are preserved; only NEW episodes get the OP3 prefix.
  enabled: true
  prefix_url: "https://op3.dev/e/"

newsletter:
  enabled: false
  platform: buttondown
  status: about_to_send
  # ---- Branded-email defaults (PR-A: newsletter quick wins) ----
  # Target word count for the LLM-generated body. The synthesizer
  # passes this into the JSON-envelope output instructions so the
  # model knows where to land. Per-show overrides are encouraged;
  # 1300 is a sensible network default for a news-driven weekly.
  length_target_words: 1300
  # Compose flag for the styled "Heads up: educational only..."
  # callout. Flip to true on shows that discuss money / trades.
  requires_financial_disclaimer: false
  # short_label is what we use in the subject suffix ("Cybercab
  # production begins · Tesla Shorts 🚀"). Keep <=14 chars.
  short_label: ""
  # Per-show emoji that pairs with short_label in subject lines and
  # cross-network modules. Single grapheme; pick one that's readable
  # on iOS and Android.
  emoji: ""
  # The date the show's first newsletter went out. We derive a
  # deterministic per-show issue number as
  # ``floor((send_date - newsletter_start_date) / 7) + 1`` instead
  # of carrying mutable state in git or R2.
  newsletter_start_date: "2026-04-30"
  # ---- Cross-network ("Across the Nerra Network") adjacency map ----
  # Each show points to 1-3 sibling shows whose top stories of the
  # week are surfaced in the email's cross-network module. Override
  # in a show's own YAML to pin specific siblings; otherwise the
  # synthesizer falls back to "any other show" rotation.
  adjacent_shows: []
  # Network-wide map used as a fallback when a show YAML doesn't list
  # its own adjacent_shows. Each key is a slug, value is an ordered
  # list of preferred siblings.
  network_adjacencies:
    tesla: [modern_investing, models_agents]
    modern_investing: [tesla, finansy_prosto]
    omni_view: [modern_investing, env_intel]
    models_agents: [models_agents_beginners, tesla]
    models_agents_beginners: [models_agents, fascinating_frontiers]
    fascinating_frontiers: [planetterrian, models_agents]
    planetterrian: [env_intel, fascinating_frontiers]
    env_intel: [planetterrian, omni_view]
    finansy_prosto: [modern_investing, privet_russian]
    privet_russian: [finansy_prosto]

chapters:
  enabled: true

content_tracking:
  enabled: true
  max_days: 14

youtube:
  # Off by default — flip per-show in the show YAML once an OAuth refresh
  # token is provisioned for that channel.
  enabled: false
  # "en" = upload to the English Nerra Network channel using
  # YOUTUBE_REFRESH_TOKEN_EN. "ru" = Russian channel
  # using YOUTUBE_REFRESH_TOKEN_RU.
  channel: en
  # YouTube category ID (24=Entertainment, 25=News, 27=Education,
  # 28=Science & Tech). Override per-show when a more specific bucket fits.
  category_id: 28
  default_language: en
  # "public" once we've validated a few uploads via "unlisted".
  privacy_status: public
  # Per-episode rendering toggles.
  publish_long_form: true
  publish_shorts: true
  # Shorts clip pulled from the voice track only (skips music intro);
  # keep < 60s so YouTube treats it as a Short.
  short_duration_seconds: 55
  # Network-wide tags appended to per-show tags.
  tags:
    - nerra network
    - podcast
    - ai podcast
  # Disclosure footer appended to every video description. The API also
  # sets status.containsSyntheticMedia=True on every upload, which is the
  # field YouTube uses to render the "Altered or synthetic content" label.
  synthetic_disclosure: |
    AI Disclosure: This podcast is curated by Patrick but uses AI-generated
    voice synthesis (ElevenLabs) for the narration. Editorial selection,
    summaries, and analysis are written from primary sources by
    Nerra Network. Learn more: https://nerranetwork.com/about
