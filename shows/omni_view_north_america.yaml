# Omni View North America — Phase 3 of docs/new_shows_plan_2026_09_22.md §4.7.
# One of the five Omni View regional desks read by Mira, the network's AI
# host. The desks share ONE format: prompts include
# shows/prompts/_shared/omni_desk_*.txt, and the only per-desk prompt text is
# the region file (shows/prompts/omni_desks/). Everything per-desk that a
# registry needs lives in engine/omni_desks.py.
#
# Distribution OFF at launch (RSS + site + blog). NOT on a cron: Episode 1 is
# produced by manual dispatch and listened to before the launch PR adds the
# schedule (10:16 UTC (06:16 ET), plan §6).
name: Omni View North America
slug: omni_view_north_america
weekly_summary_segment: true   # daily cadence; Sunday adds a short week-in-review segment
memory_enabled: true
story_recurrence: true
description: 'The day in the United States and Canada, one region deep: the White House and Congress, the courts, the states, Ottawa and the provinces, the border and trade — every claim attributed, one contested question argued fairly both ways and one sign of progress. Read by Mira, the Nerra Network''s AI host; every story from named newsrooms.'

fetch_full_text: 16
absence_sentence_filter: true
# Digest lints + X-source policy (Sep 23 2026 launch-cohort review; engine/digest_lint.py).
digest_lints:
- wyntk_hook_match
- x_only_lead
- progress_watch_thin
- region_world_thin
x_posts_as_sources: linked_only
stale_article_days: 3

# Probed 2026-09-23 from this session's egress (200, posts inside the day);
# re-grade from a runner (`python check_feeds.py omni_view_north_america`) before Episode 1.
# No `keywords:` list on purpose: these feeds are regional by construction,
# and a title keyword filter would drop on-region stories whose titles name
# no country. The REGION RULE in the prompt decides what qualifies.
sources:
- url: https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml
  label: BBC US & Canada
- url: https://www.theguardian.com/us-news/rss
  label: The Guardian US
- url: https://feeds.npr.org/1001/rss.xml
  label: NPR
- url: https://www.pbs.org/newshour/feeds/rss/headlines
  label: PBS NewsHour
- url: https://rss.nytimes.com/services/xml/rss/nyt/US.xml
  label: The New York Times US
- url: https://thehill.com/news/feed/
  label: The Hill
- url: https://www.scotusblog.com/feed/
  label: SCOTUSblog
- url: https://www.theglobeandmail.com/arc/outboundfeeds/rss/category/canada/
  label: The Globe and Mail Canada
- url: https://www.theglobeandmail.com/arc/outboundfeeds/rss/category/politics/
  label: The Globe and Mail Politics
- url: https://globalnews.ca/canada/feed/
  label: Global News Canada
- url: https://www.cbc.ca/webfeed/rss/rss-politics
  label: CBC Politics
- url: https://mexiconewsdaily.com/feed/
  label: Mexico News Daily
- url: https://news.google.com/rss/search?q=Congress+OR+Senate+vote+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News North America 1
- url: https://news.google.com/rss/search?q=White+House+executive+order+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News North America 2
- url: https://news.google.com/rss/search?q=Supreme+Court+ruling+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News North America 3
- url: https://news.google.com/rss/search?q=Canada+Parliament+OR+Carney+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News North America 4
- url: https://news.google.com/rss/search?q=Ontario+OR+Quebec+OR+Alberta+premier+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News North America 5
- url: https://news.google.com/rss/search?q=US+Mexico+border+OR+tariffs+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News North America 6
- url: https://news.google.com/rss/search?q=governor+OR+state+legislature+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News North America 7

web_search_queries:
- US news today
- Canada news today
- US Supreme Court Congress news today

# Omni View's nine anti-tabloid filters plus the desk additions
# (engine.omni_desks.ANTI_TABLOID_PATTERNS — keep the two in sync).
exclude_title_patterns:
- 'red carpet'
- '\bLove Island\b'
- '\bStrictly Come Dancing\b'
- 'reality TV star'
- '\broyal\b.*\b(fashion|dress|style|outfit)\b'
- 'wardrobe malfunction'
- '\bpaparazzi\b'
- '\bnet worth\b'
- 'steps out (?:in|with)'
- '\b(live updates?|as it happened|live blog)\b'
- '\b(in pictures|photos of the (day|week)|week in pictures)\b'
- '\b(quiz|crossword|wordle)\b'
- '\b(obituar(y|ies)|in memoriam)\b'

x_fetch_enabled: true
x_accounts:
- handle: NPR
  label: NPR
  max_posts: 3
- handle: CBCNews
  label: CBC News
  max_posts: 3
- handle: PBSNews
  label: PBS News
  max_posts: 2
- handle: globeandmail
  label: The Globe and Mail
  max_posts: 2

min_articles: 8
min_articles_skip: 4

# Cost circuit breaker — TOP LEVEL (nested keys are ignored; see _defaults).
max_weekly_cost_usd: 7.0

multilingual:
  enabled: false

llm:
  provider: xai
  # grok-4.7 at low effort, like every new show (operator brief 2026-09-23;
  # experiment new-shows-grok-47-2026-09-23). A run whose pinned model does
  # not answer falls back to grok-4.3 and records it.
  model: grok-4.7
  reasoning_effort: low
  system_prompt_file: shows/prompts/omni_view_north_america_system.txt
  digest_prompt_file: shows/prompts/omni_view_north_america_digest.txt
  podcast_prompt_file: shows/prompts/omni_view_north_america_podcast.txt
  digest_temperature: 0.4
  podcast_temperature: 0.7
  # Room for grok-4.7's reasoning AND the claims ledger at the tail
  # (Prediction Markets Ep1 used 5,384 of 5,500 and lost its ledger).
  max_tokens: 8000
  podcast_max_tokens: 9500
  # A 10-12 minute brief. The skip floor is 60% of this.
  min_podcast_words: 1300
  podcast_expand_below_target: false
  min_digest_words: 1100
  digest_expand_below_target: true

tts:
  # Mira's voice (Grok built-in `ara`), no speech wrap — the Vancouver
  # calibration shape (plan §2b).
  voice_id: ara
  speech_wrap_open: ""
  speech_wrap_close: ""

audio:
  # The Omni View theme until the desk variant is commissioned (plan §5c).
  music_file: assets/music/OmniView.mp3
  transition_sting: assets/music/transition_sting.mp3
  voice_intro_delay: 0.0
  intro_duration: 3.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.6
  overlap_volume: 0.5
  fade_volume: 0.4
  outro_volume: 0.6

publishing:
  rss_file: omni_view_north_america_podcast.rss
  rss_title: Omni View North America
  rss_description: 'The day in the United States and Canada, one region deep: the White House and Congress, the courts, the states, Ottawa and the provinces, the border and trade — every claim attributed, one contested question argued fairly both ways and one sign of progress. Read by Mira, the Nerra Network''s AI host; every story from named newsrooms.'
  rss_link: https://nerranetwork.com/omni-view-north-america.html
  rss_author: Mira (AI host), Nerra Network
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/omni-view-north-america.jpg
  rss_category: News
  rss_subcategory: Daily News
  # Secondary must differ from the primary (Apple rejects a duplicate).
  rss_category2: Government
  rss_keywords: us news, canada news, congress, supreme court, canadian politics, daily news briefing
  guid_prefix: omni-view-north-america
  base_url: https://nerranetwork.com
  audio_subdir: digests/omni_view_north_america
  summaries_json: digests/omni_view_north_america/summaries_omni_view_north_america.json
  summaries_podcast_name: omni_view_north_america
  player_html: omni-view-north-america.html
  summaries_html: omni-view-north-america-summaries.html
  x_enabled: false
  x_env_prefix: X_
  host_name: Mira
  host_kind: ai

episode:
  prefix: Omni_View_North_America
  filename_pattern: '{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3'
  output_dir: digests/omni_view_north_america
  mp3_glob: Omni_View_North_America_Ep*.mp3

chapters:
  enabled: true
  # Anchors only — never a topic word. The Lead and Across the Region items
  # take their chapters from the digest headlines; the segments key on
  # REQUIRED phrases the podcast prompt builds a sentence around, never
  # inside the opening window (where: body — the Vancouver Ep1 lesson).
  section_markers:
  - pattern: This is Omni View North America|first episode of|Omni View North America, episode
    title: Introduction
    where: start
  - pattern: across the region
    title: Across the Region
    where: body
  - pattern: also today
    title: Also Today
    where: body
  - pattern: the wider world
    title: The Region and the World
    where: body
  - pattern: case on both sides
    title: Both Sides
    where: body
  - pattern: a sign of progress
    title: Progress Watch
    where: body
  - pattern: That's Omni View North America|see you tomorrow
    title: Closing
    where: end

slow_news:
  enabled: false

newsletter:
  enabled: false
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: Omni View North America
  short_label: North America
  emoji: 🗽
  newsletter_start_date: '2026-10-15'
  requires_financial_disclaimer: false
  length_target_words: 1300

content_tracking:
  section_patterns: {}

youtube:
  enabled: false                 # OFF at launch (plan §7: a second channel is a data decision)
  channel: en
  category_id: 25
  shorts_start_mode: smart
  shorts_min_score_threshold: 3.5
  default_language: en
  privacy_status: public
  image_provider: grok
  grok_image_model: grok-imagine-image
  grok_image_descriptor: "cinematic news photo, natural light, ultra-detailed"
  image_queries:
  - US Capitol building at dawn
  - Parliament Hill in Ottawa
  - highway through a North American city at morning
  - US Supreme Court steps
  image_query_prefix: ''
  tags:
  - world news
  - north america
  - daily news
