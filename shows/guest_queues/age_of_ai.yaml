# The Age of AI — guest pipeline ("CRM").
#
# Managed by scripts/age_of_ai_guests.py (list / add / invite / questions /
# ingest / compile). Schema per guest:
#
#   id:                  unique slug (kebab-case)
#   name:                display name
#   stage:               prospect | invited | accepted | questions_sent |
#                        answers_received | compiled | published | declined
#   contact:             email (operator sends outreach from their own inbox)
#   bio:                 who they are (used to personalize invite + questions)
#   angle:               the AI-age angle for this interview
#   why_this_guest:      internal note
#   name_pronunciation:  optional TTS hint for the host (plain description,
#                        NOT a phonetic respelling — landmine #17)
#   consent_to_publish:  true ONLY after the guest explicitly agrees.
#                        compile refuses without it.
#   consent_ai_voice:    true ONLY if the guest explicitly agrees to their
#                        answers being performed by a synthetic voice.
#   voice_mode:          quoted | ai_voiced (ai_voiced requires
#                        consent_ai_voice; degrades to quoted otherwise)
#   guest_voice_id:      optional per-guest Grok voice override (ai_voiced)
#   questions:           filled by `questions <id>`
#   answers:             filled by `ingest <id> --answers <file>` — the
#                        guest's VERBATIM written words. Never edit these.
#
# NEVER set the consent flags on a guest's behalf. The flags are the
# machine-readable record of a human agreement that must exist first.

guests:
  - id: patrick-novak
    name: Patrick Novak
    stage: prospect
    contact: patrick@planetterrian.com
    bio: >-
      Founder and operator of the Nerra Network — a 14-show automated podcast
      network he runs solo with AI doing the production. Vancouver-based
      entrepreneur, physical chemist by training, published science fiction
      novelist.
    angle: >-
      building and operating an AI-run podcast network solo — what it's like
      when your entire production staff is software
    why_this_guest: >-
      The natural debut: the show's own premise made personal. The founder
      being interviewed by the AI he operates inverts the network's usual
      arrangement on air, and he can speak to both the leverage and the
      discomfort honestly.
    name_pronunciation: ""
    consent_to_publish: false
    consent_ai_voice: false
    voice_mode: quoted
    guest_voice_id: ""
    questions: []
    answers: []
    notes: >-
      Ep1 target. Operator answers the question set in writing, sets the
      consent flags, then compiles.
