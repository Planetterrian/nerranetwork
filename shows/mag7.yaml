# X accounts (Sep 22 2026 Ep1 review). Source only — the show never posts
# to X. The first dry run (same day) proved the CEOs are the wrong accounts:
# Pichai, Jassy, Cook, Nadella and @Meta all returned "No recent posts" in
# 24 hours while Gurman and the NVIDIA newsroom carried real news. These
# post daily. A handle that returns nothing for a week is pruned.
x_fetch_enabled: true
x_accounts:
- handle: markgurman
  label: Mark Gurman (Bloomberg)
  max_posts: 3
- handle: nvidianewsroom
  label: NVIDIA Newsroom
  max_posts: 2
- handle: Techmeme
  label: Techmeme
  max_posts: 4
- handle: theinformation
  label: The Information
  max_posts: 3
- handle: Google
  label: Google
  max_posts: 2
- handle: Microsoft
  label: Microsoft
  max_posts: 2
- handle: amazonnews
  label: Amazon News
  max_posts: 2

# Full article text (engine/article_text.py): Ep1's Company Desk was three
# teaser-length items padded with "no release date was given".
fetch_full_text: 12
absence_sentence_filter: true
# Digest lints + X-source policy (Sep 23 2026 launch-cohort review; engine/digest_lint.py).
digest_lints:
- wyntk_hook_match
- x_only_lead
- counterpoint_keyed_to_lead
x_posts_as_sources: secondary

min_articles: 8
min_articles_skip: 5

max_weekly_cost_usd: 10.0

multilingual:
  enabled: false

llm:
  provider: xai
  # grok-4.7 on every stage that writes (digest + script; combined generation
  # stays eligible because podcast_model is unset), operator-directed
  # 2026-09-23: the new shows are the proving ground for the latest model,
  # and what works here is carried to the existing shows afterwards
  # (experiment new-shows-grok-47-2026-09-23, docs/model_upgrade_playbook.md).
  # The existing news shows stay on grok-4.3 (TestStagedGrok46Trial).
  # Revert: delete this line.
  model: grok-4.7
  # Low effort (Sep 23 2026): at default effort grok-4.7's digest call ran
  # past xAI's ~260 s edge disconnect on both Episode 1s (Vancouver,
  # Collingwood); the reviewer's 4.7 pin completes at "low". A fallback to
  # grok-4.3 drops this with the model (switch_to_network_default).
  reasoning_effort: low
  system_prompt_file: shows/prompts/mag7_system.txt
  digest_prompt_file: shows/prompts/mag7_digest.txt
  podcast_prompt_file: shows/prompts/mag7_podcast.txt
  digest_temperature: 0.5
  podcast_temperature: 0.7
  # 8000: grok-4.7's reasoning shares this budget with the digest AND the
  # claims ledger at its tail (Prediction Markets Ep1, 2026-09-23: 5,384 of
  # 5,500 used, ledger never arrived). A ceiling, not a spend.
  max_tokens: 8000
  podcast_max_tokens: 8000
  # Sep 23 2026: targets set to what the format's digest supports. The
  # skip floor is 60% of this; Ep1 runs produced 883, 701 and 661 words against 1,300. Length is still
  # a digest-side lever (CLAUDE.md) — this is the target, not a retry.
  min_podcast_words: 1100
  podcast_expand_below_target: false
  min_digest_words: 1300
  digest_expand_below_target: true
  podcast_chain: true

tts: {}

audio:
  # Reuses the markets strand's theme until a dedicated track is commissioned
  # (plan §5c).
  music_file: assets/music/ModernInvesting.mp3
  transition_sting: assets/music/transition_sting.mp3
  voice_intro_delay: 0.0
  intro_duration: 3.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.6
  overlap_volume: 0.5
  fade_volume: 0.4
  outro_volume: 0.6

