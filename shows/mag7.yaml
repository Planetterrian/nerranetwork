chapters:
  enabled: true
  # Anchors only (never a company name — every item names one).
  section_markers:
  - pattern: This is Mag Seven Daily|first episode of|Mag Seven Daily, episode
    title: Introduction
    where: start
  - pattern: top of the tape
    title: Top News
    where: body
  - pattern: across the seven|runs through (several|more than one) of (them|these companies)
    title: The Thread
  - pattern: on the calendar
    title: On the Calendar
    where: body
  - pattern: Before we go|before we wrap
    title: Tomorrow Teaser
    where: end
  - pattern: That's Mag Seven Daily|that.?s.*for today
    title: Closing
    where: end

