# MAG 7 Daily — launched Sep 2026 (Phase 1 of docs/new_shows_plan_2026_09_22.md
# §4.2). Modelled on SpaceX Daily: a company desk with a market thread, but
# for seven companies at once — Alphabet (GOOGL/GOOG), Amazon (AMZN), Apple
# (AAPL), Meta Platforms (META), Microsoft (MSFT), NVIDIA (NVDA), Tesla (TSLA).
#
# Boundaries (prompt rules + a data-side sibling block in shows/hooks/mag7.py):
# Tesla Shorts Time owns Tesla's products, FSD, energy and community — this
# show speaks Tesla only as a company. Modern Investing owns picks and the
# practice portfolio — this show never picks.
#
# The show is about what the seven build, ship and discover (operator brief,
# 2026-09-23). THE TAPE survives only as one reader-only line at the foot of
# the digest (regular-session closes, engine/market_quotes.py); the podcast
# never reads it, and the earnings calendar is gone.
#
# Distribution OFF at launch; on the cron since 2026-09-23 (Episode 1 reviewed first).
name: MAG 7 Daily
slug: mag7
weekly_summary_segment: true
memory_enabled: true
story_recurrence: true
description: The seven largest US technology companies as one daily desk —
  Alphabet, Amazon, Apple, Meta, Microsoft, NVIDIA and Tesla. What they built,
  shipped and discovered, one cross-company thread. Not financial advice.

# Probed live 2026-09-22. Company newsrooms first; finance.yahoo.com and
# seekingalpha.com are in shows/_blocked_sources.yaml and stay out.
