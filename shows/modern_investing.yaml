multilingual:
  # Enabled June 2026 for the Russian YouTube dub (@NerraRU) — MIT was the
  # one ru_dub show without a Russian audio track. Scoped to `ru` only (MIT
  # never carried FR/ZH); this generates the RU track engine.ru_dub needs.
  enabled: true
  auto: true
  # fr added July 18 2026 for the @NerraFR dub (the FR audio track is
  # the dub's input; ~$0.05/episode extra translation+TTS).
  languages: [ru, fr]
llm:
  provider: xai
  fallback_model: grok-4.20-non-reasoning
  system_prompt_file: shows/prompts/modern_investing_system.txt
  digest_prompt_file: shows/prompts/modern_investing_digest.txt
  podcast_prompt_file: shows/prompts/modern_investing_podcast.txt
  digest_temperature: 0.5
  podcast_temperature: 0.7
  max_tokens: 4000
  podcast_max_tokens: 8000
  min_podcast_words: 1800
  # SCRIPT-STAGE ONLY A/B (2026-08-15, experiment mit-script-model-46).
  # The digest stays on grok-4.3: the network holds facts-first stages
  # there because grok-4.5 regressed confident-hallucination 25% -> 54%,
  # and 4.6 is a post-training upgrade over 4.5, so that risk is
  # unmeasured, not disproven. MIT is the show where a hallucinated
  # number is most expensive (real tickers, real prices, a published
  # track record), which is exactly why the newer model is pointed at
  # the one stage that introduces no facts — it rewrites an
  # already-verified digest into a script. The problem it is aimed at is
  # measurable: 9 of the last 10 scripts came in under the 1800-word
  # floor (median ~1535w). Readout 2026-08-29. Revert = delete this line.
  # An unreachable model id falls back to llm.model with a loud warning
  # (engine/generator.py), so a bad id costs the A/B, never the episode.
  podcast_model: grok-4.6
  # DISABLED July 29 2026 (cost + quality). Measured over 901 committed
  # episodes: 81% still shipped BELOW target WITH this retry running (Tesla
  # 96.7%, M&A 95.2%) — it fires on nearly every episode and almost never
  # reaches the goal, because the ceiling is the DIGEST, not the script.
  # It also pads by paraphrase-duplication (the July 28 pass had to add
  # _dedup_expansion_sentences to strip its near-duplicate sentences), so
  # what it does ship is the weaker copy. The July 18 playbook already
  # banned podcast-side length levers network-wide (do_not_retry: ~10
  # misses vs 1 hit); this makes the config match the policy. Length is
  # now attacked only at the sanctioned substrate below
  # (digest_expand_below_target). ~$39/yr of retry calls recovered.
  podcast_expand_below_target: false
  # Digest-substrate length lever (July 24 2026 review): all 10 recent
  # scripts ran 1158-1746w against the 1800 floor, and the podcast-side
  # expand retry can't add facts the digest doesn't carry (network-wide
  # ledger lesson — podcast-side length levers are banned). The digest
  # retry deepens the brief when it lands under 1500w (FPD/OV precedent).
  digest_expand_below_target: true
  min_digest_words: 1500
  podcast_chain: true
tts: {}
audio:
  music_file: assets/music/ModernInvesting.mp3
  # July 30 2026 cold-open change: the hook is now the first thing
  # spoken (engine.intros.build_cold_open_spec + the podcast prompt), so
  # the voice starts at 0 and the music's alone-period is a short breath
  # rather than a ten-second wait. Long-form YouTube retention was 10.7%
  # (EN) / 6.3% (RU) with the old 10 s + ~18 s greeting open.
  voice_intro_delay: 0.0
  intro_duration: 3.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.5
  overlap_volume: 0.4
  fade_volume: 0.3
  outro_volume: 0.5
