  # seekingalpha.com/market_currents removed — blocked source
  - url: https://www.cbc.ca/cmlink/rss-business
    label: CBC Business

web_search_queries:
  - "stock market investing news today"
  - "TSX Canadian market news"
  - "ETF investing strategy news"
  - "AI investing fintech news"

x_accounts:
  - handle: unusual_whales
    label: Unusual Whales (Options Flow)
    max_posts: 5
  - handle: NickTimiraos
    label: Nick Timiraos (Fed Watcher, WSJ)
    max_posts: 3
  - handle: OptionsPlay
    label: OptionsPlay (Strategies)
    max_posts: 3
  - handle: BankOfCanada
    label: Bank of Canada
    max_posts: 3
  - handle: Waborsh
    label: Dividend Data (Canadian Markets)
    max_posts: 3
  - handle: StockMKTNewz
    label: Stock Market News
    max_posts: 3

min_articles: 6
# Explicit per-show pin (CLAUDE.md landmine #21). Markets always
# produce 3+ stories on a weekday; if the network default ever
# changes, this stays at 3 unless deliberately edited.
min_articles_skip: 3

keywords:
  - AI investing
  - algorithmic trading
  - ETF strategy
  - TFSA
  - RRSP
  - FHSA
  - TSX
  - sector rotation
  - momentum investing
  - value investing
  - swing trading
  - options strategy
  - robo-advisor
  - Wealthsimple
  - technical analysis
  - earnings surprise
  - capital gains
  - fintech
  - risk management
  - modern portfolio theory
  - Bank of Canada rate
  - dividend growth
  - stock screener
  - portfolio rebalancing
  - covered call
  - earnings report
  - interest rate decision
  - dollar cost averaging

llm:
  provider: xai
  # Inherits grok-4.3 from _defaults.yaml. Modern Investing previously
  # pinned grok-4.20-reasoning for factual grounding on live markets,
  # central-bank policy, and numerical data; grok-4.3 has always-on
  # reasoning at lower cost so we no longer need the per-show override.
  # Refusal fallback points at a different family so the chain actually
  # switches models on a refusal (default would equal `model`).
  fallback_model: grok-4.20-non-reasoning
  system_prompt_file: shows/prompts/modern_investing_system.txt
  digest_prompt_file: shows/prompts/modern_investing_digest.txt
  podcast_prompt_file: shows/prompts/modern_investing_podcast.txt
  digest_temperature: 0.5
  podcast_temperature: 0.7
  max_tokens: 4000
  podcast_max_tokens: 8000
  min_podcast_words: 1300
  # June 2026 quality pass (mirrors Tesla): 4 of 10 recent episodes
  # shipped under the 1300-word target with listener_value averaging
  # 3.4/10. The expand-retry now fires on ANY below-target script.
  podcast_expand_below_target: true
  podcast_chain: true

tts:
  # Inherits provider=grok, voice_id=sal, language_code=en, max_chars=10000
  # from shows/_defaults.yaml (network default since May 2026 — Grok TTS
  # at $4.20/M chars vs ElevenLabs Flash $150/M).
  {}

audio:
  # Dedicated MIT theme (the old "TODO: falling back to TST theme"
  # comment was stale — the file exists and is in use).
  music_file: assets/music/ModernInvesting.mp3
  # May 12 2026 retune (see shows/_defaults.yaml).
  voice_intro_delay: 10.0
  intro_duration: 10.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.5
  overlap_volume: 0.4
  fade_volume: 0.3
  outro_volume: 0.5

publishing:
  rss_file: modern_investing_podcast.rss
  rss_title: "Modern Investing Techniques"
  rss_description: "Daily investing podcast using AI-driven analysis and modern tools to identify market opportunities, track simulated trades, and teach strategies that aim to outperform index funds. Covering Canadian and US markets with actionable picks, performance tracking, and lessons learned."
  rss_link: https://nerranetwork.com/modern-investing.html
  rss_author: "Modern Investing Techniques"
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/modern-investing.jpg
  rss_category: Business
  rss_keywords: "investing, canadian investing, tsx, tfsa, stock market, finance, retirement, etfs"
  rss_subcategory: Investing
  rss_language: en-us
  guid_prefix: modern-investing
  base_url: https://nerranetwork.com
  audio_subdir: digests/modern_investing
  summaries_json: digests/modern_investing/summaries_modern_investing.json
  summaries_podcast_name: modern_investing
  player_html: modern-investing.html
  summaries_html: modern-investing-summaries.html
  # X posting enabled May 12 2026 — shares @teslashortstime account
  # (Option B from the pipeline-streamline plan). FinTwit / $cashtag
  # culture is huge on X and the Tesla account covers TSLA daily, so
  # the audience overlaps cleanly with general investing content.
  x_enabled: true
  x_env_prefix: "X_"

episode:
  prefix: Modern_Investing
  filename_pattern: "{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3"
  output_dir: digests/modern_investing
  mp3_glob: "Modern_Investing_Ep*.mp3"

chapters:
  enabled: true
  section_markers:
    - pattern: "Welcome.*Modern Investing|first episode of Modern Investing|Good morning.*Modern Investing|This is Modern Investing|Modern Investing Techniques.*episode"
      title: "Introduction"
    - pattern: "market pulse|market overview|here's where markets|let's check the pulse|check.*pulse"
      title: "Market Pulse"
    - pattern: "strategy spotlight|strategy of the day|today's strategy|educational centrepiece"
      title: "Strategy Spotlight"
    - pattern: "investor education|deep dive|how.*works"
      title: "Investor Education"
    - pattern: "practice investment|AI pick|today's pick|trade of the day|simulated trade"
      title: "Practice Investment of the Day"
    - pattern: "yesterday's trade|trade review|how did .* pick|weekly hold|last week's hold|mid-week update"
      title: "Trade Review & Lessons"
    - pattern: "tools and techniques|tools & techniques|recommended tools|let's talk tools"
      title: "Tools & Techniques"
    - pattern: "quick hits|rapid fire|shorter items|rapid-fire"
      title: "Quick Hits"
    - pattern: "portfolio tracker|running total|portfolio performance|simulated track record"
      title: "Portfolio Performance"
    - pattern: "That's Modern Investing|wraps up|wraps up.*episode"
      title: "Closing"

newsletter:
  enabled: true
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: "Modern Investing Techniques"
  weekly_prompt_file: shows/prompts/modern_investing_weekly.txt
  short_label: "MIT"
  emoji: "📈"
  newsletter_start_date: "2026-04-30"
  requires_financial_disclaimer: true
  length_target_words: 1300

slow_news:
  enabled: true
  library_file: shows/segments/modern_investing.json
  max_segments: 2
  cooldown_days: 30

# Special standalone single-subject episodes (May 2026). When a topic in the
# queue is scheduled for today (date:) or flagged when: next — or forced via
# `python run_show.py modern_investing --deep-dive <id>` — that one episode
# bypasses the daily news fetch and runs as a deep dive using the prompts
# below, then auto-reverts to the normal daily markets show. Add future deep
# dives by appending entries to shows/deep_dives/modern_investing.yaml.
deep_dive:
  enabled: true
  queue_file: shows/deep_dives/modern_investing.yaml
  digest_prompt_file: shows/prompts/modern_investing_deep_dive.txt
  podcast_prompt_file: shows/prompts/modern_investing_deep_dive_podcast.txt
  # Deep dives are full-length explainers, not daily-sized episodes. Push the
  # word floor above MIT's daily 1300 so the expansion retry fires and a fuller
  # episode ships — but NOT so high it skips a good-content episode. Ep060
  # (SpaceX, excellent live-sourced content) produced ~1320 words after the
  # retry; a 2400 target skipped it at the 1440 soft floor. 1700 → soft floor
  # 1020, so a ~1300-word deep dive ships while the retry still pushes depth.
  # (Single-pass generation caps ~1300-1400 words for this content; a true
  # 16-20 min deep dive needs section-by-section generation — see backlog.)
  min_podcast_words: 1700

youtube:
  podcast_playlist_id: PLRHMnzNNXPYCnD0HJiNss4SZPLBsH7z6v
  enabled: true                 # June 2026 four-show expansion: Shorts-only
                                # launch while the quota-increase request is
                                # pending (Tesla + MAB dropped to 1 Short each
                                # to make room). Flip publish_long_form to
                                # true once the increase is granted.
  publish_long_form: false      # Shorts-only until quota increase lands.
  # Smart Shorts segment selection (same as Tesla/MAB) — starts the
  # clip at the most engaging transcript beat instead of the intro.
  shorts_start_mode: smart
  short_duration_seconds: 40
  channel: en
  category_id: 25               # News & Politics (markets/business)
  default_language: en
  # Markets / Canadian + US investing imagery. Bare keywords like
  # "growth" / "yield" / "bonds" return generic / off-topic results,
  # so each query is grounded in finance context.
  image_queries:
    - stock market chart
    - canadian stock exchange
    - financial newspaper
    - trading desk monitors
    - investment portfolio
    - federal reserve building
    - bull and bear market
  image_query_prefix: ""
  tags:
    - investing
    - canadian investing
    - us markets
    - stocks
    - investing podcast
