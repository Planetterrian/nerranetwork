multilingual:
  enabled: false
llm:
  provider: xai
  system_prompt_file: shows/prompts/mab_system.txt
  digest_prompt_file: shows/prompts/mab_digest.txt
  podcast_prompt_file: shows/prompts/mab_podcast.txt
  digest_temperature: 0.4
  podcast_temperature: 0.75
  max_tokens: 5000
  podcast_max_tokens: 6000
  min_podcast_words: 1200
  # DISABLED July 29 2026 (cost + quality). Measured over 901 committed
  # episodes: 81% still shipped BELOW target WITH this retry running (Tesla
  # 96.7%, M&A 95.2%) — it fires on nearly every episode and almost never
  # reaches the goal, because the ceiling is the DIGEST, not the script.
  # It also pads by paraphrase-duplication (the July 28 pass had to add
  # _dedup_expansion_sentences to strip its near-duplicate sentences), so
  # what it does ship is the weaker copy. The July 18 playbook already
  # banned podcast-side length levers network-wide (do_not_retry: ~10
  # misses vs 1 hit); this makes the config match the policy. Length is
  # now attacked only at the sanctioned substrate below
  # (digest_expand_below_target). ~$39/yr of retry calls recovered.
  podcast_expand_below_target: false
  # July 2026 improvements pack: digest ceiling was capping beginner scripts.
  digest_expand_below_target: true
  min_digest_words: 1000
tts: {}
audio:
  music_file: assets/music/ModelsAgents.mp3
  transition_sting: assets/music/transition_sting.mp3
  # July 30 2026 cold-open change: the hook is now the first thing
  # spoken (engine.intros.build_cold_open_spec + the podcast prompt), so
  # the voice starts at 0 and the music's alone-period is a short breath
  # rather than a ten-second wait. Long-form YouTube retention was 10.7%
  # (EN) / 6.3% (RU) with the old 10 s + ~18 s greeting open.
  voice_intro_delay: 0.0
  intro_duration: 3.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.6
  overlap_volume: 0.5
  fade_volume: 0.4
  outro_volume: 0.6
# Apple video podcast — a second show carrying the long-form MP4.
# Enabled July 2026 alongside Tesla/SpaceX/Fascinating Frontiers: same daily long-form cadence as its parent show.
# Operator step: submit the .video.rss to Podcasts Connect as a NEW
# show — see docs/video_podcasts.md.
video_podcast:
  enabled: true

publishing:
  rss_file: models_agents_beginners_podcast.rss
  rss_title: Models & Agents for Beginners
  rss_description: AI for beginners and teens — daily episodes that explain how models
    and agents actually work, with free hands-on experiments you can try in minutes,
    no coding needed. Our sister show Models & Agents covers the expert builder view;
    this is the same AI universe explained for everyone. Every expert started exactly
    here.
  rss_link: https://nerranetwork.com/models-agents-beginners.html
  rss_author: Patrick
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/models-agents-beginners.jpg
  rss_category: Technology
  # Apple allows a primary + secondary category; the second gets its
  # own category page. Technology has no subcategories, so this is
  # how a Technology show widens reach.
  rss_category2: "Education"
  rss_subcategory2: "How To"
  rss_keywords: ai for beginners, learn ai, ai for teens, ai education, ai explained,
    beginner ai
  guid_prefix: mab
  base_url: https://nerranetwork.com
  audio_subdir: digests/models_agents_beginners
  summaries_json: digests/models_agents_beginners/summaries_models_agents_beginners.json
  summaries_podcast_name: models_agents_beginners
  player_html: models-agents-beginners.html
  summaries_html: models-agents-beginners-summaries.html
  x_enabled: false
  x_env_prefix: ''
episode:
  prefix: MAB
  filename_pattern: '{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3'
  output_dir: digests/models_agents_beginners
  mp3_glob: MAB_Ep*.mp3
chapters:
  enabled: true
  section_markers:
  - pattern: welcome to Models and Agents for Beginners
    title: Welcome
    where: start
  - pattern: big story|biggest news
    title: The Big Story
  - pattern: deep dive|how it works|under the hood
    title: 'Deep Dive: How It Works'
  - pattern: cool stuff|cool tools|tools and models|try this
    title: Cool Stuff & Try This
  - pattern: quick bits|rapid fire|quick round
    title: Quick Bits
  # "that is it for today" (no contraction) shipped on Ep095/098 July 2026
  # and matched nothing; the `.?s` form covers straight/curly apostrophes.
  - pattern: that(?:.?s| is) it for today|that.?s models and agents|that.?s a wrap
    title: Closing
    where: end
newsletter:
  enabled: true
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: Models & Agents for Beginners
  short_label: M&A Beginners
  emoji: 🎓
  newsletter_start_date: '2026-04-30'
  requires_financial_disclaimer: false
  length_target_words: 1300
slow_news:
  enabled: true
  library_file: shows/segments/models_agents_beginners.json
  max_segments: 2
  cooldown_days: 30
youtube:
  podcast_playlist_id: PLRHMnzNNXPYBFcirj6Ivq6PxZealY8fAp
  enabled: true                 # Full-network rollout (200k quota, June 2026; un-paused)
  channel: en
  category_id: 27
  default_language: en
  privacy_status: public
  shorts_start_mode: smart
  # July 22 2026: smart start had fallen back to the 10 s intro on 6/6 recent
  # episodes — the 5.0 default threshold never fires on MAB's explanatory
  # transcript style. 3.5 matches the Tesla/SpaceX/FF fleet setting.
  shorts_min_score_threshold: 3.5
  shorts_per_episode: 1
  # 35s (was 40) — July 30 2026. See shows/_defaults.yaml: the median
  # Short holds 21s, so 35 turns that into 60% completion instead of
  # 52%. This show was already ahead of the 55s network default.
  short_duration_seconds: 35
