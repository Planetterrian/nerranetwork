name: Unintended Consequences
slug: unintended_consequences
description: A daily narrative podcast profiling inventions, policies, and systems
  that were meant to help — but triggered surprising, unintended consequences. From
  the Cobra Effect to social media algorithms, every episode follows a single case
  study through good intentions, implementation, unexpected fallout, and the lessons
  we can learn. Produced by the Nerra Network in Vancouver.
narrative_mode: true
topic_queue_file: shows/topic_queues/unintended_consequences.yaml
weekly_summary_segment: false
min_articles_skip: 0
# ENFORCED (Aug 2026): this show's history-essay format is where fabricated
# provenance was demonstrated (three chapters across two book volumes citing
# "a 1962 paper in Nature" for findings published elsewhere, or nowhere). A
# citation-shaped assertion that traces to nothing now skips the episode —
# the topic-queue slot is NOT burned on a skip, so the cost is a rerun.
source_integrity:
  enabled: true
  enforce: true
multilingual:
  enabled: false
llm:
  provider: xai
  # 2026-08-27 WITHDRAWN from the staged grok-4.6 trial (operator-
  # directed, per the model-upgrade playbook's latency gate): on
  # 2026-08-27 both of this show's runs died mid-pipeline while its
  # sibling trial show first_principles hit the 4.6 stall-then-server-
  # disconnect signature outright (~260s per attempt, three attempts,
  # twice) — the same operational failure that forced the Aug-18
  # network-wide 4.6 revert. The deleted `model: grok-4.6` pin means
  # this show inherits the grok-4.3 network default again; the accepted
  # 4.3 narrative-length plateau applies and podcast-side retries stay
  # banned. Do not re-pin 4.6 here without a fresh staged trial per
  # docs/model_upgrade_playbook.md.
  system_prompt_file: shows/prompts/unintended_consequences_system.txt
  digest_prompt_file: shows/prompts/unintended_consequences_episode.txt
  podcast_prompt_file: shows/prompts/unintended_consequences_podcast.txt
  digest_temperature: 0.55
  podcast_temperature: 0.7
  max_tokens: 4500
  podcast_max_tokens: 9000
  min_podcast_words: 1300
  # DISABLED July 29 2026 (cost + quality). Measured over 901 committed
  # episodes: 81% still shipped BELOW target WITH this retry running (Tesla
  # 96.7%, M&A 95.2%) — it fires on nearly every episode and almost never
  # reaches the goal, because the ceiling is the DIGEST, not the script.
  # It also pads by paraphrase-duplication (the July 28 pass had to add
  # _dedup_expansion_sentences to strip its near-duplicate sentences), so
  # what it does ship is the weaker copy. The July 18 playbook already
  # banned podcast-side length levers network-wide (do_not_retry: ~10
  # misses vs 1 hit); this makes the config match the policy. Length is
  # now attacked only at the sanctioned substrate below
  # (digest_expand_below_target). ~$39/yr of retry calls recovered.
  podcast_expand_below_target: false
  # July 2026 improvements pack: narrative briefs were the length ceiling
  # (FPD precedent). Deepen the case brief before the podcast stage.
  digest_expand_below_target: true
  min_digest_words: 1200
  podcast_chain: true
tts: {}
audio:
  transition_sting: assets/music/transition_sting.mp3
  # July 30 2026 cold-open change: the hook is now the first thing
  # spoken (engine.intros.build_cold_open_spec + the podcast prompt), so
  # the voice starts at 0 and the music's alone-period is a short breath
  # rather than a ten-second wait. Long-form YouTube retention was 10.7%
  # (EN) / 6.3% (RU) with the old 10 s + ~18 s greeting open.
  voice_intro_delay: 0.0
  intro_duration: 3.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.5
  overlap_volume: 0.4
  fade_volume: 0.3
  outro_volume: 0.5
publishing:
  rss_file: unintended_consequences_podcast.rss
  rss_title: Unintended Consequences
  rss_description: Every weekday, one true story of good intentions gone sideways.
    From cobra bounties in colonial Delhi to recommendation algorithms, each episode
    follows a single case through the original idea, how it rolled out, the unintended
    fallout, and the lessons that still apply — told with empathy for the people who
    tried.
  rss_summary: Good intentions. Surprising results. Real lessons.
  rss_link: https://nerranetwork.com/unintended-consequences.html
  rss_author: Patrick
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/unintended-consequences.jpg
  rss_category: Education
  rss_subcategory: Self-Improvement
  rss_keywords: history, case studies, narrative, business mistakes, unintended consequences,
    decisions
  guid_prefix: unintended-consequences
  base_url: https://nerranetwork.com
  audio_subdir: digests/unintended_consequences
  summaries_json: digests/unintended_consequences/summaries_unintended_consequences.json
  summaries_podcast_name: unintended_consequences
  x_enabled: true
  x_env_prefix: PLANETTERRIAN_X_
  x_handle: '@planetterrian'
episode:
  prefix: Unintended_Consequences
  filename_pattern: '{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3'
  output_dir: digests/unintended_consequences
  mp3_glob: Unintended_Consequences_Ep*.mp3
chapters:
  enabled: true
  section_markers:
  - pattern: Unintended Consequences|episode (?:one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty)|good
      intentions|the cure was almost worse|well-meaning people|complex systems|reasonable
      plan|did the opposite|doing their best|case study|case today|today.?s (?:story|case|profile)|good
      to have you|glad you.?re here|settle in|welcome (?:back|to)|this is a show about|wrap
      the week|a (?:story|case) (?:that|of|about)|(?:two thousand|twenty)[\s-]twenty-six|^(?:Today|It.?s|Good|Welcome|Glad|Settle|Every|In|On|This|We|By|When|For|There)\b
    title: Introduction
    where: start
  - pattern: that.?s\b.*\bfor today|that wraps today.?s case|until next time|see you
      tomorrow|back tomorrow|before you go
    title: Closing
    where: end
newsletter:
  enabled: true
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: Unintended Consequences
  short_label: Consequences
  emoji: ⚖️
  newsletter_start_date: '2026-05-04'
  requires_financial_disclaimer: false
  length_target_words: 1100
content_tracking:
  enabled: true
slow_news:
  enabled: false
content_freshness:
  lookback_days: 0
  similarity_threshold: 1.0
youtube:
  podcast_playlist_id: PLRHMnzNNXPYCaZmqVHARd4L1Qi977FL5d
  enabled: true                 # Full-network rollout (200k quota, June 2026)
  channel: en
  category_id: 27
  # July 22 2026: smart Shorts start — every Short had opened on the 10 s
  # intro/branding beat (weakest possible Shorts opening). Threshold 3.5
  # matches the Tesla/SpaceX/FF fleet setting (5.0 default caused chronic
  # fallback on non-numeric transcript styles).
  shorts_start_mode: smart
  shorts_min_score_threshold: 3.5
  default_language: en
  privacy_status: public
  image_provider: grok
  grok_image_model: grok-imagine-image
  grok_image_descriptor: "documentary narrative photo, archival cinematic lighting, ultra-detailed"
  publish_long_form: true
  publish_shorts: true
  synthetic_disclosure: All audio narration is generated using AI voice synthesis.
    Curated and produced by Patrick at the Nerra Network in Vancouver, Canada.
  image_queries:
  - domino chain falling
  - ripple effect water
  - old library archives
  - vintage newspaper headlines
  - history museum exhibit
  - policy document gavel
  - factory workers historical
  - city skyline retrospective
  image_query_prefix: documentary
  video_genre: narrative-storytelling
  video_mood: thoughtful-narrative-introspective
  video_keywords:
  - narrative
  - case study
  - systems thinking
  - consequences
  - history
  - analysis
  video_visual_style: 'Documentary-style storytelling, archival footage, expert commentary,

    case study visuals, systems diagrams, historical context,

    cause-and-effect visualizations, thoughtful, contemplative aesthetic.'

