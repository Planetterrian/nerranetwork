name: Unintended Consequences
slug: unintended_consequences
description: A daily narrative podcast profiling inventions, policies, and systems
  that were meant to help — but triggered surprising, unintended consequences. From
  the Cobra Effect to social media algorithms, every episode follows a single case
  study through good intentions, implementation, unexpected fallout, and the lessons
  we can learn. Produced by the Nerra Network in Vancouver.
narrative_mode: true
topic_queue_file: shows/topic_queues/unintended_consequences.yaml
weekly_recap_on_sunday: false
min_articles_skip: 0
multilingual:
  enabled: false
llm:
  provider: xai
  system_prompt_file: shows/prompts/unintended_consequences_system.txt
  digest_prompt_file: shows/prompts/unintended_consequences_episode.txt
  podcast_prompt_file: shows/prompts/unintended_consequences_podcast.txt
  digest_temperature: 0.55
  podcast_temperature: 0.7
  max_tokens: 4500
  podcast_max_tokens: 9000
  min_podcast_words: 1300
  podcast_expand_below_target: true
  podcast_chain: true
tts: {}
audio:
  transition_sting: assets/music/transition_sting.mp3
  voice_intro_delay: 10.0
  intro_duration: 10.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.5
  overlap_volume: 0.4
  fade_volume: 0.3
  outro_volume: 0.5
publishing:
  rss_file: unintended_consequences_podcast.rss
  rss_title: Unintended Consequences
  rss_description: Every weekday, one true story of good intentions gone sideways.
    From cobra bounties in colonial Delhi to recommendation algorithms, each episode
    follows a single case through the original idea, how it rolled out, the unintended
    fallout, and the lessons that still apply — told with empathy for the people who
    tried.
  rss_summary: Good intentions. Surprising results. Real lessons.
  rss_link: https://nerranetwork.com/unintended-consequences.html
  rss_author: Patrick
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/unintended-consequences.jpg
  rss_category: Education
  rss_subcategory: Self-Improvement
  rss_keywords: history, case studies, narrative, business mistakes, unintended consequences,
    decisions
  guid_prefix: unintended-consequences
  base_url: https://nerranetwork.com
  audio_subdir: digests/unintended_consequences
  summaries_json: digests/unintended_consequences/summaries_unintended_consequences.json
  summaries_podcast_name: unintended_consequences
  x_enabled: true
  x_env_prefix: PLANETTERRIAN_X_
  x_handle: '@planetterrian'
episode:
