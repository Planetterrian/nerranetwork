# Longevity Weekly — launched Sep 2026 (Phase 1 of docs/new_shows_plan_2026_09_22.md
# §4.3). Weekly (Wednesday), Planetterrian-structured: the week's news plus one
# curriculum spotlight (shows/curricula/longevity.yaml, picked by the hook).
# Health posture (plan §4.3): education and awareness, never dosing,
# sourcing or protocols. The posture is in the identity line and the
# closing (engine/intros.py — supplied verbatim, so the model cannot drop
# it), the newsletter health callout, and every prompt. The claims gate is
# the network default enforce + STRIP: a sentence it cannot trace to a
# source does not ship. Spotlight evidence arrives as real Europe PMC
# abstracts (engine/europe_pmc.py via the hook), so it can be cited.
# YouTube stays OFF until a policy review — platform medical-content rules
# are a channel-level risk, not a per-video one.

# Sibling: Planetterrian Daily covers longevity news daily; this show is the
# weekly synthesis + mechanism show, and the hook hands it Planetterrian's
# week of headlines as update-don't-retell notes (engine/sibling_coverage.py).
#
# Distribution OFF at launch; on the cron since 2026-09-23 (Episode 1 reviewed first).
name: Longevity Weekly
slug: longevity
weekly_summary_segment: false   # a weekly show IS the week in review
memory_enabled: true
story_recurrence: true
description: Education about the science of aging — what people can do, how aging works, and which claims hold up — with the evidence read carefully every week. Never medical advice.

# Weekly show: every feed reads a week and a day (window_hours: 192), and
# nothing older than nine days by its page or feed date reaches the prompt
# (stale_article_days). Opt-in by name in the Offshore North guards.
stale_article_days: 9
# check_feeds.py 2026-09-22 (this session's egress, pipeline user agent);
# BioPharma Dive dropped 2026-09-23 (commercial pipeline, operator brief):
# Endpoints News 403s the fetcher's user agent; Fierce Biotech's pubDate is
# not a parseable date; ScienceDaily Hormones and Cell Metabolism were stale
# (monthly issue feeds). Wiley journal feeds 403 GitHub runners (Peptides
# dry run, 2026-09-22). Dropped. Re-grade from a runner before Episode 1.
sources:
- url: https://www.fightaging.org/feed/
  label: Fight Aging!
  window_hours: 192
- url: https://www.lifespan.io/feed/
  label: Lifespan.io
  window_hours: 192
- url: https://www.nature.com/nataging.rss
  label: Nature Aging
  window_hours: 192
- url: https://www.sciencedaily.com/rss/health_medicine/healthy_aging.xml
  label: ScienceDaily Healthy Aging
  window_hours: 192
- url: https://www.statnews.com/feed/
  label: STAT News
  window_hours: 192
# Education-first sources (operator brief 2026-09-23): human research on
# exercise, diet and sleep, and a clinical journal, in place of the biotech
# trade press. Probed 200 with posts inside the week, 2026-09-23.
- url: https://www.sciencedaily.com/rss/health_medicine/fitness.xml
  label: ScienceDaily Fitness
  window_hours: 192
- url: https://www.sciencedaily.com/rss/health_medicine/nutrition.xml
  label: ScienceDaily Nutrition
  window_hours: 192
- url: https://www.sciencedaily.com/rss/mind_brain/sleep_disorders.xml
  label: ScienceDaily Sleep
  window_hours: 192
- url: https://www.nature.com/nm.rss
  label: Nature Medicine
  window_hours: 192
- url: https://news.google.com/rss/search?q=longevity+research+OR+%22aging+research%22+when:7d&hl=en-US&gl=US&ceid=US:en
  label: Google News longevity research
  window_hours: 192
- url: https://news.google.com/rss/search?q=anti-aging+trial+OR+%22biological+age%22+when:7d&hl=en-US&gl=US&ceid=US:en
  label: Google News aging trials
  window_hours: 192
- url: https://news.google.com/rss/search?q=%22older+adults%22+study+exercise+OR+sleep+OR+diet+when:7d&hl=en-US&gl=US&ceid=US:en
  label: Google News healthy aging studies
  window_hours: 192

web_search_queries:
- longevity aging research news this week
- healthy aging study older adults this week
- aging clinical trial results this week

exclude_title_patterns:
# Commerce and dosing content only. Never bare "order" (an FDA or
# executive order is news) or "protocol" (a trial protocol is news).
- '\b(buy now|shop now|coupon|promo code|discount code|for sale)\b'
- '\b(peptide stack|dosing guide|how much to take|cycle guide)\b'
# Out-of-scope disease trials (Ep1 led with three of them): a result is
# aging news only when the source frames it as aging — these titles never do.
- '\b(Sj[oö]gren|psoriasis|eczema|migraine|schizophrenia|hepatitis|HIV|malaria|tuberculosis|cystic fibrosis|retinitis pigmentosa|ulcerative colitis|Crohn)\b'

keywords:
- aging
- ageing
- longevity
- lifespan
- healthspan
- senescence
- senolytic
- rapamycin
- mtor
- metformin
- nad
- reprogramming
- epigenetic
- biological age
- centenarian
- caloric restriction
- autophagy
- mitochondria
- glp-1
# NOT bare "trial": it admitted every BioPharma Dive trial on Ep1
# (Sjogren's, obesity maintenance, an eye gene therapy — none about aging).
- age-related
- frailty
- sarcopenia
- epigenetic clock
- geroscience
- older adults
- midlife
- later life

# X accounts (Sep 22 2026 Ep1 review): the aging-research institutions,
# journal and researchers who report trials and caveats rather than
# protocols. Source only — the show never posts to X. The whole week is
# read (x_lookback_hours). A claim with no study behind it is rejected by
# the digest's selection rules like any other article.
x_fetch_enabled: true
x_lookback_hours: 192
x_accounts:
- handle: NIAgov
  label: National Institute on Aging
  max_posts: 3
- handle: NatureAging
  label: Nature Aging
  max_posts: 3
- handle: EricTopol
  label: Eric Topol (Scripps Research)
  max_posts: 3
- handle: MattKaeberlein
  label: Matt Kaeberlein (aging researcher)
  max_posts: 3
- handle: PeterAttiaMD
  label: Peter Attia
  max_posts: 2
- handle: LifespanIO
  label: Lifespan.io
  max_posts: 2
- handle: BuckInstitute
  label: Buck Institute for Research on Aging
  max_posts: 2

# Full article text (engine/article_text.py) — the digest reads the articles.
fetch_full_text: 12
absence_sentence_filter: true
# Digest lints + X-source policy (Sep 23 2026 launch-cohort review; engine/digest_lint.py).
digest_lints:
- wyntk_hook_match
- x_only_lead
- evidence_rung
- items_without_source
x_posts_as_sources: secondary
# Primary publishers the lead claims should lean on (relevance bonus +
# a prompt tag; see engine/preferred_sources.py). Sep 23 2026.
preferred_domains:
- europepmc.org
- pubmed.ncbi.nlm.nih.gov
- clinicaltrials.gov
- fda.gov
- nejm.org
- thelancet.com

min_articles: 5
min_articles_skip: 3

max_weekly_cost_usd: 4.0

multilingual:
  enabled: false

llm:
  provider: xai
  # grok-4.7 on every stage that writes (digest + script; combined generation
  # stays eligible because podcast_model is unset), operator-directed
  # 2026-09-23: the new shows are the proving ground for the latest model,
  # and what works here is carried to the existing shows afterwards
  # (experiment new-shows-grok-47-2026-09-23, docs/model_upgrade_playbook.md).
  # The existing news shows stay on grok-4.3 (TestStagedGrok46Trial).
  # Revert: delete this line.
  model: grok-4.7
  # Low effort (Sep 23 2026): at default effort grok-4.7's digest call ran
  # past xAI's ~260 s edge disconnect on both Episode 1s (Vancouver,
  # Collingwood); the reviewer's 4.7 pin completes at "low". A fallback to
  # grok-4.3 drops this with the model (switch_to_network_default).
  reasoning_effort: low
  system_prompt_file: shows/prompts/longevity_system.txt
  digest_prompt_file: shows/prompts/longevity_digest.txt
  podcast_prompt_file: shows/prompts/longevity_podcast.txt
  digest_temperature: 0.4
  podcast_temperature: 0.6
  # 8000: grok-4.7's reasoning shares this budget with the digest AND the
  # claims ledger at its tail (Prediction Markets Ep1, 2026-09-23: 5,384 of
  # 5,500 used, ledger never arrived). A ceiling, not a spend.
  max_tokens: 8000
  podcast_max_tokens: 9000
  # Sep 23 2026: targets set to what the format's digest supports. The
  # skip floor is 60% of this; Ep1 runs produced 1,213 words against 1,400. Length is still
  # a digest-side lever (CLAUDE.md) — this is the target, not a retry.
  min_podcast_words: 1200
  podcast_expand_below_target: false
  min_digest_words: 1300
  digest_expand_below_target: true

tts: {}

audio:
  # Reuses Planetterrian's theme (the health strand) until a dedicated
  # track is commissioned (plan §5c).
  music_file: assets/music/oilers-pride.mp3
  transition_sting: assets/music/transition_sting.mp3
  voice_intro_delay: 0.0
  intro_duration: 3.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.6
  overlap_volume: 0.5
  fade_volume: 0.4
  outro_volume: 0.6

publishing:
  rss_file: longevity_podcast.rss
  rss_title: Longevity Weekly
  rss_description: 'The science of aging, read carefully. Every Wednesday: the week''s most useful aging research — exercise, sleep, diet, the biology and the tests — and one mechanism of aging explained properly — what it is, what the evidence shows in animals and in people, and what it does not show. Education only; never medical advice.'
  rss_link: https://nerranetwork.com/longevity.html
  rss_author: Patrick
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/longevity.jpg
  rss_category: Health & Fitness
  rss_subcategory: Medicine
  rss_category2: "Science"
  rss_subcategory2: "Life Sciences"
  rss_keywords: aging, ageing, longevity, lifespan, healthspan, senescence, senolytic, rapamycin, mtor, metformin
  guid_prefix: longevity
  base_url: https://nerranetwork.com
  audio_subdir: digests/longevity
  summaries_json: digests/longevity/summaries_longevity.json
  summaries_podcast_name: longevity
  player_html: longevity.html
  summaries_html: longevity-summaries.html
  x_enabled: false
  x_env_prefix: X_
  host_name: Patrick
  host_kind: human

episode:
  prefix: Longevity_Weekly
  filename_pattern: '{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3'
  output_dir: digests/longevity
  mp3_glob: Longevity_Weekly_Ep*.mp3

chapters:
  enabled: true
  section_markers:
  - pattern: This is Longevity Weekly|first episode of|Longevity Weekly, episode
    title: Introduction
    where: start
  - pattern: this week'?s (spotlight|mechanism)|let'?s look (closely|properly) at
    title: Mechanism of the Week
  - pattern: worth knowing
    title: Worth Knowing
  - pattern: That's Longevity Weekly|see you next week
    title: Closing
    where: end

slow_news:
  enabled: false

newsletter:
  enabled: false
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: Longevity Weekly
  short_label: Longevity
  emoji: 🌱
  newsletter_start_date: '2026-10-01'
  requires_financial_disclaimer: false
  requires_health_disclaimer: true
  length_target_words: 1300

content_tracking:
  section_patterns: {}

source_integrity:
  enabled: true
  enforce: true
  on_failure: strip

youtube:
  enabled: false                # OFF until a medical-content policy review
  channel: en
  category_id: 27
  shorts_start_mode: smart
  shorts_min_score_threshold: 3.5
  default_language: en
  privacy_status: public
  image_provider: grok
  grok_image_model: grok-imagine-image
  grok_image_descriptor: "cinematic laboratory science photo, soft lighting, ultra-detailed"
  image_queries:
  - research laboratory bench with pipettes
  - microscope in a clinical lab
  - scientist reviewing data on a screen
  - molecular model on a desk
  - hospital research corridor
  - library of scientific journals
  image_query_prefix: ''
  tags:
  - longevity
  - health science
  - medical research
