# Omni View Europe — Phase 3 of docs/new_shows_plan_2026_09_22.md §4.7.
# One of the five Omni View regional desks read by Mira, the network's AI
# host. The desks share ONE format: prompts include
# shows/prompts/_shared/omni_desk_*.txt, and the only per-desk prompt text is
# the region file (shows/prompts/omni_desks/). Everything per-desk that a
# registry needs lives in engine/omni_desks.py.
#
# Distribution OFF at launch (RSS + site + blog). NOT on a cron: Episode 1 is
# produced by manual dispatch and listened to before the launch PR adds the
# schedule (06:46 UTC (08:46 CEST), plan §6).
name: Omni View Europe
slug: omni_view_europe
weekly_summary_segment: true   # daily cadence; Sunday adds a short week-in-review segment
memory_enabled: true
story_recurrence: true
description: 'The day in Europe, one region deep: the decisions in Brussels, London and the capitals, the war in Ukraine, the economies and the elections — with one contested question argued fairly both ways and one sign of progress. Read by Mira, the Nerra Network''s AI host; every story from named newsrooms.'

fetch_full_text: 16
absence_sentence_filter: true
# Digest lints + X-source policy (Sep 23 2026 launch-cohort review; engine/digest_lint.py).
digest_lints:
- wyntk_hook_match
- x_only_lead
- progress_watch_thin
- region_world_thin
# Progress Watch may revisit one of the day's stories by contract; the overlap
# dedup dropping it left a fragment that bought a full regeneration (Top World
# Ep2, 2026-09-24). progress_watch_thin judges substance; never a deletion.
digest_overlap_exempt_sections:
- Progress Watch
x_posts_as_sources: linked_only
stale_article_days: 3

# Probed 2026-09-23 from this session's egress (200, posts inside the day);
# re-grade from a runner (`python check_feeds.py omni_view_europe`) before Episode 1.
# No `keywords:` list on purpose: these feeds are regional by construction,
# and a title keyword filter would drop on-region stories whose titles name
# no country. The REGION RULE in the prompt decides what qualifies.
sources:
- url: https://feeds.bbci.co.uk/news/world/europe/rss.xml
  label: BBC Europe
- url: https://www.theguardian.com/world/europe-news/rss
  label: The Guardian Europe
- url: https://www.france24.com/en/europe/rss
  label: France 24 Europe
- url: https://rss.dw.com/rdf/rss-en-eu
  label: DW Europe
- url: https://www.euronews.com/rss?level=theme&name=news
  label: Euronews
- url: https://www.politico.eu/feed/
  label: Politico Europe
- url: https://www.irishtimes.com/arc/outboundfeeds/feed-irish-news/?outputType=xml
  label: The Irish Times
- url: https://balkaninsight.com/feed/
  label: Balkan Insight
- url: https://www.themoscowtimes.com/rss/news
  label: The Moscow Times
- url: https://notesfrompoland.com/feed/
  label: Notes from Poland
- url: https://news.google.com/rss/search?q=European+Commission+OR+%22European+Parliament%22+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News Europe 1
- url: https://news.google.com/rss/search?q=UK+government+OR+Westminster+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News Europe 2
- url: https://news.google.com/rss/search?q=Germany+government+OR+Bundestag+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News Europe 3
- url: https://news.google.com/rss/search?q=France+government+OR+Elysee+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News Europe 4
- url: https://news.google.com/rss/search?q=Ukraine+war+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News Europe 5
- url: https://news.google.com/rss/search?q=Nordic+OR+Sweden+OR+Norway+OR+Finland+OR+Denmark+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News Europe 6
- url: https://news.google.com/rss/search?q=Spain+OR+Portugal+OR+Italy+government+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News Europe 7

web_search_queries:
- Europe news today
- European Union decision today
- Ukraine war news today

# Omni View's nine anti-tabloid filters plus the desk additions
# (engine.omni_desks.ANTI_TABLOID_PATTERNS — keep the two in sync).
exclude_title_patterns:
- 'red carpet'
- '\bLove Island\b'
- '\bStrictly Come Dancing\b'
- 'reality TV star'
- '\broyal\b.*\b(fashion|dress|style|outfit)\b'
- 'wardrobe malfunction'
- '\bpaparazzi\b'
- '\bnet worth\b'
- 'steps out (?:in|with)'
- '\b(live updates?|as it happened|live blog)\b'
- '\b(in pictures|photos of the (day|week)|week in pictures)\b'
- '\b(quiz|crossword|wordle)\b'
- '\b(obituar(y|ies)|in memoriam)\b'

x_fetch_enabled: true
x_accounts:
- handle: euronews
  label: Euronews
  max_posts: 3
- handle: dwnews
  label: DW News
  max_posts: 3
- handle: BBCWorld
  label: BBC World
  max_posts: 2
- handle: POLITICOEurope
  label: Politico Europe
  max_posts: 3

min_articles: 8
min_articles_skip: 4

# Cost circuit breaker — TOP LEVEL (nested keys are ignored; see _defaults).
max_weekly_cost_usd: 7.0

multilingual:
  enabled: false

llm:
  provider: xai
  # grok-4.7 at low effort, like every new show (operator brief 2026-09-23;
  # experiment new-shows-grok-47-2026-09-23). A run whose pinned model does
  # not answer falls back to grok-4.3 and records it.
  model: grok-4.7
  reasoning_effort: low
  # Sep 24 2026: stream the completion (xAI's guidance for reasoning models);
  # 9 of the cohort's first 24 episodes fell back on a dropped non-streaming
  # connection. False = the pre-existing request.
  stream: true
  system_prompt_file: shows/prompts/omni_view_europe_system.txt
  digest_prompt_file: shows/prompts/omni_view_europe_digest.txt
  podcast_prompt_file: shows/prompts/omni_view_europe_podcast.txt
  digest_temperature: 0.4
  podcast_temperature: 0.7
  # Room for grok-4.7's reasoning AND the claims ledger at the tail
  # (Prediction Markets Ep1 used 5,384 of 5,500 and lost its ledger).
  max_tokens: 8000
  podcast_max_tokens: 9500
  # A 10-12 minute brief. The skip floor is 60% of this.
  min_podcast_words: 1300
  podcast_expand_below_target: false
  min_digest_words: 1100
  digest_expand_below_target: true

tts:
  # Mira's voice (Grok built-in `ara`), no speech wrap — the Vancouver
  # calibration shape (plan §2b).
  voice_id: ara
  speech_wrap_open: ""
  speech_wrap_close: ""

audio:
  # The Omni View theme until the desk variant is commissioned (plan §5c).
  music_file: assets/music/OmniView.mp3
  transition_sting: assets/music/transition_sting.mp3
  voice_intro_delay: 0.0
  intro_duration: 3.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.6
  overlap_volume: 0.5
  fade_volume: 0.4
  outro_volume: 0.6

publishing:
  rss_file: omni_view_europe_podcast.rss
  rss_title: Omni View Europe
  rss_description: 'The day in Europe, one region deep: the decisions in Brussels, London and the capitals, the war in Ukraine, the economies and the elections — with one contested question argued fairly both ways and one sign of progress. Read by Mira, the Nerra Network''s AI host; every story from named newsrooms.'
  rss_link: https://nerranetwork.com/omni-view-europe.html
  rss_author: Mira (AI host), Nerra Network
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/omni-view-europe.jpg
  rss_category: News
  rss_subcategory: Daily News
  # Secondary must differ from the primary (Apple rejects a duplicate).
  rss_category2: Government
  rss_keywords: europe news, eu news, uk news, ukraine war, european politics, daily news briefing
  guid_prefix: omni-view-europe
  base_url: https://nerranetwork.com
  audio_subdir: digests/omni_view_europe
  summaries_json: digests/omni_view_europe/summaries_omni_view_europe.json
  summaries_podcast_name: omni_view_europe
  player_html: omni-view-europe.html
  summaries_html: omni-view-europe-summaries.html
  x_enabled: false
  x_env_prefix: X_
  host_name: Mira
  host_kind: ai

episode:
  prefix: Omni_View_Europe
  filename_pattern: '{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3'
  output_dir: digests/omni_view_europe
  mp3_glob: Omni_View_Europe_Ep*.mp3

chapters:
  enabled: true
  # Anchors only — never a topic word. The Lead and Across the Region items
  # take their chapters from the digest headlines; the segments key on
  # REQUIRED phrases the podcast prompt builds a sentence around, never
  # inside the opening window (where: body — the Vancouver Ep1 lesson).
  section_markers:
  - pattern: This is Omni View Europe|first episode of|Omni View Europe, episode
    title: Introduction
    where: start
  - pattern: across the region
    title: Across the Region
    where: body
  - pattern: also today
    title: Also Today
    where: body
  - pattern: the wider world
    title: The Region and the World
    where: body
  - pattern: case on both sides
    title: Both Sides
    where: body
  - pattern: a sign of progress
    title: Progress Watch
    where: body
  - pattern: That's Omni View Europe|see you tomorrow
    title: Closing
    where: end

slow_news:
  enabled: false

newsletter:
  enabled: false
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: Omni View Europe
  short_label: Europe
  emoji: 🇪🇺
  newsletter_start_date: '2026-10-15'
  requires_financial_disclaimer: false
  length_target_words: 1300

content_tracking:
  section_patterns: {}

youtube:
  enabled: false                 # OFF at launch (plan §7: a second channel is a data decision)
  channel: en
  category_id: 25
  shorts_start_mode: smart
  shorts_min_score_threshold: 3.5
  default_language: en
  privacy_status: public
  image_provider: grok
  grok_image_model: grok-imagine-image
  grok_image_descriptor: "cinematic news photo, natural light, ultra-detailed"
  image_queries:
  - European Parliament building in Strasbourg
  - Brussels Berlaymont building
  - old town square in a European capital at dawn
  - train crossing a river bridge in central Europe
  image_query_prefix: ''
  tags:
  - world news
  - europe
  - daily news
