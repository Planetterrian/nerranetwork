  label: IEEE Spectrum Semiconductors
- url: https://news.google.com/rss/search?q=TSMC+OR+%22advanced+packaging%22+OR+CoWoS&hl=en-US&gl=US&ceid=US:en
  label: Google News TSMC & packaging
- url: https://news.google.com/rss/search?q=%22HBM%22+memory+SK+Hynix+OR+Samsung+OR+Micron&hl=en-US&gl=US&ceid=US:en
  label: Google News HBM
- url: https://news.google.com/rss/search?q=%22data+center%22+power+grid+gigawatt&hl=en-US&gl=US&ceid=US:en
  label: Google News data-centre power
- url: https://news.google.com/rss/search?q=Nvidia+Blackwell+OR+Rubin+GPU&hl=en-US&gl=US&ceid=US:en
  label: Google News Nvidia GPUs
- url: https://news.google.com/rss/search?q=chip+%22export+controls%22&hl=en-US&gl=US&ceid=US:en
  label: Google News export controls

web_search_queries:
- AI data center construction news today
- AI chip GPU accelerator announcement today
- semiconductor fab advanced packaging news
- data center power grid interconnection AI

# Tom's Hardware and TechPowerUp carry heavy consumer-hardware traffic.
exclude_title_patterns:
- '\bbest (gaming )?(laptops?|monitors?|keyboards?|mice|headsets?)\b'
# Shopping only — never the bare word "deal": power, supply and chip deals
# are this show's news.
- '\b(best deals?|black friday|prime day|coupon|promo code|price drop|lowest price|% off)\b'
- '\b(game|gaming) (review|benchmark)s?\b'
- '\bhow to\b'

keywords:
- gpu
- accelerator
- chip
- chips
- semiconductor
- silicon
- wafer
- fab
- foundry
- tsmc
- nvidia
- amd
- intel
- broadcom
