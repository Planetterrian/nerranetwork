# AI Chips & Data Centres Daily — launched Sep 2026 (Phase 1 of
# docs/new_shows_plan_2026_09_22.md §4.1). Modelled on Models & Agents:
# same digest-first structure and content discipline, different layer of
# the stack. M&A owns models, agents, software and research; this show owns
# silicon, systems, data-centre construction, power and cooling, the supply
# chain and export policy. The boundary is written into both prompts and a
# sibling-coverage block from the hook (shows/hooks/ai_chips.py).
#
# Distribution is OFF at launch (RSS + site + blog only) — the First
# Principles launch pattern. On the cron since 2026-09-23, after Episode 1 was reviewed.
name: AI Chips & Data Centres Daily
slug: ai_chips
weekly_summary_segment: true   # daily cadence; Sunday adds a short week-in-review segment
memory_enabled: true
story_recurrence: true
description: The silicon, the buildings and the power behind AI — what shipped,
  what broke ground, what it costs. A daily engineering-and-capex briefing on
  AI chips and data centres.

# Sources probed live 2026-09-22 (Appendix B of the plan). Re-grade from a
# runner with `python check_feeds.py ai_chips` before Episode 1.
sources:
- url: https://newsletter.semianalysis.com/feed
  label: SemiAnalysis
- url: https://www.nextplatform.com/feed/
  label: The Next Platform
- url: https://www.hpcwire.com/feed/
  label: HPCwire
- url: https://www.servethehome.com/feed/
  label: ServeTheHome
