  - hyperscale data center server aisle
  - silicon wafer in clean room
  - gpu accelerator board close-up
  - data center cooling towers
  - high voltage substation at dusk
  - semiconductor fab exterior
  - liquid cooled server rack
  image_query_prefix: ''
  tags:
  - ai chips
  - data centers
  - semiconductors
  - gpu
  - ai infrastructure
