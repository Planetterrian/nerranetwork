# X accounts (Sep 22 2026 Ep1 review): the companies that ship the silicon
# and the analysts who count it. Fetched as a content SOURCE only — the show
# never posts to X (x_enabled stays false). A handle that returns nothing is
# logged "No recent posts" and costs one search call; prune it.
x_fetch_enabled: true
x_accounts:
- handle: nvidia
  label: NVIDIA
  max_posts: 3
- handle: AMD
  label: AMD
  max_posts: 3
- handle: intel
  label: Intel
  max_posts: 2
- handle: MicronTech
  label: Micron
  max_posts: 2
- handle: Arm
  label: Arm
  max_posts: 2
- handle: CoreWeave
  label: CoreWeave
  max_posts: 2
- handle: dylan522p
  label: Dylan Patel (SemiAnalysis)
  max_posts: 3
- handle: ServeTheHome
  label: ServeTheHome
  max_posts: 2

# Full article text for the top articles (engine/article_text.py): Ep1's
# items were written from feed teasers and ended in "no figures were
# disclosed" eight times out of ten. The digest now reads the articles.
fetch_full_text: 12
absence_sentence_filter: true

min_articles: 6
min_articles_skip: 4

# Cost circuit breaker — TOP LEVEL (nested keys are ignored; see _defaults).
max_weekly_cost_usd: 8.0

multilingual:
  enabled: false

llm:
  provider: xai
  # grok-4.7 on every stage that writes (digest + script; combined generation
  # stays eligible because podcast_model is unset), operator-directed
  # 2026-09-23: the new shows are the proving ground for the latest model,
  # and what works here is carried to the existing shows afterwards
  # (experiment new-shows-grok-47-2026-09-23, docs/model_upgrade_playbook.md).
  # The existing news shows stay on grok-4.3 (TestStagedGrok46Trial).
  # Revert: delete this line.
  model: grok-4.7
  system_prompt_file: shows/prompts/ai_chips_system.txt
  digest_prompt_file: shows/prompts/ai_chips_digest.txt
  podcast_prompt_file: shows/prompts/ai_chips_podcast.txt
  digest_temperature: 0.5
  podcast_temperature: 0.7
  max_tokens: 5000
  podcast_max_tokens: 10000
  # Sep 23 2026: targets set to what the format's digest supports. The
  # skip floor is 60% of this; Ep1 runs produced 912 words against 1,500 (61% — one bad day from a skip). Length is still
  # a digest-side lever (CLAUDE.md) — this is the target, not a retry.
  min_podcast_words: 1300
  # Length levers are digest-side only (CLAUDE.md live constraints).
  podcast_expand_below_target: false
  min_digest_words: 1300
  digest_expand_below_target: true

tts: {}

audio:
  # Reuses the AI strand's theme until a dedicated track is commissioned
  # (plan §5c; M&A and MAB already share it).
  music_file: assets/music/ModelsAgents.mp3
  transition_sting: assets/music/transition_sting.mp3
  voice_intro_delay: 0.0
  intro_duration: 3.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.6
  overlap_volume: 0.5
  fade_volume: 0.4
  outro_volume: 0.6

publishing:
  rss_file: ai_chips_podcast.rss
  rss_title: AI Chips & Data Centres Daily
  rss_description: 'The silicon, the buildings and the power behind AI. Every day:
    the chips and systems that shipped, the data centres that broke ground or
    switched on, the grid and cooling constraints that decide where they go, and
    the supply chain and export rules underneath it all — with the numbers.
    Engineering and capex first, never hype.'
  rss_link: https://nerranetwork.com/ai-chips.html
  rss_author: Patrick
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/ai-chips.jpg
  rss_category: Technology
  rss_category2: "News"
  rss_subcategory2: "Tech News"
  rss_keywords: ai chips, gpu, data center, semiconductors, nvidia, tsmc, hbm, ai
    infrastructure
  guid_prefix: ai-chips
  base_url: https://nerranetwork.com
  audio_subdir: digests/ai_chips
  summaries_json: digests/ai_chips/summaries_ai_chips.json
  summaries_podcast_name: ai_chips
  player_html: ai-chips.html
  summaries_html: ai-chips-summaries.html
  x_enabled: false
  x_env_prefix: X_
  host_name: Patrick
  host_kind: human

episode:
  prefix: AI_Chips
  filename_pattern: '{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3'
  output_dir: digests/ai_chips
  mp3_glob: AI_Chips_Ep*.mp3

chapters:
  enabled: true
  # Anchors only — never a topic word (Sep 4 2026: M&A's "open.source"
  # marker fired on news content and titled the whole body). The host never
  # announces sections, so news chapters come from the digest headlines;
  # the Teardown keys on its REQUIRED phrase "take it apart".
  section_markers:
  - pattern: This is AI Chips and Data Centres|first episode of|AI Chips and Data Centres, episode
    title: Introduction
    where: start
  - pattern: take (it|this|that) apart
    title: The Teardown
  - pattern: Before we go|before we wrap
    title: Tomorrow Teaser
    where: end
  - pattern: That's AI Chips and Data Centres|that.?s.*for today|until tomorrow
    title: Closing
    where: end

slow_news:
  enabled: false

newsletter:
  enabled: false
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: AI Chips & Data Centres Daily
  short_label: AI Chips
  emoji: 🔌
  newsletter_start_date: '2026-10-01'
  requires_financial_disclaimer: false
  length_target_words: 1300

content_tracking:
  section_patterns: {}

youtube:
  enabled: false                 # OFF at launch (plan §7; EN channel cadence)
  channel: en
  category_id: 28
  shorts_start_mode: smart
  shorts_min_score_threshold: 3.5
  default_language: en
  privacy_status: public
  image_provider: grok
  grok_image_model: grok-imagine-image
  grok_image_descriptor: "cinematic data-centre and semiconductor photo, dramatic lighting, ultra-detailed"
