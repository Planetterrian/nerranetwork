  # 187 kbps/48 kHz, added June 13 2026 — IPO-day launch). Timing/volume
  # params follow the network's May 13 shape (10 s music-only intro,
  # 45 s under voice, 20-30 s outro), same as First Principles.
  # A/B-listen the first mixed episode per landmine #17.
  music_file: assets/music/spacex.mp3
  transition_sting: assets/music/transition_sting.mp3
