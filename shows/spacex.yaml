# Generated by scripts/scaffold_show.py — review before first production run.
name: "SpaceX Daily"
slug: spacex
memory_enabled: true
description: "The daily companion for following SpaceX as a public company (Nasdaq: SPCX). Launched the day of the largest IPO in history: Starship development, Falcon launch cadence, Starlink, Dragon missions, the SPCX market picture, and the engineering and economics behind the push to make life multiplanetary. The day's developments with sources, what the spaceflight community is buzzing about, one honest counterpoint, and a daily engineering-first look at the long arcs. Not financial advice."

weekly_recap_on_sunday: true

sources:
  - url: "https://www.teslarati.com/category/spacex/feed/"
    label: Teslarati SpaceX
  - url: "https://www.nasaspaceflight.com/feed/"
    label: NASASpaceflight
  - url: "https://spacenews.com/feed/"
    label: SpaceNews
  - url: "https://arstechnica.com/space/feed/"
    label: Ars Technica Space
  - url: "https://spaceflightnow.com/feed/"
    label: Spaceflight Now
  - url: "https://www.reddit.com/r/spacex/.rss"
    label: r/spacex
  - url: "https://www.reddit.com/r/SpaceXLounge/.rss"
    label: r/SpaceXLounge
  - url: "https://news.google.com/rss/search?q=SpaceX+Starship&hl=en-US&gl=US&ceid=US:en"
    label: "Google News — SpaceX Starship"
  - url: "https://news.google.com/rss/search?q=SpaceX+Starlink+launch&hl=en-US&gl=US&ceid=US:en"
    label: "Google News — SpaceX Starlink launch"
  - url: "https://news.google.com/rss/search?q=SpaceX+Raptor+OR+Starbase+OR+%22launch+pad%22&hl=en-US&gl=US&ceid=US:en"
    label: "Google News — SpaceX hardware & infrastructure"
  - url: "https://news.google.com/rss/search?q=SpaceX+%22AI+satellite%22+OR+%22orbital+data+center%22+OR+Starshield&hl=en-US&gl=US&ceid=US:en"
    label: "Google News — SpaceX AI satellites & Starshield"
  - url: "https://news.google.com/rss/search?q=xAI+OR+Grok+datacenter+OR+Colossus+OR+%22direct+to+cell%22&hl=en-US&gl=US&ceid=US:en"
    label: "Google News — xAI / Grok / compute"

web_search_queries:
  - SpaceX news today
  - Starship launch update
  - SPCX stock market news
  - SpaceX Raptor Starship launch infrastructure news
  - SpaceX orbital data center AI satellites Starshield
  - xAI Grok datacenter Colossus news

keywords:
  - spacex
  - starship
  - starlink
  - falcon 9
  - falcon heavy
  - dragon
  - raptor
  - starbase
  - super heavy
  - merlin
  - crew dragon
  - cargo dragon
  - boca chica
  - vandenberg
  - cape canaveral
  - mechazilla
  - spcx
  - nasdaq
  # Launch infrastructure & hardware breadth
  - gigabay
  - tower catch
  - orbital refueling
  - launch pad
  - starshield
  - direct to cell
  - ai satellite
  - orbital data center
  # Musk-ecosystem AI thread (the dedicated AI section)
  - xai
  - grok
  - colossus
  - data center
  - datacenter

# Curated like TST's commentator roster (landmine: the X fetch prompt
# requires SUBSTANTIVE posts — emoji-spam accounts were removed from the
# Tesla list in June 2026; apply the same bar before adding handles here).
x_accounts:
  - handle: SpaceX
    label: SpaceX Official
    max_posts: 5
  - handle: NASASpaceflight
    label: NASASpaceflight
    max_posts: 5
  - handle: elonmusk
    label: Elon Musk
    max_posts: 3
  - handle: SciGuySpace
    label: Eric Berger (Ars Technica)
    max_posts: 3
  - handle: thesheetztweetz
    label: Michael Sheetz (CNBC Space)
    max_posts: 3
  - handle: StarshipGazer
    label: StarshipGazer
    max_posts: 3
  # Musk-ecosystem AI thread (the dedicated AI section)
  - handle: xai
    label: xAI
    max_posts: 3
  - handle: grok
    label: Grok
    max_posts: 2

min_articles: 8
min_articles_skip: 5

llm:
  provider: xai
  system_prompt_file: shows/prompts/spacex_system.txt
  digest_prompt_file: shows/prompts/spacex_digest.txt
  podcast_prompt_file: shows/prompts/spacex_podcast.txt
  digest_temperature: 0.5
  podcast_temperature: 0.7
  max_tokens: 4000
  podcast_max_tokens: 8000
  # ONE unified length target (June 2026): the prompt states
  # 1,500-1,900 words ~ 11-14 min exactly once; this floor sits just
  # under it so the digest-carrying expand-retry fires on anything
  # short of a full episode.
  #
  # Recalibrated 1700 -> 1300 after Ep2 SKIPPED (912w): grok-4.3 plateaus
  # and a news show's podcast is capped by its digest, so a thin Saturday
  # (worsened by Ep1's one-time double-run polluting the 7-day URL dedup)
  # fell under the old soft skip floor (0.6 x 1700 = 1020). The same
  # digest-ceiling/plateau the FF/UC/FP reviews documented. The fix that
  # preserves quality is the Engineering Deep Dive length lever (licensed
  # to use the model's own physics/economics knowledge) in the podcast
  # prompt; this floor change just stops a quality-adequate ~10-min
  # episode from skipping (soft skip floor now 0.6 x 1300 = 780 ~ 5 min).
  min_podcast_words: 1300
  podcast_expand_below_target: true
  podcast_chain: true

tts: {}

audio:
  # Theme music "Launch Window" (operator-produced track, 4:26 @
  # 187 kbps/48 kHz, added June 13 2026 — IPO-day launch). Timing/volume
  # params follow the network's May 13 shape (10 s music-only intro,
  # 45 s under voice, 20-30 s outro), same as First Principles.
  # A/B-listen the first mixed episode per landmine #17.
  music_file: assets/music/spacex.mp3
  transition_sting: assets/music/transition_sting.mp3
  voice_intro_delay: 10.0
  intro_duration: 10.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.5
  overlap_volume: 0.4
  fade_volume: 0.3
  outro_volume: 0.5

publishing:
  rss_file: spacex_podcast.rss
  rss_title: "SpaceX Daily"
  rss_description: "The daily companion for following SpaceX as a public company (Nasdaq: SPCX). Starship, Falcon, Starlink, Dragon, the SPCX market picture, and the engineering and economics behind the push to make life multiplanetary — with sources, community buzz, one honest counterpoint every day, and a daily engineering deep dive. Not financial advice."
  rss_link: https://nerranetwork.com/spacex.html
  rss_author: Patrick
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/spacex.jpg
  rss_category: Technology
  rss_keywords: "spacex, spcx, spacex stock, starship, starlink, falcon 9, falcon heavy, dragon, raptor, starbase"
  guid_prefix: spacex
  base_url: https://nerranetwork.com
  audio_subdir: digests/spacex
  summaries_json: digests/spacex/summaries_spacex.json
  summaries_podcast_name: spacex
  player_html: spacex.html
  summaries_html: spacex-summaries.html
  x_enabled: false
  x_env_prefix: ""

episode:
  prefix: SpaceX_Daily
  filename_pattern: "{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3"
  output_dir: digests/spacex
  mp3_glob: "SpaceX_Daily_Ep*.mp3"

chapters:
  enabled: true
  # June 2026 lessons baked in at launch: positional `where` anchors
  # (the Tesla chapter-bug class) and a Closing pattern that covers
  # EVERY closing-pool variant in engine/intros.py (guarded by
  # tests/test_spacex_show.py).
  # NOTE: chapters parse the POST-pronunciation script (Ep001 lesson):
  # assets/pronunciation.py maps "SpaceX" -> "Space X" and "SPCX" ->
  # "S P C X" for TTS, so every pattern must tolerate both forms.
  section_markers:
    - pattern: "Space ?X Daily|welcome to Space ?X"
      title: "Introduction"
      where: start
    - pattern: "on the market side|market watch|S ?P ?C ?X (closed|is at|is trading|opened)"
      title: "Market Watch"
    - pattern: "one thing worth watching|worth keeping an eye on|the counterpoint"
      title: "The Counterpoint"
    - pattern: "engineering deep dive|engineering angle|from an engineering standpoint|the engineering reality"
      title: "The Engineering Angle"
    - pattern: "on the ai front|the ai and compute|ai and compute side|over in the ai"
      title: "AI & Compute"
    - pattern: "Before we go|before we wrap"
      title: "Tomorrow Teaser"
      where: end
    - pattern: "that.?s.*for today|that.?s a wrap|that covers|see you (tomorrow|next time)"
      title: "Closing"
      where: end

newsletter:
  enabled: true
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: "SpaceX Daily"
  short_label: "SpaceX Daily"
  emoji: "🚀"
  newsletter_start_date: "2026-06-12"
  # SpaceX is a public company (SPCX) and the show carries a daily
  # Market Watch — newsletters get the standard financial disclaimer.
  requires_financial_disclaimer: true
  length_target_words: 1200

slow_news:
  enabled: true

content_tracking:
  section_patterns: {}

youtube:
  enabled: false
  channel: en
  category_id: 28
  privacy_status: public
  image_queries:
    - spacex rocket launch
    - starship rocket
    - falcon 9 landing
    - rocket engine test
  image_query_prefix: ""
  image_provider: pexels
