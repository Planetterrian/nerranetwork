chapters:
  enabled: true
  # June 2026 lessons baked in at launch: positional `where` anchors
  # (the Tesla chapter-bug class) and a Closing pattern that covers
  # EVERY closing-pool variant in engine/intros.py (guarded by
  # tests/test_spacex_show.py).
  # NOTE: chapters parse the POST-pronunciation script (Ep001 lesson):
  # assets/pronunciation.py maps "SpaceX" -> "Space X" and "SPCX" ->
  # "S P C X" for TTS, so every pattern must tolerate both forms.
  section_markers:
    - pattern: "Space ?X Daily|welcome to Space ?X"
      title: "Introduction"
      where: start
    # Closing is listed BEFORE Market Watch so it wins the sign-off line.
    # The code-supplied closing block appends the SPCX price ("…that's a
    # wrap. S P C X closed at $X…"), which the Market Watch pattern below
    # also matches. On weekly-recap episodes there's no separate Market
    # Watch SEGMENT to consume that marker first, so the sign-off was being
    # mis-titled "Market Watch" and the episode shipped with NO Closing
    # chapter (Ep3 2026-06-14). `where: end` keeps Closing pinned to the
    # sign-off; daily episodes still get a Market Watch chapter from their
    # real segment. Orphan-closing class (cf. EI/OV/MAB/FP/UC).
    - pattern: "that.?s.*for today|that.?s a wrap|that covers|see you (tomorrow|next time)"
      title: "Closing"
      where: end
    - pattern: "on the market side|market watch|S ?P ?C ?X (closed|is at|is trading|opened)"
      title: "Market Watch"
    - pattern: "one thing worth watching|worth keeping an eye on|the counterpoint"
      title: "The Counterpoint"
    - pattern: "engineering deep dive|engineering angle|from an engineering standpoint|the engineering reality"
      title: "The Engineering Angle"
    # NOTE: chapters parse the POST-pronunciation script where the TTS
    # layer spaces acronyms ("AI" -> "A I"), so the pattern must tolerate
    # "a i" as well as "ai" (Ep2 lesson — the segment shipped without a
    # chapter because "on the ai front" didn't match "on the a i front").
    - pattern: "on the a ?i front|the a ?i and compute|a ?i and compute side|over in the a ?i"
      title: "AI & Compute"
    - pattern: "Before we go|before we wrap"
      title: "Tomorrow Teaser"
      where: end

newsletter:
  enabled: true
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: "SpaceX Daily"
  short_label: "SpaceX Daily"
  emoji: "🚀"
  newsletter_start_date: "2026-06-12"
  # SpaceX is a public company (SPCX) and the show carries a daily
  # Market Watch — newsletters get the standard financial disclaimer.
  requires_financial_disclaimer: true
  length_target_words: 1200

slow_news:
  enabled: true

content_tracking:
  section_patterns: {}

youtube:
  # SpaceX Daily podcast playlist on @NerraNetwork — created and flagged as
  # a podcast in YouTube Studio on Jun 14 2026 (landmine #15). The runner
  # adds each future upload to this playlist via playlistItems.insert; once
  # added, episodes also surface under YouTube Podcasts.
  podcast_playlist_id: PLRHMnzNNXPYAmq9rUDUCN2iCk4v9WdLpw
  # June 14 2026 — SpaceX Daily takes MAB's EN-channel YouTube slot (full
  # format: long-form + 1 Short) until the @NerraNetwork quota increase lands.
  # Mirrors the Tesla block; same per-episode footprint MAB had, so the EN
  # channel quota math (landmine #20) is unchanged by the swap.
  enabled: true
  channel: en
  category_id: 28               # Science & Technology
  default_language: en
  privacy_status: public
  # Auto-pick the Shorts start at the most engaging beat (numeric reveal,
  # "the kicker is…" framing, surprise hook) instead of the legacy voice-intro
  # start. Falls back to voice mode when the heuristic can't find a winner.
  shorts_start_mode: smart
  shorts_per_episode: 2         # 2 Shorts/episode (restored after the 200k quota grant)
  short_duration_seconds: 40    # 30-45 s Shorts sweet spot for completion rate
  # SpaceX stories are narrative/measured like Tesla's; lower the smart-selector
  # floor from the 5.0 default so good-but-not-perfect beats still win over the
  # boilerplate voice-intro start. See engine/shorts_selector.py.
  shorts_min_score_threshold: 3.5
  # Grok Video pipeline DISABLED 2026-06-23 — too expensive
  # ($0.07/sec 720p ≈ $40-50/episode). Reverted to the image slideshow
  # (image_provider below). Do NOT re-enable without a cost decision.
  video_provider: null
  video_resolution: "720p"
  video_aspect_ratio: "16:9"

  # ---- Hybrid short video clips (Phase 4, June 2026 pilot) ----
  # A few SHORT Grok clips interleaved with the still slideshow for motion
  # (NOT full-episode video). ~3 × 5 s × $0.07 ≈ $1.05/episode. Best-effort:
  # falls back to all-stills on any failure. Tesla + SpaceX pilot.
  video_clips_enabled: true
  video_clips_count: 3
  video_clip_seconds: 5
  video_clips_resolution: "720p"

  # Grok Imagine for all imagery (long-form slideshow + Shorts) — unique,
  # narrative-tied spaceflight visuals and feeds the gallery pipeline. ~$0.32/
  # episode (8 imgs × 2 formats × $0.02 standard model).
  image_provider: grok
  grok_image_model: grok-imagine-image
  grok_image_descriptor: "cinematic, high-energy spaceflight photo, dramatic lighting, ultra-detailed"
  # Curated, disambiguated subjects spanning the whole SpaceX business so the
  # slideshow matches the day's narrative (rockets, Starship, Raptor, launch
  # sites, Starlink, crewed flight). Per-scene narrative context + the episode
  # hook are layered on top at prompt-build time.
  image_queries:
    - Falcon 9 rocket night launch
    - Starship on the launch pad
    - Super Heavy booster tower catch
    - Raptor engine static fire
    - Starlink satellites deploying in orbit
    - Dragon capsule docking with space station
    - rocket booster landing on droneship
  image_query_prefix: ""

  # ---- Show-specific video prompt customization ----
  video_genre: "aerospace-engineering"
  video_mood: "awe-inspiring-technical-epic"
  video_keywords:
    - "SpaceX"
    - "Starship"
    - "Falcon 9"
    - "rocket launch"
    - "orbital mechanics"
    - "space exploration"
    - "engineering"
    - "spaceflight"
    - "Starlink"
  video_visual_style: |
    Launch footage, rocket close-ups, orbital mechanics animations,
    space scenes, engineering diagrams, real SpaceX/NASA footage,
    test pad visuals, atmospheric re-entry sequences, booster landings.
    Epic, aspirational, technically detailed aesthetic with dramatic lighting.

  tags:
    - spacex
    - starship
    - falcon 9
    - spaceflight
    - rocket launch
    - starlink
    - spacex news
    - space podcast
