multilingual:
  # English-only show (operator decision June 2026) — no translations.
  enabled: false

llm:
  provider: xai
  system_prompt_file: shows/prompts/planetterrian_system.txt
  digest_prompt_file: shows/prompts/planetterrian_digest.txt
  podcast_prompt_file: shows/prompts/planetterrian_podcast.txt
  digest_temperature: 0.5
  podcast_temperature: 0.70
  # May 16 2026: bumped 3500 → 5000 after Ep064 / Ep065 aborted at the
  # 600-word podcast hard floor. Root cause: grok-4.3 reasoning tokens
  # consumed a growing share of the 3500-token completion budget
  # (Ep063 digest used 1204 completion tokens; the failed Ep064 used
  # ~2500), squeezing the visible output down to ~4 stories instead of
  # the prompt's 12-15 target. The thin digest then had all four
  # surviving items stripped as 100% cross-episode duplicates, leaving
  # the podcast LLM with nothing to expand. 5000 matches Tesla; MIT and
  # Omni View sit at 4000. Re-tune downward only with evidence that the
  # full digest fits in fewer tokens than grok-4.3 burns on reasoning.
  max_tokens: 5000
  podcast_max_tokens: 10000
  # May 2026 substance-boost: target bumped 950 → 1250 to match the new
  # "12-14 stories × 5-7 sentences" podcast structure (was "9-11 × 4-6").
  # June 10 2026 review: 1250 -> 1600. The prompt simultaneously said
  # "10-13 minute", "12-15 minute", and "at least 2400 words" while
  # this floor enforced 1250 (15 of 15 recent episodes under it, avg
  # ~970). One target now: 1,800-2,100 words ~ 12-13 min. The 60% skip
  # line lands at 960 — the digest-carrying expand-retry must lift a
  # weak ~800-word draft past it, mirroring the FF twin's tuning.
  min_podcast_words: 1600
  # June 2026 network quality pass: 8 of 8 recent episodes below target.
  # Expand-retry now fires on ANY below-target script.
  podcast_expand_below_target: true
  podcast_chain: true

tts:
  # Inherits provider=grok, voice_id=sal, language_code=en, max_chars=10000
  # from shows/_defaults.yaml (network default since May 2026 — Grok TTS
  # at $4.20/M chars vs ElevenLabs Flash $150/M).
  {}

audio:
  music_file: assets/music/oilers-pride.mp3
  transition_sting: assets/music/transition_sting.mp3
  # May 12 2026 retune (see shows/_defaults.yaml).
  voice_intro_delay: 10.0
  intro_duration: 10.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.6
  overlap_volume: 0.5
  fade_volume: 0.4
  outro_volume: 0.6

publishing:
  rss_file: planetterrian_podcast.rss
  rss_title: Planetterrian Daily
  rss_description: "Daily science, longevity, and health discoveries across neuroscience, microbiome, cellular aging biology, sleep research, nutrition science, genetics, and regenerative biology. We deliberately minimize drug-industry dealmaking in favour of the broader research shaping how we understand the body."
  rss_summary: "Daily science, longevity, and health discoveries — neuroscience, microbiome, sleep, nutrition, genetics, and cellular aging biology. Research-first, not pharma-trade."
  rss_link: https://nerranetwork.com/planetterrian.html
  rss_author: Patrick
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/planetterrian-daily.jpg
  rss_category: Science
  rss_subcategory: Life Sciences
  rss_keywords: "longevity, science, health, biology, medical research, neuroscience, brain"
  guid_prefix: planetterrian-daily
  base_url: https://nerranetwork.com
  audio_subdir: digests/planetterrian
  summaries_json: digests/planetterrian/summaries_planet.json
  summaries_podcast_name: planet
  x_enabled: true
  x_env_prefix: "PLANETTERRIAN_X_"
  x_handle: "@planetterrian"

episode:
  prefix: Planetterrian_Daily
  filename_pattern: "{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3"
  output_dir: digests/planetterrian
  mp3_glob: "Planetterrian_Daily_Ep*.mp3"

chapters:
  enabled: true
  section_markers:
    # June 10 2026: positional `where` anchors (the Tesla chapter-bug
    # class) + "see you next" closing coverage (Ep081 ended "See you
    # next time." which matched no pattern -> no Closing chapter).
    - pattern: "Welcome.*Planet|Planet-terry-an.*episode"
      title: "Introduction"
      where: start
    - pattern: "Planetterrian Spotlight|Planet-terry-an Spotlight|Spotlight"
      title: "Planetterrian Spotlight"
    - pattern: "science deep dive|deep dive|under the microscope"
      title: "Science Deep Dive"
    - pattern: "Before we go|Next time|before we wrap"
      title: "Tomorrow Teaser"
      where: end
    - pattern: "That's Planet|that.?s.*for today|until next time|see you next"
      title: "Closing"
      where: end

newsletter:
  enabled: true
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: "Planetterrian Daily"
  short_label: "Planetterrian"
  emoji: "🧬"
  newsletter_start_date: "2026-04-30"
  requires_financial_disclaimer: false
  length_target_words: 1300

slow_news:
  enabled: true
  library_file: shows/segments/planetterrian.json
  max_segments: 2
  cooldown_days: 30

