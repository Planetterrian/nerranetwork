llm:
  provider: xai
  system_prompt_file: shows/prompts/fp_system.txt
  digest_prompt_file: shows/prompts/fp_digest.txt
  podcast_prompt_file: shows/prompts/fp_podcast.txt
  digest_temperature: 0.4
  podcast_temperature: 0.75
  max_tokens: 5000
  podcast_max_tokens: 6000
  # June 10 2026 review: 900 -> 1200. The prompt targets 1,300-1,700
  # слов but the floor sat at 900, so short episodes never tripped the
  # expand-retry. 1000 (not the prompt's 1300 low end) keeps the 60%
  # skip floor at 600 — below the worst recent raw output (645 words,
  # Ep45) so an episode still ships even if the expand-retry fails.
  min_podcast_words: 1000
  # June 2026 network quality pass: chronic below-target episodes —
  # the expand-retry now fires on ANY below-target script.
  podcast_expand_below_target: true

tts:
  # Olya — Russian voice. Migrated from ElevenLabs (`gedzfqL7OGdPbwm0ynTP`)
  # to xAI's Grok TTS (May 2026) for the same persona at ~36× lower
  # per-character cost ($4.20/M vs $150/M). Reuses GROK_API_KEY /
  # XAI_API_KEY — no new secret needed. ElevenLabs-specific voice
  # settings (stability / similarity_boost / style / use_speaker_boost)
  # are not exposed by Grok TTS and are intentionally absent here.
  provider: grok
  voice_id: 0b875ae2
  language_code: ru
  max_chars: 10000

audio:
  music_file: "assets/music/Финансы Просто.mp3"
  transition_sting: assets/music/transition_sting.mp3
  # May 12 2026 retune (see shows/_defaults.yaml).
  voice_intro_delay: 10.0
  intro_duration: 10.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.6
  overlap_volume: 0.5
  fade_volume: 0.4
  outro_volume: 0.6

publishing:
  host_name: "Оля"
  rss_language: ru
  rss_file: finansy_prosto_podcast.rss
  rss_title: "Финансы Просто"
  rss_description: "Ежедневный подкаст о финансах на русском языке для женщин в Канаде. Ведущая Оля объясняет инвестиции, сбережения, бюджет и финансовую грамотность — просто и понятно. Каждый выпуск — практические советы, новости и ресурсы для финансовой независимости."
  rss_link: https://nerranetwork.com/ru/finansy-prosto.html
  rss_author: Nerra Network
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/finansy-prosto.jpg
  rss_category: Business
  rss_subcategory: Investing
  rss_keywords: "финансы, инвестиции, ипотека, канада, женщины, RRSP, TFSA, экономия, новости"
  guid_prefix: fp
  base_url: https://nerranetwork.com
  audio_subdir: digests/finansy_prosto
  summaries_json: digests/finansy_prosto/summaries_finansy_prosto.json
  summaries_podcast_name: finansy_prosto
  player_html: ru/finansy-prosto.html
  summaries_html: ru/finansy-prosto-summaries.html
  x_enabled: false
  x_env_prefix: ""

episode:
  prefix: FP
  filename_pattern: "{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3"
  output_dir: digests/finansy_prosto
  mp3_glob: "FP_Ep*.mp3"

chapters:
  enabled: true
  section_markers:
    # June 10 2026: positional `where` anchors (the Tesla chapter-bug
    # class) + the second closing-pool variant ("Вот и всё на сегодня!")
    # previously matched no pattern.
    - pattern: "Финансы Просто|добро пожаловать"
      title: "Приветствие"
      where: start
    - pattern: "главная тема|главная новость|самое важное|сегодня разберёмся|сегодня мы разберём|тема сегодня"
      title: "Главная тема"
    - pattern: "как это работает|как это устроено|разбираемся|давайте разберёмся|почему это работает|объясни как подруге"
      title: "Как это работает"
    - pattern: "попробуйте сами|практическ\\w+ совет|первый совет|несколько советов|на практике"
      title: "Практические советы"
    - pattern: "коротко и ясно|быстрые новости"
      title: "Коротко и ясно"
    - pattern: "на сегодня всё|вот и всё|до завтра"
      title: "Завершение"
      where: end

newsletter:
  enabled: true
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  # Buttondown rejects tags with no ASCII letter/number, so we use the
  # transliterated form rather than the Cyrillic show display name.
  tag: "Finansy Prosto"
  short_label: "Финансы"
  emoji: "💰"
  newsletter_start_date: "2026-04-30"
  requires_financial_disclaimer: true
  length_target_words: 1300

slow_news:
  enabled: true
  library_file: shows/segments/finansy_prosto.json
  max_segments: 2
  cooldown_days: 30

youtube:
  podcast_playlist_id: PLrkQSSjMOK2fb9y1CV3UsH0f-ZTJWYPpD
  enabled: true                 # June 2026: @NerraRU has its own 10k/day quota
                                # (separate from @NerraNetwork), so full format
                                # (long-form + 1 Short) fits — both Russian
                                # shows run even days only. Requires the
                                # YOUTUBE_REFRESH_TOKEN_RU secret to be set;
                                # uploads no-op with a logged warning until it is.
  channel: ru
  # Russian-language end-screen CTA (the network default is English).
  shorts_end_card_main_text: "СМОТРЕТЬ ПОЛНЫЙ ВЫПУСК"
  shorts_end_card_sub_text: "Подпишитесь ↗"
  category_id: 27               # Education (financial literacy — was 25/News, a misclassification)
  default_language: ru
  # Russian-language financial-literacy show for women in Canada.
  # Pexels search is English-only despite the show's RU output, so
  # queries stay in English.
  image_queries:
    - personal finance planning
    - savings jar coins
    - canadian dollars
    - family budget
    - investment chart
    - bank meeting
    - retirement planning
  image_query_prefix: ""
  tags:
    - финансы
    - инвестиции
    - канада
    - финансовая грамотность
    - сбережения
