# Omni View Asia Pacific — Phase 3 of docs/new_shows_plan_2026_09_22.md §4.7.
# One of the five Omni View regional desks read by Mira, the network's AI
# host. The desks share ONE format: prompts include
# shows/prompts/_shared/omni_desk_*.txt, and the only per-desk prompt text is
# the region file (shows/prompts/omni_desks/). Everything per-desk that a
# registry needs lives in engine/omni_desks.py.
#
# Distribution OFF at launch (RSS + site + blog). NOT on a cron: Episode 1 is
# produced by manual dispatch and listened to before the launch PR adds the
# schedule (06:16 UTC (16:16 AEST), plan §6).
name: Omni View Asia Pacific
slug: omni_view_asia_pacific
weekly_summary_segment: true   # daily cadence; Sunday adds a short week-in-review segment
memory_enabled: true
story_recurrence: true
description: 'The day across Asia and the Pacific, one region deep: China, Japan, the Koreas, India and South Asia, Southeast Asia, Australia, New Zealand and the Pacific islands — decisions, economies, security and elections, with one contested question argued fairly both ways and one sign of progress. Read by Mira, the Nerra Network''s AI host; every story from named newsrooms.'

fetch_full_text: 16
absence_sentence_filter: true
# Digest lints + X-source policy (Sep 23 2026 launch-cohort review; engine/digest_lint.py).
digest_lints:
# Sep 24 2026: Top World Ep2 shipped eleven items and no Source line (a grok-4.3
# structural retry); an item without a Source rides the one-shot regeneration.
- items_without_source
- wyntk_hook_match
- x_only_lead
- progress_watch_thin
- region_world_thin
# Progress Watch may revisit one of the day's stories by contract; the overlap
# dedup dropping it left a fragment that bought a full regeneration (Top World
# Ep2, 2026-09-24). progress_watch_thin judges substance; never a deletion.
digest_overlap_exempt_sections:
- Progress Watch
x_posts_as_sources: linked_only
stale_article_days: 3

# Probed 2026-09-23 from this session's egress (200, posts inside the day);
# re-grade from a runner (`python check_feeds.py omni_view_asia_pacific`) before Episode 1.
# No `keywords:` list on purpose: these feeds are regional by construction,
# and a title keyword filter would drop on-region stories whose titles name
# no country. The REGION RULE in the prompt decides what qualifies.
sources:
- url: https://feeds.bbci.co.uk/news/world/asia/rss.xml
  label: BBC Asia
- url: https://www.theguardian.com/world/asia-pacific/rss
  label: The Guardian Asia Pacific
- url: https://rss.dw.com/rdf/rss-en-asia
  label: DW Asia
- url: https://www.scmp.com/rss/4/feed
  label: South China Morning Post China
- url: https://www.scmp.com/rss/3/feed
  label: South China Morning Post Asia
- url: https://www.japantimes.co.jp/feed/
  label: The Japan Times
- url: https://www.abc.net.au/news/feed/51120/rss.xml
  label: ABC News Australia
- url: https://www.channelnewsasia.com/api/v1/rss-outbound-feed?_format=xml&category=6511
  label: CNA Asia
- url: https://www.straitstimes.com/news/asia/rss.xml
  label: The Straits Times Asia
- url: https://en.yna.co.kr/RSS/news.xml
  label: Yonhap
- url: https://www.thehindu.com/news/national/feeder/default.rss
  label: The Hindu
- url: https://www.smh.com.au/rss/national.xml
  label: Sydney Morning Herald
- url: https://www.rnz.co.nz/rss/pacific.xml
  label: RNZ Pacific
- url: https://www.taipeitimes.com/xml/index.rss
  label: Taipei Times
- url: https://news.google.com/rss/search?q=China+government+OR+Beijing+policy+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News Asia Pacific 1
- url: https://news.google.com/rss/search?q=Japan+government+OR+Tokyo+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News Asia Pacific 2
- url: https://news.google.com/rss/search?q=India+government+OR+Modi+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News Asia Pacific 3
- url: https://news.google.com/rss/search?q=ASEAN+OR+Indonesia+OR+Philippines+OR+Vietnam+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News Asia Pacific 4
- url: https://news.google.com/rss/search?q=Australia+government+OR+Albanese+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News Asia Pacific 5
- url: https://news.google.com/rss/search?q=Pacific+islands+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News Asia Pacific 6
- url: https://news.google.com/rss/search?q=Taiwan+when:1d&hl=en-US&gl=US&ceid=US:en
  label: Google News Asia Pacific 7

web_search_queries:
- Asia Pacific news today
- China Japan India news today
- Southeast Asia Australia news today

# Omni View's nine anti-tabloid filters plus the desk additions
# (engine.omni_desks.ANTI_TABLOID_PATTERNS — keep the two in sync).
exclude_title_patterns:
- 'red carpet'
- '\bLove Island\b'
- '\bStrictly Come Dancing\b'
- 'reality TV star'
- '\broyal\b.*\b(fashion|dress|style|outfit)\b'
- 'wardrobe malfunction'
- '\bpaparazzi\b'
- '\bnet worth\b'
- 'steps out (?:in|with)'
- '\b(live updates?|as it happened|live blog)\b'
- '\b(in pictures|photos of the (day|week)|week in pictures)\b'
- '\b(quiz|crossword|wordle)\b'
- '\b(obituar(y|ies)|in memoriam)\b'

x_fetch_enabled: true
x_accounts:
- handle: SCMPNews
  label: South China Morning Post
  max_posts: 3
- handle: ChannelNewsAsia
  label: CNA
  max_posts: 3
- handle: abcnews
  label: ABC News Australia
  max_posts: 2
- handle: the_hindu
  label: The Hindu
  max_posts: 2

min_articles: 8
min_articles_skip: 4

# Cost circuit breaker — TOP LEVEL (nested keys are ignored; see _defaults).
max_weekly_cost_usd: 7.0

multilingual:
  enabled: false

llm:
  provider: xai
  # grok-4.7 at low effort, like every new show (operator brief 2026-09-23;
  # experiment new-shows-grok-47-2026-09-23). A run whose pinned model does
  # not answer falls back to grok-4.3 and records it.
  model: grok-4.7
  reasoning_effort: low
  # Sep 24 2026: stream the completion (xAI's guidance for reasoning models);
  # 9 of the cohort's first 24 episodes fell back on a dropped non-streaming
  # connection. False = the pre-existing request.
  stream: true
  system_prompt_file: shows/prompts/omni_view_asia_pacific_system.txt
  digest_prompt_file: shows/prompts/omni_view_asia_pacific_digest.txt
  podcast_prompt_file: shows/prompts/omni_view_asia_pacific_podcast.txt
  digest_temperature: 0.4
  podcast_temperature: 0.7
  # Room for grok-4.7's reasoning AND the claims ledger at the tail
  # (Prediction Markets Ep1 used 5,384 of 5,500 and lost its ledger).
  max_tokens: 8000
  podcast_max_tokens: 9500
  # A 10-12 minute brief. The skip floor is 60% of this.
  min_podcast_words: 1300
  podcast_expand_below_target: false
  min_digest_words: 1100
  digest_expand_below_target: true

tts:
  # Mira's voice (Grok built-in `ara`), no speech wrap — the Vancouver
  # calibration shape (plan §2b).
  voice_id: ara
  speech_wrap_open: ""
  speech_wrap_close: ""

audio:
  # The Omni View theme until the desk variant is commissioned (plan §5c).
  music_file: assets/music/OmniView.mp3
  transition_sting: assets/music/transition_sting.mp3
  voice_intro_delay: 0.0
  intro_duration: 3.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.6
  overlap_volume: 0.5
  fade_volume: 0.4
  outro_volume: 0.6

publishing:
  rss_file: omni_view_asia_pacific_podcast.rss
  rss_title: Omni View Asia Pacific
  rss_description: 'The day across Asia and the Pacific, one region deep: China, Japan, the Koreas, India and South Asia, Southeast Asia, Australia, New Zealand and the Pacific islands — decisions, economies, security and elections, with one contested question argued fairly both ways and one sign of progress. Read by Mira, the Nerra Network''s AI host; every story from named newsrooms.'
  rss_link: https://nerranetwork.com/omni-view-asia-pacific.html
  rss_author: Mira (AI host), Nerra Network
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/omni-view-asia-pacific.jpg
  rss_category: News
  rss_subcategory: Daily News
  # Secondary must differ from the primary (Apple rejects a duplicate).
  rss_category2: Government
  rss_keywords: asia news, china news, india news, japan news, australia news, asia pacific daily briefing
  guid_prefix: omni-view-asia-pacific
  base_url: https://nerranetwork.com
  audio_subdir: digests/omni_view_asia_pacific
  summaries_json: digests/omni_view_asia_pacific/summaries_omni_view_asia_pacific.json
  summaries_podcast_name: omni_view_asia_pacific
  player_html: omni-view-asia-pacific.html
  summaries_html: omni-view-asia-pacific-summaries.html
  x_enabled: false
  x_env_prefix: X_
  host_name: Mira
  host_kind: ai

episode:
  prefix: Omni_View_Asia_Pacific
  filename_pattern: '{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3'
  output_dir: digests/omni_view_asia_pacific
  mp3_glob: Omni_View_Asia_Pacific_Ep*.mp3

chapters:
  enabled: true
  # Anchors only — never a topic word. The Lead and Across the Region items
  # take their chapters from the digest headlines; the segments key on
  # REQUIRED phrases the podcast prompt builds a sentence around, never
  # inside the opening window (where: body — the Vancouver Ep1 lesson).
  section_markers:
  - pattern: This is Omni View Asia Pacific|first episode of|Omni View Asia Pacific, episode
    title: Introduction
    where: start
  - pattern: across the region
    title: Across the Region
    where: body
  - pattern: also today
    title: Also Today
    where: body
  - pattern: the wider world
    title: The Region and the World
    where: body
  - pattern: case on both sides
    title: Both Sides
    where: body
  - pattern: a sign of progress
    title: Progress Watch
    where: body
  - pattern: That's Omni View Asia Pacific|see you tomorrow
    title: Closing
    where: end

slow_news:
  enabled: false

newsletter:
  enabled: false
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: Omni View Asia Pacific
  short_label: Asia Pacific
  emoji: 🌏
  newsletter_start_date: '2026-10-15'
  requires_financial_disclaimer: false
  length_target_words: 1300

content_tracking:
  section_patterns: {}

youtube:
  enabled: false                 # OFF at launch (plan §7: a second channel is a data decision)
  channel: en
  category_id: 25
  shorts_start_mode: smart
  shorts_min_score_threshold: 3.5
  default_language: en
  privacy_status: public
  image_provider: grok
  grok_image_model: grok-imagine-image
  grok_image_descriptor: "cinematic news photo, natural light, ultra-detailed"
  image_queries:
  - Hong Kong harbour skyline at dusk
  - Tokyo street crossing at night
  - Sydney harbour at morning
  - busy port cranes in Singapore
  image_query_prefix: ''
  tags:
  - world news
  - asia pacific
  - daily news
