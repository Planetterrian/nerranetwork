name: Fascinating Frontiers
slug: fascinating_frontiers
weekly_recap_on_sunday: true   # May 2026: daily cadence; Sunday slot recaps the past 7 days from the content lake.
description: "Space exploration, astronomy, and cosmology — the frontier of human discovery beyond Earth. Daily briefings on NASA, ESA, SpaceX missions, planetary science, and the search for life in the universe."

sources:
  - url: https://www.nasa.gov/rss/dyn/breaking_news.rss
    label: NASA Breaking
  - url: https://www.nasa.gov/rss/dyn/image_of_the_day.rss
    label: NASA Image
  - url: https://www.space.com/feeds/all
    label: Space.com
  - url: https://www.space.com/rss
    label: Space.com RSS
  - url: https://www.spaceflightnow.com/feed/
    label: Spaceflight Now
  - url: https://spacenews.com/feed/
    label: SpaceNews
  - url: https://www.astronomy.com/feed/
    label: Astronomy
  - url: https://www.skyandtelescope.com/feed/
    label: Sky & Telescope
  - url: https://www.universetoday.com/feed/
    label: Universe Today
  - url: https://www.esa.int/rssfeed/ESA
    label: ESA
  - url: https://www.esa.int/rssfeed/Our_Activities
    label: ESA Activities
  - url: https://www.nature.com/nature/astronomy.rss
    label: Nature Astronomy
  - url: https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=science
    label: Science Magazine
  # Google News — supplementary broad coverage
  - url: "https://news.google.com/rss/search?q=space+exploration+news&hl=en-US&gl=US&ceid=US:en"
    label: Google News Space
  - url: "https://news.google.com/rss/search?q=NASA+SpaceX+rocket+launch&hl=en-US&gl=US&ceid=US:en"
    label: Google News NASA SpaceX
  - url: "https://news.google.com/rss/search?q=astronomy+discovery+exoplanet&hl=en-US&gl=US&ceid=US:en"
    label: Google News Astronomy
  # Reddit — community space coverage
  - url: "https://www.reddit.com/r/space/.rss"
    label: r/space
  - url: "https://www.reddit.com/r/spacex/.rss"
    label: r/spacex
  - url: "https://www.reddit.com/r/astronomy/.rss"
    label: r/astronomy
  # --- Round 4 additions (April 2026) ---
  - url: https://science.nasa.gov/feed/
    label: NASA Science
  - url: https://www.nasa.gov/feeds/iotd-feed/
    label: NASA Image of the Day
  - url: https://www.esa.int/rssfeed/Our_Activities/Space_News
    label: ESA Space News
  - url: https://phys.org/rss-feed/space-news/
    label: Phys.org Space
  - url: https://www.teslarati.com/category/spacex/feed/
    label: Teslarati SpaceX
  - url: https://www.quantamagazine.org/feed/
    label: Quanta Magazine

web_search_queries:
  - "space exploration news today"
  - "NASA SpaceX launch update"
  - "astronomy discovery news"
  - "rocket launch news today"

x_accounts:
  - handle: NASA
    label: NASA
    max_posts: 4
  - handle: SpaceX
    label: SpaceX
    max_posts: 4
  - handle: esa
    label: European Space Agency
    max_posts: 3
  - handle: SciGuySpace
    label: Eric Berger (Ars Technica space)
    max_posts: 3
  - handle: planet4589
    label: Jonathan McDowell (orbital launch tracker)
    max_posts: 3
  - handle: Erdayastronaut
    label: Tim Dodd (Everyday Astronaut)
    max_posts: 3
  - handle: NASAWebb
    label: NASA Webb Telescope
    max_posts: 3

min_articles_skip: 4

keywords:
  - space
  - astronomy
  - astronaut
  - cosmic
  - galaxy
  - galaxies
  - planet
  - planets
  - exoplanet
  - exoplanets
  - solar system
  - mars
  - moon
  - lunar
  - asteroid
  - comet
  - meteor
  - telescope
  - observatory
  - hubble
  - james webb
  - jwst
  - nasa
  - esa
  - spacex
  - rocket
  - launch
  - mission
  - satellite
  - spacecraft
  - rover
  - lander
  - orbiter
  - nebula
  - star
  - stars
  - supernova
  - black hole
  - iss
  - international space station
  - space station
  - spaceflight
  - space travel
  - space exploration
  - astrophysics
  - cosmology
  - universe
  - cosmos

llm:
  provider: xai
  system_prompt_file: shows/prompts/fascinating_frontiers_system.txt
  digest_prompt_file: shows/prompts/fascinating_frontiers_digest.txt
  podcast_prompt_file: shows/prompts/fascinating_frontiers_podcast.txt
  digest_temperature: 0.5
  podcast_temperature: 0.75
  max_tokens: 3500
  podcast_max_tokens: 8000
  min_podcast_words: 2000
  podcast_chain: true

tts:
  # Inherits provider=grok, voice_id=sal, language_code=en, max_chars=10000
  # from shows/_defaults.yaml (network default since May 2026 — Grok TTS
  # at $4.20/M chars vs ElevenLabs Flash $150/M).
  {}

audio:
  # Single-track config (May 2026): the long ``_bg`` track is used for
  # intro AND outro so the open and close share the same musical
  # identity — operator preferred this over the previous dual-track
  # setup where ``fascinatingfrontiers.mp3`` (a short intro jingle)
  # opened the episode and ``fascinatingfrontiers_bg.mp3`` only
  # appeared at the end. The shorter jingle file remains in the repo
  # for emergency rollback.
  music_file: assets/music/fascinatingfrontiers_bg.mp3
  transition_sting: assets/music/transition_sting.mp3
  voice_intro_delay: 15.0
  intro_duration: 15.0
  overlap_duration: 10.0
  fade_duration: 27.0
  outro_duration: 40.0
  outro_crossfade: 20.0
  intro_volume: 0.6
  overlap_volume: 0.5
  fade_volume: 0.4
  outro_volume: 0.4

publishing:
  rss_file: fascinating_frontiers_podcast.rss
  rss_title: Fascinating Frontiers
  rss_description: "Daily space and astronomy news digest. Bringing the wonders of space exploration and astronomy discoveries to everyone."
  rss_summary: "Daily space and astronomy news. Curiosity, exploration, scientific accuracy, and inspiration."
  rss_link: https://nerranetwork.com/fascinating_frontiers.html
  rss_author: Patrick
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/fascinating-frontiers.jpg
  rss_category: Science
  guid_prefix: fascinating-frontiers
  base_url: https://nerranetwork.com
  audio_subdir: digests/fascinating_frontiers
  summaries_json: digests/fascinating_frontiers/summaries_space.json
  summaries_podcast_name: space
  x_enabled: true
  x_env_prefix: "PLANETTERRIAN_X_"

episode:
  prefix: Fascinating_Frontiers
  filename_pattern: "{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3"
  output_dir: digests/fascinating_frontiers
  mp3_glob: "Fascinating_Frontiers_Ep*.mp3"

chapters:
  enabled: true
  section_markers:
    - pattern: "Welcome.*Fascinating Frontiers|Fascinating Frontiers.*episode"
      title: "Introduction"
    - pattern: "Cosmic Spotlight"
      title: "Cosmic Spotlight"
    - pattern: "cosmic deep dive|deep dive|under the hood"
      title: "Cosmic Deep Dive"
    - pattern: "Before we go|Next time"
      title: "Tomorrow Teaser"
    - pattern: "That's Fascinating Frontiers|that.?s.*for today|until next time"
      title: "Closing"

newsletter:
  enabled: true
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: "Fascinating Frontiers"
  short_label: "Frontiers"
  emoji: "🛰️"
  newsletter_start_date: "2026-04-30"
  requires_financial_disclaimer: false
  length_target_words: 1300

slow_news:
  enabled: true
  library_file: shows/segments/fascinating_frontiers.json
  max_segments: 2
  cooldown_days: 30
  # Loosened from 3 — space/astronomy news cycles often surface the same
  # story across multiple outlets (NASA + SpaceX + Space.com) within 24h.
  repeat_trigger_threshold: 5

content_freshness:
  # Less aggressive pre-filter so space stories with overlapping keywords
  # (e.g. multiple Artemis II updates) aren't all collapsed into "similar".
  lookback_days: 2
  similarity_threshold: 0.72

youtube:
  podcast_playlist_id: PLRHMnzNNXPYDC7-f8Dary-bTZyvwxR-dR
  enabled: false                # Disabled May 2026 — moved to daily cadence,
                                # YouTube quota only fits 2 daily shows
                                # (10K/day ÷ 1.6K/upload ≈ 6 uploads;
                                # network shipped 16+/day pre-disable). Only
                                # TST and MAB stay on YouTube for now.
  channel: en
  category_id: 28               # Science & Tech
  default_language: en
  privacy_status: public        # Phase-1 validated; uploads are public
  # Space / frontier-science visuals. Pexels has strong coverage here so
  # short, descriptive queries work well without prefix injection.
  image_queries:
    - space telescope
    - galaxy nebula
    - rocket launch
    - astronaut spacewalk
    - mars rover
    - aurora borealis
    - cosmic stars
  image_query_prefix: ""
  tags:
    - space
    - astronomy
    - nasa
    - spacex
    - science podcast
    - space news

