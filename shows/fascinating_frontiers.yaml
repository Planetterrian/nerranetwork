llm:
  provider: xai
  system_prompt_file: shows/prompts/fascinating_frontiers_system.txt
  digest_prompt_file: shows/prompts/fascinating_frontiers_digest.txt
  podcast_prompt_file: shows/prompts/fascinating_frontiers_podcast.txt
  digest_temperature: 0.5
  podcast_temperature: 0.75
  # May 2026 substance-boost: bumped 3500 → 5000 (matches PT + Tesla)
  # to give grok-4.3's always-on reasoning enough headroom to produce
  # a full Top-15 digest with 4-5 sentences per item. The prior 3500
  # cap was producing 8-item Top-15 sections; operator complaint
  # ("less news items being included and less of the substance from
  # any news item") traced to budget-starved completions.
  max_tokens: 5000
  podcast_max_tokens: 10000
  # Podcast target bumped 1050 → 1350 to match the new "12-14 stories
  # × 5-7 sentences" structure (was "9-11 × 4-6").
  # June 10 2026 review: 1350 -> 1700. The prompt simultaneously said
  # "10-13 minute", "12-15 minute", and "at least 2400 words" while this
  # floor enforced 1350 (recent episodes averaged ~1100). The prompt now
  # states ONE target (1,900-2,200 words ~ 12-14 min).
  min_podcast_words: 1700
  # June 2026 network quality pass: 8 of 8 recent episodes below target
  # (avg listener_value 3.6, lowest of the memory trio). Expand-retry
  # now fires on ANY below-target script.
  podcast_expand_below_target: true
  podcast_chain: true

tts:
  # Inherits provider=grok, voice_id=sal, language_code=en, max_chars=10000
  # from shows/_defaults.yaml (network default since May 2026 — Grok TTS
  # at $4.20/M chars vs ElevenLabs Flash $150/M).
  {}

audio:
  # Single-track config (May 2026): the long ``_bg`` track is used for
  # intro AND outro so the open and close share the same musical
  # identity — operator preferred this over the previous dual-track
  # setup where ``fascinatingfrontiers.mp3`` (a short intro jingle)
  # opened the episode and ``fascinatingfrontiers_bg.mp3`` only
  # appeared at the end. The shorter jingle file remains in the repo
  # for emergency rollback.
  music_file: assets/music/fascinatingfrontiers_bg.mp3
  transition_sting: assets/music/transition_sting.mp3
  # May 12 2026 retune (see shows/_defaults.yaml). FF previously pinned
  # fade_duration at 27 s (network baseline was 20 s, FF was +7); with
  # the new 30 s baseline FF returns to the network default. Operator
  # can re-tune up if FF specifically needs a longer under-voice tail.
  voice_intro_delay: 10.0
  intro_duration: 10.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.6
  overlap_volume: 0.5
  fade_volume: 0.4
  outro_volume: 0.6

publishing:
  rss_file: fascinating_frontiers_podcast.rss
  rss_title: Fascinating Frontiers
  # June 2026: value-prop description for Apple/Spotify listing pages.
  rss_description: "Daily space and astronomy news: NASA and SpaceX missions, ESA operations, exoplanet and James Webb discoveries, and the engineering behind humanity's push into the cosmos — with ongoing story tracking across Starship, Artemis, and deep-space science. For space enthusiasts, engineers, and the curious."
  rss_summary: "Daily space and astronomy news. Curiosity, exploration, scientific accuracy, and inspiration."
  rss_link: https://nerranetwork.com/fascinating_frontiers.html
  rss_author: Patrick
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/fascinating-frontiers.jpg
  rss_category: Science
  rss_subcategory: Astronomy
  rss_keywords: "space, astronomy, nasa, spacex, cosmos, exoplanet, telescope, james webb"
  guid_prefix: fascinating-frontiers
  base_url: https://nerranetwork.com
  audio_subdir: digests/fascinating_frontiers
  summaries_json: digests/fascinating_frontiers/summaries_space.json
  summaries_podcast_name: space
  x_enabled: true
  x_env_prefix: "PLANETTERRIAN_X_"
  x_handle: "@planetterrian"

episode:
  prefix: Fascinating_Frontiers
  filename_pattern: "{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3"
  output_dir: digests/fascinating_frontiers
  mp3_glob: "Fascinating_Frontiers_Ep*.mp3"

chapters:
  enabled: true
  section_markers:
    # June 10 2026: positional `where` anchors (the Tesla chapter-bug
    # class) + the "That covers today's space and science news" closing
    # variant previously matched no pattern.
    - pattern: "Welcome.*Fascinating Frontiers|Fascinating Frontiers.*episode"
      title: "Introduction"
      where: start
    - pattern: "Cosmic Spotlight"
      title: "Cosmic Spotlight"
    - pattern: "cosmic deep dive|deep dive|under the hood"
      title: "Cosmic Deep Dive"
    - pattern: "Before we go|Next time"
      title: "Tomorrow Teaser"
      where: end
    - pattern: "That's Fascinating Frontiers|that covers today|that.?s.*for today|until next time"
      title: "Closing"
      where: end

newsletter:
  enabled: true
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: "Fascinating Frontiers"
  short_label: "Frontiers"
  emoji: "🛰️"
  newsletter_start_date: "2026-04-30"
  requires_financial_disclaimer: false
  length_target_words: 1300

slow_news:
  enabled: true
  library_file: shows/segments/fascinating_frontiers.json
  max_segments: 2
  cooldown_days: 30
  # Loosened from 3 — space/astronomy news cycles often surface the same
  # story across multiple outlets (NASA + SpaceX + Space.com) within 24h.
  repeat_trigger_threshold: 5

content_freshness:
  # Less aggressive pre-filter so space stories with overlapping keywords
  # (e.g. multiple Artemis II updates) aren't all collapsed into "similar".
  lookback_days: 2
  similarity_threshold: 0.72

youtube:
  podcast_playlist_id: PLRHMnzNNXPYDC7-f8Dary-bTZyvwxR-dR
  enabled: true                 # June 2026 four-show expansion: Shorts-only
                                # launch while the quota-increase request is
                                # pending (Tesla + MAB dropped to 1 Short each
                                # to make room). Flip publish_long_form to
                                # true once the increase is granted.
  publish_long_form: false      # Shorts-only until quota increase lands.
  # Smart Shorts segment selection (same as Tesla/MAB) — starts the
  # clip at the most engaging transcript beat instead of the intro.
  shorts_start_mode: smart
  short_duration_seconds: 40
  channel: en
  category_id: 28               # Science & Tech
  default_language: en
  privacy_status: public        # Phase-1 validated; uploads are public
  # Space / frontier-science visuals. June 14 2026 — upgraded from terse
  # Pexels-search keywords to vivid, cinematic scene subjects now that imagery
  # is Grok-generated (generation rewards descriptive scenes over noun tags).
  image_queries:
    - James Webb telescope in deep space
    - spiral galaxy with glowing nebula
    - astronaut on a spacewalk above Earth
    - Mars rover crossing red rocky terrain
    - aurora borealis over snowy mountains
    - black hole bending starlight
    - rocket lifting off through dramatic clouds
  image_query_prefix: ""
  # June 14 2026 — Grok Imagine for the Shorts imagery (was inheriting the
  # pexels default, so Shorts shipped stock photos). Unique, narrative-tied
  # space/science visuals + feeds the gallery pipeline.
  image_provider: grok
  grok_image_model: grok-imagine-image-quality
  grok_image_descriptor: "cinematic, awe-inspiring space and science photo, dramatic lighting, ultra-detailed"
  tags:
    - space
    - astronomy
    - nasa
    - spacex
    - science podcast
    - space news
