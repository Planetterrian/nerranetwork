# Story-recurrence memory (Aug 2026): inline "already covered — update,
# don't re-tell" notes on fetched articles matching the ContentTracker's
# recent-headline window. Built after the Fort Bend story ran in 5 of 10
# Tesla episodes past three existing dedup layers. Data-side and
# deterministic (engine/story_recurrence.py).
story_recurrence: true

exclude_title_patterns:
- full moon calendar
- (moon|lunar) calendar
- this day in (space )?history
- \bon this day\b
- on \w+ \d{1,2},? 1[89]\d{2}
- evening skies?\b
- morning skies?\b
- (night|evening|morning) sky (this|tonight|for|in)
- \bsky this (week|month)\b
- what to see in the (night|evening) sky
- highest point in (the )?(evening|morning) sky
- (super|blue|harvest|wolf|pink|strawberry|blood|hunter|snow|worm|flower|buck|sturgeon|corn|beaver|cold)\s+moon\b
- (telescope|binoculars?) deals?
- best (telescopes?|binoculars?|star projectors?)\b
- meteor shower.*(peak|tonight|when to|how to|watch)
- \bSPCX\b
- \bmarket cap(italization)?\b
- \bgreen ?shoe\b
- \bfunding round\b
- \bIPO\b
- \bshares?\b.{0,25}\b(rise|rises|risen|climb|climbs|jump|jumps|surge|surges|soar|soars|skyrocket|fall|falls|drop|drops|plunge|tumble|rally|slip|slid|gain|gains|percent)\b
- \b(raises?|raised)\b.{0,20}\bbillion\b
- \b(\$|usd|billion|trillion|all-?stock|all stock)\b.{0,25}\bmerger\b
- \bmerger\b.{0,25}\b(valued|deal|shareholders?|billion|trillion)\b
- \bindex\b.{0,20}\b(inclusion|rebalanc|addition)\b
- \badded to\b.{0,20}\bindex\b
# July 2 2026: nightly-ephemeris almanac items kept slipping past the
# calendar/sky-tonight filters above ("Moon Passes Near the Sickle of Leo
# Tonight", "Mars passes within 5 degrees of the Pleiades", "Neptune
# reaches 30 degrees altitude before dawn", "Venus Shines Beneath Leo's
# Sickle This Evening" — 4 episodes in the June 18-July 2 window). Anchor
# on a planet/Moon SUBJECT at the start of the title + an almanac verb, so
# real news survives: "Asteroid passes near Earth" (subject not a planet),
# "Mars may host large subsurface magma systems" (verb not almanac), and
# the FF June-16 lesson — never a bare "passes near".
- ^(the )?(moon|mercury|venus|mars|jupiter|saturn|uranus|neptune)\b.{0,60}\b(passes|shines|reaches \d+ degrees)\b
# July 31 2026: the daily "sky today / sky tonight" almanac columns from
# astronomy.com + Astronomy Magazine (URL slug "the-sky-today-friday-...")
# and Space.com's monthly stargazing round-up ("The night sky is changing
# this August — here's which planets to watch") kept slipping the filters
# above because the LLM re-headlines them ("Mercury Brightens in Morning
# Sky", "August Night Sky Features Shifting Planets") AFTER the fetch-time
# title check. Anchor on the ORIGINAL column titles instead. Conservative
# — verified against the Ep140-147 kept-title set: zero real-news drops.
- \bthe sky (today|tonight)\b
- \bnight sky is changing\b
- \bwhich planets?\b.{0,20}\b(to )?(watch|see)\b
