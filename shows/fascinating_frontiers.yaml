multilingual:
  enabled: true
  auto: true
  languages:
  - fr
  - ru
  - zh
  # Operator approved batch ZH for this show (listen-first gate).
  zh_approved: true
llm:
  provider: xai
  system_prompt_file: shows/prompts/fascinating_frontiers_system.txt
  digest_prompt_file: shows/prompts/fascinating_frontiers_digest.txt
  podcast_prompt_file: shows/prompts/fascinating_frontiers_podcast.txt
  digest_temperature: 0.5
  podcast_temperature: 0.75
  # Raised 5000 -> 7500 (July 28 2026). 7 of 107 recorded runs (6%) hit
  # the truncation retry; largest kept digest was 7,287 tokens, which the
  # old ceiling could never have produced in one call. Matches the retry
  # ceiling (5000 x 1.5), so a run that used to need two calls now needs
  # one. Free on the 94% of runs that finish well under it.
  max_tokens: 7500
  podcast_max_tokens: 10000
  min_podcast_words: 1700
  # DISABLED July 29 2026 (cost + quality). Measured over 901 committed
  # episodes: 81% still shipped BELOW target WITH this retry running (Tesla
  # 96.7%, M&A 95.2%) — it fires on nearly every episode and almost never
  # reaches the goal, because the ceiling is the DIGEST, not the script.
  # It also pads by paraphrase-duplication (the July 28 pass had to add
  # _dedup_expansion_sentences to strip its near-duplicate sentences), so
  # what it does ship is the weaker copy. The July 18 playbook already
  # banned podcast-side length levers network-wide (do_not_retry: ~10
  # misses vs 1 hit); this makes the config match the policy. Length is
  # now attacked only at the sanctioned substrate below
  # (digest_expand_below_target). ~$39/yr of retry calls recovered.
  podcast_expand_below_target: false
  # July 2026 depth pass: RSS-snippet digests capped the podcast. Digest
  # expand deepens Top-15 fact sentences + Cosmic Deep Dive (licensed
  # knowledge) without inventing. Floor under the observed plateau.
  min_digest_words: 1400
  digest_expand_below_target: true
  podcast_chain: true
tts: {}
audio:
  music_file: assets/music/fascinatingfrontiers_bg.mp3
  transition_sting: assets/music/transition_sting.mp3
  # July 30 2026 cold-open change: the hook is now the first thing
  # spoken (engine.intros.build_cold_open_spec + the podcast prompt), so
  # the voice starts at 0 and the music's alone-period is a short breath
  # rather than a ten-second wait. Long-form YouTube retention was 10.7%
  # (EN) / 6.3% (RU) with the old 10 s + ~18 s greeting open.
  voice_intro_delay: 0.0
  intro_duration: 3.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.6
  overlap_volume: 0.5
  fade_volume: 0.4
  outro_volume: 0.6
publishing:
  rss_file: fascinating_frontiers_podcast.rss
  rss_title: Fascinating Frontiers
  rss_description: 'Daily space and astronomy news: NASA and SpaceX missions, ESA
    operations, exoplanet and James Webb discoveries, and the engineering behind humanity''s
    push into the cosmos — with ongoing story tracking across Starship, Artemis, and
    deep-space science. For space enthusiasts, engineers, and the curious.'
  rss_summary: Daily space and astronomy news. Curiosity, exploration, scientific
    accuracy, and inspiration.
  rss_link: https://nerranetwork.com/fascinating-frontiers.html
  rss_author: Patrick
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/fascinating-frontiers.jpg
  rss_category: Science
  rss_subcategory: Astronomy
  rss_keywords: space, astronomy, nasa, spacex, cosmos, exoplanet, telescope, james
    webb
  guid_prefix: fascinating-frontiers
  base_url: https://nerranetwork.com
  audio_subdir: digests/fascinating_frontiers
  summaries_json: digests/fascinating_frontiers/summaries_space.json
  summaries_podcast_name: space
  x_enabled: true
  x_env_prefix: PLANETTERRIAN_X_
  x_handle: '@planetterrian'
episode:
  prefix: Fascinating_Frontiers
  filename_pattern: '{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3'
  output_dir: digests/fascinating_frontiers
  mp3_glob: Fascinating_Frontiers_Ep*.mp3
chapters:
  enabled: true
  section_markers:
  - pattern: Welcome.*Fascinating Frontiers|Fascinating Frontiers.*episode
    title: Introduction
    where: start
  - pattern: Cosmic Spotlight
    title: Cosmic Spotlight
  # `deep dive` (bare) + `under the hood` dropped June 24 2026: the spoken
  # script never announces the Cosmic Deep Dive (podcast prompt forbids it),
  # so the only thing the bare pattern ever matched was the cross-promo
  # "daily deep dive into everything Tesla" in the network-family closing —
  # which created a spurious, out-of-order "Cosmic Deep Dive" chapter AFTER
  # the sign-off (Ep109). Keep only the literal section label.
  - pattern: cosmic deep dive
    title: Cosmic Deep Dive
  # Closing MUST precede Tomorrow Teaser: the sign-off line ("…I'll see you
  # next time") matches the teaser's `Next time`, so with Teaser listed first
  # the closing line was mis-titled "Tomorrow Teaser" and the episode shipped
  # with NO Closing chapter (Ep110/Ep111 ended on Tomorrow Teaser). Listing
  # Closing first lets it win the shared sign-off line (EI June-11 / SpaceX
  # June-18 / First-Principles June-23 ordering rule). `where: end` keeps it
  # pinned to the sign-off; the real teaser line still wins its own earlier
  # line via the broadened pattern below.
  - pattern: That's Fascinating Frontiers|that covers today|that.?s.*for today|until
      next time
    title: Closing
    where: end
  # Broadened June 24 2026: 6 of the last 8 teasers open "Keep an eye on…" /
  # "Watch for…" (podcast prompt line 122), which the old `Before we go|Next
  # time` pattern missed — so the only Tomorrow-Teaser chapter ever created
  # was the closing line stolen by `Next time`. The two new openers are
  # line-anchored (`^`) so mid-body forward-looking phrasing ("…as we watch
  # for…", "Watch for the next Ariane 6 mission" in the news body) can't
  # claim the title; the `where: end` window already restricts to the sign-off
  # region.
  - pattern: Before we go|Next time|^Keep an eye on|^Watch for
    title: Tomorrow Teaser
    where: end
newsletter:
  enabled: true
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: Fascinating Frontiers
  short_label: Frontiers
  emoji: 🛰️
  newsletter_start_date: '2026-04-30'
  requires_financial_disclaimer: false
  length_target_words: 1300
slow_news:
  enabled: true
  library_file: shows/segments/fascinating_frontiers.json
  max_segments: 2
  cooldown_days: 30
  repeat_trigger_threshold: 5
content_freshness:
  # July 2 2026: 2 -> 7. A 2-day window let a slow news day re-run stories
  # already aired earlier the same week (Ep116, 2026-06-29, repeated 4 of
  # Ep111/112's stories verbatim). A full week matches the cross-episode
  # dedup horizon listeners actually notice.
  lookback_days: 7
  similarity_threshold: 0.72
# July 2026 improvements pack: second video-podcast pilot after Tesla/SpaceX.
# Operator must submit fascinating_frontiers_podcast.video.rss as a SEPARATE
# Apple Podcasts show (docs/video_podcasts.md) — enabling the feed alone is
# not enough for the Apple video shelf.
video_podcast:
  enabled: true
youtube:
  podcast_playlist_id: PLRHMnzNNXPYDC7-f8Dary-bTZyvwxR-dR
  enabled: true
  publish_long_form: true       # Flipped on with the 200k quota grant (June 2026)
  shorts_start_mode: smart
  # July 18 2026: parity with the Tesla/SpaceX May-2026 retune. FF's calm
  # science prose rarely beats the default 5.0 (kicker-phrase-driven
  # scorer), so every July episode fell back to the 10.0s voice start
  # and shipped 1-of-2 Shorts.
  shorts_min_score_threshold: 3.5
  # 35s (was 40) — July 30 2026. See shows/_defaults.yaml: the median
  # Short holds 21s, so 35 turns that into 60% completion instead of
  # 52%. This show was already ahead of the 55s network default.
  short_duration_seconds: 35
  channel: en
  # Russian-dubbed video to @NerraRU from the auto-generated `ru` audio
  # track (engine.ru_dub, decoupled multilingual flow). Operator must
  # create + flag the @NerraRU playlist in Studio (landmine #15) and set
  # ru_podcast_playlist_id; uploads still publish without it (warned).
  ru_dub_enabled: true
  # July 18 2026 — @NerraFR French dubs (engine.lang_dub, generalized
  # language-dub engine). Dormant until YOUTUBE_REFRESH_TOKEN_FR is set;
  # playlist via dub_playlist_ids: {fr: PL...} once created (landmine #15).
  dub_languages: [fr]
  # dub-long-form-probe ENDED EARLY 2026-08-15 (operator-directed): the
  # readout repeated the July numbers it was meant to re-test — across
  # the enrolled shows the forced RU/FR longs earned ~9 views/video
  # (52 videos, 461 views, net -2 subscribers) and ru_long_vpd sat at
  # 1.52 against the 2.0 floor. The flag is removed per the experiment's
  # own exit rule; the adaptive policy's shorts-only tier decides again.
  dub_playlist_ids: {fr: PLbi8yBcu23No}
  ru_podcast_playlist_id: PLKuK4hcwFm1w
  category_id: 28
  default_language: en
