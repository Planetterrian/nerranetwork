chapters:
  enabled: true
  section_markers:
  - pattern: Privyet|welcome to Privyet
    title: Привет! Welcome
    where: start
  - pattern: word of the day|first word
    title: Word of the Day
  - pattern: vocabulary builder|let's learn more|let's build more|more words|more
      new words
    title: Vocabulary Builder
  - pattern: grammar bite|grammar time|how Russian works|little grammar|quick grammar|grammar
      moment
    title: Grammar Bite
  - pattern: word origins|where.*comes? from|etymology|history of|cool about one of
      today's words|story behind
    title: Word Origins Deep Dive
  - pattern: culture corner|fun fact|did you know
    title: Culture Corner
  - pattern: practice time|quiz|remember what
    title: Practice Time
  - pattern: molodets|well done|poka|see you
    title: Closing
    where: end
