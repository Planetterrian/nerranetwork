# The Age of AI — the network's AI-hosted interview show (July 2026).
#
# Premise stated on air every episode: the host (Nerra, the network's
# resident AI) is a machine; the guests are real people, and their words are
# their own. Episodes are produced from consented, answered interview
# packets compiled by scripts/age_of_ai_guests.py into the topic queue —
# an empty queue is a clean skip, so the show publishes only when an
# interview is actually ready.
#
# No cron at launch (CRON_MAP/scheduler Worker untouched): produce via the
# Run Podcast Show workflow_dispatch or `python run_show.py age_of_ai`.
# Design + operator runbook: docs/age_of_ai_plan.md.
name: "The Age of AI"
slug: age_of_ai
description: >-
  The interview show where the roles are reversed: Nerra, an AI, asks the
  questions — and real people answer. Teachers, founders, artists,
  tradespeople, and skeptics on what the AI transition actually feels like
  from inside a life and a livelihood. Real people. Real answers. An honest
  machine asking the questions.

narrative_mode: true
topic_queue_file: shows/topic_queues/age_of_ai.yaml
weekly_recap_on_sunday: false
min_articles_skip: 0

multilingual:
  enabled: false
  auto: false
  languages: []

llm:
  provider: xai
  system_prompt_file: shows/prompts/age_of_ai_system.txt
  digest_prompt_file: shows/prompts/age_of_ai_digest.txt
  podcast_prompt_file: shows/prompts/age_of_ai_podcast.txt
  digest_temperature: 0.5
  podcast_temperature: 0.7
  max_tokens: 4500
  podcast_max_tokens: 9000
  # Interview length tracks the guest's actual answers; padding an interview
  # risks drifting from verbatim guest words, so the expand-retry stays OFF
  # (fidelity beats length on this show) and the floor is deliberately low.
  min_podcast_words: 1200
  min_podcast_word_floor: 700

tts:
  # Two-voice dialogue mode on the DP Pod infrastructure. NERRA is the AI
  # host (a deliberately distinct Grok built-in voice — NOT the network's
  # Patrick clone: the host persona is a machine, not Patrick). GUEST is the
  # default synthetic voice for ai_voiced episodes (guest answers performed
  # with explicit consent_ai_voice only); a packet's guest_voice_id can
  # override it per episode via shows/hooks/age_of_ai.py. quoted-mode
  # packets flip dialogue_mode off for that run (single-narrator episode).
  dialogue_mode: true
  dialogue_voices:
    NERRA: eve   # Grok built-in voice — the AI host's own identity
    GUEST: ara   # Grok built-in voice — consented synthetic guest voicing
  dialogue_pause_ms: 260
  # Dialogue mode never applies the speech wrap (landmine #17 leak shape);
  # pin empty so the config states reality.
  speech_wrap_open: ""
  speech_wrap_close: ""

audio:
  transition_sting: assets/music/transition_sting.mp3

publishing:
  rss_file: age_of_ai_podcast.rss
  rss_title: "The Age of AI"
  rss_description: >-
    The interview show where the roles are reversed: Nerra, an AI, asks the
    questions — and real people answer, in their own words. Honest
    conversations about what the AI transition actually feels like from
    inside a life and a livelihood, with full disclosure baked into every
    episode: the host is a machine, the guests never are.
  rss_summary: "Real people. AI host. The age we're all living through."
  rss_link: https://nerranetwork.com/age-of-ai.html
  rss_author: Nerra Network
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/age-of-ai.jpg
  rss_category: Society & Culture
  rss_subcategory: Personal Journals
  rss_keywords: "AI, artificial intelligence, interviews, future of work, technology and society, AI transition"
  guid_prefix: age-of-ai
  base_url: https://nerranetwork.com
  audio_subdir: digests/age_of_ai
  summaries_json: digests/age_of_ai/summaries_age_of_ai.json
  summaries_podcast_name: age_of_ai
  player_html: age-of-ai.html
  summaries_html: age-of-ai-summaries.html
  # RSS + site page only at launch (X/YouTube/newsletter off).
  x_enabled: false
  x_env_prefix: ""
  host_name: Nerra

episode:
  prefix: Age_of_AI
  filename_pattern: "{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3"
  output_dir: digests/age_of_ai
  mp3_glob: "Age_of_AI_Ep*.mp3"

chapters:
  enabled: true
  # Network chapter lessons baked in at launch: positional where anchors
  # (Tesla/EI/PT orphan-chapter class) and Closing listed BEFORE the body
  # markers (EI June-11 ordering rule). The podcast prompt requires the
  # host to announce segment names so the mid-body markers latch.
  section_markers:
    - pattern: "[Ww]elcome to The Age of AI|[Tt]his is The Age of AI"
      title: "Introduction"
      where: start
    - pattern: "keep being human|[Tt]hat.?s The Age of AI for"
      title: "Closing"
      where: end
    - pattern: "[Mm]y guest (?:today|this episode)|[Mm]eet (?:today.?s|our) guest"
      title: "Meet the Guest"
    - pattern: "[Ll]et.?s get into the conversation|[Oo]n to the conversation"
      title: "The Conversation"
    - pattern: "[Ss]ignals from the [Ff]uture"
      title: "Signals from the Future"

newsletter:
  enabled: false
  tag: "The Age of AI"
  short_label: "Age of AI"
  emoji: "🤖"

content_tracking:
  section_patterns: {}

youtube:
  # Off at launch. image_provider pre-set to grok so a future one-line
  # enable doesn't trip tests/test_config.py's Grok-Imagine drift guard.
  enabled: false
  channel: en
  category_id: 28               # Science & Technology
  image_provider: grok
  # Required ≥3 even while YouTube is disabled
  # (tests/test_visual_assets.py::test_every_show_yaml_has_image_queries).
  image_queries:
    - human and robot hands almost touching
    - person being interviewed in a warm studio
    - craftsperson at work with modern technology
    - teacher in a classroom with holographic display
    - portrait of a thoughtful person dramatic lighting
