  transition_sting: assets/music/transition_sting.mp3
  # May 12 2026 retune (see shows/_defaults.yaml).
  voice_intro_delay: 10.0
  intro_duration: 10.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.5
  overlap_volume: 0.4
  fade_volume: 0.3
  outro_volume: 0.5

publishing:
  rss_file: omni_view_podcast.rss
  rss_title: "Omni View - Balanced News Perspectives"
  # June 2026: lead with the Steel Man value prop instead of a generic
  # "countering media bias" claim.
  rss_description: "Daily world news where every story is presented from the strongest case each side can make — the version its most thoughtful advocates actually argue, never a caricature. Sources attributed, both sides steel-manned, so you decide. You shouldn't be able to tell which side we favor."
  rss_link: https://nerranetwork.com/omni-view.html
  rss_author: Omni View
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/omni-view.jpg
  rss_category: News
  rss_subcategory: Daily News
  rss_keywords: "world news, geopolitics, daily news, current events, multi-perspective"
  guid_prefix: omni-view
  base_url: https://nerranetwork.com
  audio_subdir: digests/omni_view
  summaries_json: digests/omni_view/summaries_omni.json
  summaries_podcast_name: omni
  x_enabled: true
  x_env_prefix: "X_"

episode:
  prefix: Omni_View
  filename_pattern: "{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3"
  output_dir: digests/omni_view
  mp3_glob: "Omni_View_Ep*.mp3"

chapters:
  enabled: true
  # June 10 2026 quality pass: Omni View was MISSED by the Tesla/four-show/
  # env_intel chapter-hardening passes. Two shipped bugs:
  #   1. 7 of the last 10 episodes shipped with NO Closing chapter — the
  #      dominant closing-pool variant ("That wraps up today's Omni View.
  #      Remember — the best-informed people…") matched no pattern (the
  #      MAB orphan-closing class). The Closing pattern now covers both
  #      closing-pool variants in engine/intros.py.
  #   2. The "Understanding the Issue" pattern ("understanding the issue|
  #      deeper look|let's understand") never matched the actual spoken
  #      deep-dive opener ("Now, to really understand this story, there is
  #      something most coverage leaves out…" / "To understand the X more
  #      fully…"). With only 2 markers matching, the auto-segment fallback
  #      fired and titled a chapter from a raw deep-dive sentence — Ep061
  #      shipped a chapter literally titled "Knowing this, when you hear
  #      claims that the system worked…" and Ep068 "How are casualty
  #      figures verified when access to strike…". The pattern now matches
  #      the real opener, restoring the deep-dive chapter and keeping the
  #      matched count at/above min_chapters so the garbage-title fallback
  #      stops firing.
  # Positional `where` anchors (Tesla chapter-bug class) keep Introduction
  # pinned to the open and Teaser/Closing pinned to the sign-off.
  section_markers:
    - pattern: "This is Omni View|Welcome.*Omni View|Omni View.*episode"
      title: "Introduction"
      where: start
    - pattern: "Shifting now to|Meanwhile|first story|first up"
      title: "Main Stories"
    - pattern: "to really understand|to understand .{1,80}? more fully|most coverage leaves out|here's the thing that changes"
      title: "Understanding the Issue"
    - pattern: "That's Omni View|That wraps up today.?s Omni View|that wraps up today|until next time"
      title: "Closing"
      where: end
    - pattern: "Before we go|before we wrap|Tomorrow, watch for"
      title: "Tomorrow Teaser"
      where: end

newsletter:
  enabled: true
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: "Omni View"
  short_label: "Omni View"
  emoji: "🌍"
  newsletter_start_date: "2026-04-30"
  requires_financial_disclaimer: false
  length_target_words: 1300

slow_news:
  enabled: true
  library_file: shows/segments/omni_view.json
  max_segments: 2
  cooldown_days: 30

