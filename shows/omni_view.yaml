multilingual:
  # English-only show (operator decision June 2026) — no translations.
  enabled: false

llm:
  provider: xai
  system_prompt_file: shows/prompts/omni_view_system.txt
  digest_prompt_file: shows/prompts/omni_view_digest.txt
  podcast_prompt_file: shows/prompts/omni_view_podcast.txt
  digest_temperature: 0.5
  podcast_temperature: 0.7
  # Steel-man format is verbose (~1.6k chars/story). 4000 truncated the
  # 22-story digest mid-way (losing the later sections + tripping retries);
  # the story count is now 12 (5+2+2+1+1+1) and this gives headroom to
  # finish all sections without truncation. Digest still lands well under
  # the 30k-char "too long" guard.
  max_tokens: 10000
  podcast_max_tokens: 8000
  # June 10 2026 quality pass: Omni View was MISSED by the June network
  # pass that added podcast_expand_below_target to the eight chronically
  # short shows. Its episodes ran ~1,150 words (range 900-1,566) against a
  # podcast prompt that simultaneously demanded "8-12 minutes", "at least
  # 2000 words", and "40+ sentences" (40 sentences is ~700 words, not
  # 2000 — the prompt's own arithmetic contradicted itself). The prompt is
  # now unified to one target (1,700-2,000 words / 11-13 min); this floor
  # + the expand flag fire the one-shot "cover more stories" retry whenever
  # a first pass lands short (the digest carries ~12 stories; episodes were
  # covering only 6-7). Soft skip floor = 1400*0.6 = 840, below the lowest
  # recent output, so nothing newly skips. Watch the first week for
  # podcast_script_too_thin markers; fall back to 1200 if it skips.
  min_podcast_words: 1400
  podcast_expand_below_target: true

tts:
  # Inherits provider=grok, voice_id=sal, language_code=en, max_chars=10000
  # from shows/_defaults.yaml (network default since May 2026 — Grok TTS
  # at $4.20/M chars vs ElevenLabs Flash $150/M).
  {}

audio:
