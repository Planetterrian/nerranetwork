# Defense-in-depth against celebrity/tabloid shapes at fetch time (FF
# stock-filter class — deterministic, no A/B). Conservative on purpose:
# hard-news false drops are worse than a leaked soft item (the prompt-level
# anti-tabloid bar is the primary filter).
exclude_title_patterns:
- red carpet
- \bLove Island\b
- \bStrictly Come Dancing\b
- reality TV star
- \broyal\b.*\b(fashion|dress|style|outfit)\b
- wardrobe malfunction
- \bpaparazzi\b
- (?i)\bnet worth\b
- (?i)steps out (?:in|with)
web_search_queries:
- world news geopolitics today
- US politics policy news today
- Africa major news developments today
- Latin America Asia major news today
- economy markets news today
x_accounts:
- handle: Reuters
  label: Reuters
  max_posts: 4
- handle: AP
  label: Associated Press
  max_posts: 4
- handle: BBCBreaking
  label: BBC Breaking News
  max_posts: 3
- handle: TheEconomist
  label: The Economist
  max_posts: 3
- handle: AxiosNews
  label: Axios
  max_posts: 3
- handle: SemaforNews
  label: Semafor
  max_posts: 3
min_articles_skip: 4
