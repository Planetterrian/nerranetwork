name: Omni View
slug: omni_view
weekly_summary_segment: true   # July 2026: daily cadence; Sunday episode includes a short "week in review" segment (content lake).
description: The day's most important stories from around the world — explained calmly,
  from every side, in plain language for everyone from teens to seniors.
# July 18 2026 editorial realignment — sources rebalanced for worldwide scope:
# Daily Mail REMOVED (was the single most-cited outlet, framing hard news;
# tabloid vector), duplicate http BBC feed removed, r/news removed (US
# crime-blotter vector). Added: wires via Google News site: proxies (Reuters/
# AP publish no public RSS), WSJ World, and regional feeds for Africa / Asia /
# Latin America to fix the heavy UK/US skew (3-6 UK items per episode in the
# Jul 3-16 window).
