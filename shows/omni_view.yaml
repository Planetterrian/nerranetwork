multilingual:
  enabled: false
llm:
  provider: xai
  system_prompt_file: shows/prompts/omni_view_system.txt
  digest_prompt_file: shows/prompts/omni_view_digest.txt
  podcast_prompt_file: shows/prompts/omni_view_podcast.txt
  digest_temperature: 0.5
  podcast_temperature: 0.7
  max_tokens: 10000
  podcast_max_tokens: 8000
  min_podcast_words: 1400
  podcast_expand_below_target: true
  # July 18 2026: the new 7-slot format is a fixed slate — the default
  # "cover more stories" retry would fight it, so OV expands by DEEPENING
  # existing stories instead (engine/generator.py deepen flavor).
  podcast_expansion_style: deepen
  # Digest-stage floor + retry (the chronic under-length root cause was the
  # digest ceiling: 12 thin stories; now 7 deep ones must clear 1500 words).
  digest_expand_below_target: true
  min_digest_words: 1500
tts: {}
audio:
  music_file: assets/music/OmniView.mp3
  transition_sting: assets/music/transition_sting.mp3
  voice_intro_delay: 10.0
  intro_duration: 10.0
  overlap_duration: 15.0
  fade_duration: 30.0
  outro_duration: 30.0
  outro_crossfade: 0.0
  outro_fade_out_duration: 10.0
  intro_volume: 0.5
  overlap_volume: 0.4
  fade_volume: 0.3
  outro_volume: 0.5
publishing:
  rss_file: omni_view_podcast.rss
  rss_title: Omni View - Balanced News Perspectives
  rss_description: The day's most important stories from around the world — explained
    calmly, from every side. Named sources across the spectrum, genuine disagreements
    presented at their strongest, jargon translated into plain language, and every
    day one story about what's actually being done — so listeners from teens to
    seniors stay informed and curious, without clickbait, doom, or spin. You still
    shouldn't be able to tell which side we favor.
  rss_link: https://nerranetwork.com/omni-view.html
  rss_author: Omni View
  rss_email: patrick@planetterrian.com
  rss_image: https://nerranetwork.com/assets/covers/omni-view.jpg
  rss_category: News
  rss_subcategory: Daily News
  rss_keywords: world news, geopolitics, daily news, current events, multi-perspective
  guid_prefix: omni-view
  base_url: https://nerranetwork.com
  audio_subdir: digests/omni_view
  summaries_json: digests/omni_view/summaries_omni.json
  summaries_podcast_name: omni
  x_enabled: true
  x_env_prefix: X_
episode:
  prefix: Omni_View
  filename_pattern: '{prefix}_Ep{num:03d}_{date:%Y%m%d}.mp3'
  output_dir: digests/omni_view
  mp3_glob: Omni_View_Ep*.mp3
chapters:
  enabled: true
  section_markers:
  - pattern: This is Omni View|Welcome.*Omni View|Omni View.*episode
    title: Introduction
    where: start
  - pattern: Shifting now to|Meanwhile|first story|first up
    title: Main Stories
  # July 18 2026: the new daily progress/solutions segment. Anchored on the
  # three rotating transitions the podcast prompt seeds (PT dead-marker
  # class — verify on the first shipped episodes and broaden if needed).
  - pattern: progress worth knowing|what.?s actually being done|pushing in the
      right direction
    title: Progress Watch
  - pattern: to really understand|to understand .{1,80}? more fully|most coverage
      leaves out|here's the thing that changes
    title: Understanding the Issue
  - pattern: That's Omni View|That wraps up today.?s Omni View|that wraps up today|until
      next time
    title: Closing
    where: end
  - pattern: Before we go|before we wrap|Tomorrow, watch for
    title: Tomorrow Teaser
    where: end
newsletter:
  enabled: true
  platform: buttondown
  api_key_env: BUTTONDOWN_API_KEY
  status: about_to_send
  tag: Omni View
  short_label: Omni View
  emoji: 🌍
  newsletter_start_date: '2026-04-30'
  requires_financial_disclaimer: false
  length_target_words: 1300
slow_news:
  enabled: true
  library_file: shows/segments/omni_view.json
  max_segments: 2
  cooldown_days: 30
youtube:
  podcast_playlist_id: PLRHMnzNNXPYCv9Q34Hnv9h6C3PMUpkLXo
  enabled: true                 # Full-network rollout (200k quota, June 2026)
  channel: en
  category_id: 25
  # July 22 2026: smart Shorts start — every Short had opened on the 10 s
  # intro/branding beat (weakest possible Shorts opening). Threshold 3.5
  # matches the Tesla/SpaceX/FF fleet setting (5.0 default caused chronic
  # fallback on non-numeric transcript styles).
  shorts_start_mode: smart
  shorts_min_score_threshold: 3.5
  default_language: en
  image_provider: grok
  grok_image_model: grok-imagine-image
  grok_image_descriptor: "documentary photojournalism news photo, dramatic lighting, ultra-detailed"
  image_queries:
  - newsroom
  - capitol building
  - newspaper headlines
  - journalism studio
  - voting ballot
  - city skyline news
  - press conference
  image_query_prefix: ''
  tags:
  - news
  - balanced news
  - news podcast
  video_genre: world-news-analysis
  video_mood: balanced-analytical-serious
  video_keywords:
  - world news
  - international
  - analysis
  - global events
  - perspectives
  - debate
  video_visual_style: 'Documentary-style news footage, global locations, newsroom
    settings,

    expert interviews, map visualizations, data charts, current events,

    serious and balanced aesthetic.'

