  search: efficient markets hypothesis betting markets
  require:
  - efficien
  - betting|wager|prediction
  produced: false
- id: ai-forecasters
  title: Can AI Forecast?
  brief: How researchers benchmark language models against live prediction markets and human forecasters, what the early results show, and the limits of those benchmarks. Education only; never a recommendation, a pick or a strategy to follow.
