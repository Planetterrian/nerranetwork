  - id: fhsa-first-home-playbook
    title: "The FHSA Playbook: Canada's Best Account Nobody Uses Right"
    brief: >
      A complete First Home Savings Account strategy episode. How the FHSA
      actually works (contribution room accrual, the 15-year clock, the
      8k/year and 40k lifetime limits), why it beats both the TFSA and the
      RRSP Home Buyers' Plan for a first home (deduction on the way in,
      tax-free on the way out), how to invest inside it on a 1-3 year vs a
      5-10 year horizon (GIC ladders and high-interest savings ETFs vs
      balanced index exposure, sequence-of-returns risk near the purchase
      date), what happens if you never buy a home (the tax-free RRSP
      rollover escape hatch), couple-level coordination (two FHSAs plus
      the HBP), and the common mistakes: opening it too late (room only
      accrues after opening), holding US dividend payers inside it (no
      treaty relief), and over-equitizing a 18-month down-payment fund.
      Concrete numbers throughout; educational only, no advice.
