# Pronunciation map for Grok TTS.
#
# Purpose: override the TTS input text for a small set of proper nouns,
# acronyms, or product names where Grok TTS consistently mispronounces the
# standard spelling. Applied ONLY to the TTS copy of the text — the digest,
# blog, transcript, and social posts continue to use the standard written
# form. The map is layered on top of Grok's server-side `text_normalization`
# (which already handles dates, currencies, and ordinary numbers).
#
# Rules for adding entries:
# 1. Only add an entry after confirming Grok mispronounces the standard
#    written form on the production voice (`b4cusb2omvkz` for English shows,
#    `0b875ae2` "Olya" for Russian shows). With `text_normalization: true`
#    the engine handles most things natively — additions here should be
#    rare exceptions.
# 2. Match is case-insensitive, whole-word.
# 3. Replacement is the respelling sent to the TTS engine only.
# 4. Keep the list minimal — every entry is a maintenance burden.
# 5. Leave a comment recording WHEN the entry was added and WHY (which
#    show / which voice / what the symptom was).
#
# Format:
#   corrections:
#     "Written Form": "tts respelling"

corrections:
  # ---------------- Tickers / financial ----------------
  # Stock tickers should be read as letters, not as words. Grok will
  # otherwise occasionally pronounce "TSLA" as "tezz-luh".
  TSLA: "T S L A"
  NVDA: "N V D A"
  MSFT: "M S F T"
  AAPL: "A A P L"
  # SPCX added June 13 2026 (SpaceX IPO'd June 12; SpaceX Daily carries a
  # daily Market Watch on the ticker — same letter-spelling class as TSLA).
  SPCX: "S P C X"

  # ---------------- Canadian registered accounts ----------------
  # Spelled-out is universally how listeners refer to these vehicles
  # (TFSA, RRSP, FHSA), so the audio should match.
  TFSA: "T F S A"
  RRSP: "R R S P"
  FHSA: "F H S A"
  RESP: "R E S P"

  # Added June 12 2026 (transcript-evidenced, Финансы Просто / Olya
  # voice): Whisper transcripts of shipped FP episodes show "CRA"
  # coming out as "KRA" / "Crafts" — the Russian voice reads the Latin
  # token as a word. Both tokens are universally spoken letter-by-letter
  # (same class as TFSA/RRSP above). Letter-spellings only — NOT
  # phonetic respellings (see pause note below).
  CRA: "C R A"
  GIC: "G I C"

  # ---------------- Environmental Intelligence ----------------
  # Added June 12 2026 (transcript-evidenced): all 7 recent on-air
  # occurrences of EPEA (Alberta's Environmental Protection and
  # Enhancement Act) were transcribed as "EPA" — the voice elides a
  # letter and names the WRONG statute on air. Letter-by-letter
  # spelling removes the elision.
  EPEA: "E P E A"

  # ---------------- Tesla-specific ----------------
  # HW4 / HW5 / AI5 are read as "hardware four", "hardware five",
  # "A I five" — letter-by-letter avoids the engine attempting to
  # pronounce the alphanumeric tokens phonetically.
  HW4: "H W four"
  HW5: "H W five"
  AI5: "A I five"

  # Operator caught (Tesla Ep468, May 10 2026) the show name
  # "Tesla Shorts Time Daily" being mispronounced — Grok TTS glides
  # the /m/ at the end of "Time" into the /d/ of "Daily" and the
  # word comes out as "Time-aily" / "Timely" instead of two clearly
  # separated words. Inserting a comma forces a brief pause that
  # resets prosody at the junction. The text-only surfaces (digest,
  # blog, RSS) read the standard form because this map only applies
  # to the TTS copy of the script.
  Tesla Shorts Time Daily: "Tesla Shorts Time, Daily"

  # ---------------- Phonetic respellings paused (May 11 2026) ----------------
  # Operator A/B'd phonetic respellings (Planetterrian → "plan it TAIR ee
  # uhn", tissue → "tish-oo", neurodegenerative → "newro-de-JEN-er-uh-tiv")
  # on PT Ep060 / Fascinating Frontiers Ep080 and concluded **every
  # respelling sounded worse than the original word**. Grok TTS's custom
  # voice (kdif6sqjcyiq) handles these multi-syllable words natively; the
  # hyphen-separated tokens were read as 4-5 separately stressed
  # syllables instead of one fluid word.
  #
  # Decision: pause phonetic respellings entirely. Run raw text through
  # Grok TTS with ``text_normalization: true`` and let the voice clone
  # handle pronunciation. Re-introduce a respelling ONLY with listen-test
  # evidence that the respelled audio is measurably better than the
  # original on the custom voice — not just on theory.
  #
  # Acronyms below are letter-by-letter spellings of all-caps tokens
  # (LLM → "L L M", TSLA → "T S L A"). These are NOT phonetic guesses —
  # they're literal letter-spellings, and the operator-verified failure
  # mode without them is Grok occasionally saying "lum" / "tezz-luh".
  # Those stay.

  # ---------------- AI / tech ----------------
  # LLM and MCP are universally said as letter-by-letter; without this
  # entry Grok occasionally tries "lum" / "mick-pee".
  LLM: "L L M"
  MCP: "M C P"

  # ---------------- Brand names ----------------
  # Added 2026-06-24. The rotating closing promo says the network brand three
  # ways in one segment — the spaced "Nerra Network", the URL "nerranetwork.com"
  # (which strip_urls turns into "nerranetwork dot com"), and the YouTube handle
  # — and Grok was guessing a different pronunciation for each, so listeners
  # heard "Nerra" said 2-3 ways back to back. These entries are audio-only
  # (applied at synthesis, after strip_urls) so the blog/RSS transcript keeps
  # the clean brand while every spoken form normalizes to one pronunciation.
  # Operator-chosen pronunciation: "NEH-ruh" (short e, like "Nera"). This is an
  # explicit operator override of the "no phonetic respellings" pause above for
  # the network's own name — A/B-listen before merge (landmine #17).
  # Order matters (longest-first): "Nerra Network" before the "nerranetwork"
  # URL compound before the bare "Nerra".
  "Nerra Network": "NEH-ruh Network"
  nerranetwork: "NEH-ruh Network"
  Nerra: "NEH-ruh"

  # ---------------- Proper nouns moved from WORD_PRONUNCIATIONS (2026-06-25) ----------------
  # These foreign / hard-to-say names were respelled in
  # assets/pronunciation.py:WORD_PRONUNCIATIONS, which runs at SCRIPT-SAVE time
  # and leaks the respelling into the saved _tts.txt -> blog/RSS transcript
  # (the same class as the historical "nassa" / "koo-dah" / "An-thropic"
  # leaks). Moved here (audio-only, applied at synthesis) so the transcript
  # keeps the canonical spelling while Grok still receives the pronunciation
  # guide. The audio is byte-for-byte unchanged from the WORD_PRONUNCIATIONS
  # version, and none of these values overlap engine.utils._PHONETIC_GARBLES,
  # so there is no double-processing. NOT phonetic respellings of common
  # English words (those are deleted, not moved) — these are genuinely foreign
  # / hard tokens where the guide is load-bearing on the voice.
  # Organizations / unions
  "IG Metall": "I G Metall"
  "IF Metall": "I F Metall"
  # Companies / brands / missions
  Mistral: "Mee-stral"
  AstraZeneca: "Astra-Zeneca"
  Alnylam: "Al-nye-lam"
  Roscosmos: "Ross-cosmos"
  Hachette: "hah-SHET"
  SoFi: "So-Fi"
  NOIRLab: "Noir Lab"
  Afeela: "ah-FEE-lah"
  # Benchmark / library names with embedded letters
  DSPy: "D S Pie"
  HarmfulQA: "Harmful Q A"
  TheoremQA: "Theorem Q A"
  VideoQA: "Video Q A"
  MedQuAD: "Med Quad"
  # Space-mission / scientist names
  Cassini: "Kah-see-nee"
  Oberth: "Oh-bairt"
  # People (longest variants first so the bare "Zelensky" can't pre-empt them)
  Zelenskyy: "Zeh-len-skee"
  Zelenskyj: "Zeh-len-skee"
  Zelensky: "Zeh-len-skee"
  Karpathy: "Kar-pathy"
  Milei: "Mee-lay"
  Altman: "Awlt-man"
  Amodei: "Ah-mo-day"

