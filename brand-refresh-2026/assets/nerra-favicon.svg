<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Nerra Network favicon">
  <defs>
    <linearGradient id="nerra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B47FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0B0F1A"/>
  <!-- Bold 4-node burst: legible at 16px -->
