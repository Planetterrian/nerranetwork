    <line x1="50" y1="50" x2="28" y2="28"/>
    <line x1="50" y1="50" x2="72" y2="28"/>
    <line x1="50" y1="50" x2="28" y2="72"/>
    <line x1="50" y1="50" x2="72" y2="72"/>
  </g>
  <circle cx="28" cy="28" r="8" fill="#00D4FF"/>
  <circle cx="72" cy="28" r="8" fill="#6B47FF"/>
  <circle cx="28" cy="72" r="8" fill="#6B47FF"/>
  <circle cx="72" cy="72" r="8" fill="#00D4FF"/>
  <circle cx="50" cy="50" r="14" fill="url(#nerra)"/>
  <circle cx="50" cy="50" r="6" fill="#FFFFFF" opacity="0.95"/>
</svg>
