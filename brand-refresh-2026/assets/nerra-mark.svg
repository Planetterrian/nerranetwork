<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Nerra Network mark">
  <defs>
    <linearGradient id="nerra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B47FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="nerraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B47FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6B47FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect width="100" height="100" rx="24" fill="#0B0F1A"/>

  <!-- Energy glow -->
  <circle cx="50" cy="50" r="38" fill="url(#nerraGlow)"/>

  <!-- Pulse rings (momentum) -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="url(#nerra)" stroke-width="1" opacity="0.18"/>
  <circle cx="50" cy="50" r="24.5" fill="none" stroke="url(#nerra)" stroke-width="1" opacity="0.10"/>

  <!-- Spokes from hub to nodes -->
  <g stroke="url(#nerra)" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
    <line x1="50" y1="50" x2="50" y2="26"/>
    <line x1="50" y1="50" x2="70.8" y2="38"/>
    <line x1="50" y1="50" x2="70.8" y2="62"/>
    <line x1="50" y1="50" x2="50" y2="74"/>
    <line x1="50" y1="50" x2="29.2" y2="62"/>
    <line x1="50" y1="50" x2="29.2" y2="38"/>
  </g>

  <!-- Nodes (alternating spectrum, no rainbow) -->
  <circle cx="50"   cy="26" r="5.2" fill="#00D4FF"/>
  <circle cx="70.8" cy="38" r="5.2" fill="#6B47FF"/>
  <circle cx="70.8" cy="62" r="5.2" fill="#00D4FF"/>
  <circle cx="50"   cy="74" r="5.2" fill="#6B47FF"/>
  <circle cx="29.2" cy="62" r="5.2" fill="#00D4FF"/>
  <circle cx="29.2" cy="38" r="5.2" fill="#6B47FF"/>

  <!-- Hub -->
  <circle cx="50" cy="50" r="10" fill="url(#nerra)"/>
  <circle cx="50" cy="50" r="4.2" fill="#FFFFFF" opacity="0.95"/>
</svg>
