<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1500" width="1500" height="1500" role="img" aria-label="Nerra Network show cover template">
  <!--
    NERRA NETWORK — UNIFIED SHOW COVER TEMPLATE
    Swap these per show to keep the whole network a visual family:
      • SHOW-COLOR        : the show's accent (see palette in guidelines) — here #E31937 (Tesla)
      • SHOW-TITLE        : the show name
      • SHOW-KICKER       : one-line descriptor
    Everything else (dark base, corner mark badge, node accent, type) stays fixed.
  -->
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A"/><stop offset="100%" stop-color="#11151F"/>
    </linearGradient>
    <radialGradient id="showGlow" cx="50%" cy="34%" r="60%">
      <stop offset="0%" stop-color="#E31937" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#E31937" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E31937" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nerra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B47FF"/><stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="1500" rx="0" fill="url(#base)"/>
  <rect width="1500" height="1500" fill="url(#showGlow)"/>

  <!-- Show node accent (the show's place in the constellation) -->
  <g transform="translate(750,470)">
    <circle r="180" fill="none" stroke="#E31937" stroke-width="2" opacity="0.18"/>
    <circle r="120" fill="none" stroke="#E31937" stroke-width="2" opacity="0.28"/>
    <g stroke="#E31937" stroke-width="4" stroke-linecap="round" opacity="0.5">
      <line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="0" x2="104" y2="60"/><line x1="0" y1="0" x2="-104" y2="60"/>
    </g>
    <circle cx="0" cy="-120" r="14" fill="#E31937"/>
    <circle cx="104" cy="60" r="14" fill="#E31937"/>
    <circle cx="-104" cy="60" r="14" fill="#E31937"/>
    <circle r="40" fill="#E31937"/>
    <circle r="16" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Show title -->
  <text x="750" y="820" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="150" letter-spacing="-4" fill="#FFFFFF">Tesla</text>
  <text x="750" y="960" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="150" letter-spacing="-4" fill="#FFFFFF">Shorts Time</text>

  <!-- Kicker -->
  <text x="750" y="1050" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="46" letter-spacing="2" fill="#CBD5E1">Shorting Tesla? Time's up.</text>

  <!-- Network badge (fixed across all shows) -->
  <g transform="translate(620,1300)">
    <g transform="scale(0.62)">
      <rect width="100" height="100" rx="24" fill="#0B0F1A"/>
      <g stroke="url(#nerra)" stroke-width="2.4" stroke-linecap="round" opacity="0.6">
        <line x1="50" y1="50" x2="50" y2="26"/><line x1="50" y1="50" x2="70.8" y2="38"/>
        <line x1="50" y1="50" x2="70.8" y2="62"/><line x1="50" y1="50" x2="50" y2="74"/>
        <line x1="50" y1="50" x2="29.2" y2="62"/><line x1="50" y1="50" x2="29.2" y2="38"/>
      </g>
      <circle cx="50" cy="26" r="5.2" fill="#00D4FF"/><circle cx="70.8" cy="38" r="5.2" fill="#6B47FF"/>
      <circle cx="70.8" cy="62" r="5.2" fill="#00D4FF"/><circle cx="50" cy="74" r="5.2" fill="#6B47FF"/>
      <circle cx="29.2" cy="62" r="5.2" fill="#00D4FF"/><circle cx="29.2" cy="38" r="5.2" fill="#6B47FF"/>
      <circle cx="50" cy="50" r="10" fill="url(#nerra)"/><circle cx="50" cy="50" r="4.2" fill="#FFFFFF" opacity="0.95"/>
    </g>
    <text x="86" y="46" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="34" letter-spacing="4" fill="#FFFFFF">NERRA NETWORK</text>
  </g>
</svg>
