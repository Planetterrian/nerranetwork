# Members-only limited series (Oct 18 2026, operator-directed).
#
# Produced by scripts/produce_special.py, released whole by
# scripts/release_special.py (see engine/specials.py and docs/specials.md).
# Briefs describe what each part must establish and the questions it must
# answer; they are research instructions, never facts to repeat. Anything
# the model cannot source from a page the run fetched stays out of the
# episode or is stated as an open question.

id: spacex-tesla-merger
title: "SpaceX and Tesla: The Merger Question"
subtitle: "A members-only limited series on whether the two companies should become one"
host_show: spacex            # voice, music and model settings come from this show
tease_shows: [spacex, tesla] # free feeds, newsletters and show pages that carry the trailer
x_env_prefixes: ["X_", "NERRANETWORK_X_"]
min_sources: 12              # fetched, readable pages per episode, or the episode does not produce
rules_file: shows/prompts/specials/spacex_tesla_merger_rules.txt
summary: >-
  Seven episodes on the idea of combining SpaceX and Tesla: what each company
  is today, how a combination would actually be done, the industrial logic, the
  governance and legal record, the regulatory and national-security questions,
  and then the strongest case for and the strongest case against, each argued
  on its own terms.
teaser: >-
  Should SpaceX and Tesla become one company? A seven-part members-only
  series: the mechanics, the money, the law, the national-security questions,
  and the strongest case on each side.

episodes:
  - id: two-companies-today
    part: 1
    title: "Two Companies, One Founder"
    stance: neutral
    brief: |
      Establish the ground truth the whole series stands on. What each
      company is today as a business: revenue lines, segments, margins where
      published, capital spending, debt, headcount where published, and the
      share structure — SpaceX as a listed company (ticker SPCX) and Tesla
      (TSLA): market value, share classes, who the largest holders are, and
      Elon Musk's economic and voting interest in each, from the latest
      filings. The existing ties between them and with xAI: contracts,
      shared suppliers, executives who have moved between them, shared
      technology (batteries, materials, manufacturing methods, Starlink on
      vehicles), and any related-party transactions disclosed in filings.
      What has actually been said in public about combining them — by Musk,
      by the companies, by analysts — with dates; separate statements of
      intent from speculation and say plainly if no formal proposal exists.
      End by setting out the questions the rest of the series answers.
    questions:
      - SpaceX SPCX latest quarterly results revenue segments Starlink launch
      - SpaceX 10-Q risk factors related party transactions Tesla xAI
      - Tesla 10-Q 10-K related party transactions SpaceX xAI
      - Elon Musk ownership stake SpaceX Tesla voting control filing
      - Tesla SpaceX merger speculation Musk comments
      - SpaceX Tesla shared executives suppliers technology transfer
      - Tesla investment in xAI shareholder vote
      - SpaceX market capitalization SPCX share classes
      - Tesla market capitalization institutional holders proxy statement

  - id: how-a-merger-works
    part: 2
    title: "How You Would Actually Combine Them"
    stance: neutral
    brief: |
      The mechanics, explained so a non-lawyer can follow them. The
      structures available (one company acquiring the other in stock, a new
      holding company over both, a partial combination or asset transfer),
      and what each implies for the two sets of shareholders. How an exchange
      ratio is set and why it is the whole fight; the role of independent
      board committees, fairness opinions, majority-of-the-minority votes and
      appraisal rights when a controlling or conflicted shareholder sits on
      both sides. Where each company is incorporated now and what that
      state's law requires of a conflicted transaction (Tesla moved its
      incorporation from Delaware to Texas in 2024; establish SpaceX's from
      its filings). Listing, index and tax consequences. The SolarCity
      acquisition of 2016 as the closest precedent: how it was structured,
      what the Delaware litigation found, and what that record means for any
      future Musk-to-Musk deal. Use the court's own text where it was fetched.
    questions:
      - In re Tesla Motors SolarCity litigation Delaware Court of Chancery opinion
      - Delaware Supreme Court SolarCity Tesla appeal ruling 2023
      - controlling shareholder transaction MFW framework special committee majority of minority
      - Tesla reincorporation Texas 2024 shareholder vote business judgment
      - Texas business organizations code controlling shareholder conflicted transaction 2025 amendment
      - SpaceX state of incorporation SEC filing
      - stock-for-stock merger exchange ratio fairness opinion explained
      - holding company reorganization two public companies combination examples

  - id: industrial-logic
    part: 3
    title: "The Industrial Logic"
    stance: neutral
    brief: |
      What a combined company could do that the two cannot do by contract
      today, and what is overstated. Work through each claimed synergy with
      the evidence for and against it: batteries and energy storage;
      materials and manufacturing (stainless steel, casting, factory
      methods); Starlink connectivity in vehicles and robots; AI compute and
      chips (Dojo's fate, AI5/AI6, xAI's Colossus, data centres in orbit
      where actually proposed); Optimus and robotics in factories and in
      space; procurement scale; engineering talent. For each, distinguish
      what is already happening between separate companies from what would
      only be possible inside one. Name what does not overlap at all (car
      dealerships and insurance, launch services, government spaceflight)
      and what a combined capital-allocation committee would have to choose
      between. Use numbers from filings and named reporting only.
    questions:
      - Tesla SpaceX synergies analyst note combination
      - Tesla Megapack energy storage SpaceX Starlink batteries supplier
      - Starlink in Tesla vehicles connectivity
      - Tesla AI5 AI6 chips Samsung SpaceX xAI compute
      - xAI Colossus Memphis Tesla SpaceX investment
      - SpaceX orbital data centers proposal
      - Tesla Optimus robot factory deployment SpaceX
      - Tesla capital expenditure guidance SpaceX capital spending Starship

  - id: control-and-governance
    part: 4
    title: "Control, Pay and Who Decides"
    stance: neutral
    brief: |
      The governance record a combination would inherit. Musk's
      compensation history at Tesla (the 2018 award, the Tornetta ruling,
      the re-approval vote, the later award) and what each step shows about
      how Tesla's board handles conflicts. Board independence at each
      company as disclosed. Key-person risk: how each company describes its
      dependence on one person in its own risk factors. How Musk's time is
      divided across companies and what investors have said about it. The
      xAI dimension: Tesla's and SpaceX's dealings with xAI, any investment
      votes, and whether a combination would include or exclude xAI. What
      minority shareholders of each company would gain or lose in voting
      power and protections. Quote the court and the proxy statements
      directly where fetched.
    questions:
      - Tornetta v. Musk Delaware Chancery ruling compensation 2024 opinion
      - Tesla shareholders reapprove Musk pay package 2024 vote result
      - Tesla 2025 CEO performance award proxy
      - Tesla board independence proxy statement directors
      - SpaceX risk factors dependence on Elon Musk key person
      - Tesla risk factors dependence on Elon Musk time
      - Tesla xAI investment shareholder proposal vote result
      - proxy advisors ISS Glass Lewis Tesla recommendation Musk

  - id: regulation-and-national-security
    part: 5
    title: "Washington, Security and the Regulators"
    stance: neutral
    brief: |
      The government side, which may decide more than the shareholders do.
      SpaceX's role as a national-security contractor (NSSL launches, the
      Starshield work, NASA crew and cargo, the lunar lander) and what that
      implies for ownership, foreign shareholders, export control (ITAR/EAR)
      and facility clearances in a combined company. Tesla's exposure to
      China (Shanghai factory, sales, supply chain) and how a combined
      company with Tesla's China footprint would sit beside classified
      defence work — what rules actually apply, as opposed to commentary.
      Antitrust: whether any market overlap exists that a regulator would
      review, and which filings would be required. FCC licensing for
      Starlink. Any public statements from lawmakers or agencies about
      Musk's companies' government ties. Be precise about what the law
      requires and what is merely speculated.
    questions:
      - SpaceX national security launch contracts NSSL Space Force
      - Starshield contract National Reconnaissance Office SpaceX
      - ITAR foreign ownership control influence FOCI facility clearance merger
      - Tesla Shanghai Gigafactory China revenue share
      - CFIUS review foreign investment defense contractor merger rules
      - Hart-Scott-Rodino merger filing requirements antitrust review
      - FCC Starlink license conditions ownership change
      - lawmakers letter SpaceX Tesla China conflict of interest

  - id: the-case-for
    part: 6
    title: "The Case For"
    stance: for
    brief: |
      The strongest honest argument that combining SpaceX and Tesla would
      create value for shareholders and for the mission, made by its best
      advocates and built only from sourced material. Assemble it from the
      earlier parts: the synergies that are real and cannot be captured by
      contract; ending conflicts of interest by putting them under one
      board; one capital pool for the largest capital programmes; simpler
      governance of Musk's attention; a single AI and robotics strategy;
      the value of a combined balance sheet. Use named analysts, investors
      and statements on the record. State the conditions under which the
      case holds (an exchange ratio set by independent committees, a
      minority vote) and the strongest objection it must answer, then
      answer it. This part argues one side; say so at the start and point
      the listener to Part 7.
    questions:
      - analyst bull case Tesla SpaceX merger value
      - investor argues Tesla SpaceX should merge
      - conglomerate premium Musk companies argument
      - Tesla SpaceX combined balance sheet capital Starship robotaxi
      - Elon Musk comments companies combine future

  - id: the-case-against
    part: 7
    title: "The Case Against"
    stance: against
    brief: |
      The strongest honest argument that combining them would destroy
      value or harm one set of shareholders, made by its best advocates and
      built only from sourced material. The conglomerate discount and the
      evidence for it; the SolarCity precedent and what the court record
      shows; the exchange-ratio problem when one person controls both sides;
      the national-security and China entanglement; the loss of two separate
      valuation stories that investors can choose between; regulatory and
      litigation risk; concentration of key-person risk; what each
      company's minority shareholders would give up. Use named critics,
      governance experts, proxy advisers and court findings on the record.
      State the strongest point of the case for and answer it. This part
      argues one side; say so at the start, and close the series by setting
      out the questions a listener should ask of any actual proposal.
    questions:
      - analyst bear case Tesla SpaceX merger risk
      - conglomerate discount evidence study
      - SolarCity acquisition criticism bailout governance
      - governance experts Musk related party transactions concern
      - Tesla shareholders oppose xAI investment SpaceX conflict
      - minority shareholder protection controlling shareholder merger risk
