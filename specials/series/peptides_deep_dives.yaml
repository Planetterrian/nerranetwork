# Members-only limited series (Oct 18 2026, operator-directed).
#
# One deep dive per peptide, plus an opening episode on how to read the
# field. Produced by scripts/produce_special.py and released whole by
# scripts/release_special.py (engine/specials.py, docs/specials.md).
# Peptides Weekly's editorial rules bind every episode: education, never a
# dose, a schedule, a stack, a source or a protocol; every study named with
# its evidence level; regulatory status stated. The rules file below
# repeats them for the special, and the dose-terms lint blocks a script
# that breaks them.

id: peptides-deep-dives
title: "Peptides, One at a Time"
subtitle: "A members-only deep dive into the peptides people are actually taking"
host_show: peptides
tease_shows: [peptides, longevity]
x_env_prefixes: ["NERRANETWORK_X_"]
min_sources: 10
rules_file: shows/prompts/specials/peptides_deep_dives_rules.txt
summary: >-
  Seventeen episodes: how to read peptide evidence and the grey market, then
  one peptide per episode — what it is, what the human evidence shows and
  does not show, why people are taking it, its regulatory status, and the
  risks.
teaser: >-
  The peptides people are actually taking, one at a time: what each one is,
  what the human evidence really shows, why people use it, and the risks. A
  members-only series from Peptides Weekly.

# Every peptide episode answers the same eight questions, in this order, so
# the series reads as one reference work. The script may group them
# naturally but may not skip one; "no human data" is an answer.
episode_template: |
  1. What it is: the molecule, where it comes from, what it was first made or
     studied for, and the mechanism proposed for it (labelled as proposed
     unless shown in people).
  2. Why people are taking it now: what users and clinics claim it does,
     where the interest comes from (online communities, clinics, athletes,
     celebrities, wellness media), and how big the interest is where a
     source measures it.
  3. The human evidence: every human trial or study the sources name, each
     with its design, size, population and result, and its evidence level.
  4. The animal and cell evidence, kept separate from the human evidence and
     labelled as such; what it would and would not predict for people.
  5. What the evidence does not show: the gaps, the outcomes never tested,
     the populations never studied, the effects claimed online that no
     study supports.
  6. Regulatory status: approved or not, by which regulator and for what; the
     U.S. FDA compounding position where a source states it; sports
     anti-doping status (WADA) where relevant; Canada and the EU where a
     source covers them.
  7. Risks and unknowns: adverse events reported in trials or case reports,
     contamination and mislabelling in the grey market where tested, drug
     interactions a source names, and what is simply unknown about
     long-term use.
  8. What a listener should take away and the questions to put to a
     clinician — without any dose, schedule, stack, source or protocol.

episodes:
  - id: how-to-read-peptides
    part: 1
    title: "How to Read the Peptide World"
    peptide: null
    stance: neutral
    brief: |
      The opening episode, not about one peptide. What a peptide is and
      why the word covers both approved medicines (insulin, the GLP-1 drugs)
      and unapproved research chemicals. The evidence ladder the series
      uses — cell, animal, small human, randomised controlled trial,
      approval — and why most popular peptides sit low on it. How the grey
      market works: research-chemical sellers, compounding pharmacies and
      the FDA's bulk-substance categories, telehealth clinics; what testing
      of grey-market vials has found. Why WADA bans many of them. How to
      read a claim online. Set out the eight questions every later episode
      answers.
    questions:
      - FDA bulk drug substances compounding category 2 peptides BPC-157
      - FDA compounding peptides safety concerns 2023 2024
      - research chemical peptides grey market testing contamination study
      - WADA prohibited list peptides growth hormone secretagogues
      - telehealth peptide clinics regulation investigation
      - peptide therapeutics approved drugs review

