# Corrections for Fascinating Frontiers. Format and reach: docs/corrections.md.
- episode: 229
  date: 2026-10-21
  text: >-
    The article heading and chapter placed the James Webb images of NGC 7129
    in Orion's nursery. NGC 7129 is a star-forming region in the
    constellation Cepheus, not Orion. The audio named the region correctly.
  where: digest
  replacements:
    - find: "JWST reveals protostellar jets inside Orion’s nursery"
      replace: "JWST reveals protostellar jets inside NGC 7129 in Cepheus"
- episode: 231
  date: 2026-10-23
  text: >-
    The deep dive said the magnesium oxide crystals just above Earth's core
    sit under a pressure equal to the weight of the whole atmosphere. That is
    about one atmosphere. The pressure at the base of the mantle is roughly
    1.3 million times the atmospheric pressure at the surface.
  where: both
  replacements:
    - find: "sitting under pressures equivalent to the weight of the entire atmosphere pressing down on every square centimetre of surface."
      replace: "sitting under pressures roughly 1.3 million times the atmospheric pressure at the surface."
    - find: "They sit under pressure equal to the weight of the whole atmosphere pressing on every square centimetre of surface."
      replace: "They sit under pressure roughly one point three million times the atmospheric pressure at the surface."
- episode: 232
  date: 2026-10-24
  text: >-
    The episode said the 3.3 percent rate of oddly coloured white dwarfs
    implies thousands of such stars across the galaxy. The Milky Way holds
    roughly ten billion white dwarfs, so the same rate would mean hundreds of
    millions. The study modelled 151 nearby white dwarfs and says only that
    there should be a lot of them.
  where: both
  replacements:
    - find: "even a 3 percent rate implies thousands of oddly colored remnants across the galaxy."
      replace: "even a 3 percent rate implies a very large number of oddly colored remnants across the galaxy."
    - find: "so even that small rate implies thousands of oddly colored remnants across the galaxy."
      replace: "so even that small rate implies a very large number of oddly colored remnants across the galaxy."
- episode: 235
  date: 2026-10-28
  text: >-
    The episode said a gamma-ray burst stayed active for twenty-seven days.
    The burst, GRB 220706A, was detected in July 2022; what lasted was its
    central engine, which kept producing X-ray flares for about 51 days as
    seen from Earth, or 27 days in the burst's own frame. The gamma-ray
    emission itself did not last 27 days.
  where: both
  replacements:
    - find: "Record 27-day gamma-ray burst observed"
      replace: "A gamma-ray burst whose engine flared for 27 days"
    - find: "Astronomers recorded a gamma-ray burst that remained active for 27 days, far longer than typical events of its class."
      replace: "Astronomers reported that the central engine of GRB 220706A, a gamma-ray burst detected in July 2022, kept producing X-ray flares for about 51 days as seen from Earth, or 27 days in the burst's own frame, far longer than typical events of its class."
