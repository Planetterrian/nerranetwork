# Corrections for First Principles Daily. Format and reach: docs/corrections.md.
- episode: 134
  date: 2026-10-18
  text: >-
    This episode said RCA's 630TS television weighed roughly as much as a
    small battleship. It was a heavy tabletop set of the late 1940s, on the
    order of a hundred pounds, not anything near a ship. The point about its
    thirty tubes each being designed for performance in isolation stands.
  where: both
  replacements:
    - find: "RCA’s 630TS itself used thirty tubes and weighed roughly as much as a small battleship because each stage was designed for maximum performance in isolation rather than for shared production tooling."
      replace: "RCA’s 630TS itself used thirty tubes and was heavy for a tabletop set because each stage was designed for maximum performance in isolation rather than for shared production tooling."
    - find: "The 630TS itself was heavy — roughly as much as a small battleship — because each stage had been designed for maximum performance in isolation, not for tooling that could be shared."
      replace: "The 630TS itself was heavy for a tabletop set, because each stage had been designed for maximum performance in isolation, not for tooling that could be shared."
- episode: 137
  date: 2026-10-21
  text: >-
    This episode said the Apple II produced color graphics on a standard
    television without extra hardware. The Apple II generated color
    graphics from its own circuitry, but it sent composite video; using an
    ordinary television needed a separate RF modulator, which Apple did not
    ship and owners bought from third parties such as M&R Enterprises.
  where: both
  replacements:
    - find: "Color video went onto the motherboard, so a standard television became the display without a separate box."
      replace: "Color video went onto the motherboard, so a television or a monitor became the display instead of a separate video terminal."
    - find: "Earlier machines treated the television as an optional accessory."
      replace: "Most earlier hobby machines treated video as an add-on."
    - find: "You bought an RF modulator, or a dedicated monitor, and you carried that cost yourself."
      replace: "You bought a video terminal or a display board, and you carried that cost yourself."
    - find: "Moving the video circuitry onto the main board made the television a standard display and took away a layer of hardware every buyer had previously sourced alone."
      replace: "Moving the video circuitry onto the main board made a television the display and took away the terminal every buyer had previously sourced alone. A television still needed a small RF modulator, which Apple did not ship and owners bought from third parties."
    - find: "The machine arrived ready to produce color graphics without another purchase."
      replace: "The machine produced color graphics from its own circuitry."
    - find: "Treating the television as the display deleted a whole category of dedicated hardware that hobbyist designs had kept carrying forward out of habit."
      replace: "Treating the television as the display deleted the dedicated video terminal that hobbyist designs had kept carrying forward out of habit."
    - find: "He added circuitry that produced color graphics on a standard television without extra hardware."
      replace: "He added circuitry that produced color graphics from the board itself, sent as composite video to a monitor or, through a separately bought RF modulator, to a standard television."
    - find: "Treating the television as the display removed an entire category of dedicated hardware that hobbyist designs had carried forward."
      replace: "Treating the television as the display removed the dedicated video terminal that hobbyist designs had carried forward."
