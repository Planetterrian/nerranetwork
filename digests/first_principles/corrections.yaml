# Corrections for First Principles Daily. Format and reach: docs/corrections.md.
- episode: 134
  date: 2026-10-18
  text: >-
    This episode said RCA's 630TS television weighed roughly as much as a
    small battleship. It was a heavy tabletop set of the late 1940s, on the
    order of a hundred pounds, not anything near a ship. The point about its
    thirty tubes each being designed for performance in isolation stands.
  where: both
  replacements:
    - find: "RCA’s 630TS itself used thirty tubes and weighed roughly as much as a small battleship because each stage was designed for maximum performance in isolation rather than for shared production tooling."
      replace: "RCA’s 630TS itself used thirty tubes and was heavy for a tabletop set because each stage was designed for maximum performance in isolation rather than for shared production tooling."
    - find: "The 630TS itself was heavy — roughly as much as a small battleship — because each stage had been designed for maximum performance in isolation, not for tooling that could be shared."
      replace: "The 630TS itself was heavy for a tabletop set, because each stage had been designed for maximum performance in isolation, not for tooling that could be shared."
- episode: 137
  date: 2026-10-21
  text: >-
    This episode said the Apple II produced color graphics on a standard
    television without extra hardware. The Apple II generated color
    graphics from its own circuitry, but it sent composite video; using an
    ordinary television needed a separate RF modulator, which Apple did not
    ship and owners bought from third parties such as M&R Enterprises.
  where: both
