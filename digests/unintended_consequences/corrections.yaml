# Corrections for Unintended Consequences. Format and reach: docs/corrections.md.
- episode: 139
  date: 2026-10-11
  text: >-
    This episode said the Argentine government licensed the Patagonian
    toothfish fishery off South Georgia and that Argentine-flagged boats
    worked it. South Georgia is a British Overseas Territory; its fishery
    is licensed by the Government of South Georgia and the South Sandwich
    Islands under CCAMLR rules, not by Argentina. The episode also said
    the licences cut orca calf survival there. We could not find a source
    for that finding and the episode cited none, so treat the case as
    unsupported.
  where: both
  amend_headline: true
  headline: >-
    South Georgia toothfish licences were issued by Britain, not Argentina
    — and the orca calf claim remains unsupported.
  replacements:
    - find: "The Argentine government had issued a limited number of exclusive licenses in the 1990s precisely to keep foreign poachers out and give the stock room to recover."
      replace: "The Government of South Georgia and the South Sandwich Islands had issued a limited number of exclusive licenses in the 1990s precisely to keep foreign poachers out and give the stock room to recover."
    - find: "The Argentine government had issued a limited number of exclusive licenses in the 1990s, precisely to keep foreign poachers out and give the stock room to recover."
      replace: "The Government of South Georgia and the South Sandwich Islands had issued a limited number of exclusive licenses in the 1990s, precisely to keep foreign poachers out and give the stock room to recover."
    - find: "Argentine fisheries managers and scientists working through the Commission for the Conservation of Antarctic Marine Living Resources"
      replace: "Fisheries managers for South Georgia and scientists working through the Commission for the Conservation of Antarctic Marine Living Resources"
    - find: "Argentine fisheries managers and scientists working through the commission for the conservation"
      replace: "Fisheries managers for South Georgia and scientists working through the commission for the conservation"
    - find: "a handful of Argentine-flagged longliners"
      replace: "a handful of licensed longliners"
    - find: "a handful of Argentine flagged longliners"
      replace: "a handful of licensed longliners"
    - find: "Proponents inside the Argentine fisheries secretariat"
      replace: "Proponents inside the South Georgia fisheries authority"
    - find: "When Argentina limited the number of vessels allowed near South Georgia"
      replace: "When South Georgia limited the number of vessels allowed near its waters"
    - find: "setting off a chain that ended with orca calves drowning in heavier gear the fishers adopted"
      replace: "setting off a chain some later accounts linked to orca calves drowning in heavier gear — a finding this episode could not source and that readers should treat as unsupported"
    - find: "Those changes increased the chance that an orca calf swimming near the surface would become entangled and drown. Population surveys conducted in later years recorded fewer calves reaching independence in the affected groups."
      replace: "Those changes raised concern that an orca calf swimming near the surface could become entangled. We found no sourced population survey confirming that the licences cut calf survival in the affected groups, so that claim remains unsupported."
    - find: "full recruitment rates have not returned to pre-license levels"
      replace: "whether recruitment rates fully recovered relative to pre-license levels is not established in the sources we could check"
- episode: 146
  date: 2026-10-18
  text: >-
    This episode said corn prices rose roughly 30 percent between 2008 and
    2016 as ethanol demand grew. They did not: U.S. corn prices climbed to a
    peak in 2012 and then fell, and the 2016 season-average price was below
    the 2008 level. The ethanol mandate's effect on prices is a modelled
    counterfactual, not an observed rise over that span.
  where: both
  replacements:
    - find: "Corn prices rose roughly 30 percent between 2008 and 2016 as demand for ethanol feedstock grew."
      replace: "Corn prices rose sharply through 2012 as demand for ethanol feedstock grew, then fell; by 2016 the season-average price was below its 2008 level."
    - find: "Corn prices rose roughly thirty percent between two thousand eight and two thousand sixteen as demand for ethanol feedstock grew."
      replace: "Corn prices rose sharply through two thousand twelve as demand for ethanol feedstock grew, then fell; by two thousand sixteen the season-average price was below its two thousand eight level."
- episode: 149
  date: 2026-10-21
  text: >-
    This episode said Wisconsin's yearly savings from fewer deer-vehicle
    collisions, about $10.9 million, were roughly 63 times the livestock
    losses the state had paid out "over the preceding decades", after
    putting those payments at about $3 million over 35 years. The 2021
    PNAS study compares one year with one year: the annual collision
    savings were about 63 times the state's annual compensation for
    verified wolf kills of livestock. The headline's "24 percent each year"
    is also wrong: collisions in counties wolves entered were about 24
    percent lower, a drop in level, not a cut repeated every year.
  where: both
  replacements:
    - find: "by twenty-four percent each year."
      replace: "by about twenty-four percent."
    - find: "by 24 percent each year."
      replace: "by about 24 percent."
    - find: "That figure was roughly sixty-three times the verified livestock losses the state had paid out over the preceding decades."
      replace: "That figure was roughly sixty-three times what the state paid in a typical year to compensate farmers for verified wolf kills of livestock."
    - find: "For every dollar the compensation program had been writing checks to cover,"
      replace: "For every dollar the compensation program paid out in a year,"
- episode: 151
  date: 2026-10-23
  text: >-
    The hook and cold open said India's vultures fell to one-thousandth of
    their earlier numbers. That figure is the white-rumped vulture's; the
    long-billed and slender-billed vultures fell by about 97 percent, as the
    episode said later. The claim that the decline began in 1994 when the
    diclofenac patent expired is flagged as unverified on the claims record.
  where: both
  replacements:
    - find: "the three Gyps vulture species that had once numbered in the tens of millions across the subcontinent fell to roughly one-thousandth of their earlier abundance."
      replace: "the three Gyps vulture species that had once numbered in the tens of millions across the subcontinent fell by roughly 97 percent or more, the white-rumped vulture to about one-thousandth of its earlier abundance."
    - find: "cut India's vultures to one-thousandth"
      replace: "cut India's vultures by ninety-seven percent or more"
    - find: "cut vulture numbers to one-thousandth"
      replace: "cut vulture numbers by 97 percent or more"
- episode: 152
  date: 2026-10-24
  text: >-
    The article described the callback gap in Agan and Starr's study as 7 and
    then 43 percentage points and said the move more than doubled the white
    applicants' relative advantage. The study's gaps are relative: white
    applicants were called back about 7 percent more often before the ban and
    about 43 percent more often after it, an advantage roughly six times as
    large. The audio did not carry this passage.
  where: digest
  replacements:
    - find: "a 7-percentage-point gap means white applicants received callbacks at a rate roughly 1.07 times that of Black applicants; at 43 percentage points the ratio rises to 1.43 times, more than doubling the relative advantage."
      replace: "a 7 percent gap means white applicants received callbacks at a rate roughly 1.07 times that of Black applicants; at 43 percent the ratio rises to 1.43 times, an advantage about six times as large."
