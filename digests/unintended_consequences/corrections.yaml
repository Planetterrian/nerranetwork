# Corrections for Unintended Consequences. Format and reach: docs/corrections.md.
- episode: 139
  date: 2026-10-11
  text: >-
    This episode said the Argentine government licensed the Patagonian
    toothfish fishery off South Georgia and that Argentine-flagged boats
    worked it. South Georgia is a British Overseas Territory; its fishery
    is licensed by the Government of South Georgia and the South Sandwich
    Islands under CCAMLR rules, not by Argentina. The episode also said
    the licences cut orca calf survival there. We could not find a source
    for that finding and the episode cited none, so treat the case as
    unsupported.
  where: both
