# Corrections for Modern Investing Techniques. Format and reach: docs/corrections.md.
- episode: 207
  date: 2026-10-21
  text: >-
    The options lesson said 100 shares with a short call at a delta of about
    0.25 behave like 75 shares long plus 25 shares short. The position
    behaves like roughly 75 shares long in total: the 100 shares count fully
    and the short call subtracts about 25. The episode also gave two start
    dates. The NASDAQ comparison runs from March 16, 2026, the day the
    practice portfolio opened; the rules-based record the show scores
    itself on began on August 18, 2026.
  where: both
  replacements:
    - find: "since this practice record began on March sixteenth, twenty twenty-six."
      replace: "since the practice portfolio opened on March sixteenth, twenty twenty-six."
    - find: "so the position behaves like seventy-five shares of long stock plus twenty-five shares of short stock for risk purposes."
      replace: "so the position behaves like roughly seventy-five shares of long stock for risk purposes: the hundred shares count fully and the short call takes away about twenty-five."
