# Corrections for Offshore North. Format and reach: docs/corrections.md.
- episode: 11
  date: 2026-10-30
  text: >-
    This episode said the RORC Transatlantic counts as a qualifying race for
    the 2028 Vendée Globe. It does not: the Notice of Race requires a solo
    finish in an IMOCA Globe Series race on the same boat, and the RORC
    Transatlantic is a double-handed race outside that series. It also told
    Scott Shawyer and Alan Roberts' 2023 course record beside EMIRA IV; they
    set it on the team's earlier IMOCA. The article now dates the team's
    announcement, gives the 10 January start from Marina Lanzarote and says
    who Alan Roberts is, and a few repeated lines are gone.
  where: both
  replacements:
    # The digest (one paragraph per line; sentences joined by spaces).
    - find: "Canada Ocean Racing announced this week that Scott Shawyer will team up with British offshore sailor Alan Roberts for the RORC Transatlantic Race in January 2027. The pair set a double-handed course record together in 2023. They will sail the 3,000-nautical-mile crossing from Lanzarote to Antigua on the foiling EMIRA IV. The post notes that Shawyer is looking ahead after the decision not to compete in the Route du Rhum. The announcement includes a photo of Alan shaking hands with Scott from their 2023 record run. Shawyer is described as already planning his next opportunity to race after missing the Route du Rhum start. The team states that the crossing will allow him to get back on the water and build valuable experience aboard EMIRA IV."
      replace: "Canada Ocean Racing, 23 October: Scott Shawyer will team up with British offshore sailor Alan Roberts for the RORC Transatlantic Race, which starts on 10 January 2027 from Marina Lanzarote. Roberts finished fourth in The Ocean Race 2022–23 with Biotherm and raced nine seasons on the French Figaro solo circuit. In 2023 the pair won their class and set the race's double-handed course record, 9 days, 12 hours and 26 minutes, on the team's earlier IMOCA, not EMIRA IV. This time they will sail the 3,000-nautical-mile crossing from Lanzarote to Antigua on the foiling EMIRA IV. The post says Shawyer is looking ahead after deciding not to compete in the Route du Rhum, and that the crossing will get him back on the water and build valuable experience aboard EMIRA IV."
    - find: "This gives Shawyer another double-handed offshore passage on the boat that will carry his Vendée Globe 2028 campaign. Every mile sailed on EMIRA IV builds the solo and systems experience required for Grade 2 qualification races. The RORC Transatlantic counts as a qualifying passage under the published IMOCA rules for the 2028 Vendée Globe. Completing it on EMIRA IV would satisfy the requirement to finish at least one Grade 2 solo or double-handed race on the boat that will be used in the Vendée Globe, within twice the winner's time."
      replace: "The RORC Transatlantic isn't a Vendée qualifier, but it's valuable ocean time on EMIRA IV. Scott still needs a solo Grade 2 finish, such as Retour à la Base 2027 or The Transat CIC 2028, plus a top-37 Globe Series ranking."
