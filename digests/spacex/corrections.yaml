# Corrections for SpaceX Daily. Format and reach: docs/corrections.md.
- episode: 137
  date: 2026-10-21
  text: >-
    The Engineering Deep Dive said the Flight 15 ship catch uses body flaps
    "rather than engines" for its last seconds. That is wrong: the Starship
    upper stage relights its Raptor engines to flip upright and brake before
    the tower arms catch it; the flaps steer it during the belly-flop
    descent before that. The segment's tolerances ("under one meter per
    second", "under one degree per second", "a few hundred milliseconds")
    were illustrative, not figures SpaceX has published.
  where: audio
