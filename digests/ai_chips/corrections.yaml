# Corrections for AI Chips & Data Centres Daily. Format and reach: docs/corrections.md.
- episode: 27
  date: 2026-10-19
  text: >-
    This episode said RTX Spark laptops start at $2,599, the figure the
    iTWire report it cited carried. Nvidia's own announcement puts the
    starting price at $2,399, and MAG 7 Daily's episode of the same day
    reported it from that source. The memory ceiling and the partner list
    stand.
  where: both
  replacements:
    - find: "Systems from Asus, Dell, HP, Lenovo, Microsoft and MSI start at $2,599."
      replace: "Systems from Asus, Dell, HP, Lenovo, Microsoft and MSI start at $2,399, the figure in Nvidia's announcement; iTWire's report put it at $2,599."
    - find: "At a $2,599 start the comparison is not a data-centre GPU tray."
      replace: "At a $2,399 start the comparison is not a data-centre GPU tray."
    - find: "The partner list and the $2,599 floor do not move that ceiling."
      replace: "The partner list and the $2,399 floor do not move that ceiling."
    - find: "start at two thousand five hundred ninety-nine dollars"
      replace: "start at two thousand three hundred ninety-nine dollars"
    - find: "two-thousand-five-hundred-ninety-nine-dollar floor"
      replace: "two-thousand-three-hundred-ninety-nine-dollar floor"
    - find: "$2,599"
      replace: "$2,399"
