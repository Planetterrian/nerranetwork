# Corrections for Tesla Shorts Time. Format and reach: docs/corrections.md.
- episode: 627
  date: 2026-10-08
  text: >-
    The episode's opening line and title said Giga Storage's move into
    Germany widens the path for Tesla Megapack deployments across Europe.
    The Energy-Storage.News report the story was written from connects the
    project to neither Tesla nor Megapack. That link was ours, not the
    source's.
  where: both
  # Ep628 published the same day; carry the note in the next episode.
  noted_in: 629

- episode: 634
  date: 2026-10-16
  text: >-
    The episode's headline and cold open said Tesla's China sales dropped
    12 percent year over year in September. CPCA September retail for Tesla
    in China was down 9.35 percent year over year, not 12. The Model Y
    topping the monthly sales chart is unchanged.
  where: both
  amend_headline: true
  headline: >-
    Model Y topped China's September sales charts while Tesla's China sales
    dropped 9.35 percent year over year.
  replacements:
    - find: "dropped 12 percent year over year"
      replace: "dropped 9.35 percent year over year"
    - find: "dropped twelve percent year over year"
      replace: "dropped nine point three five percent year over year"
    - find: "dropped 12% year over year"
      replace: "dropped 9.35% year over year"
    - find: "Sales Drop 12%"
      replace: "Sales Drop 9.35%"
    - find: "fell 12%"
      replace: "fell 9.35%"
    - find: "reculaient de 12% sur un an"
      replace: "reculaient de 9,35% sur un an"
    - find: "reculaient de douze pour cent sur un an"
      replace: "reculaient de neuf virgule trente-cinq pour cent sur un an"
    - find: "упали на 12% в годовом выражении"
      replace: "упали на 9,35% в годовом выражении"
    - find: "упали на двенадцать процентов в годовом выражении"
      replace: "упали на девять целых тридцать пять сотых процента в годовом выражении"
